AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stage-bound CloudFormation execution policy and runtime permissions boundary
  for Archon CDK stacks in eu-west-1 and us-east-1.

Parameters:
  DeploymentEnvironment:
    Type: String
    AllowedValues:
      - staging
      - production
  CloudFrontDomainName:
    Type: String
    MinLength: 4
    MaxLength: 253
    AllowedPattern: '^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    ConstraintDescription: >-
      Must be the exact lowercase stage hostname without a wildcard or
      trailing dot.
  CloudFrontHostedZoneId:
    Type: String
    AllowedPattern: '^Z[A-Z0-9]{1,31}$'
    ConstraintDescription: >-
      Must be the exact public Route 53 hosted-zone ID without the
      /hostedzone/ prefix.

Conditions:
  IsStaging: !Equals [!Ref DeploymentEnvironment, staging]

Resources:
  ArchonRuntimeBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub archon-datahub-runtime-boundary-${DeploymentEnvironment}
      Description: !Sub >-
        Maximum runtime permissions for Archon ${DeploymentEnvironment} roles.
        This policy grants nothing unless an identity policy also allows it.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InvokeOnlyBedrockMantleProjects
            Effect: Allow
            Action:
              - bedrock-mantle:CreateInference
            Resource: !Sub arn:${AWS::Partition}:bedrock-mantle:eu-west-1:${AWS::AccountId}:project/*
            Condition:
              StringEquals:
                bedrock-mantle:Model: qwen.qwen3-235b-a22b-2507
          - Sid: MintOnlyShortTermBedrockMantleTokens
            Effect: Allow
            Action: bedrock-mantle:CallWithBearerToken
            Resource: "*"
            Condition:
              StringEquals:
                bedrock-mantle:BearerTokenType: SHORT_TERM
          - Sid: UseOnlyStageTables
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:TransactWriteItems
              - dynamodb:UpdateItem
            Resource: !Sub arn:${AWS::Partition}:dynamodb:eu-west-1:${AWS::AccountId}:table/Archon-${DeploymentEnvironment}-*
          - Sid: RestrictDefaultStageSecurityGroup
            Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
            Resource: !Sub arn:${AWS::Partition}:ec2:eu-west-1:${AWS::AccountId}:security-group/*
          - Sid: AuthenticateRuntimeImagePull
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - Sid: PullOnlySharedImmutableImage
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: !Sub arn:${AWS::Partition}:ecr:eu-west-1:${AWS::AccountId}:repository/archon-datahub
          - Sid: UseOnlyStageRuntimeKeys
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:Describe*
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
            Resource: !Sub arn:${AWS::Partition}:kms:eu-west-1:${AWS::AccountId}:key/*
            Condition:
              ForAnyValue:StringLike:
                kms:ResourceAliases: !Sub alias/archon/${DeploymentEnvironment}/*
              StringLike:
                kms:ViaService:
                  - s3.eu-west-1.amazonaws.com
                  - secretsmanager.eu-west-1.amazonaws.com
                  - sqs.eu-west-1.amazonaws.com
                  - logs.eu-west-1.amazonaws.com
          - Sid: WriteOnlyStageRuntimeLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:DescribeLogStreams
              - logs:PutLogEvents
            Resource:
              - !Sub arn:${AWS::Partition}:logs:eu-west-1:${AWS::AccountId}:log-group:/archon/${DeploymentEnvironment}/*
              - !Sub arn:${AWS::Partition}:logs:eu-west-1:${AWS::AccountId}:log-group:/archon/${DeploymentEnvironment}/*:*
              - !Sub arn:${AWS::Partition}:logs:eu-west-1:${AWS::AccountId}:log-group:/aws/lambda/Archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:logs:eu-west-1:${AWS::AccountId}:log-group:/aws/lambda/Archon-${DeploymentEnvironment}-*:*
              - !Sub arn:${AWS::Partition}:logs:eu-west-1:${AWS::AccountId}:log-group:aws-waf-logs-archon-${DeploymentEnvironment}-api*
              - !Sub arn:${AWS::Partition}:logs:eu-west-1:${AWS::AccountId}:log-group:sns/eu-west-1/${AWS::AccountId}/archon-${DeploymentEnvironment}-alarms*
          - Sid: DeliverStepFunctionsLogs
            Effect: Allow
            Action:
              - logs:CreateLogDelivery
              - logs:DeleteLogDelivery
              - logs:DescribeLogGroups
              - logs:DescribeResourcePolicies
              - logs:GetLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:UpdateLogDelivery
            Resource: "*"
          - Sid: UseOnlyStageObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectAttributes
              - s3:GetObjectVersion
              - s3:PutObject
            Resource: !Sub arn:${AWS::Partition}:s3:::archon-${DeploymentEnvironment}-*/*
          - Sid: ReadOnlyStageRuntimeSecrets
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub arn:${AWS::Partition}:secretsmanager:eu-west-1:${AWS::AccountId}:secret:archon/${DeploymentEnvironment}/datahub-read-*
              - !Sub arn:${AWS::Partition}:secretsmanager:eu-west-1:${AWS::AccountId}:secret:archon/${DeploymentEnvironment}/datahub-write-*
          - Sid: UseOnlyStageQueues
            Effect: Allow
            Action:
              - sqs:ChangeMessageVisibility
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ReceiveMessage
              - sqs:SendMessage
            Resource: !Sub arn:${AWS::Partition}:sqs:eu-west-1:${AWS::AccountId}:archon-${DeploymentEnvironment}-*
          - Sid: UseOnlyStageStateMachine
            Effect: Allow
            Action:
              - states:DescribeExecution
              - states:StartExecution
            Resource:
              - !Sub arn:${AWS::Partition}:states:eu-west-1:${AWS::AccountId}:stateMachine:archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:states:eu-west-1:${AWS::AccountId}:execution:archon-${DeploymentEnvironment}-*:*
          - Sid: ReturnOpaqueTaskTokens
            Effect: Allow
            Action:
              - states:SendTaskFailure
              - states:SendTaskHeartbeat
              - states:SendTaskSuccess
            Resource: "*"
          - Sid: EmitRuntimeTraces
            Effect: Allow
            Action:
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
              - xray:PutTelemetryRecords
              - xray:PutTraceSegments
            Resource: "*"
          - Sid: DenyIdentityEscalation
            Effect: Deny
            Action:
              - account:*
              - iam:*
              - organizations:*
              - sts:AssumeRole
            Resource: "*"
          - Sid: DenyLongTermBedrockMantleTokens
            Effect: Deny
            Action: bedrock-mantle:CallWithBearerToken
            Resource: "*"
            Condition:
              StringEquals:
                bedrock-mantle:BearerTokenType: LONG_TERM
          - Sid: DenyEvidenceDeletionAndRetentionBypass
            Effect: Deny
            Action:
              - s3:BypassGovernanceRetention
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:PutObjectRetention
            Resource: !Sub arn:${AWS::Partition}:s3:::archon-${DeploymentEnvironment}-*/*

  ArchonCdkIdentityPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub archon-datahub-cdk-identity-${DeploymentEnvironment}
      Description: !Sub >-
        Exact runtime-role creation, boundary, policy, and PassRole permissions
        for Archon ${DeploymentEnvironment} CloudFormation execution.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CreateStageRolesWithExactBoundary
            Effect: Allow
            Action: iam:CreateRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-${DeploymentEnvironment}-sns-delivery-status
            Condition:
              ArnEquals:
                iam:PermissionsBoundary: !Ref ArchonRuntimeBoundary
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
                aws:RequestTag/ManagedBy: aws-cdk
          - Sid: PreserveExactStageBoundary
            Effect: Allow
            Action: iam:PutRolePermissionsBoundary
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-${DeploymentEnvironment}-sns-delivery-status
            Condition:
              ArnEquals:
                iam:PermissionsBoundary: !Ref ArchonRuntimeBoundary
          - Sid: ReadStageRoles
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:ListRoleTags
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-${DeploymentEnvironment}-sns-delivery-status
          - Sid: ReconcileStageRoleInlinePolicies
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:PutRolePolicy
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateRole
              - iam:UpdateRoleDescription
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-${DeploymentEnvironment}-sns-delivery-status
            Condition:
              StringEquals:
                iam:ResourceTag/Application: archon-datahub
                iam:ResourceTag/Environment: !Ref DeploymentEnvironment
          - Sid: TagOnlyExistingStageRoles
            Effect: Allow
            Action:
              - iam:TagRole
              - iam:UntagRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-${DeploymentEnvironment}-sns-delivery-status
            Condition:
              StringEquals:
                iam:ResourceTag/Application: archon-datahub
                iam:ResourceTag/Environment: !Ref DeploymentEnvironment
          - Sid: DenyCrossStageRoleRetag
            Effect: Deny
            Action: iam:TagRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-${DeploymentEnvironment}-sns-delivery-status
            Condition:
              "Null":
                aws:RequestTag/Environment: "false"
              StringNotEquals:
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
          - Sid: DenyCoreStageRoleTagRemoval
            Effect: Deny
            Action: iam:UntagRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-${DeploymentEnvironment}-sns-delivery-status
            Condition:
              ForAnyValue:StringEquals:
                aws:TagKeys:
                  - Application
                  - Environment
                  - ManagedBy
          - Sid: AttachOnlyApprovedServiceRolePolicies
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Archon-${DeploymentEnvironment}-*
            Condition:
              ArnEquals:
                iam:PolicyARN:
                  - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
          - Sid: PassOnlyStageRolesToRequiredServices
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-${DeploymentEnvironment}-sns-delivery-status
            Condition:
              StringEquals:
                iam:PassedToService:
                  - ecs-tasks.amazonaws.com
                  - lambda.amazonaws.com
                  - sns.amazonaws.com
                  - states.amazonaws.com
                  - vpc-flow-logs.amazonaws.com
          - Sid: CreateOnlyRequiredServiceLinkedRoles
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - autoscaling.amazonaws.com
                  - ecs.amazonaws.com
                  - ecs.application-autoscaling.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
                  - ops.apigateway.amazonaws.com
                  - wafv2.amazonaws.com

  ArchonCdkGuardPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub archon-datahub-cdk-guard-${DeploymentEnvironment}
      Description: !Sub >-
        Stage-isolation and foundation-protection explicit denies for Archon
        ${DeploymentEnvironment} CloudFormation execution roles.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenySharedApiGatewayAccountMutation
            Effect: Deny
            Action:
              - apigateway:DELETE
              - apigateway:PATCH
              - apigateway:POST
              - apigateway:PUT
            Resource: arn:aws:apigateway:eu-west-1::/account
          - Sid: DenyRuntimeBoundaryRemoval
            Effect: Deny
            Action: iam:DeleteRolePermissionsBoundary
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-${DeploymentEnvironment}-sns-delivery-status
          - Sid: DenyFoundationControlPlaneMutation
            Effect: Deny
            Action: iam:*
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-datahub-apigateway-cloudwatch-logs
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-datahub-github-foundation
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-datahub-github-staging-deploy
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-datahub-github-production-deploy
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-staging-judge-user
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-production-judge-user
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-production-posture-observer
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-production-runtime-read
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/archon-production-paging-test
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/archon-datahub-cdk-*-staging
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/archon-datahub-cdk-*-production
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/archon-datahub-runtime-boundary-staging
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/archon-datahub-runtime-boundary-production
          - !If
            - IsStaging
            - !Ref AWS::NoValue
            - Sid: DenySharedRegistryKmsMutationFromProduction
              Effect: Deny
              Action:
                - kms:CancelKeyDeletion
                - kms:CreateAlias
                - kms:DeleteAlias
                - kms:DisableKey
                - kms:DisableKeyRotation
                - kms:EnableKey
                - kms:EnableKeyRotation
                - kms:PutKeyPolicy
                - kms:ScheduleKeyDeletion
                - kms:TagResource
                - kms:UntagResource
                - kms:UpdateAlias
                - kms:UpdateKeyDescription
              Resource: "*"
              Condition:
                ForAnyValue:StringLike:
                  kms:ResourceAliases: alias/archon/ecr
          - !If
            - IsStaging
            - Sid: DenyProductionNamedBuckets
              Effect: Deny
              Action: "*"
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::archon-production-*
                - !Sub arn:${AWS::Partition}:s3:::archon-production-*/*
            - Sid: DenyStagingNamedBuckets
              Effect: Deny
              Action: "*"
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::archon-staging-*
                - !Sub arn:${AWS::Partition}:s3:::archon-staging-*/*
          - !If
            - IsStaging
            - Sid: DenyProductionTaggedResources
              Effect: Deny
              Action: "*"
              Resource: "*"
              Condition:
                StringEquals:
                  aws:ResourceTag/Environment: production
            - Sid: DenyStagingTaggedResources
              Effect: Deny
              Action: "*"
              Resource: "*"
              Condition:
                StringEquals:
                  aws:ResourceTag/Environment: staging
          - Sid: DenyIdentityAndAccountAdministration
            Effect: Deny
            Action:
              - account:*
              - billing:*
              - iam:AddUserToGroup
              - iam:AttachUserPolicy
              - iam:CreateAccessKey
              - iam:CreateGroup
              - iam:CreateLoginProfile
              - iam:CreateUser
              - iam:DeleteAccessKey
              - iam:DeleteGroup
              - iam:DeleteLoginProfile
              - iam:DeleteUser
              - iam:DeleteUserPolicy
              - iam:DetachUserPolicy
              - iam:PutUserPolicy
              - organizations:*
              - route53domains:*
            Resource: "*"

  ArchonCdkDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub archon-datahub-cdk-data-${DeploymentEnvironment}
      Description: !Sub >-
        Stage-scoped object storage and encryption reconciliation for Archon
        ${DeploymentEnvironment}.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CreateTaggedStageKeys
            Effect: Allow
            Action:
              - kms:CreateKey
              - kms:PutKeyPolicy
              - kms:TagResource
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
                aws:RequestedRegion: eu-west-1
          - Sid: ReconcileTaggedStageKeys
            Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:EnableKeyRotation
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListResourceTags
              - kms:PutKeyPolicy
              - kms:TagResource
              - kms:UntagResource
              - kms:UpdateKeyDescription
            Resource: !Sub arn:${AWS::Partition}:kms:eu-west-1:${AWS::AccountId}:key/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: archon-datahub
                aws:ResourceTag/Environment: !Ref DeploymentEnvironment
          - Sid: ManageOnlyStageAliasNames
            Effect: Allow
            Action:
              - kms:CreateAlias
              - kms:DeleteAlias
              - kms:UpdateAlias
            Resource: !Sub arn:${AWS::Partition}:kms:eu-west-1:${AWS::AccountId}:alias/archon/${DeploymentEnvironment}/*
          - Sid: UseOnlyStageKeysAsAliasTargets
            Effect: Allow
            Action:
              - kms:CreateAlias
              - kms:UpdateAlias
            Resource: !Sub arn:${AWS::Partition}:kms:eu-west-1:${AWS::AccountId}:key/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: archon-datahub
                aws:ResourceTag/Environment: !Ref DeploymentEnvironment
          - !If
            - IsStaging
            - Sid: CreateTaggedSharedRegistryKey
              Effect: Allow
              Action:
                - kms:CreateKey
                - kms:PutKeyPolicy
                - kms:TagResource
              Resource: "*"
              Condition:
                StringEquals:
                  aws:RequestTag/Application: archon-datahub
                  aws:RequestTag/Environment: shared
                  aws:RequestedRegion: eu-west-1
            - !Ref AWS::NoValue
          - !If
            - IsStaging
            - Sid: ReconcileTaggedSharedRegistryKey
              Effect: Allow
              Action:
                - kms:DescribeKey
                - kms:EnableKeyRotation
                - kms:GetKeyPolicy
                - kms:GetKeyRotationStatus
                - kms:ListResourceTags
                - kms:PutKeyPolicy
                - kms:TagResource
                - kms:UntagResource
                - kms:UpdateKeyDescription
              Resource: !Sub arn:${AWS::Partition}:kms:eu-west-1:${AWS::AccountId}:key/*
              Condition:
                StringEquals:
                  aws:ResourceTag/Application: archon-datahub
                  aws:ResourceTag/Environment: shared
            - !Ref AWS::NoValue
          - !If
            - IsStaging
            - Sid: ManageOnlySharedRegistryAlias
              Effect: Allow
              Action:
                - kms:CreateAlias
                - kms:DeleteAlias
                - kms:UpdateAlias
              Resource: !Sub arn:${AWS::Partition}:kms:eu-west-1:${AWS::AccountId}:alias/archon/ecr
            - !Ref AWS::NoValue
          - !If
            - IsStaging
            - Sid: UseOnlySharedTaggedKeyAsRegistryAliasTarget
              Effect: Allow
              Action:
                - kms:CreateAlias
                - kms:UpdateAlias
              Resource: !Sub arn:${AWS::Partition}:kms:eu-west-1:${AWS::AccountId}:key/*
              Condition:
                StringEquals:
                  aws:ResourceTag/Application: archon-datahub
                  aws:ResourceTag/Environment: shared
            - !Ref AWS::NoValue
          - Sid: ReconcileOnlyStageBuckets
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucketPolicy
              - s3:GetBucketAcl
              - s3:GetBucketCORS
              - s3:GetBucketLocation
              - s3:GetBucketLogging
              - s3:GetBucketNotification
              - s3:GetBucketObjectLockConfiguration
              - s3:GetBucketOwnershipControls
              - s3:GetBucketPolicy
              - s3:GetBucketPublicAccessBlock
              - s3:GetBucketTagging
              - s3:GetBucketVersioning
              - s3:GetEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:ListBucket
              - s3:PutBucketAcl
              - s3:PutBucketCORS
              - s3:PutBucketLogging
              - s3:PutBucketNotification
              - s3:PutBucketObjectLockConfiguration
              - s3:PutBucketOwnershipControls
              - s3:PutBucketPolicy
              - s3:PutBucketPublicAccessBlock
              - s3:PutBucketTagging
              - s3:PutBucketVersioning
              - s3:PutEncryptionConfiguration
              - s3:PutLifecycleConfiguration
            Resource: !Sub arn:${AWS::Partition}:s3:::archon-${DeploymentEnvironment}-*

  ArchonCdkStatePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub archon-datahub-cdk-state-${DeploymentEnvironment}
      Description: !Sub >-
        Stage-scoped tables, secrets, queues, topics, and staging-owned
        registry reconciliation for Archon ${DeploymentEnvironment}.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CreateTaggedStageTables
            Effect: Allow
            Action: dynamodb:CreateTable
            Resource: !Sub arn:${AWS::Partition}:dynamodb:eu-west-1:${AWS::AccountId}:table/Archon-${DeploymentEnvironment}-*
            Condition:
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
          - Sid: ReconcileOnlyStageTables
            Effect: Allow
            Action:
              - dynamodb:DeleteTable
              - dynamodb:DescribeContinuousBackups
              - dynamodb:DescribeContributorInsights
              - dynamodb:DescribeTable
              - dynamodb:DescribeTimeToLive
              - dynamodb:ListTagsOfResource
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:UpdateContinuousBackups
              - dynamodb:UpdateContributorInsights
              - dynamodb:UpdateTable
              - dynamodb:UpdateTimeToLive
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:eu-west-1:${AWS::AccountId}:table/Archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:dynamodb:eu-west-1:${AWS::AccountId}:table/Archon-${DeploymentEnvironment}-*/index/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: archon-datahub
                aws:ResourceTag/Environment: !Ref DeploymentEnvironment
          - Sid: ReconcileOnlyStageSecrets
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:DeleteResourcePolicy
              - secretsmanager:DescribeSecret
              - secretsmanager:GetResourcePolicy
              - secretsmanager:ListSecretVersionIds
              - secretsmanager:ListTagsForResource
              - secretsmanager:PutResourcePolicy
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
              - secretsmanager:UpdateSecret
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:eu-west-1:${AWS::AccountId}:secret:archon/${DeploymentEnvironment}/*
          - Sid: ReconcileOnlyStageQueues
            Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ListQueueTags
              - sqs:SetQueueAttributes
              - sqs:TagQueue
              - sqs:UntagQueue
