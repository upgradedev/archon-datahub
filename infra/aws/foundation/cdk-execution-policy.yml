  ArchonCdkNetworkPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub archon-datahub-cdk-network-${DeploymentEnvironment}
      Description: !Sub >-
        Tagged VPC, load-balancer, and API Gateway reconciliation for Archon
        ${DeploymentEnvironment} in eu-west-1.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DiscoverOnlyRequiredRegionalNetworkState
            Effect: Allow
            Action:
              - ec2:DescribeAccountAttributes
              - ec2:DescribeAddresses
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeFlowLogs
              - ec2:DescribeInternetGateways
              - ec2:DescribeManagedPrefixLists
              - ec2:DescribeNatGateways
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribePrefixLists
              - ec2:DescribeRouteTables
              - ec2:DescribeSecurityGroupRules
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeTags
              - ec2:DescribeVpcs
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: eu-west-1
          - Sid: CreateOnlyTaggedStageNetworkResources
            Effect: Allow
            Action:
              - ec2:AllocateAddress
              - ec2:CreateFlowLogs
              - ec2:CreateInternetGateway
              - ec2:CreateNatGateway
              - ec2:CreateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:CreateSubnet
              - ec2:CreateTags
              - ec2:CreateVpc
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
                aws:RequestedRegion: eu-west-1
          - Sid: ReconcileOnlyTaggedStageNetworkResources
            Effect: Allow
            Action:
              - ec2:AssociateAddress
              - ec2:AssociateRouteTable
              - ec2:AttachInternetGateway
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:CreateRoute
              - ec2:DeleteFlowLogs
              - ec2:DeleteInternetGateway
              - ec2:DeleteNatGateway
              - ec2:DeleteRoute
              - ec2:DeleteRouteTable
              - ec2:DeleteSecurityGroup
              - ec2:DeleteSubnet
              - ec2:DeleteTags
              - ec2:DeleteVpc
              - ec2:DetachInternetGateway
              - ec2:DisassociateAddress
              - ec2:DisassociateRouteTable
              - ec2:ModifySubnetAttribute
              - ec2:ModifyVpcAttribute
              - ec2:ReleaseAddress
              - ec2:ReplaceRoute
              - ec2:RevokeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
            Resource: "*"
            Condition:
              StringEquals:
                aws:ResourceTag/Application: archon-datahub
                aws:ResourceTag/Environment: !Ref DeploymentEnvironment
                aws:RequestedRegion: eu-west-1
          - Sid: DiscoverOnlyRequiredStageLoadBalancerState
            Effect: Allow
            Action:
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:DescribeLoadBalancerAttributes
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeTags
              - elasticloadbalancing:DescribeTargetGroupAttributes
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetHealth
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: eu-west-1
          - Sid: CreateOnlyTaggedStageLoadBalancerResources
            Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:CreateTargetGroup
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
                aws:RequestedRegion: eu-west-1
          - Sid: ReconcileOnlyTaggedStageLoadBalancerResources
            Effect: Allow
            Action:
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:DeregisterTargets
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:ModifyTargetGroupAttributes
              - elasticloadbalancing:RegisterTargets
              - elasticloadbalancing:RemoveTags
              - elasticloadbalancing:SetIpAddressType
              - elasticloadbalancing:SetSecurityGroups
              - elasticloadbalancing:SetSubnets
            Resource: "*"
            Condition:
              StringEquals:
                aws:ResourceTag/Application: archon-datahub
                aws:ResourceTag/Environment: !Ref DeploymentEnvironment
                aws:RequestedRegion: eu-west-1
          - Sid: CreateOnlyNamedTaggedRestApi
            Effect: Allow
            Action: apigateway:POST
            Resource: arn:aws:apigateway:eu-west-1::/restapis
            Condition:
              StringEquals:
                apigateway:Request/ApiName: !Sub archon-${DeploymentEnvironment}
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
          - Sid: CreateOnlyTaggedStageApiTopLevelResources
            Effect: Allow
            Action:
              - apigateway:POST
              - apigateway:PUT
            Resource:
              - arn:aws:apigateway:eu-west-1::/apikeys
              - arn:aws:apigateway:eu-west-1::/usageplans
              - arn:aws:apigateway:eu-west-1::/vpclinks
            Condition:
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
          - Sid: ReconcileOnlyTaggedStageRestApiTree
            Effect: Allow
            Action:
              - apigateway:DELETE
              - apigateway:GET
              - apigateway:PATCH
              - apigateway:POST
              - apigateway:PUT
            Resource:
              - arn:aws:apigateway:eu-west-1::/restapis/*
              - arn:aws:apigateway:eu-west-1::/apikeys/*
              - arn:aws:apigateway:eu-west-1::/usageplans/*
              - arn:aws:apigateway:eu-west-1::/vpclinks/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: archon-datahub
                aws:ResourceTag/Environment: !Ref DeploymentEnvironment

  ArchonCdkEndpointPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub archon-datahub-cdk-endpoint-${DeploymentEnvironment}
      Description: !Sub >-
        Exact same-region PrivateLink endpoint and private-DNS reconciliation
        for Archon ${DeploymentEnvironment}.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DiscoverOnlyRequiredVpcEndpointState
            Effect: Allow
            Action:
              - ec2:DescribeVpcEndpointServices
              - ec2:DescribeVpcEndpoints
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: eu-west-1
          - Sid: CreateOnlyTaggedSameRegionVpcEndpoints
            Effect: Allow
            Action: ec2:CreateVpcEndpoint
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
                aws:RequestedRegion: eu-west-1
                ec2:VpceServiceRegion: eu-west-1
              StringNotEquals:
                ec2:VpceServiceOwner: !Ref AWS::AccountId
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - Application
                  - Environment
                  - ManagedBy
                  - Name
          - Sid: TagOnlyDuringOwnedVpcEndpointCreation
            Effect: Allow
            Action: ec2:CreateTags
            Resource: !Sub arn:${AWS::Partition}:ec2:eu-west-1:${AWS::AccountId}:vpc-endpoint/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
                aws:RequestedRegion: eu-west-1
                ec2:CreateAction: CreateVpcEndpoint
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - Application
                  - Environment
                  - ManagedBy
                  - Name
          - Sid: ReconcileOnlyOwnedStageVpcEndpoints
            Effect: Allow
            Action:
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:DeleteVpcEndpoints
              - ec2:ModifyVpcEndpoint
            Resource: !Sub arn:${AWS::Partition}:ec2:eu-west-1:${AWS::AccountId}:vpc-endpoint/*
            Condition:
              StringEquals:
                aws:RequestedRegion: eu-west-1
                aws:ResourceTag/Application: archon-datahub
                aws:ResourceTag/Environment: !Ref DeploymentEnvironment
          - Sid: DenyVpcEndpointOwnershipTagRemoval
            Effect: Deny
            Action: ec2:DeleteTags
            Resource: !Sub arn:${AWS::Partition}:ec2:eu-west-1:${AWS::AccountId}:vpc-endpoint/*
            Condition:
              ForAnyValue:StringEquals:
                aws:TagKeys:
                  - Application
                  - Environment
          - Sid: AssociatePrivateDnsOnlyWithCallerAccountVpc
            Effect: Allow
            Action: route53:AssociateVPCWithHostedZone
            Resource: arn:aws:route53:::hostedzone/*
            Condition:
              ForAllValues:StringLike:
                route53:VPCs: VPCId=vpc-*,VPCRegion=eu-west-1

  ArchonCdkDeliveryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub archon-datahub-cdk-delivery-${DeploymentEnvironment}
      Description: !Sub >-
        Exact CloudFront, viewer-alias, and regional WAF control-plane
        permissions for Archon ${DeploymentEnvironment}.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CreateOnlyTaggedStageDistribution
            Effect: Allow
            Action: cloudfront:CreateDistribution
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
          - Sid: TagOnlyStageDistribution
            Effect: Allow
            Action: cloudfront:TagResource
            Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
            Condition:
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
          - Sid: ReconcileOnlyTaggedStageDistribution
            Effect: Allow
            Action:
              - cloudfront:DeleteDistribution
              - cloudfront:GetDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:ListTagsForResource
              - cloudfront:UntagResource
              - cloudfront:UpdateDistribution
            Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: archon-datahub
                aws:ResourceTag/Environment: !Ref DeploymentEnvironment
          - Sid: CreateOnlyRequiredUntaggableCloudFrontComponents
            Effect: Allow
            Action:
              - cloudfront:CreateOriginAccessControl
              - cloudfront:CreateOriginRequestPolicy
              - cloudfront:CreateResponseHeadersPolicy
            Resource: "*"
          - Sid: ReconcileOnlyRequiredOriginAccessControls
            Effect: Allow
            Action:
              - cloudfront:DeleteOriginAccessControl
              - cloudfront:GetOriginAccessControl
              - cloudfront:GetOriginAccessControlConfig
              - cloudfront:UpdateOriginAccessControl
            Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*
          - Sid: ReconcileOnlyRequiredOriginRequestPolicies
            Effect: Allow
            Action:
              - cloudfront:DeleteOriginRequestPolicy
              - cloudfront:GetOriginRequestPolicy
              - cloudfront:GetOriginRequestPolicyConfig
              - cloudfront:UpdateOriginRequestPolicy
            Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-request-policy/*
          - Sid: ReconcileOnlyRequiredResponseHeadersPolicies
            Effect: Allow
            Action:
              - cloudfront:DeleteResponseHeadersPolicy
              - cloudfront:GetResponseHeadersPolicy
              - cloudfront:GetResponseHeadersPolicyConfig
              - cloudfront:UpdateResponseHeadersPolicy
            Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:response-headers-policy/*
          - Sid: CreateOnlyTaggedStageCloudFrontFunctions
            Effect: Allow
            Action: cloudfront:CreateFunction
            Resource: "*"
            Condition:
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - Application
                  - Environment
                  - ManagedBy
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
                aws:RequestTag/ManagedBy: aws-cdk
          - Sid: TagOnlyExactCanonicalHostFunction
            Effect: Allow
            Action: cloudfront:TagResource
            Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/archon-${DeploymentEnvironment}-canonical-host
            Condition:
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - Application
                  - Environment
                  - ManagedBy
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
                aws:RequestTag/ManagedBy: aws-cdk
          - Sid: ReconcileOnlyExactCanonicalHostFunction
            Effect: Allow
            Action:
              - cloudfront:DeleteFunction
              - cloudfront:DescribeFunction
              - cloudfront:GetFunction
              - cloudfront:ListTagsForResource
              - cloudfront:PublishFunction
              - cloudfront:UntagResource
              - cloudfront:UpdateFunction
            Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/archon-${DeploymentEnvironment}-canonical-host
          - Sid: DenyCanonicalHostOwnershipTagRemoval
            Effect: Deny
            Action: cloudfront:UntagResource
            Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/archon-${DeploymentEnvironment}-canonical-host
            Condition:
              ForAnyValue:StringEquals:
                aws:TagKeys:
                  - Application
                  - Environment
                  - ManagedBy
          - Sid: ReadExactPublicHostedZoneForAliases
            Effect: Allow
            Action:
              - route53:GetHostedZone
              - route53:ListResourceRecordSets
            Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${CloudFrontHostedZoneId}
          - Sid: ReconcileOnlyExactStageViewerAliases
            Effect: Allow
            Action: route53:ChangeResourceRecordSets
            Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${CloudFrontHostedZoneId}
            Condition:
              ForAllValues:StringEquals:
                route53:ChangeResourceRecordSetsActions:
                  - CREATE
                  - DELETE
                  - UPSERT
                route53:ChangeResourceRecordSetsNormalizedRecordNames:
                  - !Ref CloudFrontDomainName
                route53:ChangeResourceRecordSetsRecordTypes:
                  - A
                  - AAAA
          - Sid: ReadExactViewerAliasChanges
            Effect: Allow
            Action: route53:GetChange
            Resource: !Sub arn:${AWS::Partition}:route53:::change/*
          - Sid: CreateOnlyTaggedStageRegionalWebAcl
            Effect: Allow
            Action:
              - wafv2:CreateWebACL
              - wafv2:TagResource
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
                aws:RequestedRegion: eu-west-1
          - Sid: ReconcileOnlyNamedStageRegionalWebAcl
            Effect: Allow
            Action:
              - wafv2:AssociateWebACL
              - wafv2:DeleteLoggingConfiguration
              - wafv2:DeleteWebACL
              - wafv2:DisassociateWebACL
              - wafv2:GetLoggingConfiguration
              - wafv2:GetWebACL
              - wafv2:GetWebACLForResource
              - wafv2:ListTagsForResource
              - wafv2:PutLoggingConfiguration
              - wafv2:UntagResource
              - wafv2:UpdateWebACL
            Resource: !Sub arn:${AWS::Partition}:wafv2:eu-west-1:${AWS::AccountId}:regional/webacl/archon-${DeploymentEnvironment}-*/*

  ArchonCdkEdgePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub archon-datahub-cdk-edge-${DeploymentEnvironment}
      Description: !Sub >-
        Exact us-east-1 certificate, DNS-validation, KMS, log, and
        CloudFront-scope WAF permissions for Archon ${DeploymentEnvironment}.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RequestOnlyExactStageViewerCertificate
            Effect: Allow
            Action: acm:RequestCertificate
            Resource: "*"
            Condition:
              ForAllValues:StringEquals:
                acm:DomainNames:
                  - !Ref CloudFrontDomainName
                aws:TagKeys:
                  - Application
                  - Environment
                  - ManagedBy
              StringEquals:
                acm:CertificateTransparencyLogging: ENABLED
                acm:Export: DISABLED
                acm:KeyAlgorithm: EC_prime256v1
                acm:ValidationMethod: DNS
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
                aws:RequestTag/ManagedBy: aws-cdk
                aws:RequestedRegion: us-east-1
          - Sid: TagOnlyExactStageViewerCertificateAtCreate
            Effect: Allow
            Action: acm:AddTagsToCertificate
            Resource: !Sub arn:${AWS::Partition}:acm:us-east-1:${AWS::AccountId}:certificate/*
            Condition:
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - Application
                  - Environment
                  - ManagedBy
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
                aws:RequestTag/ManagedBy: aws-cdk
                aws:RequestedRegion: us-east-1
          - Sid: ReconcileOnlyTaggedStageViewerCertificates
            Effect: Allow
            Action:
              - acm:AddTagsToCertificate
              - acm:DeleteCertificate
              - acm:DescribeCertificate
              - acm:ListTagsForCertificate
              - acm:RemoveTagsFromCertificate
              - acm:UpdateCertificateOptions
            Resource: !Sub arn:${AWS::Partition}:acm:us-east-1:${AWS::AccountId}:certificate/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: archon-datahub
                aws:ResourceTag/Environment: !Ref DeploymentEnvironment
                aws:ResourceTag/ManagedBy: aws-cdk
          - Sid: DenyViewerCertificateOwnershipTagRemoval
            Effect: Deny
            Action: acm:RemoveTagsFromCertificate
            Resource: !Sub arn:${AWS::Partition}:acm:us-east-1:${AWS::AccountId}:certificate/*
            Condition:
              ForAnyValue:StringEquals:
                aws:TagKeys:
                  - Application
                  - Environment
                  - ManagedBy
          - Sid: ReadExactPublicHostedZoneForDnsValidation
            Effect: Allow
            Action:
              - route53:GetHostedZone
              - route53:ListResourceRecordSets
            Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${CloudFrontHostedZoneId}
          - Sid: ReconcileOnlyExactStageDnsValidation
            Effect: Allow
            Action: route53:ChangeResourceRecordSets
            Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${CloudFrontHostedZoneId}
            Condition:
              ForAllValues:StringEquals:
                route53:ChangeResourceRecordSetsActions:
                  - CREATE
                  - DELETE
                  - UPSERT
                route53:ChangeResourceRecordSetsRecordTypes:
                  - CNAME
              ForAllValues:StringLike:
                route53:ChangeResourceRecordSetsNormalizedRecordNames:
                  - !Sub '_*.${CloudFrontDomainName}'
          - Sid: ReadExactDnsValidationChanges
            Effect: Allow
            Action: route53:GetChange
            Resource: !Sub arn:${AWS::Partition}:route53:::change/*
          - Sid: CreateTaggedStageEdgeKey
            Effect: Allow
            Action:
              - kms:CreateKey
              - kms:PutKeyPolicy
              - kms:TagResource
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
                aws:RequestedRegion: us-east-1
          - Sid: ReconcileTaggedStageEdgeKey
            Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:EnableKeyRotation
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListResourceTags
              - kms:PutKeyPolicy
              - kms:TagResource
              - kms:UntagResource
              - kms:UpdateKeyDescription
            Resource: !Sub arn:${AWS::Partition}:kms:us-east-1:${AWS::AccountId}:key/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: archon-datahub
                aws:ResourceTag/Environment: !Ref DeploymentEnvironment
          - Sid: ManageOnlyStageEdgeAlias
            Effect: Allow
            Action:
              - kms:CreateAlias
              - kms:DeleteAlias
              - kms:UpdateAlias
            Resource: !Sub arn:${AWS::Partition}:kms:us-east-1:${AWS::AccountId}:alias/archon/${DeploymentEnvironment}/edge-waf-logs
          - Sid: UseOnlyStageEdgeKeyAsAliasTarget
            Effect: Allow
            Action:
              - kms:CreateAlias
              - kms:UpdateAlias
            Resource: !Sub arn:${AWS::Partition}:kms:us-east-1:${AWS::AccountId}:key/*
            Condition:
              StringEquals:
                aws:ResourceTag/Application: archon-datahub
                aws:ResourceTag/Environment: !Ref DeploymentEnvironment
          - Sid: CreateOnlyTaggedStageEdgeLogGroup
            Effect: Allow
            Action: logs:CreateLogGroup
            Resource: !Sub arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:aws-waf-logs-archon-${DeploymentEnvironment}-cloudfront
            Condition:
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
          - Sid: ReconcileOnlyStageEdgeLogGroup
            Effect: Allow
            Action:
              - logs:AssociateKmsKey
              - logs:DeleteLogGroup
              - logs:DeleteRetentionPolicy
              - logs:DescribeLogGroups
              - logs:DisassociateKmsKey
              - logs:ListTagsForResource
              - logs:PutRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
            Resource: !Sub arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:aws-waf-logs-archon-${DeploymentEnvironment}-cloudfront*
          - Sid: CreateOnlyTaggedStageGlobalWebAcl
            Effect: Allow
            Action:
              - wafv2:CreateWebACL
              - wafv2:TagResource
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestTag/Application: archon-datahub
                aws:RequestTag/Environment: !Ref DeploymentEnvironment
                aws:RequestedRegion: us-east-1
          - Sid: ReconcileOnlyNamedStageGlobalWebAcl
            Effect: Allow
            Action:
              - wafv2:DeleteLoggingConfiguration
              - wafv2:DeleteWebACL
              - wafv2:GetLoggingConfiguration
              - wafv2:GetWebACL
              - wafv2:ListTagsForResource
              - wafv2:PutLoggingConfiguration
              - wafv2:UntagResource
              - wafv2:UpdateWebACL
            Resource: !Sub arn:${AWS::Partition}:wafv2:us-east-1:${AWS::AccountId}:global/webacl/archon-${DeploymentEnvironment}-cloudfront/*

Outputs:
  ArchonCdkEuWest1ExecutionPolicyArns:
    Description: Comma-delimited exact policy inventory for the eu-west-1 bootstrap.
    Value: !Join
      - ","
      - - !Ref ArchonCdkGuardPolicy
        - !Ref ArchonCdkIdentityPolicy
        - !Ref ArchonCdkDataPolicy
        - !Ref ArchonCdkStatePolicy
        - !Ref ArchonCdkObservabilityPolicy
        - !Ref ArchonCdkComputePolicy
        - !Ref ArchonCdkNetworkPolicy
        - !Ref ArchonCdkEndpointPolicy
        - !Ref ArchonCdkDeliveryPolicy
  ArchonCdkUsEast1ExecutionPolicyArns:
    Description: Comma-delimited exact policy inventory for the us-east-1 bootstrap.
    Value: !Join
      - ","
      - - !Ref ArchonCdkGuardPolicy
        - !Ref ArchonCdkEdgePolicy
  ArchonCdkExecutionPolicyNames:
    Value: !Sub >-
      archon-datahub-cdk-guard-${DeploymentEnvironment},
      archon-datahub-cdk-identity-${DeploymentEnvironment},
      archon-datahub-cdk-data-${DeploymentEnvironment},
      archon-datahub-cdk-state-${DeploymentEnvironment},
      archon-datahub-cdk-observability-${DeploymentEnvironment},
      archon-datahub-cdk-compute-${DeploymentEnvironment},
      archon-datahub-cdk-network-${DeploymentEnvironment},
      archon-datahub-cdk-endpoint-${DeploymentEnvironment},
      archon-datahub-cdk-delivery-${DeploymentEnvironment},
      archon-datahub-cdk-edge-${DeploymentEnvironment}
  ArchonRuntimeBoundaryArn:
    Description: Applied to every IAM role synthesized for this stage.
    Value: !Ref ArchonRuntimeBoundary
  ArchonRuntimeBoundaryName:
    Value: !Sub archon-datahub-runtime-boundary-${DeploymentEnvironment}
