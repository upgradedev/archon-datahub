              - !Sub arn:${AWS::Partition}:logs:eu-west-1:${AWS::AccountId}:log-group:/aws/lambda/archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:logs:eu-west-1:${AWS::AccountId}:log-group:/aws/lambda/Archon-${DeploymentEnvironment}-*
              - !Sub arn:${AWS::Partition}:logs:eu-west-1:${AWS::AccountId}:log-group:aws-waf-logs-archon-${DeploymentEnvironment}-api*
              - !Sub arn:${AWS::Partition}:logs:eu-west-1:${AWS::AccountId}:log-group:sns/eu-west-1/${AWS::AccountId}/archon-${DeploymentEnvironment}-alarms*
          - Sid: ReconcileOnlyRequiredLogDeliveryControlPlane
