---
- name: IAM runtime roles with a permissions boundary pass
  input:
    Resources:
      BoundedRuntimeRole:
        Type: AWS::IAM::Role
        Properties:
          PermissionsBoundary: arn:aws:iam::111111111111:policy/archon-datahub-runtime-boundary-staging
          AssumeRolePolicyDocument:
            Version: "2012-10-17"
            Statement: []
  expectations:
    rules:
      iam_roles_require_a_permissions_boundary: PASS

- name: IAM runtime roles without a permissions boundary are rejected
  input:
    Resources:
      UnboundedRuntimeRole:
        Type: AWS::IAM::Role
        Properties:
          AssumeRolePolicyDocument:
            Version: "2012-10-17"
            Statement: []
  expectations:
    rules:
      iam_roles_require_a_permissions_boundary: FAIL

- name: secure Archon reference architecture passes every preventive control
  input:
    Resources:
      PlatformMarker:
        Type: AWS::ECS::Cluster
        Properties: {}
      Registry:
        Type: AWS::ECR::Repository
        Properties:
          ImageTagMutability: IMMUTABLE
          ImageScanningConfiguration:
            ScanOnPush: true
          EncryptionConfiguration:
            EncryptionType: KMS
            KmsKey: arn:aws:kms:eu-west-1:111111111111:key/registry
      SpaBucket:
        Type: AWS::S3::Bucket
        Properties:
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - BucketKeyEnabled: true
                ServerSideEncryptionByDefault:
                  SSEAlgorithm: aws:kms
                  KMSMasterKeyID: arn:aws:kms:eu-west-1:111111111111:key/spa
          OwnershipControls:
            Rules:
              - ObjectOwnership: BucketOwnerEnforced
          Tags:
            - Key: ArchonBucketRole
              Value: application
            - Key: ArchonBucketPurpose
              Value: spa
          VersioningConfiguration:
            Status: Enabled
          LoggingConfiguration:
            DestinationBucketName: archon-log-archive
            LogFilePrefix: s3-access/spa/
      EvidenceBucket:
        Type: AWS::S3::Bucket
        Properties:
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - BucketKeyEnabled: true
                ServerSideEncryptionByDefault:
                  SSEAlgorithm: aws:kms
                  KMSMasterKeyID: arn:aws:kms:eu-west-1:111111111111:key/evidence
          OwnershipControls:
            Rules:
              - ObjectOwnership: BucketOwnerEnforced
          Tags:
            - Key: ArchonBucketRole
              Value: application
            - Key: ArchonBucketPurpose
              Value: evidence
          VersioningConfiguration:
            Status: Enabled
          LoggingConfiguration:
            DestinationBucketName: archon-log-archive
            LogFilePrefix: s3-access/evidence/
          ObjectLockEnabled: true
          ObjectLockConfiguration:
            ObjectLockEnabled: Enabled
            Rule:
              DefaultRetention:
                Mode: GOVERNANCE
                Days: 30
      CloudFrontLogBucket:
        Type: AWS::S3::Bucket
        Properties:
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - ServerSideEncryptionByDefault:
                  SSEAlgorithm: AES256
          OwnershipControls:
            Rules:
              - ObjectOwnership: ObjectWriter
          Tags:
            - Key: ArchonBucketRole
              Value: access-log-sink
            - Key: ArchonBucketPurpose
              Value: access-logs
          VersioningConfiguration:
            Status: Enabled
      DataKey:
        Type: AWS::KMS::Key
        Properties:
          EnableKeyRotation: true
          KeyPolicy:
            Version: "2012-10-17"
            Statement: []
      ApiLogs:
        Type: AWS::Logs::LogGroup
        Properties:
          KmsKeyId: arn:aws:kms:eu-west-1:111111111111:key/logs
          RetentionInDays: 365
      ApprovalTable:
        Type: AWS::DynamoDB::Table
        Properties:
          DeletionProtectionEnabled: true
          PointInTimeRecoverySpecification:
            PointInTimeRecoveryEnabled: true
          SSESpecification:
            SSEEnabled: true
            SSEType: KMS
            KMSMasterKeyId: arn:aws:kms:eu-west-1:111111111111:key/data
      AuditDlq:
        Type: AWS::SQS::Queue
        Properties:
          QueueName: archon-staging-audit-dlq
          KmsMasterKeyId: arn:aws:kms:eu-west-1:111111111111:key/queues
      AuditQueue:
        Type: AWS::SQS::Queue
        Properties:
          QueueName: archon-staging-audit-jobs
          KmsMasterKeyId: arn:aws:kms:eu-west-1:111111111111:key/queues
          RedrivePolicy:
            deadLetterTargetArn: arn:aws:sqs:eu-west-1:111111111111:audit-dlq
            maxReceiveCount: 5
      ApprovalDlq:
        Type: AWS::SQS::Queue
        Properties:
          QueueName: archon-staging-approval-dlq
          KmsMasterKeyId: arn:aws:kms:eu-west-1:111111111111:key/queues
      ApprovalQueue:
        Type: AWS::SQS::Queue
        Properties:
          QueueName: archon-staging-approval-events
          KmsMasterKeyId: arn:aws:kms:eu-west-1:111111111111:key/queues
          RedrivePolicy:
            deadLetterTargetArn: arn:aws:sqs:eu-west-1:111111111111:approval-dlq
            maxReceiveCount: 5
      RemediationDlq:
        Type: AWS::SQS::Queue
        Properties:
          QueueName: archon-staging-remediation-dlq
          KmsMasterKeyId: arn:aws:kms:eu-west-1:111111111111:key/queues
      RemediationQueue:
        Type: AWS::SQS::Queue
        Properties:
          QueueName: archon-staging-remediation-jobs
          KmsMasterKeyId: arn:aws:kms:eu-west-1:111111111111:key/queues
          RedrivePolicy:
            deadLetterTargetArn: arn:aws:sqs:eu-west-1:111111111111:remediation-dlq
            maxReceiveCount: 5
      ApiTask:
        Type: AWS::ECS::TaskDefinition
        Properties:
          ContainerDefinitions:
            - Name: Api
              ReadonlyRootFilesystem: true
              User: "1000"
              LogConfiguration:
                LogDriver: awslogs
      ApprovalFunction:
        Type: AWS::Lambda::Function
        Properties:
          Runtime: nodejs24.x
          ReservedConcurrentExecutions: 10
          TracingConfig:
            Mode: Active
          Environment:
            Variables:
              APPROVAL_TABLE: approval-table
              APPROVER_GROUP: archon-approvers
      ApiStage:
        Type: AWS::ApiGateway::Stage
        Properties:
          AccessLogSetting:
            DestinationArn: arn:aws:logs:eu-west-1:111111111111:log-group:api
            Format: '{"requestId":"$context.requestId"}'
          TracingEnabled: true
          CacheClusterEnabled: true
          MethodSettings:
            - ResourcePath: /~1api~1control-loops~1{auditId}
              HttpMethod: GET
              LoggingLevel: ERROR
              MetricsEnabled: true
              DataTraceEnabled: false
              CachingEnabled: true
              CacheDataEncrypted: true
              CacheTtlInSeconds: 2
      RestApi:
        Type: AWS::ApiGateway::RestApi
        Properties:
          ApiKeySourceType: HEADER
      PublicAuditMethod:
        Type: AWS::ApiGateway::Method
        Properties:
          ApiKeyRequired: true
          AuthorizationType: NONE
          HttpMethod: POST
          Integration:
            Type: HTTP_PROXY
            RequestParameters:
              integration.request.header.x-api-key: "'redacted'"
      PublicControlStartMethod:
        Type: AWS::ApiGateway::Method
        Properties:
          ApiKeyRequired: true
          AuthorizationType: NONE
          HttpMethod: POST
          Integration:
            Type: AWS
            PassthroughBehavior: NEVER
            RequestTemplates:
              application/json: '{"operation":"start","requestId":"request","body":{}}'
      PublicControlStatusMethod:
        Type: AWS::ApiGateway::Method
        Properties:
          ApiKeyRequired: true
          AuthorizationType: NONE
          HttpMethod: GET
          Integration:
            Type: AWS
            PassthroughBehavior: NEVER
            RequestTemplates:
              application/json: '{"operation":"status","requestId":"request","auditId":"abc"}'
      ApprovalDecisionMethod:
        Type: AWS::ApiGateway::Method
        Properties:
          ApiKeyRequired: true
          AuthorizationType: COGNITO_USER_POOLS
          HttpMethod: POST
          Integration:
            Type: AWS
            PassthroughBehavior: NEVER
            RequestTemplates:
              application/json: '{"operation":"decide","requestId":"request","approvalId":"abc","body":{},"identity":{}}'
      CloudFrontOriginApiKey:
        Type: AWS::ApiGateway::ApiKey
        Properties:
          Enabled: true
          Value: "{{resolve:secretsmanager:archon/staging/cloudfront-origin-api-key:SecretString:apiKey::}}"
      CloudFrontOriginUsagePlan:
        Type: AWS::ApiGateway::UsagePlan
        Properties:
          ApiStages:
            - ApiId: api-123
              Stage: staging
          Quota:
            Limit: 25000
            Period: DAY
          Throttle:
            BurstLimit: 20
            RateLimit: 10
      CloudFrontOriginUsagePlanKey:
        Type: AWS::ApiGateway::UsagePlanKey
        Properties:
          KeyId: key-123
          KeyType: API_KEY
          UsagePlanId: plan-123
      ApiOriginRequestPolicy:
        Type: AWS::CloudFront::OriginRequestPolicy
        Properties:
          OriginRequestPolicyConfig:
            Name: archon-staging-api-origin
            CookiesConfig:
              CookieBehavior: all
            HeadersConfig:
              HeaderBehavior: allExcept
              Headers:
                - host
            QueryStringsConfig:
              QueryStringBehavior: all
      PrivateSubnet:
        Type: AWS::EC2::Subnet
        Properties:
          VpcId: vpc-12345678
          CidrBlock: 10.42.4.0/22
          MapPublicIpOnLaunch: false
      CanonicalHost:
        Type: AWS::CloudFront::Function
        Properties:
          Name: archon-staging-canonical-host
          AutoPublish: true
          FunctionConfig:
            Comment: Reject non-canonical hosts
            Runtime: cloudfront-js-2.0
          FunctionCode: function handler(event) { return event.request; }
      Distribution:
        Type: AWS::CloudFront::Distribution
        Properties:
          DistributionConfig:
            Enabled: true
            Aliases:
              - archon.example.com
            Logging:
              Bucket: logs.s3.amazonaws.com
            WebACLId: arn:aws:wafv2:us-east-1:111111111111:global/webacl/archon/00000000-0000-4000-8000-000000000000
            ViewerCertificate:
              AcmCertificateArn: arn:aws:acm:us-east-1:111111111111:certificate/00000000-0000-4000-8000-000000000000
              SslSupportMethod: sni-only
              MinimumProtocolVersion: TLSv1.3_2025
            DefaultCacheBehavior:
              ViewerProtocolPolicy: redirect-to-https
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN:
                    Fn::GetAtt:
                      - CanonicalHost
                      - FunctionARN
            CacheBehaviors:
              - PathPattern: api/*
                OriginRequestPolicyId:
                  Ref: ApiOriginRequestPolicy
                TargetOriginId: ApiOrigin
                ViewerProtocolPolicy: https-only
                FunctionAssociations:
                  - EventType: viewer-request
                    FunctionARN:
                      Fn::GetAtt:
                        - CanonicalHost
                        - FunctionARN
              - PathPattern: runtime-config.json
                TargetOriginId: SpaOrigin
                ViewerProtocolPolicy: https-only
                FunctionAssociations:
                  - EventType: viewer-request
                    FunctionARN:
                      Fn::GetAtt:
                        - CanonicalHost
                        - FunctionARN
            Origins:
              - Id: SpaOrigin
                DomainName: spa.s3.amazonaws.com
                OriginAccessControlId: oac-123
              - Id: ApiOrigin
                DomainName:
                  Fn::Join:
                    - ""
                    - - Ref: RestApi
                      - .execute-api.
                      - Ref: AWS::Region
                      - "."
                      - Ref: AWS::URLSuffix
                CustomOriginConfig:
                  OriginProtocolPolicy: https-only
                OriginCustomHeaders:
                  - HeaderName: x-api-key
                    HeaderValue: "{{resolve:secretsmanager:archon/staging/cloudfront-origin-api-key:SecretString:apiKey::}}"
      SecretsKey:
        Type: AWS::KMS::Key
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
          EnableKeyRotation: true
          PendingWindowInDays: 30
          KeyPolicy:
            Version: "2012-10-17"
            Statement: []
          Tags:
            - Key: ArchonKeyPurpose
              Value: secrets
      CloudFrontOriginApiKeySecret:
        Type: AWS::SecretsManager::Secret
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
          Name: archon/staging/cloudfront-origin-api-key
          KmsKeyId:
            Fn::GetAtt:
              - SecretsKey
              - Arn
          GenerateSecretString:
            ExcludePunctuation: true
            GenerateStringKey: apiKey
            IncludeSpace: false
            PasswordLength: 64
            SecretStringTemplate: "{}"
      ReadSecret:
        Type: AWS::SecretsManager::Secret
        Properties:
          KmsKeyId: arn:aws:kms:eu-west-1:111111111111:key/secrets
      RegionalWebAcl:
        Type: AWS::WAFv2::WebACL
        Properties:
          Scope: REGIONAL
          DefaultAction:
            Allow: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: archon-staging-api-waf
            SampledRequestsEnabled: true
          DataProtectionConfig:
            DataProtections:
              - Action: SUBSTITUTION
                ExcludeRateBasedDetails: false
                ExcludeRuleMatchDetails: false
                Field:
                  FieldType: SINGLE_HEADER
                  FieldKeys:
                    - authorization
              - Action: SUBSTITUTION
                ExcludeRateBasedDetails: false
                ExcludeRuleMatchDetails: false
                Field:
                  FieldType: SINGLE_HEADER
                  FieldKeys:
                    - cookie
              - Action: SUBSTITUTION
                ExcludeRateBasedDetails: false
                ExcludeRuleMatchDetails: false
                Field:
                  FieldType: SINGLE_HEADER
                  FieldKeys:
                    - x-api-key
      ApiWafLogging:
        Type: AWS::WAFv2::LoggingConfiguration
        Properties:
          ResourceArn: arn:aws:wafv2:eu-west-1:111111111111:regional/webacl/archon/id
          LogDestinationConfigs:
            - arn:aws:logs:eu-west-1:111111111111:log-group:aws-waf-logs-archon-staging-api
          LoggingFilter:
            DefaultBehavior: DROP
            Filters:
              - Behavior: KEEP
                Requirement: MEETS_ANY
                Conditions:
                  - ActionCondition:
                      Action: BLOCK
                  - ActionCondition:
                      Action: COUNT
          RedactedFields:
            - SingleHeader:
                Name: authorization
            - SingleHeader:
                Name: cookie
            - SingleHeader:
                Name: x-api-key
      ApiWafAssociation:
        Type: AWS::WAFv2::WebACLAssociation
        Properties:
          ResourceArn: arn:aws:apigateway:eu-west-1::/restapis/example/stages/staging
          WebACLArn: arn:aws:wafv2:eu-west-1:111111111111:regional/webacl/archon/id
      CognitoUserPool:
        Type: AWS::Cognito::UserPool
        Properties: {}
      CognitoWafAssociation:
        Type: AWS::WAFv2::WebACLAssociation
        Properties:
          ResourceArn: arn:aws:cognito-idp:eu-west-1:111111111111:userpool/eu-west-1_example
          WebACLArn: arn:aws:wafv2:eu-west-1:111111111111:regional/webacl/archon/id
  expectations:
    rules:
      ecr_repositories_are_hardened: PASS
      s3_buckets_are_private_and_encrypted: PASS
      platform_has_s3_server_access_logging: PASS
      platform_has_versioned_object_locked_evidence_store: PASS
      kms_keys_rotate: PASS
      retained_logs_are_encrypted: PASS
      dynamodb_tables_are_resilient_and_encrypted: PASS
      sqs_queues_are_encrypted: PASS
      platform_source_queues_use_dead_letter_queues: PASS
      ecs_task_containers_are_hardened: PASS
      platform_approval_lambda_is_hardened: PASS
      lambda_functions_enable_active_xray: PASS
      subnets_never_auto_assign_public_ips: PASS
      api_gateway_stages_are_observable: PASS
      public_api_methods_require_cloudfront_origin_gate: PASS
      cloudfront_api_origin_is_rest_api_bound: PASS
      cloudfront_origin_custom_headers_are_api_key_only: PASS
      cloudfront_origin_key_is_stage_bound: PASS
      cloudfront_origin_key_uses_dedicated_cmk: PASS
      cloudfront_distributions_enforce_tls_logging_and_oac: PASS
      secrets_use_customer_managed_kms: PASS
      waf_web_acls_protect_sensitive_sampled_data: PASS
      waf_logging_is_filtered_and_redacted: PASS
      platform_has_regional_waf: PASS

- name: mutable unscanned ECR repositories are rejected
