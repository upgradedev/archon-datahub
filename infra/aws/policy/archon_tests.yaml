---
- name: retired ECS resources are rejected
  input:
    Resources:
      Legacy:
        Type: AWS::ECS::Cluster
        Properties: {}
  expectations:
    rules:
      retired_always_on_topology_is_absent: FAIL

- name: a bounded runtime role is accepted
  input:
    Resources:
      Role:
        Type: AWS::IAM::Role
        Properties:
          PermissionsBoundary: arn:aws:iam::111111111111:policy/archon-datahub-runtime-boundary-staging
          AssumeRolePolicyDocument:
            Version: "2012-10-17"
            Statement: []
  expectations:
    rules:
      every_runtime_role_has_the_stage_boundary: PASS

- name: an unbounded runtime role is rejected
  input:
    Resources:
      Role:
        Type: AWS::IAM::Role
        Properties:
          AssumeRolePolicyDocument:
            Version: "2012-10-17"
            Statement: []
  expectations:
    rules:
      every_runtime_role_has_the_stage_boundary: FAIL

- name: a zero-idle single-host Core group is accepted
  input:
    Resources:
      Core:
        Type: AWS::AutoScaling::AutoScalingGroup
        Properties:
          MinSize: "0"
          DesiredCapacity: "0"
          MaxSize: "1"
  expectations:
    rules:
      core_is_zero_idle_single_host: PASS

- name: an always-on Core group is rejected
  input:
    Resources:
      Core:
        Type: AWS::AutoScaling::AutoScalingGroup
        Properties:
          MinSize: "1"
          DesiredCapacity: "1"
          MaxSize: "1"
  expectations:
    rules:
      core_is_zero_idle_single_host: FAIL

- name: a KMS-encrypted one-year log group is accepted
  input:
    Resources:
      Logs:
        Type: AWS::Logs::LogGroup
        Properties:
          KmsKeyId: arn:aws:kms:eu-west-1:111111111111:key/00000000-0000-0000-0000-000000000000
          RetentionInDays: 365
  expectations:
    rules:
      retained_logs_are_kms_encrypted: PASS

- name: a 30-day log group is rejected
  input:
    Resources:
      Logs:
        Type: AWS::Logs::LogGroup
        Properties:
          KmsKeyId: arn:aws:kms:eu-west-1:111111111111:key/00000000-0000-0000-0000-000000000000
          RetentionInDays: 30
  expectations:
    rules:
      retained_logs_are_kms_encrypted: FAIL

- name: a WAF ACL with sampled requests disabled is accepted
  input:
    Resources:
      Waf:
        Type: AWS::WAFv2::WebACL
        Properties:
          Scope: REGIONAL
          VisibilityConfig:
            SampledRequestsEnabled: false
          Rules:
            - Name: Managed
              VisibilityConfig:
                SampledRequestsEnabled: false
  expectations:
    rules:
      waf_acls_fail_closed_on_sensitive_fields: PASS

- name: a WAF ACL with sampled requests enabled is rejected
  input:
    Resources:
      Waf:
        Type: AWS::WAFv2::WebACL
        Properties:
          Scope: CLOUDFRONT
          VisibilityConfig:
            SampledRequestsEnabled: true
          Rules:
            - Name: Managed
              VisibilityConfig:
                SampledRequestsEnabled: false
  expectations:
    rules:
      waf_acls_fail_closed_on_sensitive_fields: FAIL

- name: a WAF rule with sampled requests enabled is rejected
  input:
    Resources:
      Waf:
        Type: AWS::WAFv2::WebACL
        Properties:
          Scope: REGIONAL
          VisibilityConfig:
            SampledRequestsEnabled: false
          Rules:
            - Name: Managed
              VisibilityConfig:
                SampledRequestsEnabled: true
  expectations:
    rules:
      waf_acls_fail_closed_on_sensitive_fields: FAIL

- name: a fully logged and traced Core lifecycle is accepted
  input:
    Resources:
      Lifecycle:
        Type: AWS::StepFunctions::StateMachine
        Properties:
          TracingConfiguration:
            Enabled: true
          LoggingConfiguration:
            Level: "ALL"
            IncludeExecutionData: false
  expectations:
    rules:
      core_lifecycle_is_traced_and_logged: PASS

- name: an error-only Core lifecycle log is rejected
  input:
    Resources:
      Lifecycle:
        Type: AWS::StepFunctions::StateMachine
        Properties:
          TracingConfiguration:
            Enabled: true
          LoggingConfiguration:
            Level: "ERROR"
            IncludeExecutionData: false
  expectations:
    rules:
      core_lifecycle_is_traced_and_logged: FAIL

- name: an automatically rotating symmetric KMS key is accepted
  input:
    Resources:
      Key:
        Type: AWS::KMS::Key
        Properties:
          EnableKeyRotation: true
          PendingWindowInDays: 30
          KeyPolicy:
            Version: "2012-10-17"
            Statement: []
  expectations:
    rules:
      kms_keys_rotate_and_are_not_immediately_deletable: PASS

- name: a retained asymmetric mutation-signing key is accepted
  input:
    Resources:
      Key:
        Type: AWS::KMS::Key
        Properties:
          KeySpec: ECC_NIST_P256
          KeyUsage: SIGN_VERIFY
          PendingWindowInDays: 30
          KeyPolicy:
            Version: "2012-10-17"
            Statement: []
  expectations:
    rules:
      kms_keys_rotate_and_are_not_immediately_deletable: PASS

- name: automatic rotation on an asymmetric signing key is rejected
  input:
    Resources:
      Key:
        Type: AWS::KMS::Key
        Properties:
          EnableKeyRotation: true
          KeySpec: ECC_NIST_P256
          KeyUsage: SIGN_VERIFY
          PendingWindowInDays: 30
          KeyPolicy:
            Version: "2012-10-17"
            Statement: []
  expectations:
    rules:
      kms_keys_rotate_and_are_not_immediately_deletable: FAIL

- name: an unreviewed asymmetric signing key spec is rejected
  input:
    Resources:
      Key:
        Type: AWS::KMS::Key
        Properties:
          KeySpec: RSA_2048
          KeyUsage: SIGN_VERIFY
          PendingWindowInDays: 30
          KeyPolicy:
            Version: "2012-10-17"
            Statement: []
  expectations:
    rules:
      kms_keys_rotate_and_are_not_immediately_deletable: FAIL

- name: the exact bounded terminal access-log sink is accepted
  input:
    Resources:
      AccessLogs:
        Type: AWS::S3::Bucket
        Properties:
          AccessControl: LogDeliveryWrite
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
          OwnershipControls:
            Rules:
              - ObjectOwnership: ObjectWriter
          VersioningConfiguration:
            Status: Enabled
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - ServerSideEncryptionByDefault:
                  SSEAlgorithm: AES256
          LifecycleConfiguration:
            Rules:
              - Id: BoundedTerminalAccessLogs
                Status: Enabled
                AbortIncompleteMultipartUpload:
                  DaysAfterInitiation: 1
                ExpirationInDays: 180
                NoncurrentVersionExpiration:
                  NoncurrentDays: 30
          Tags:
            - Key: SecurityProfile
              Value: terminal-access-log-sink
  expectations:
    rules:
      only_the_reviewed_terminal_sink_may_enable_bucket_acls: PASS
      terminal_s3_access_log_sink_is_bounded: PASS

- name: an unrelated ACL-enabled bucket is rejected
  input:
    Resources:
      Unreviewed:
        Type: AWS::S3::Bucket
        Properties:
          AccessControl: PublicRead
  expectations:
    rules:
      only_the_reviewed_terminal_sink_may_enable_bucket_acls: FAIL

- name: a recursive terminal log sink is rejected
  input:
    Resources:
      Recursive:
        Type: AWS::S3::Bucket
        Properties:
          AccessControl: LogDeliveryWrite
          LoggingConfiguration:
            DestinationBucketName: recursive
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
          OwnershipControls:
            Rules:
              - ObjectOwnership: ObjectWriter
          VersioningConfiguration:
            Status: Enabled
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - ServerSideEncryptionByDefault:
                  SSEAlgorithm: AES256
          LifecycleConfiguration:
            Rules:
              - Status: Enabled
                AbortIncompleteMultipartUpload:
                  DaysAfterInitiation: 1
                ExpirationInDays: 30
                NoncurrentVersionExpiration:
                  NoncurrentDays: 7
          Tags:
            - Key: SecurityProfile
              Value: terminal-access-log-sink
  expectations:
    rules:
      terminal_s3_access_log_sink_is_bounded: FAIL

- name: an unbounded terminal log sink is rejected
  input:
    Resources:
      Unbounded:
        Type: AWS::S3::Bucket
        Properties:
          AccessControl: LogDeliveryWrite
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
          OwnershipControls:
            Rules:
              - ObjectOwnership: ObjectWriter
          VersioningConfiguration:
            Status: Enabled
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - ServerSideEncryptionByDefault:
                  SSEAlgorithm: AES256
          LifecycleConfiguration:
            Rules:
              - Status: Enabled
                AbortIncompleteMultipartUpload:
                  DaysAfterInitiation: 7
                ExpirationInDays: 365
                NoncurrentVersionExpiration:
                  NoncurrentDays: 90
          Tags:
            - Key: SecurityProfile
              Value: terminal-access-log-sink
  expectations:
    rules:
      terminal_s3_access_log_sink_is_bounded: FAIL

- name: the exact KMS CloudFront log bucket forwards its own access logs
  input:
    Resources:
      CloudFrontLogs:
        Type: AWS::S3::Bucket
        Properties:
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
          OwnershipControls:
            Rules:
              - ObjectOwnership: ObjectWriter
          VersioningConfiguration:
            Status: Enabled
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - BucketKeyEnabled: true
                ServerSideEncryptionByDefault:
                  SSEAlgorithm: aws:kms
                  KMSMasterKeyID: test-key
          LoggingConfiguration:
            DestinationBucketName: terminal-sink
            LogFilePrefix: staging/s3/cloudfront-log-bucket/
          LifecycleConfiguration:
            Rules:
              - Status: Enabled
                AbortIncompleteMultipartUpload:
                  DaysAfterInitiation: 1
                ExpirationInDays: 30
                NoncurrentVersionExpiration:
                  NoncurrentDays: 7
          Tags:
            - Key: SecurityProfile
              Value: cloudfront-access-log-bucket
  expectations:
    rules:
      cloudfront_log_bucket_is_kms_encrypted_and_forwards_access_logs: PASS

- name: an unlogged ObjectWriter KMS bucket is rejected
  input:
    Resources:
      Unlogged:
        Type: AWS::S3::Bucket
        Properties:
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
          OwnershipControls:
            Rules:
              - ObjectOwnership: ObjectWriter
          VersioningConfiguration:
            Status: Enabled
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - BucketKeyEnabled: true
                ServerSideEncryptionByDefault:
                  SSEAlgorithm: aws:kms
                  KMSMasterKeyID: test-key
  expectations:
    rules:
      cloudfront_log_bucket_is_kms_encrypted_and_forwards_access_logs: FAIL

- name: an all-traffic CloudWatch VPC flow log is accepted
  input:
    Resources:
      CoreVpc:
        Type: AWS::EC2::VPC
        Properties:
          CidrBlock: 10.77.0.0/24
      CoreFlow:
        Type: AWS::EC2::FlowLog
        Properties:
          DeliverLogsPermissionArn: test-role
          LogDestination: test-log-group
          LogDestinationType: cloud-watch-logs
          ResourceId: core-vpc
          ResourceType: VPC
          TrafficType: ALL
  expectations:
    rules:
      every_vpc_emits_all_traffic_to_cloudwatch: PASS

- name: a VPC without flow logs is rejected
  input:
    Resources:
      CoreVpc:
        Type: AWS::EC2::VPC
        Properties:
          CidrBlock: 10.77.0.0/24
  expectations:
    rules:
      every_vpc_emits_all_traffic_to_cloudwatch: FAIL
