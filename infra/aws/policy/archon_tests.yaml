      PublicBucket:
        Type: AWS::S3::Bucket
        Properties:
          PublicAccessBlockConfiguration:
            BlockPublicAcls: false
            BlockPublicPolicy: false
            IgnorePublicAcls: false
            RestrictPublicBuckets: false
          BucketEncryption:
            ServerSideEncryptionConfiguration: []
  expectations:
    rules:
      s3_buckets_are_private_and_encrypted: FAIL

- name: a platform without object locked evidence is rejected
  input:
    Resources:
      PlatformMarker:
        Type: AWS::ECS::Cluster
        Properties: {}
  expectations:
    rules:
      platform_has_versioned_object_locked_evidence_store: FAIL

- name: object lock on a non-evidence bucket cannot satisfy evidence retention
