---
- name: retired ECS resources are rejected
  input:
    Resources:
      Legacy:
        Type: AWS::ECS::Cluster
        Properties: {}
  expectations:
    rules:
      retired_always_on_topology_is_absent: FAIL

- name: a bounded runtime role is accepted
  input:
    Resources:
      Role:
        Type: AWS::IAM::Role
        Properties:
          PermissionsBoundary: arn:aws:iam::111111111111:policy/archon-datahub-runtime-boundary-staging
          AssumeRolePolicyDocument:
            Version: "2012-10-17"
            Statement: []
  expectations:
    rules:
      every_runtime_role_has_the_stage_boundary: PASS

- name: an unbounded runtime role is rejected
  input:
    Resources:
      Role:
        Type: AWS::IAM::Role
        Properties:
          AssumeRolePolicyDocument:
            Version: "2012-10-17"
            Statement: []
  expectations:
    rules:
      every_runtime_role_has_the_stage_boundary: FAIL

- name: a zero-idle single-host Core group is accepted
  input:
    Resources:
      Core:
        Type: AWS::AutoScaling::AutoScalingGroup
        Properties:
          MinSize: "0"
          DesiredCapacity: "0"
          MaxSize: "1"
  expectations:
    rules:
      core_is_zero_idle_single_host: PASS

- name: an always-on Core group is rejected
  input:
    Resources:
      Core:
        Type: AWS::AutoScaling::AutoScalingGroup
        Properties:
          MinSize: "1"
          DesiredCapacity: "1"
          MaxSize: "1"
  expectations:
    rules:
      core_is_zero_idle_single_host: FAIL

- name: a KMS-encrypted one-year log group is accepted
  input:
    Resources:
      Logs:
        Type: AWS::Logs::LogGroup
        Properties:
          KmsKeyId: arn:aws:kms:eu-west-1:111111111111:key/00000000-0000-0000-0000-000000000000
          RetentionInDays: 365
  expectations:
    rules:
      retained_logs_are_kms_encrypted: PASS

- name: a 30-day log group is rejected
  input:
    Resources:
      Logs:
        Type: AWS::Logs::LogGroup
        Properties:
          KmsKeyId: arn:aws:kms:eu-west-1:111111111111:key/00000000-0000-0000-0000-000000000000
          RetentionInDays: 30
  expectations:
    rules:
      retained_logs_are_kms_encrypted: FAIL

- name: a WAF ACL with sampled requests disabled is accepted
  input:
    Resources:
      Waf:
        Type: AWS::WAFv2::WebACL
        Properties:
          Scope: REGIONAL
          VisibilityConfig:
            SampledRequestsEnabled: false
          Rules:
            - Name: Managed
              VisibilityConfig:
                SampledRequestsEnabled: false
  expectations:
    rules:
      waf_acls_fail_closed_on_sensitive_fields: PASS

- name: a WAF ACL with sampled requests enabled is rejected
  input:
    Resources:
      Waf:
        Type: AWS::WAFv2::WebACL
        Properties:
          Scope: CLOUDFRONT
          VisibilityConfig:
            SampledRequestsEnabled: true
          Rules:
            - Name: Managed
              VisibilityConfig:
                SampledRequestsEnabled: false
  expectations:
    rules:
      waf_acls_fail_closed_on_sensitive_fields: FAIL

- name: a WAF rule with sampled requests enabled is rejected
  input:
    Resources:
      Waf:
        Type: AWS::WAFv2::WebACL
        Properties:
          Scope: REGIONAL
          VisibilityConfig:
            SampledRequestsEnabled: false
          Rules:
            - Name: Managed
              VisibilityConfig:
                SampledRequestsEnabled: true
  expectations:
    rules:
      waf_acls_fail_closed_on_sensitive_fields: FAIL

- name: a fully logged and traced Core lifecycle is accepted
  input:
    Resources:
      Lifecycle:
        Type: AWS::StepFunctions::StateMachine
        Properties:
          TracingConfiguration:
            Enabled: true
          LoggingConfiguration:
            Level: "ALL"
            IncludeExecutionData: false
  expectations:
    rules:
      core_lifecycle_is_traced_and_logged: PASS

- name: an error-only Core lifecycle log is rejected
  input:
    Resources:
      Lifecycle:
        Type: AWS::StepFunctions::StateMachine
        Properties:
          TracingConfiguration:
            Enabled: true
          LoggingConfiguration:
            Level: "ERROR"
            IncludeExecutionData: false
  expectations:
    rules:
      core_lifecycle_is_traced_and_logged: FAIL
