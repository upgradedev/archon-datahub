      Registry:
        Type: AWS::ECR::Repository
        Properties:
          ImageTagMutability: MUTABLE
          ImageScanningConfiguration:
            ScanOnPush: false
          EncryptionConfiguration:
            EncryptionType: AES256
  expectations:
    rules:
      ecr_repositories_are_hardened: FAIL

- name: publicly reachable unencrypted S3 buckets are rejected
  input:
