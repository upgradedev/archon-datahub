- name: exact Archon alarm HTTP/S delivery feedback passes
  input:
    Resources:
      LogsKey: &validAlarmLogsKey
        Type: AWS::KMS::Key
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
          EnableKeyRotation: true
          KeyPolicy:
            Version: "2012-10-17"
            Statement:
              - &validAlarmKmsCloudWatchPublishStatement
                Sid: AllowAccountCloudWatchAlarmsToPublishEncryptedAlerts
                Effect: Allow
                Principal:
                  Service: cloudwatch.amazonaws.com
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:SourceAccount:
                      Ref: AWS::AccountId
                    kms:EncryptionContext:aws:sns:topicArn:
                      Fn::Join:
                        - ""
                        - - "arn:"
                          - Ref: AWS::Partition
                          - ":sns:"
                          - Ref: AWS::Region
                          - ":"
                          - Ref: AWS::AccountId
                          - ":archon-production-alarms"
                  ArnLike:
                    aws:SourceArn:
                      Fn::Join:
                        - ""
                        - - "arn:"
                          - Ref: AWS::Partition
                          - ":cloudwatch:"
                          - Ref: AWS::Region
                          - ":"
                          - Ref: AWS::AccountId
                          - ":alarm:*"
      AlarmDeliveryStatusRole: &validAlarmDeliveryStatusRole
        Type: AWS::IAM::Role
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
          RoleName: archon-production-sns-delivery-status
          AssumeRolePolicyDocument:
            Version: "2012-10-17"
            Statement:
              - &validAlarmTrustStatement
                Effect: Allow
                Action: sts:AssumeRole
                Principal:
                  Service: sns.amazonaws.com
                Condition:
                  StringEquals:
                    aws:SourceAccount:
                      Ref: AWS::AccountId
                  ArnEqualsIfExists:
                    aws:SourceArn:
                      Fn::Join:
                        - ""
                        - - "arn:"
                          - Ref: AWS::Partition
                          - ":sns:"
                          - Ref: AWS::Region
                          - ":"
                          - Ref: AWS::AccountId
                          - ":archon-production-alarms"
      AlarmDeliveryStatusPolicy: &validAlarmDeliveryStatusPolicy
        Type: AWS::IAM::Policy
        Properties:
          PolicyName: archon-production-sns-delivery-status
          Roles:
            - Ref: AlarmDeliveryStatusRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - &validAlarmCreateLogGroupStatement
                Sid: CreateOnlyArchonAlarmDeliveryLogGroups
                Effect: Allow
                Action: logs:CreateLogGroup
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:aws:logs:eu-west-1:111111111111:log-group:sns/"
                      - Ref: AWS::Region
                      - "/"
                      - Ref: AWS::AccountId
                      - "/archon-production-alarms"
              - &validAlarmWriteLogStreamStatement
                Sid: WriteOnlyArchonAlarmDeliveryLogStreams
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:aws:logs:eu-west-1:111111111111:log-group:sns/"
                      - Ref: AWS::Region
                      - "/"
                      - Ref: AWS::AccountId
                      - "/archon-production-alarms:log-stream:*"
              - &validAlarmFeedbackKmsStatement
                Sid: UseExactLogsKeyOnlyThroughCloudWatchLogs
                Effect: Allow
                Action:
                  - kms:Decrypt
