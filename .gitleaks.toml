title = "Archon DataHub secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "AWS ACM EC P-256 certificate algorithm is a public enum, not a credential"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = [
  '''(?i)(certificatekeyalgorithm|keyalgorithm)[^\r\n]{0,64}EC_prime256v1''',
]
[[allowlists]]
description = "Pinned DataHub Quickstart default inspected only so provisioning can replace it"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
commits = ["442145990a089c7549bdda3d004e5e66cf778458"]
paths = [
  '''^infra/aws/packer/provision-datahub-core\.sh$''',
]
regexes = [
  '''DATAHUB_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
]
[[allowlists]]
description = "One historical synthetic AWS key shape tests checkpoint credential detection"
targetRules = ["aws-access-token"]
condition = "AND"
regexTarget = "match"
commits = ["9ada20069ab02b6de49a4eb0e5875108a622f45d"]
paths = [
  '''^services/datahub-cloud-runtime/tests/test_contracts\.py$''',
]
regexes = [
  '''ASIAABCDEFGHIJKLMNOP''',
]
[[allowlists]]
description = "One historical synthetic CDK logical ID tests exact Trivy resource binding"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
commits = ["c48b45e780ac32fa95fcefbc7c11da6e5a6f774f"]
paths = [
  '''^tests/pipeline/trivy-iac-exception-contract\.test\.mjs$''',
]
regexes = [
  '''LogsKeyABCDEF12''',
]