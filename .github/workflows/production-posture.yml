name: Lean production posture

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: archon-production-posture
  cancel-in-progress: false

env:
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_PAGER: ""
  AWS_REGION: eu-west-1
  AWS_EDGE_REGION: us-east-1

jobs:
  verify:
    name: Verify deployed controls, drift, alarms, and zero-idle Core
    if: >-
      github.repository == 'upgradedev/archon-datahub' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-observer
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bind the current reviewed control plane
        env:
          ATTEMPTS: "40"
          BACKOFF_SECONDS: "15"
          GH_TOKEN: ${{ github.token }}
          OUTPUT_PATH: ${{ runner.temp }}/posture/control-plane-gates.json
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          mkdir -p "${RUNNER_TEMP}/posture"
          bash scripts/verify-github-control-plane.sh
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Validate protected observer identity
        env:
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          OBSERVER_ROLE: ${{ vars.AWS_READ_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "${ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          test "${OBSERVER_ROLE}" = \
            "arn:aws:iam::${ACCOUNT_ID}:role/archon-production-posture-observer"

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_READ_ROLE_ARN }}
          role-session-name: archon-posture-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Observe runtime and prove infrastructure drift is absent
        id: posture
        env:
          ARCHON_STAGE: production
          ARCHON_OBSERVATION_OUTPUT: ${{ runner.temp }}/posture/observation.json
          EXPECT_CORE_IDLE: "true"
        run: |
          set -euo pipefail
          bash scripts/observe-aws-live-runtime.sh

          : >"${RUNNER_TEMP}/posture/drift.ndjson"
          detect_drift() {
            local stack="$1" region="$2" detection status
            detection="$(
              aws cloudformation detect-stack-drift \
                --stack-name "${stack}" --region "${region}" \
                --query StackDriftDetectionId --output text
            )"
            [[ "${detection}" =~ ^[0-9a-fA-F-]{36}$ ]]
            for ((attempt = 1; attempt <= 30; attempt++)); do
              status="$(
                aws cloudformation describe-stack-drift-detection-status \
                  --stack-drift-detection-id "${detection}" \
                  --region "${region}" --output json
              )"
              if test "$(jq -r .DetectionStatus <<<"${status}")" != DETECTION_IN_PROGRESS; then
                break
              fi
              sleep 5
            done
            jq -e '
              .DetectionStatus == "DETECTION_COMPLETE" and
              .StackDriftStatus == "IN_SYNC"
            ' <<<"${status}" >/dev/null
            jq -cnS --arg stack "${stack}" --arg region "${region}" \
              '{stack:$stack,region:$region,status:"IN_SYNC"}' \
              >>"${RUNNER_TEMP}/posture/drift.ndjson"
          }
          detect_drift "Archon-production-Edge" "${AWS_EDGE_REGION}"
          detect_drift "Archon-production-Core" "${AWS_REGION}"
          detect_drift "Archon-production-Judge" "${AWS_REGION}"
          jq -sS 'sort_by(.stack)' "${RUNNER_TEMP}/posture/drift.ndjson" \
            >"${RUNNER_TEMP}/posture/drift.json"

          alarms="$(
            aws cloudwatch describe-alarms \
              --alarm-names \
                archon-production-control-plane-errors \
                archon-production-runtime-failure-queue-visible \
              --region "${AWS_REGION}" --output json
          )"
          jq -e '
            (.MetricAlarms | length) == 2 and
            all(.MetricAlarms[];
              .StateValue != "ALARM" and
              .ActionsEnabled == true
            )
          ' <<<"${alarms}" >/dev/null

          release="$(jq -er .releaseSha "${RUNNER_TEMP}/posture/observation.json")"
          test "${release}" = "${GITHUB_SHA}"
          drift_digest="sha256:$(sha256sum "${RUNNER_TEMP}/posture/drift.json" | awk '{print $1}')"
          jq -cnS \
            --arg releaseSha "${release}" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg driftDigest "${drift_digest}" '
              {
                schemaVersion:"archon.production-posture/v2",
                releaseSha:$releaseSha,
                observedAt:$observedAt,
                checks:{
                  leanRuntimeControls:true,
                  zeroIdleCore:true,
                  cloudFormationDrift:"IN_SYNC",
                  alarmsNotFiring:true,
                  legacyAlwaysOnRuntimeAbsent:true
                },
                driftEvidenceDigest:$driftDigest,
                rawIdentifiersRetained:false,
                result:"passed"
              }
            ' >"${RUNNER_TEMP}/posture/evidence.json"
          echo "evidence=${RUNNER_TEMP}/posture/evidence.json" >>"${GITHUB_OUTPUT}"

      - name: Attest sanitized posture evidence
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.posture.outputs.evidence }}
          predicate-type: https://github.com/upgradedev/archon-datahub/attestations/production-posture/v2
          predicate-path: ${{ steps.posture.outputs.evidence }}

      - name: Retain posture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-posture-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/posture/evidence.json
            ${{ runner.temp }}/posture/observation.json
            ${{ runner.temp }}/posture/drift.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Remove runner-only evidence
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/posture"
