name: Lean production availability

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: archon-production-availability
  cancel-in-progress: false

env:
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_PAGER: ""
  AWS_REGION: eu-west-1
  AWS_EDGE_REGION: us-east-1

jobs:
  probe:
    name: Observe serverless judge path and zero-idle Core
    if: >-
      github.repository == 'upgradedev/archon-datahub' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-observer
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bind the current reviewed control plane
        env:
          ATTEMPTS: "40"
          BACKOFF_SECONDS: "15"
          GH_TOKEN: ${{ github.token }}
          OUTPUT_PATH: ${{ runner.temp }}/availability/control-plane-gates.json
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          mkdir -p "${RUNNER_TEMP}/availability"
          bash scripts/verify-github-control-plane.sh
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Validate protected observer configuration
        env:
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          OBSERVER_ROLE: ${{ vars.AWS_READ_ROLE_ARN }}
          APPLICATION_URL: ${{ vars.ARCHON_APPLICATION_URL }}
        run: |
          set -euo pipefail
          [[ "${ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          test "${OBSERVER_ROLE}" = \
            "arn:aws:iam::${ACCOUNT_ID}:role/archon-production-observer"
          [[ "${APPLICATION_URL}" =~ ^https://[A-Za-z0-9.-]+$ ]]
          [[ "${APPLICATION_URL}" != *..* ]]

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_READ_ROLE_ARN }}
          role-session-name: archon-availability-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Observe deployed controls and public read path
        id: probe
        env:
          APPLICATION_URL: ${{ vars.ARCHON_APPLICATION_URL }}
          ARCHON_STAGE: production
          ARCHON_OBSERVATION_OUTPUT: ${{ runner.temp }}/availability/observation.json
          EXPECT_CORE_IDLE: "true"
        run: |
          set -euo pipefail
          bash scripts/observe-aws-live-runtime.sh
          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --max-time 30 --dump-header "${RUNNER_TEMP}/availability/index.headers" \
            --output "${RUNNER_TEMP}/availability/index.html" \
            "${APPLICATION_URL}/"
          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --max-time 30 --dump-header "${RUNNER_TEMP}/availability/profiles.headers" \
            --output "${RUNNER_TEMP}/availability/profiles.json" \
            "${APPLICATION_URL}/api/runtime-profiles"
          grep -Eiq '^strict-transport-security: .*max-age=' \
            "${RUNNER_TEMP}/availability/index.headers"
          grep -Eiq '^content-security-policy:' \
            "${RUNNER_TEMP}/availability/index.headers"
          grep -Eiq '^x-content-type-options: nosniff' \
            "${RUNNER_TEMP}/availability/index.headers"
          jq -e '
            (keys | sort) == [
              "autoSelection","profiles","schemaVersion","serverTime"
            ] and
            .schemaVersion == "archon.runtime-profiles/v1" and
            (.serverTime | fromdateiso8601) and
            .autoSelection == "cloud" and
            (.profiles | length) == 2 and
            ([.profiles[].profileId] | sort) == ["cloud","core"] and
            all(.profiles[];
              (keys | sort) == [
                "availability","capabilities","capabilityDigest","checkedAt",
                "generation","profileId"
              ] and
              (.generation | type) == "string" and
              (.generation | length) >= 1 and
              (.checkedAt | fromdateiso8601) and
              (.capabilityDigest | test("^sha256:[0-9a-f]{64}$")) and
              (.capabilities | keys) == [
                "agentContextKit","analyticsAgent","dataHubSkills",
                "mcpGovernedWrite","mcpRead"
              ] and
              all(.capabilities[]; . == true)
            ) and
            ([.profiles[] | select(.profileId == "cloud") | .availability])
              == ["READY"] and
            ([.profiles[] | select(.profileId == "core") | .availability])
              == ["LAUNCHABLE"]
          ' "${RUNNER_TEMP}/availability/profiles.json" >/dev/null
          observed_release="$(
            jq -er '.releaseSha' "${RUNNER_TEMP}/availability/observation.json"
          )"
          test "${observed_release}" = "${GITHUB_SHA}"
          jq -cnS \
            --arg releaseSha "${observed_release}" \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg profileDigest "sha256:$(sha256sum "${RUNNER_TEMP}/availability/profiles.json" | awk '{print $1}')" '
              {
                schemaVersion:"archon.production-availability/v2",
                releaseSha:$releaseSha,
                observedAt:$observedAt,
                checks:{
                  publicSpa:true,
                  runtimeProfiles:true,
                  securityHeaders:true,
                  leanAwsControls:true,
                  coreIdle:true
                },
                profileResponseDigest:$profileDigest,
                rawIdentifiersRetained:false,
                result:"passed"
              }
            ' >"${RUNNER_TEMP}/availability/evidence.json"
          echo "evidence=${RUNNER_TEMP}/availability/evidence.json" >>"${GITHUB_OUTPUT}"

      - name: Attest sanitized availability evidence
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.probe.outputs.evidence }}
          predicate-type: https://github.com/upgradedev/archon-datahub/attestations/production-availability/v2
          predicate-path: ${{ steps.probe.outputs.evidence }}

      - name: Retain availability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-availability-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/availability/evidence.json
            ${{ runner.temp }}/availability/observation.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Remove runner-only evidence
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/availability"
