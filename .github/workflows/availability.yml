name: Production availability

run-name: Observe the public production read path

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      application_url:
        description: Optional exact HTTPS application origin (overrides the protected environment variable)
        required: false
        type: string
      query:
        description: Optional narrow demo-dataset query (overrides the protected environment variable)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-availability
  cancel-in-progress: false

jobs:
  probe:
    name: Verify the public production read path
    if: github.repository == 'upgradedev/archon-datahub'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-observer
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      APPLICATION_URL: ${{ inputs.application_url || vars.ARCHON_APPLICATION_URL }}
      AUDIT_QUERY: ${{ inputs.query || vars.DATAHUB_DEMO_QUERY }}
    steps:
      - name: Probe and seal public availability evidence
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          : "${APPLICATION_URL:?production-observer ARCHON_APPLICATION_URL or application_url is required}"
          : "${AUDIT_QUERY:?production-observer DATAHUB_DEMO_QUERY or query is required}"
          test "${#APPLICATION_URL}" -le 2048
          [[ "${APPLICATION_URL}" =~ ^https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:443)?$ ]] || {
            echo "::error::application URL must be an exact HTTPS DNS origin without a path, query, fragment, or credentials"
            exit 1
          }
          [[ "${APPLICATION_URL}" != *..* ]]
          application_host="${APPLICATION_URL#https://}"
          application_host="${application_host%:443}"
          test "${#application_host}" -le 253
          [[ "${application_host}" == *.* ]]
          [[ "${application_host}" =~ [A-Za-z] ]]
          IFS='.' read -r -a application_labels <<<"${application_host}"
          test "${#application_labels[@]}" -ge 2
          for application_label in "${application_labels[@]}"; do
            [[ "${application_label}" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$ ]] || {
              echo "::error::application URL contains an invalid DNS label"
              exit 1
            }
          done
          jq -en --arg query "${AUDIT_QUERY}" '
            ($query | length) >= 1 and
            ($query | length) <= 256 and
            ($query | test("[\\u0000-\\u001f\\u007f]") | not) and
            ($query | test("[*?]") | not) and
            $query != "{}" and
            $query == ($query | gsub("^\\s+|\\s+$"; ""))
          ' >/dev/null || {
            echo "::error::availability query must be trimmed, 1-256 characters, and non-wildcard"
            exit 1
          }

          repository_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}"
          )"
          default_branch="$(jq -er '.default_branch' <<<"${repository_json}")"
          test "${default_branch}" = "master"
          test "${GITHUB_REF}" = "refs/heads/${default_branch}" || {
            echo "::error::availability must run from the current default branch"
            exit 1
          }
          default_ref="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${default_branch}"
          )"
          default_sha="$(
            jq -er \
              --arg ref "refs/heads/${default_branch}" '
                select(
                  .ref == $ref and
                  .object.type == "commit" and
                  (.object.sha | test("^[0-9a-f]{40}$"))
                ) |
                .object.sha
              ' <<<"${default_ref}"
          )"
          test "${default_sha}" = "${GITHUB_SHA}" || {
            echo "::error::availability control plane is no longer the default-branch head"
            exit 1
          }

          work_dir="${RUNNER_TEMP}/availability-work"
          evidence_dir="${RUNNER_TEMP}/availability-evidence"
          mkdir -p "${work_dir}" "${evidence_dir}"
          payload="${work_dir}/audit-request.json"
          jq -cnS --arg query "${AUDIT_QUERY}" '{query: $query}' >"${payload}"
          test "$(stat -c '%s' "${payload}")" -le 1024
          query_sha256="$(sha256sum "${payload}" | awk '{print $1}')"

          index_headers="${work_dir}/index.headers"
          index_body="${work_dir}/index.html"
          index_meta="${work_dir}/index.meta"
          curl --fail-with-body --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.3 \
            --location --max-redirs 0 \
            --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            --header 'Accept: text/html' \
            --dump-header "${index_headers}" \
            --output "${index_body}" \
            --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}\t%{size_download}\t%{ssl_verify_result}\t%{content_type}\n' \
            "${APPLICATION_URL}/" >"${index_meta}"
          IFS=$'\t' read -r \
            index_status index_url index_redirects index_size index_tls index_type \
            <"${index_meta}"
          test "${index_status}" = "200"
          test "${index_url}" = "${APPLICATION_URL}/"
          test "${index_redirects}" = "0"
          test "${index_tls}" = "0"
          [[ "${index_size}" =~ ^[0-9]+$ ]]
          test "${index_size}" -ge 1
          test "${index_size}" -le 1048576
          test "$(stat -c '%s' "${index_body}")" = "${index_size}"
          [[ "${index_type,,}" == text/html* ]]
          grep -qi '^content-type:[[:space:]]*text/html' "${index_headers}"
          grep -qi '^cache-control:.*no-cache' "${index_headers}"
          ! grep -qi '^set-cookie:' "${index_headers}"
          ! grep -qi '^location:' "${index_headers}"
          grep -qi '<!doctype html>' "${index_body}"
          grep -Fq '<div id="root"></div>' "${index_body}"
          grep -Fq '<title>Archon ' "${index_body}"
          index_sha256="$(sha256sum "${index_body}" | awk '{print $1}')"

          runtime_headers="${work_dir}/runtime-config.headers"
          runtime_body="${work_dir}/runtime-config.json"
          runtime_meta="${work_dir}/runtime-config.meta"
          curl --fail-with-body --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.3 \
            --location --max-redirs 0 \
            --connect-timeout 10 --max-time 30 --max-filesize 65536 \
            --header 'Accept: application/json' \
            --dump-header "${runtime_headers}" \
            --output "${runtime_body}" \
            --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}\t%{size_download}\t%{ssl_verify_result}\t%{content_type}\n' \
            "${APPLICATION_URL}/runtime-config.json" >"${runtime_meta}"
          IFS=$'\t' read -r \
            runtime_status runtime_url runtime_redirects runtime_size runtime_tls runtime_type \
            <"${runtime_meta}"
          test "${runtime_status}" = "200"
          test "${runtime_url}" = "${APPLICATION_URL}/runtime-config.json"
          test "${runtime_redirects}" = "0"
          test "${runtime_tls}" = "0"
          [[ "${runtime_size}" =~ ^[0-9]+$ ]]
          test "${runtime_size}" -ge 2
          test "${runtime_size}" -le 65536
          test "$(stat -c '%s' "${runtime_body}")" = "${runtime_size}"
          [[ "${runtime_type,,}" == application/json* ]]
          grep -qi '^content-type:[[:space:]]*application/json' "${runtime_headers}"
          grep -qi '^cache-control:.*no-store' "${runtime_headers}"
          ! grep -qi '^set-cookie:' "${runtime_headers}"
          ! grep -qi '^location:' "${runtime_headers}"
          jq -e --arg root "${APPLICATION_URL}/" '
            def exact_keys($value; $wanted):
              ($value | type) == "object" and
              (($value | keys | sort) == ($wanted | sort));
            exact_keys(.; ["schemaVersion", "auth"]) and
            .schemaVersion == 1 and
            exact_keys(
              .auth;
              [
                "clientId",
                "authorizationEndpoint",
                "tokenEndpoint",
                "logoutEndpoint",
                "redirectUri",
                "logoutUri",
                "scopes"
              ]
            ) and
            (.auth.clientId | test("^[A-Za-z0-9]{8,128}$")) and
            (
              .auth.authorizationEndpoint |
              capture("^(?<origin>https://[^/?#@]+)/oauth2/authorize$").origin
            ) as $authOrigin and
            .auth.tokenEndpoint == ($authOrigin + "/oauth2/token") and
            .auth.logoutEndpoint == ($authOrigin + "/logout") and
            .auth.redirectUri == $root and
            .auth.logoutUri == $root and
            .auth.scopes == ["openid", "email", "archon/approve"]
          ' "${runtime_body}" >/dev/null
          runtime_sha256="$(sha256sum "${runtime_body}" | awk '{print $1}')"
          client_id_sha256="$(
            jq -er '.auth.clientId' "${runtime_body}" |
              sha256sum |
              awk '{print $1}'
          )"
          auth_origin="$(
            jq -er '
              .auth.authorizationEndpoint |
              sub("/oauth2/authorize$"; "")
            ' "${runtime_body}"
          )"
          auth_origin_sha256="$(
            printf '%s' "${auth_origin}" | sha256sum | awk '{print $1}'
          )"
          expected_csp="default-src 'self'; base-uri 'self'; connect-src 'self' ${auth_origin}; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'"
          assert_exact_security_headers() {
            local headers_path="$1"
            local expected_request_id="${2:-}"
            python3 - \
              "${headers_path}" \
              "${expected_csp}" \
              "${expected_request_id}" <<'PY'
          from pathlib import Path
          import re
          import sys

          headers_path, expected_csp, expected_request_id = sys.argv[1:]
          raw = Path(headers_path).read_bytes()
          if not raw or len(raw) > 131072:
              raise SystemExit("response header block is empty or oversized")
          text = raw.decode("iso-8859-1")
          if len(re.findall(r"(?im)^HTTP/\S+\s+\d{3}(?:\s|$)", text)) != 1:
              raise SystemExit("response must contain exactly one HTTP status block")

          headers: dict[str, list[str]] = {}
          for line in text.splitlines():
              if not line or line.upper().startswith("HTTP/"):
                  continue
              if line[:1].isspace() or ":" not in line:
                  raise SystemExit("malformed or folded response header")
              name, value = line.split(":", 1)
              normalized_name = name.strip().lower()
              if not re.fullmatch(r"[a-z0-9!#$%&'*+.^_`|~-]+", normalized_name):
                  raise SystemExit("invalid response header name")
              headers.setdefault(normalized_name, []).append(value.strip())

          def exactly_one(name: str) -> str:
              values = headers.get(name, [])
              if len(values) != 1:
                  raise SystemExit(f"{name} must occur exactly once")
              return values[0]

          def normalize_directives(value: str) -> str:
              return "; ".join(part.strip().lower() for part in value.split(";"))

          exact_values = {
              "content-security-policy": expected_csp,
              "strict-transport-security":
                  "max-age=63072000; includeSubDomains; preload",
              "x-content-type-options": "nosniff",
              "x-frame-options": "DENY",
              "referrer-policy": "no-referrer",
              "x-xss-protection": "1; mode=block",
          }
          for name, expected in exact_values.items():
              actual = exactly_one(name)
              if normalize_directives(actual) != normalize_directives(expected):
                  raise SystemExit(f"{name} does not match the production contract")

          if expected_request_id:
              if exactly_one("x-request-id") != expected_request_id:
                  raise SystemExit(
                      "x-request-id does not match the response body requestId"
                  )
          PY
          }
          assert_exact_security_headers "${index_headers}"
          assert_exact_security_headers "${runtime_headers}"

          audit_headers="${work_dir}/audit.headers"
          audit_body="${work_dir}/audit-response.json"
          audit_meta="${work_dir}/audit.meta"
          curl --fail-with-body --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.3 \
            --location --max-redirs 0 \
            --connect-timeout 10 --max-time 50 --max-filesize 4194304 \
            --request POST \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data-binary "@${payload}" \
            --dump-header "${audit_headers}" \
            --output "${audit_body}" \
            --write-out '%{http_code}\t%{url_effective}\t%{num_redirects}\t%{size_download}\t%{ssl_verify_result}\t%{content_type}\n' \
            "${APPLICATION_URL}/api/audits" >"${audit_meta}"
          IFS=$'\t' read -r \
            audit_status audit_url audit_redirects audit_size audit_tls audit_type \
            <"${audit_meta}"
          test "${audit_status}" = "200"
          test "${audit_url}" = "${APPLICATION_URL}/api/audits"
          test "${audit_redirects}" = "0"
          test "${audit_tls}" = "0"
          [[ "${audit_size}" =~ ^[0-9]+$ ]]
          test "${audit_size}" -ge 2
          test "${audit_size}" -le 4194304
          test "$(stat -c '%s' "${audit_body}")" = "${audit_size}"
          [[ "${audit_type,,}" == application/json* ]]
          grep -qi '^content-type:[[:space:]]*application/json' "${audit_headers}"
          grep -qi '^cache-control:.*no-store' "${audit_headers}"
          ! grep -qi '^set-cookie:' "${audit_headers}"
          ! grep -qi '^location:' "${audit_headers}"
          jq -e '
            def exact_keys($value; $wanted):
              ($value | type) == "object" and
              (($value | keys | sort) == ($wanted | sort));
            def natural:
              type == "number" and
              floor == . and
              . >= 0;
            exact_keys(.; ["requestId", "releaseSha", "report"]) and
            (.requestId | type == "string" and test("^[A-Za-z0-9._-]{1,128}$")) and
            (.releaseSha | type == "string" and test("^[0-9a-f]{40}$")) and
            exact_keys(
              .report;
              ["scanId", "classification", "findings", "narrative", "trace"]
            ) and
            (
              .report.scanId |
              type == "string" and
              length >= 1 and
              length <= 256 and
              (test("[\\u0000-\\u001f\\u007f]") | not)
            ) and
            exact_keys(
              .report.classification;
              [
                "totalEntities",
                "withLineage",
                "sensitiveEntities",
                "domains",
                "platforms"
              ]
            ) and
            (.report.classification.totalEntities | natural and . == 1) and
            (.report.classification.withLineage | natural) and
            (.report.classification.sensitiveEntities | natural) and
            .report.classification.withLineage <=
              .report.classification.totalEntities and
            .report.classification.sensitiveEntities <=
              .report.classification.totalEntities and
            (
              [.report.classification.domains[], .report.classification.platforms[]] |
              all(natural)
            ) and
            (.report.findings | type == "array" and length <= 100) and
            all(
              .report.findings[];
              type == "object" and
              has("type") and
              has("severity") and
              has("subject") and
              has("summary") and
              has("detail") and
              (
                keys -
                ["type", "severity", "subject", "summary", "detail", "recommendation"] |
                length == 0
              ) and
              (.type | IN("contradiction", "lineage_gap", "governance_violation")) and
              (.severity | IN("high", "medium", "low")) and
              (.subject | type == "string" and length >= 1 and length <= 2048) and
              (.summary | type == "string" and length >= 1 and length <= 4096) and
              (.detail | type == "object") and
              (
                .recommendation == null or
                (.recommendation | type == "string" and length <= 4096)
              )
            ) and
            (.report.narrative | type == "string" and length <= 16384) and
            (
              .report.trace |
              type == "array" and
              length == 4 and
              map(.agent) == [
                "classifier",
                "lineage-analyzer",
                "governance-auditor",
                "narrator"
              ] and
              all(
                .[];
                exact_keys(.; ["agent", "produced"]) and
                (.produced | type == "string" and length >= 1 and length <= 1024)
              )
            ) and
            (
              [.. | objects | keys[]] |
              all(
                test(
                  "(?i)(secret|password|credential|authorization|cookie|api[_-]?key|access[_-]?token|refresh[_-]?token)"
                ) |
                not
              )
            ) and
            (
              [.. | strings] |
              all(
                test(
                  "(?i)(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|Bearer[[:space:]]+[A-Za-z0-9._~+/=-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-)"
                ) |
                not
              )
            )
          ' "${audit_body}" >/dev/null

          request_id="$(jq -er '.requestId' "${audit_body}")"
          assert_exact_security_headers "${audit_headers}" "${request_id}"
          release_sha="$(jq -er '.releaseSha' "${audit_body}")"
          compare_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/compare/${release_sha}...${default_sha}"
          )"
          jq -e \
            --arg release "${release_sha}" \
            --arg current "${default_sha}" '
              .base_commit.sha == $release and
              .merge_base_commit.sha == $release and
              (.status == "ahead" or .status == "identical") and
              (
                (.status == "identical" and .ahead_by == 0) or
                (.status == "ahead" and .ahead_by >= 1)
              ) and
              (
                .commits[-1].sha == $current or
                ($release == $current and (.commits | length) == 0)
              )
            ' <<<"${compare_json}" >/dev/null || {
              echo "::error::reported release is not the current master release or one of its rollback ancestors"
              exit 1
            }

          deployment_runs="$(
            gh api \
              --method GET \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs" \
              -f "branch=${default_branch}" \
              -f event=workflow_dispatch \
              -f status=success \
              -f per_page=100
          )"
          deployment_run="$(
            jq -ce \
              --arg branch "${default_branch}" \
              --arg repository "${GITHUB_REPOSITORY}" '
                [
                  .[]?.workflow_runs[]? |
                  select(
                    (
                      .path == ".github/workflows/deploy.yml" or
                      .path ==
                        (".github/workflows/deploy.yml@" + $branch)
                    ) and
                    .head_branch == $branch and
                    .head_repository.full_name == $repository and
                    .event == "workflow_dispatch" and
                    .status == "completed" and
                    .conclusion == "success"
                  )
                ] |
                sort_by(.id, .run_attempt) |
                last |
                select(
                  . != null and
                  (.id | type) == "number" and
                  .id > 0 and
                  .id == (.id | floor) and
                  (.run_attempt | type) == "number" and
                  .run_attempt >= 1 and
                  .run_attempt == (.run_attempt | floor) and
                  (.head_sha | test("^[0-9a-f]{40}$"))
                )
              ' <<<"${deployment_runs}"
          )" || {
            echo "::error::no successful default-branch deployment run is available"
            exit 1
          }
          deployment_run_id="$(jq -er '.id' <<<"${deployment_run}")"
          deployment_attempt="$(jq -er '.run_attempt' <<<"${deployment_run}")"
          deployment_control_sha="$(jq -er '.head_sha' <<<"${deployment_run}")"
          deployment_artifact_name="deployment-evidence-${release_sha}-${deployment_attempt}"
          deployment_artifacts="$(
            gh api \
              --method GET \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${deployment_run_id}/artifacts" \
              -f per_page=100
          )"
          deployment_artifact="$(
            jq -ce \
              --arg name "${deployment_artifact_name}" \
              --argjson runId "${deployment_run_id}" '
                [
                  .[]?.artifacts[]? |
                  select(
                    .name == $name and
                    .expired == false and
                    .workflow_run.id == $runId and
                    (.digest | test("^sha256:[0-9a-f]{64}$")) and
                    (.size_in_bytes | type) == "number" and
                    .size_in_bytes >= 1 and
                    .size_in_bytes <= 67108864 and
                    .size_in_bytes ==
                      (.size_in_bytes | floor)
                  )
                ] |
                if length == 1 then .[0] else empty end
              ' <<<"${deployment_artifacts}"
          )" || {
            echo "::error::the newest successful deployment lacks one exact, bounded, unexpired release-evidence artifact"
            exit 1
          }
          deployment_artifact_id="$(jq -er '.id' <<<"${deployment_artifact}")"
          deployment_artifact_digest="$(jq -er '.digest' <<<"${deployment_artifact}")"
          deployment_artifact_size="$(
            jq -er '.size_in_bytes' <<<"${deployment_artifact}"
          )"
          deployment_archive="${work_dir}/deployment-evidence.zip"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${deployment_artifact_id}/zip" \
            >"${deployment_archive}"
          test "$(sha256sum "${deployment_archive}" | awk '{print $1}')" = \
              "${deployment_artifact_digest#sha256:}" || {
              echo "::error::GitHub deployment-evidence artifact digest verification failed"
              exit 1
            }
          test "$(stat -c '%s' "${deployment_archive}")" = \
            "${deployment_artifact_size}"

          extracted_dir="${work_dir}/deployment-evidence-extracted"
          mkdir -p "${extracted_dir}"
          python3 - "${deployment_archive}" "${extracted_dir}" <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import stat
          import sys
          import zipfile

          archive_path = Path(sys.argv[1])
          output_dir = Path(sys.argv[2])
          required_limits = {
              "deployment-evidence.json": 1_048_576,
              "production-runtime-config.json": 65_536,
              "live-runtime-manifest.json": 8_388_608,
          }
          max_entries = 256
          max_entry_size = 16_777_216
          max_total_size = 67_108_864
          max_compression_ratio = 200

          with zipfile.ZipFile(archive_path, "r") as archive:
              entries = archive.infolist()
              if not 1 <= len(entries) <= max_entries:
                  raise SystemExit("deployment archive entry count is out of bounds")

              canonical_names: set[str] = set()
              required_entries: dict[str, zipfile.ZipInfo] = {}
              total_size = 0
              for entry in entries:
                  name = entry.filename
                  if (
                      not name
                      or len(name) > 512
                      or name.startswith("/")
                      or "\\" in name
                      or ":" in name
                      or any(ord(character) < 32 or ord(character) > 126 for character in name)
                  ):
                      raise SystemExit("deployment archive contains an unsafe path")
                  path = PurePosixPath(name)
                  if any(part in ("", ".", "..") for part in path.parts):
                      raise SystemExit("deployment archive path is not canonical")
                  canonical_name = "/".join(path.parts)
                  if name.rstrip("/") != canonical_name:
                      raise SystemExit("deployment archive path is not canonical")
                  if canonical_name in canonical_names:
                      raise SystemExit("deployment archive contains a duplicate path")
                  canonical_names.add(canonical_name)

                  unix_mode = entry.external_attr >> 16
                  file_type = stat.S_IFMT(unix_mode)
                  allowed_type = (
                      file_type in (0, stat.S_IFREG, stat.S_IFDIR)
                      and (
                          (entry.is_dir() and file_type in (0, stat.S_IFDIR))
                          or (
                              not entry.is_dir()
                              and file_type in (0, stat.S_IFREG)
                          )
                      )
                  )
                  if not allowed_type:
                      raise SystemExit(
                          "deployment archive contains a non-regular entry"
                      )
                  if entry.flag_bits & 0x1:
                      raise SystemExit("deployment archive contains encrypted content")
                  if entry.compress_type not in (
                      zipfile.ZIP_STORED,
                      zipfile.ZIP_DEFLATED,
                  ):
                      raise SystemExit(
                          "deployment archive uses an unsupported compression method"
                      )
                  if entry.file_size < 0 or entry.file_size > max_entry_size:
                      raise SystemExit("deployment archive entry size is out of bounds")
                  if entry.compress_size < 0:
                      raise SystemExit("deployment archive compressed size is invalid")
                  if (
                      entry.file_size > 0
                      and (
                          entry.compress_size == 0
                          or entry.file_size >
                              entry.compress_size * max_compression_ratio
                      )
                  ):
                      raise SystemExit(
                          "deployment archive compression ratio is out of bounds"
                      )
                  if not entry.is_dir():
                      total_size += entry.file_size
                      if total_size > max_total_size:
                          raise SystemExit(
                              "deployment archive total size is out of bounds"
                          )
                      basename = path.name
                      if basename in required_limits:
                          if basename in required_entries:
                              raise SystemExit(
                                  "deployment archive duplicates a required file"
                              )
                          if not 1 <= entry.file_size <= required_limits[basename]:
                              raise SystemExit(
                                  f"{basename} size is out of bounds"
                              )
                          required_entries[basename] = entry

              if set(required_entries) != set(required_limits):
                  raise SystemExit(
                      "deployment archive is missing a required evidence file"
                  )

              for basename, entry in required_entries.items():
                  destination = output_dir / basename
                  if destination.exists() or destination.is_symlink():
                      raise SystemExit("evidence extraction target already exists")
                  written = 0
                  with archive.open(entry, "r") as source:
                      with destination.open("xb") as target:
                          while True:
                              chunk = source.read(65_536)
                              if not chunk:
                                  break
                              written += len(chunk)
                              if written > required_limits[basename]:
                                  raise SystemExit(
                                      f"{basename} exceeded its extraction bound"
                                  )
                              target.write(chunk)
                  if written != entry.file_size:
                      raise SystemExit(
                          f"{basename} extracted byte count does not match metadata"
                      )
                  os.chmod(destination, 0o600)
          PY
          deployment_evidence="${extracted_dir}/deployment-evidence.json"
          production_runtime_config="$(
            printf '%s/%s' \
              "${extracted_dir}" \
              production-runtime-config.json
          )"
          live_runtime_manifest="${extracted_dir}/live-runtime-manifest.json"
          for extracted_evidence in \
            "${deployment_evidence}" \
            "${production_runtime_config}" \
            "${live_runtime_manifest}"; do
            test -f "${extracted_evidence}"
            test ! -L "${extracted_evidence}"
          done

          ci_run_id="$(
            jq -er '
              .rollbackSelector.ciRunId |
              select(
                type == "string" and
                test("^[1-9][0-9]{0,19}$")
              )
            ' "${deployment_evidence}"
          )"
          expected_deployment_url="$(
            printf '%s/%s/actions/runs/%s' \
              "${GITHUB_SERVER_URL}" \
              "${GITHUB_REPOSITORY}" \
              "${deployment_run_id}"
          )"
          expected_ci_url="$(
            printf '%s/%s/actions/runs/%s' \
              "${GITHUB_SERVER_URL}" \
              "${GITHUB_REPOSITORY}" \
              "${ci_run_id}"
          )"
          jq -e \
            --arg release "${release_sha}" \
            --arg ciRunId "${ci_run_id}" \
            --arg ciRunUrl "${expected_ci_url}" \
            --arg deploymentUrl "${expected_deployment_url}" \
            --arg deploymentControlSha "${deployment_control_sha}" \
            --arg applicationUrl "${APPLICATION_URL}" \
            --arg runtimeConfigSha256 "${runtime_sha256}" '
              .schemaVersion == 1 and
              .promotionPolicy == "build-once-promote-same-artifacts" and
              .rollbackSelector.ciRunId == $ciRunId and
              .rollbackSelector.releaseSha == $release and
              .source.sourceRunUrl == $ciRunUrl and
              .source.deploymentRunUrl == $deploymentUrl and
              .source.deploymentControlPlaneSha ==
                $deploymentControlSha and
              .immutableArtifacts.identicalImageDigest == true and
              (.immutableArtifacts.productionEcrImageDigest |
                test("^sha256:[0-9a-f]{64}$")) and
              .staging.result == "passed" and
              .production.applicationUrl == $applicationUrl and
              .production.runtimeConfigSha256 ==
                $runtimeConfigSha256 and
              (.production.liveRuntimeManifestSha256 |
                test("^[0-9a-f]{64}$")) and
              .production.result == "passed"
            ' "${deployment_evidence}" >/dev/null || {
              echo "::error::deployment evidence is not an exact successful production promotion of the reported release"
              exit 1
            }

          cmp --silent "${production_runtime_config}" "${runtime_body}" || {
            echo "::error::public runtime-config bytes differ from sealed production deployment evidence"
            exit 1
          }
          production_runtime_config_sha256="$(
            sha256sum "${production_runtime_config}" | awk '{print $1}'
          )"
          test "${production_runtime_config_sha256}" = "${runtime_sha256}"
          live_runtime_manifest_sha256="$(
            sha256sum "${live_runtime_manifest}" | awk '{print $1}'
          )"
          test "${live_runtime_manifest_sha256}" = "$(
            jq -er '.production.liveRuntimeManifestSha256' \
              "${deployment_evidence}"
          )"
          production_image_digest="$(
            jq -er '.immutableArtifacts.productionEcrImageDigest' \
              "${deployment_evidence}"
          )"
          jq -e \
            --arg release "${release_sha}" \
            --arg imageDigest "${production_image_digest}" \
            --arg indexSha256 "${index_sha256}" \
            --argjson indexSize "${index_size}" \
            --arg runtimeConfigSha256 "${runtime_sha256}" \
            --argjson runtimeConfigSize "${runtime_size}" '
              .schemaVersion == "archon.live-runtime-manifest/v1" and
              .releaseBinding.releaseSha == $release and
              .releaseBinding.containerImageDigest == $imageDigest and
              .verification.result == "passed" and
              (.spa.objects | type == "array") and
              (
                [
                  .spa.objects[] |
                  select(.key == "index.html")
                ] as $indexObjects |
                [
                  .spa.objects[] |
                  select(.key == "runtime-config.json")
                ] as $runtimeObjects |
                ($indexObjects | length) == 1 and
                all(
                  $indexObjects[];
                  .sha256 == $indexSha256 and
                  .size == $indexSize
                ) and
                ($runtimeObjects | length) == 1 and
                all(
                  $runtimeObjects[];
                  .sha256 == $runtimeConfigSha256 and
                  .size == $runtimeConfigSize
                )
              )
            ' "${live_runtime_manifest}" >/dev/null || {
              echo "::error::public index/runtime bytes do not match the sealed live-runtime manifest"
              exit 1
            }

          ci_run="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}"
          )"
          jq -e \
            --arg ciRunId "${ci_run_id}" \
            --arg release "${release_sha}" \
            --arg branch "${default_branch}" \
            --arg repository "${GITHUB_REPOSITORY}" '
              (.id | tostring) == $ciRunId and
              (
                .path == ".github/workflows/ci.yml" or
                .path == (".github/workflows/ci.yml@" + $branch)
              ) and
              .head_sha == $release and
              .head_branch == $branch and
              .head_repository.full_name == $repository and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            ' <<<"${ci_run}" >/dev/null || {
              echo "::error::rollbackSelector.ciRunId is not the exact successful release CI run"
              exit 1
            }

          audit_sha256="$(sha256sum "${audit_body}" | awk '{print $1}')"
          deployment_evidence_sha256="$(
            sha256sum "${deployment_evidence}" | awk '{print $1}'
          )"
          request_id_sha256="$(
            printf '%s' "${request_id}" | sha256sum | awk '{print $1}'
          )"
          scan_id_sha256="$(
            jq -er '.report.scanId' "${audit_body}" |
              sha256sum |
              awk '{print $1}'
          )"

          final_repository_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}"
          )"
          test "$(jq -er '.default_branch' <<<"${final_repository_json}")" = \
            "${default_branch}"
          final_default_ref="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${default_branch}"
          )"
          final_default_sha="$(
            jq -er \
              --arg ref "refs/heads/${default_branch}" '
                select(
                  .ref == $ref and
                  .object.type == "commit" and
                  (.object.sha | test("^[0-9a-f]{40}$"))
                ) |
                .object.sha
              ' <<<"${final_default_ref}"
          )"
          test "${final_default_sha}" = "${default_sha}"
          test "${final_default_sha}" = "${GITHUB_SHA}" || {
            echo "::error::default-branch control plane changed during observation"
            exit 1
          }

          final_deployment_runs="$(
            gh api \
              --method GET \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs" \
              -f "branch=${default_branch}" \
              -f event=workflow_dispatch \
              -f status=success \
              -f per_page=100
          )"
          final_newest_deployment_run="$(
            jq -ce \
              --arg branch "${default_branch}" \
              --arg repository "${GITHUB_REPOSITORY}" '
                [
                  .[]?.workflow_runs[]? |
                  select(
                    (
                      .path == ".github/workflows/deploy.yml" or
                      .path ==
                        (".github/workflows/deploy.yml@" + $branch)
                    ) and
                    .head_branch == $branch and
                    .head_repository.full_name == $repository and
                    .event == "workflow_dispatch" and
                    .status == "completed" and
                    .conclusion == "success"
                  )
                ] |
                sort_by(.id, .run_attempt) |
                last |
                select(. != null)
              ' <<<"${final_deployment_runs}"
          )"
          jq -e \
            --argjson runId "${deployment_run_id}" \
            --argjson runAttempt "${deployment_attempt}" \
            --arg deploymentControlSha "${deployment_control_sha}" '
              .id == $runId and
              .run_attempt == $runAttempt and
              .head_sha == $deploymentControlSha
            ' <<<"${final_newest_deployment_run}" >/dev/null || {
              echo "::error::a newer successful deployment completed during observation"
              exit 1
            }

          final_deployment_run="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${deployment_run_id}/attempts/${deployment_attempt}"
          )"
          jq -e \
            --argjson runId "${deployment_run_id}" \
            --argjson runAttempt "${deployment_attempt}" \
            --arg branch "${default_branch}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg deploymentControlSha "${deployment_control_sha}" '
              .id == $runId and
              .run_attempt == $runAttempt and
              (
                .path == ".github/workflows/deploy.yml" or
                .path == (".github/workflows/deploy.yml@" + $branch)
              ) and
              .head_sha == $deploymentControlSha and
              .head_branch == $branch and
              .head_repository.full_name == $repository and
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "success"
            ' <<<"${final_deployment_run}" >/dev/null || {
              echo "::error::selected deployment attempt changed during observation"
              exit 1
            }

          final_ci_run="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}"
          )"
          jq -e \
            --arg ciRunId "${ci_run_id}" \
            --arg release "${release_sha}" \
            --arg branch "${default_branch}" \
            --arg repository "${GITHUB_REPOSITORY}" '
              (.id | tostring) == $ciRunId and
              (
                .path == ".github/workflows/ci.yml" or
                .path == (".github/workflows/ci.yml@" + $branch)
              ) and
              .head_sha == $release and
              .head_branch == $branch and
              .head_repository.full_name == $repository and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            ' <<<"${final_ci_run}" >/dev/null || {
              echo "::error::selected release CI run changed during observation"
              exit 1
            }

          final_deployment_artifact="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${deployment_artifact_id}"
          )"
          jq -e \
            --argjson artifactId "${deployment_artifact_id}" \
            --arg artifactName "${deployment_artifact_name}" \
            --arg artifactDigest "${deployment_artifact_digest}" \
            --argjson artifactSize "${deployment_artifact_size}" \
            --argjson runId "${deployment_run_id}" '
              .id == $artifactId and
              .name == $artifactName and
              .digest == $artifactDigest and
              .size_in_bytes == $artifactSize and
              .expired == false and
              .workflow_run.id == $runId
            ' <<<"${final_deployment_artifact}" >/dev/null || {
              echo "::error::selected deployment artifact changed during observation"
              exit 1
            }

          observed_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          availability="${evidence_dir}/availability.json"
          jq -cnS \
            --arg observedAt "${observed_at}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${default_branch}" \
            --arg controlPlaneSha "${default_sha}" \
            --argjson workflowRunId "${GITHUB_RUN_ID}" \
            --argjson workflowRunAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg applicationOriginSha256 "$(
              printf '%s' "${APPLICATION_URL}" | sha256sum | awk '{print $1}'
            )" \
            --arg indexSha256 "${index_sha256}" \
            --arg runtimeConfigSha256 "${runtime_sha256}" \
            --arg clientIdSha256 "${client_id_sha256}" \
            --arg authOriginSha256 "${auth_origin_sha256}" \
            --arg liveRuntimeManifestSha256 \
              "${live_runtime_manifest_sha256}" \
            --arg querySha256 "${query_sha256}" \
            --arg responseSha256 "${audit_sha256}" \
            --arg releaseSha "${release_sha}" \
            --arg requestIdSha256 "${request_id_sha256}" \
            --arg scanIdSha256 "${scan_id_sha256}" \
            --argjson classification "$(
              jq -c '
                .report.classification |
                {
                  totalEntities,
                  withLineage,
                  sensitiveEntities,
                  domainBucketCount: (.domains | keys | length),
                  platformBucketCount: (.platforms | keys | length)
                }
              ' "${audit_body}"
            )" \
            --argjson findingCount "$(
              jq -er '.report.findings | length' "${audit_body}"
            )" \
            --argjson traceAgents "$(
              jq -c '.report.trace | map(.agent)' "${audit_body}"
            )" \
            --arg ciRunId "${ci_run_id}" \
            --argjson deploymentRunId "${deployment_run_id}" \
            --argjson deploymentRunAttempt "${deployment_attempt}" \
            --arg deploymentControlPlaneSha \
              "${deployment_control_sha}" \
            --argjson deploymentArtifactId "${deployment_artifact_id}" \
            --arg deploymentArtifactDigest "${deployment_artifact_digest}" \
            --arg deploymentEvidenceSha256 "${deployment_evidence_sha256}" '
              {
                schemaVersion: "archon.production-availability/v1",
                observedAt: $observedAt,
                source: {
                  repository: $repository,
                  branch: $branch,
                  controlPlaneSha: $controlPlaneSha,
                  workflowRunId: $workflowRunId,
                  workflowRunAttempt: $workflowRunAttempt
                },
                publicRuntime: {
                  applicationOriginSha256: $applicationOriginSha256,
                  indexSha256: $indexSha256,
                  runtimeConfigSha256: $runtimeConfigSha256,
                  runtimeConfigSchemaVersion: 1,
                  clientIdSha256: $clientIdSha256,
                  authOriginSha256: $authOriginSha256,
                  liveRuntimeManifestSha256:
                    $liveRuntimeManifestSha256,
                  redirectMatchesApplication: true,
                  productionApplicationUrlMatched: true,
                  runtimeConfigMatchesDeployment: true,
                  publicBytesMatchLiveManifest: true,
                  scopes: ["openid", "email", "archon/approve"],
                  redirectsObserved: 0,
                  strictTls: true,
                  securityHeadersVerified: true
                },
                readOnlyAudit: {
                  method: "POST",
                  path: "/api/audits",
                  querySha256: $querySha256,
                  responseSha256: $responseSha256,
                  releaseSha: $releaseSha,
                  requestIdSha256: $requestIdSha256,
                  scanIdSha256: $scanIdSha256,
                  requestIdHeaderMatchesBody: true,
                  classification: $classification,
                  findingCount: $findingCount,
                  traceAgents: $traceAgents,
                  redirectsObserved: 0,
                  strictTls: true,
                  sanitized: true
                },
                releaseEvidence: {
                  masterAncestor: true,
                  ciRunId: $ciRunId,
                  newestSuccessfulDeployment: true,
                  deploymentRunId: $deploymentRunId,
                  deploymentRunAttempt: $deploymentRunAttempt,
                  deploymentControlPlaneSha:
                    $deploymentControlPlaneSha,
                  deploymentArtifactId: $deploymentArtifactId,
                  deploymentArtifactDigest: $deploymentArtifactDigest,
                  deploymentEvidenceSha256: $deploymentEvidenceSha256,
                  finalControlPlaneRevalidated: true,
                  finalDeploymentAttemptRevalidated: true,
                  finalCiRunRevalidated: true,
                  finalArtifactMetadataRevalidated: true,
                  stagingPassed: true,
                  productionPassed: true
                },
                result: "passed"
              }
            ' >"${availability}"

          availability_sha256="$(
            sha256sum "${availability}" | awk '{print $1}'
          )"
          availability_bytes="$(stat -c '%s' "${availability}")"
          manifest="${evidence_dir}/manifest.json"
          jq -cnS \
            --arg sha256 "${availability_sha256}" \
            --argjson sizeBytes "${availability_bytes}" '
              {
                schemaVersion: "archon.production-availability-manifest/v1",
                files: [
                  {
                    path: "availability.json",
                    sha256: $sha256,
                    sizeBytes: $sizeBytes
                  }
                ]
              }
            ' >"${manifest}"
          manifest_sha256="$(sha256sum "${manifest}" | awk '{print $1}')"
          (
            cd "${evidence_dir}"
            printf '%s  %s\n' \
              "${availability_sha256}" availability.json \
              "${manifest_sha256}" manifest.json \
              >SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          jq -e \
            --arg sha256 "${availability_sha256}" \
            --argjson sizeBytes "${availability_bytes}" '
              .schemaVersion ==
                "archon.production-availability-manifest/v1" and
              .files == [{
                path: "availability.json",
                sha256: $sha256,
                sizeBytes: $sizeBytes
              }]
            ' "${manifest}" >/dev/null
          actual_files="$(
            find "${evidence_dir}" \
              -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
              LC_ALL=C sort
          )"
          test "${actual_files}" = "$(
            printf '%s\n' SHA256SUMS availability.json manifest.json
          )"
          for evidence_file in \
            "${evidence_dir}/SHA256SUMS" \
            "${availability}" \
            "${manifest}"; do
            test -f "${evidence_file}"
            test ! -L "${evidence_file}"
          done

          echo "release_sha=${release_sha}" >>"${GITHUB_OUTPUT}"

      - name: Retain checksum-sealed availability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-availability-${{ steps.probe.outputs.release_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/availability-evidence
          if-no-files-found: error
          retention-days: 90
