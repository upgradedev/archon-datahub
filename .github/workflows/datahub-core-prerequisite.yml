name: DataHub Core prerequisite

run-name: Seed the synthetic PII tag at ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Current master 40-character commit SHA
        required: true
        type: string
      confirmation:
        description: Type SEED SYNTHETIC PII TAG
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: archon-governed-canary-mutation-recovery
  cancel-in-progress: false

env:
  GCP_PROJECT: upgradegr-challenges
  GCP_ZONE: europe-west1-b
  DATAHUB_VM: datahub-core
  DATAHUB_GMS_URL: http://127.0.0.1:18080
  PII_TAG_URN: urn:li:tag:PII

jobs:
  plan:
    name: Read-only prerequisite plan
    if: >-
      github.repository == 'upgradedev/archon-datahub' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      operation: ${{ steps.plan.outputs.operation }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
    steps:
      - name: Bind the exact current release and operator intent
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "SEED SYNTHETIC PII TAG"
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${RELEASE_SHA}"
          master_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)"
          test "${master_sha}" = "${RELEASE_SHA}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require the dedicated proof identity
        env:
          PROOF_IDENTITY: ${{ vars.GCP_PROOF_SERVICE_ACCOUNT }}
          DEPLOY_IDENTITY: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          RUNTIME_IDENTITY: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROOF_IDENTITY}"
          test -n "${DEPLOY_IDENTITY}"
          test -n "${RUNTIME_IDENTITY}"
          test "${PROOF_IDENTITY}" != "${DEPLOY_IDENTITY}"
          test "${PROOF_IDENTITY}" != "${RUNTIME_IDENTITY}"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PROOF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: upgradegr-challenges

      - name: Open a bounded IAP tunnel
        run: bash scripts/open-datahub-iap-tunnel.sh

      - name: Seal a read-only create-or-noop plan
        id: plan
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          urn = os.environ["PII_TAG_URN"]
          gms = os.environ["DATAHUB_GMS_URL"]
          if gms != "http://127.0.0.1:18080" or urn != "urn:li:tag:PII":
              raise SystemExit("prerequisite allowlist changed")
          url = (
              f"{gms}/openapi/v3/entity/tag/"
              f"{urllib.parse.quote(urn, safe='')}/tagProperties"
              "?systemMetadata=true&version=0"
          )
          request = urllib.request.Request(url, headers={"Accept": "application/json"})
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  raw = response.read(1_048_577)
                  if len(raw) > 1_048_576:
                      raise SystemExit("DataHub response exceeded the safety bound")
                  envelope = json.loads(raw)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              envelope = None
          present = isinstance(envelope, dict) and isinstance(envelope.get("value"), dict)
          plan = {
              "schemaVersion": "archon.datahub-core-prerequisite/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseSha": os.environ["RELEASE_SHA"],
              "target": {"entityType": "tag", "urn": urn, "aspect": "tagProperties"},
              "operation": "noop" if present else "create",
          }
          canonical = json.dumps(plan, sort_keys=True, separators=(",", ":")).encode()
          digest = "sha256:" + hashlib.sha256(canonical).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"operation={plan['operation']}\nplan_digest={digest}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Synthetic PII tag prerequisite: **{plan['operation']}** (`{digest}`).\n")
          PY

      - name: Close IAP tunnel
        if: always()
        run: test -z "${IAP_PID:-}" || kill "${IAP_PID}" 2>/dev/null || true

  apply:
    name: Solo-owner-approved prerequisite apply
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.operation == 'create' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: datahub-demo-seed
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Rebind the sealed plan and release
        env:
          OPERATION: ${{ needs.plan.outputs.operation }}
          PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "${OPERATION}" = "create"
          [[ "${PLAN_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"

      - name: Require the dedicated proof identity
        env:
          PROOF_IDENTITY: ${{ vars.GCP_PROOF_SERVICE_ACCOUNT }}
          DEPLOY_IDENTITY: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          RUNTIME_IDENTITY: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROOF_IDENTITY}"
          test -n "${DEPLOY_IDENTITY}"
          test -n "${RUNTIME_IDENTITY}"
          test "${PROOF_IDENTITY}" != "${DEPLOY_IDENTITY}"
          test "${PROOF_IDENTITY}" != "${RUNTIME_IDENTITY}"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PROOF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: upgradegr-challenges

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v7.5.0
        with:
          version: "0.11.31"
          enable-cache: false

      - name: Materialize the exact locked DataHub SDK
        env:
          RUNTIME: ${{ runner.temp }}/datahub-core-prerequisite/runtime
        run: bash scripts/materialize-datahub-mcp-lock.sh "${RUNTIME}"

      - name: Open a bounded IAP tunnel
        run: bash scripts/open-datahub-iap-tunnel.sh

      - name: Create only the missing synthetic PII tag and verify it
        env:
          RUNTIME: ${{ runner.temp }}/datahub-core-prerequisite/runtime
        shell: bash
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/datahub-core-prerequisite-receipt.json"
          "${RUNTIME}/.venv/bin/python" - "${receipt}" <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          from datahub.emitter.mcp import MetadataChangeProposalWrapper
          from datahub.emitter.rest_emitter import DatahubRestEmitter
          from datahub.metadata.schema_classes import TagPropertiesClass

          urn = os.environ["PII_TAG_URN"]
          gms = os.environ["DATAHUB_GMS_URL"]
          if gms != "http://127.0.0.1:18080" or urn != "urn:li:tag:PII":
              raise SystemExit("prerequisite allowlist changed")
          url = (
              f"{gms}/openapi/v3/entity/tag/"
              f"{urllib.parse.quote(urn, safe='')}/tagProperties"
              "?systemMetadata=true&version=0"
          )

          def read_value():
              request = urllib.request.Request(url, headers={"Accept": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      raw = response.read(1_048_577)
                      if len(raw) > 1_048_576:
                          raise SystemExit("DataHub response exceeded the safety bound")
                      envelope = json.loads(raw)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise
              value = envelope.get("value") if isinstance(envelope, dict) else None
              return value if isinstance(value, dict) else None

          before = read_value()
          outcome = "already-present"
          if before is None:
              proposal = MetadataChangeProposalWrapper(
                  entityUrn=urn,
                  aspect=TagPropertiesClass(
                      name="Personally Identifiable Information",
                      description=(
                          "Synthetic classification prerequisite for Archon's governed "
                          "write-and-rollback proof."
                      ),
                      colorHex="#B42318",
                  ),
              )
              if not proposal.validate() or not proposal.make_mcp().validate():
                  raise SystemExit("PII tag proposal failed local DataHub validation")
              DatahubRestEmitter(gms_server=gms, timeout_sec=15).emit_mcp(proposal)
              outcome = "created"
          after = read_value()
          if after is None or not isinstance(after.get("name"), str) or not after["name"]:
              raise SystemExit("PII tag read-after-write verification failed")
          receipt = {
              "schemaVersion": "archon.datahub-core-prerequisite-receipt/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseSha": os.environ["GITHUB_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "targetUrn": urn,
              "outcome": outcome,
              "verified": True,
          }
          path = pathlib.Path(sys.argv[1])
          path.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          test -s "${receipt}"
          echo "RECEIPT=${receipt}" >>"${GITHUB_ENV}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datahub-core-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT }}
          if-no-files-found: error
          retention-days: 30

      - name: Close IAP tunnel
        if: always()
        run: test -z "${IAP_PID:-}" || kill "${IAP_PID}" 2>/dev/null || true

  unchanged:
    name: Prerequisite already satisfied
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.operation == 'noop' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "The synthetic PII tag already exists; no mutation was performed."
