name: DataHub Cloud runtime OCI v2

on:
  push:
    branches: [master]
    paths:
      - ".github/locks/datahub-agent-stack.json"
      - ".github/locks/datahub-cloud-runtime-image.json"
      - ".github/locks/datahub-mcp-v0.6.0.json"
      - ".github/workflows/datahub-cloud-runtime-image.yml"
      - ".github/security/datahub-companion-image.openvex.json"
      - "contracts/datahub-core-mutation-authorization-golden.json"
      - "contrib/datahub-audit/SKILL.md"
      - "services/datahub-cloud-runtime/**"
      - "services/datahub-companion/archon_companion.py"
      - "services/datahub-companion/demo/archon_demo.sql"
      - "services/datahub-companion/pyproject.toml"
      - "services/datahub-companion/uv.lock"
  pull_request:
    paths:
      - ".github/locks/datahub-agent-stack.json"
      - ".github/locks/datahub-cloud-runtime-image.json"
      - ".github/locks/datahub-mcp-v0.6.0.json"
      - ".github/workflows/datahub-cloud-runtime-image.yml"
      - ".github/security/datahub-companion-image.openvex.json"
      - "contracts/datahub-core-mutation-authorization-golden.json"
      - "contrib/datahub-audit/SKILL.md"
      - "services/datahub-cloud-runtime/**"
      - "services/datahub-companion/archon_companion.py"
      - "services/datahub-companion/demo/archon_demo.sql"
      - "services/datahub-companion/pyproject.toml"
      - "services/datahub-companion/uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datahub-cloud-runtime-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  IMAGE_REF: archon-datahub-cloud-runtime:${{ github.event.pull_request.head.sha || github.sha }}
  LOCK_PATH: .github/locks/datahub-cloud-runtime-image.json
  VEX_PATH: .github/security/datahub-companion-image.openvex.json
  ECR_REPOSITORY: archon-datahub-cloud-runtime-v2

jobs:
  candidate:
    name: Test, scan and seal one exact candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      security-events: write
    outputs:
      artifact_id: ${{ steps.candidate.outputs['artifact-id'] }}
      artifact_digest: ${{ steps.candidate.outputs['artifact-digest'] }}
      build_digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify every immutable source binding
        run: |
          set -euo pipefail
          test "$(jq -r .schemaVersion "$LOCK_PATH")" =             "archon.datahub-cloud-runtime-image-lock/v1"
          test "$(jq -r .platform "$LOCK_PATH")" = "linux/amd64"
          test "$(jq -r .architecture "$LOCK_PATH")" = "x86_64"
          while IFS=$'\t' read -r path expected; do
            test -f "$path"
            observed="$(git hash-object -- "$path")"
            test "$observed" = "$expected"
          done < <(
            jq -r '.sourceBlobs[] | [.path,.blobSha] | @tsv' "$LOCK_PATH"
          )
          while IFS=$'\t' read -r path expected; do
            test -f "$path"
            observed="$(git hash-object -- "$path")"
            test "$observed" = "$expected"
          done < <(
            jq -r '.immutableInputs[] | [.path,.blobSha] | @tsv' "$LOCK_PATH"
          )
          test "$(git hash-object services/datahub-companion/uv.lock)" =             "$(jq -r .dependencyLock.blobSha "$LOCK_PATH")"
          test "$(git hash-object services/datahub-companion/pyproject.toml)" =             "$(jq -r .dependencyLock.pyprojectBlobSha "$LOCK_PATH")"
          grep -F             'public.ecr.aws/lambda/python:3.12@sha256:182ce4c13bce31bc9fcff9a2705f2f946b59e2d32e10cdf7700883d8a59c25da'             services/datahub-cloud-runtime/Dockerfile
          grep -F             'ghcr.io/astral-sh/uv@sha256:ecd4de2f060c64bea0ff8ecb182ddf46ba3fcccdc8a60cfdbaf20d1a047d7437'             services/datahub-cloud-runtime/Dockerfile
          if ! git diff --quiet --; then
            echo "::error title=Cloud runtime source boundary::tracked source changed before build"
            exit 1
          fi
          if ! git diff --cached --quiet --; then
            echo "::error title=Cloud runtime source boundary::index changed before build"
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked" ]]; then
            while IFS= read -r path; do
              printf '::error file=%s,title=Cloud runtime source boundary::unexpected untracked path before build\n' "$path"
            done <<<"$untracked"
            exit 1
          fi

      - name: Materialize exact official DataHub Skills without a Git checkout
        env:
          SKILLS_COMMIT: f7c7c53648b71dc0841742781e108051d46fa360
          SKILLS_SHA256: 1db5f8f88b7e13e9eac23b89363a0e2bbe0ea76a73f524f2364577d081564ad6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/datahub-skills.tar.gz"
          destination="$RUNNER_TEMP/datahub-skills"
          curl --fail --silent --show-error --location             --proto '=https' --tlsv1.2             --retry 3 --retry-all-errors --max-time 60             "https://codeload.github.com/datahub-project/datahub-skills/tar.gz/$SKILLS_COMMIT"             --output "$archive"
          echo "$SKILLS_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$destination"
          tar --extract --gzip --strip-components=1             --directory "$destination" --file "$archive"
          test ! -e "$destination/.git"
          for skill in datahub-search datahub-lineage datahub-quality datahub-enrich using-datahub; do
            test -f "$destination/skills/$skill/SKILL.md"
            test ! -L "$destination/skills/$skill/SKILL.md"
          done
          rm -f "$archive"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the CI-only test target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/datahub-cloud-runtime/Dockerfile
          target: test
          load: true
          platforms: linux/amd64
          tags: archon-datahub-cloud-runtime-test:${{ env.SOURCE_SHA }}
          build-args: |
            ARCHON_RELEASE_SHA=${{ env.SOURCE_SHA }}
          build-contexts: |
            datahub-skills=${{ runner.temp }}/datahub-skills
          cache-from: type=gha,scope=datahub-cloud-runtime-v2
          cache-to: type=gha,mode=max,scope=datahub-cloud-runtime-v2
          provenance: false
          sbom: false

      - name: Run all runtime and negative security tests inside the image
        run: |
          set -euo pipefail
          docker run --rm             --read-only             --tmpfs /tmp:rw,nosuid,nodev,size=1024m             --cap-drop ALL             --security-opt no-new-privileges             --network none             "archon-datahub-cloud-runtime-test:$SOURCE_SHA"

      - name: Build once and load the production Lambda candidate
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/datahub-cloud-runtime/Dockerfile
          target: runtime
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            ARCHON_RELEASE_SHA=${{ env.SOURCE_SHA }}
          build-contexts: |
            datahub-skills=${{ runner.temp }}/datahub-skills
          cache-from: type=gha,scope=datahub-cloud-runtime-v2
          cache-to: type=gha,mode=max,scope=datahub-cloud-runtime-v2
          provenance: false
          sbom: false

      - name: Prove Lambda image architecture, command and secret absence
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Architecture}}')" = "amd64"
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Os}}')" = "linux"
          test "$(docker image inspect "$IMAGE_REF" --format '{{json .Config.Cmd}}')" =             '["handlers.read_handler"]'
          test "$(docker image inspect "$IMAGE_REF" --format '{{json .Config.Entrypoint}}')" =             '["/lambda-entrypoint.sh"]'
          docker image inspect "$IMAGE_REF" --format '{{json .Config.Env}}' |
          jq -e 'all(.[];
            test("^(DATAHUB_GMS_TOKEN|OAUTH_MASTER_KEY|ARCHON_RUN_HANDLE_FERNET_KEY|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN)=")
            | not
          )' >/dev/null
          test -n "${{ steps.image.outputs.digest }}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Validate the exact expiring runtime OpenVEX statement
        run: |
          set -euo pipefail
          jq --exit-status '
            ."@context" == "https://openvex.dev/ns/v0.2.0" and
            ."@id" == "https://github.com/upgradedev/archon-datahub/security/vex/datahub-companion-image-setuptools/v1" and
            .author == "https://github.com/upgradedev/archon-datahub" and
            .timestamp == .last_updated and
            .version == 1 and
            (.statements | length) == 1 and
            .statements[0].vulnerability.name == "CVE-2026-59890" and
            .statements[0].products == [
              {"@id": "pkg:pypi/setuptools@81.0.0"}
            ] and
            .statements[0].status == "not_affected" and
            .statements[0].justification == "vulnerable_code_not_in_execute_path"
          ' "$VEX_PATH" >/dev/null
          python3 - <<'PY'
          import json
          import os
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          vex = json.loads(Path(os.environ["VEX_PATH"]).read_text())
          issued = datetime.fromisoformat(
              vex["timestamp"].removesuffix("Z") + "+00:00"
          )
          expires = datetime.fromisoformat(
              vex["x-archon-expires-at"].removesuffix("Z") + "+00:00"
          )
          now = datetime.now(UTC)
          assert issued <= now < expires
          assert timedelta(0) < expires - issued <= timedelta(days=32)
          PY
          test "$(
            grep -c -- '--no-build' services/datahub-cloud-runtime/Dockerfile
          )" = "2"

      - name: Dependency SCA against the exact lock
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: services/datahub-companion
          scanners: vuln
          format: sarif
          output: ${{ runner.temp }}/cloud-runtime-sca.raw.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: "0"
          hide-progress: true
          version: v0.72.0

      - name: Dependency SCA with the reviewed OpenVEX
        env:
          TRIVY_VEX: .github/security/datahub-companion-image.openvex.json
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: services/datahub-companion
          scanners: vuln
          format: sarif
          output: ${{ runner.temp }}/cloud-runtime-sca.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"
          hide-progress: true
          version: v0.72.0

      - name: Trivy raw scan of the exact production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          format: sarif
          output: ${{ runner.temp }}/cloud-runtime-image.raw.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: "0"
          hide-progress: true
          version: v0.72.0

      - name: Trivy scan of the exact production image with reviewed OpenVEX
        env:
          TRIVY_VEX: .github/security/datahub-companion-image.openvex.json
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          format: sarif
          output: ${{ runner.temp }}/cloud-runtime-image.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"
          hide-progress: true
          version: v0.72.0

      - name: Generate exact CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          format: cyclonedx
          output: ${{ runner.temp }}/cloud-runtime.cdx.json
          hide-progress: true
          version: v0.72.0

      - name: Generate exact SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          format: spdx-json
          output: ${{ runner.temp }}/cloud-runtime.spdx.json
          hide-progress: true
          version: v0.72.0

      - name: Enforce scan and SBOM gates
        id: security_gate
        continue-on-error: true
        run: |
          set -u -o pipefail
          diagnostics="$RUNNER_TEMP/cloud-runtime-gate-diagnostics.json"
          jq -nS \
            --slurpfile scaRaw "$RUNNER_TEMP/cloud-runtime-sca.raw.sarif" \
            --slurpfile sca "$RUNNER_TEMP/cloud-runtime-sca.sarif" \
            --slurpfile imageRaw "$RUNNER_TEMP/cloud-runtime-image.raw.sarif" \
            --slurpfile image "$RUNNER_TEMP/cloud-runtime-image.sarif" \
            --slurpfile cdx "$RUNNER_TEMP/cloud-runtime.cdx.json" \
            --slurpfile spdx "$RUNNER_TEMP/cloud-runtime.spdx.json" '
            def valid_sarif($document):
              $document.version == "2.1.0" and
              ($document.runs | type == "array" and length > 0) and
              all(
                $document.runs[];
                (.results | type == "array")
              );
            def findings($document):
              [
                $document.runs[]? as $run
                | ($run.results // [])[]?
                | . as $result
                | {
                    ruleId: ($result.ruleId // "unknown"),
                    level: ($result.level // "unknown"),
                    severity: (
                      [
                        $run.tool.driver.rules[]?
                        | select(.id == $result.ruleId)
                        | .properties.tags[]?
                        | select(. == "HIGH" or . == "CRITICAL")
                      ][0] // "unknown"
                    )
                  }
              ]
              | unique_by([.ruleId, .level, .severity])
              | sort_by(.ruleId)
              | .[:20];
            def count_results($document):
              [$document.runs[]?.results[]?] | length;
            def versions($name):
              [
                $cdx[0].components[]?
                | select(.name == $name)
                | .version
                | select(type == "string")
              ] | unique | sort;
            {
              schemaVersion:
                "archon.datahub-cloud-runtime-gate-diagnostics/v1",
              redaction: {
                freeTextMessages: "omitted",
                locations: "omitted",
                sourcePaths: "omitted"
              },
              scans: [
                {
                  report: "dependency",
                  raw: {
                    valid: valid_sarif($scaRaw[0]),
                    count: count_results($scaRaw[0]),
                    findings: findings($scaRaw[0])
                  },
                  actionable: {
                    valid: valid_sarif($sca[0]),
                    count: count_results($sca[0]),
                    findings: findings($sca[0])
                  }
                },
                {
                  report: "image",
                  raw: {
                    valid: valid_sarif($imageRaw[0]),
                    count: count_results($imageRaw[0]),
                    findings: findings($imageRaw[0])
                  },
                  actionable: {
                    valid: valid_sarif($image[0]),
                    count: count_results($image[0]),
                    findings: findings($image[0])
                  }
                }
              ],
              sbom: {
                cycloneDx: {
                  bomFormat: ($cdx[0].bomFormat // "missing"),
                  componentCount: ([$cdx[0].components[]?] | length),
                  required: [
                    {
                      name: "datahub-agent-context",
                      requiredVersion: "1.6.0.17",
                      observedVersions:
                        versions("datahub-agent-context")
                    },
                    {
                      name: "datahub-analytics-agent",
                      requiredVersion: "0.4.0",
                      observedVersions:
                        versions("datahub-analytics-agent")
                    },
                    {
                      name: "cryptography",
                      requiredVersion: "50.0.0",
                      observedVersions: versions("cryptography")
                    }
                  ]
                },
                spdx: {
                  version: ($spdx[0].spdxVersion // "missing")
                }
              }
            }
            | .gate = {
                sarifClean: all(
                  .scans[];
                  .raw.valid and
                  .actionable.valid and
                  .actionable.count == 0
                ),
                cycloneDxExactComponents: (
                  .sbom.cycloneDx.bomFormat == "CycloneDX" and
                  all(
                    .sbom.cycloneDx.required[];
                    . as $required
                    | (
                        $required.observedVersions
                        | index($required.requiredVersion)
                      ) != null
                  )
                ),
                spdxValid:
                  (.sbom.spdx.version | startswith("SPDX-"))
              }
            | .gate.passed = (
                .gate.sarifClean and
                .gate.cycloneDxExactComponents and
                .gate.spdxValid
              )
          ' >"$diagnostics"

          jq -c '{
            schemaVersion,
            gate,
            scans,
            sbom
          }' "$diagnostics"

          gate_status=0
          for report in \
            "$RUNNER_TEMP/cloud-runtime-sca.sarif" \
            "$RUNNER_TEMP/cloud-runtime-image.sarif"
          do
            if ! jq -e '
              .version == "2.1.0" and
              ([.runs[].results[]] | length) == 0
            ' "$report" >/dev/null; then
              count="$(
                jq -r '[.runs[]?.results[]?] | length' "$report" \
                  2>/dev/null || printf unknown
              )"
              echo "::error title=Cloud runtime security gate::$(basename "$report") has $count actionable HIGH/CRITICAL finding(s); inspect retained redacted diagnostics"
              gate_status=1
            fi
          done
          if ! jq -e '
            .bomFormat == "CycloneDX" and
            any(.components[]; .name == "datahub-agent-context" and .version == "1.6.0.17") and
            any(.components[]; .name == "datahub-analytics-agent" and .version == "0.4.0") and
            any(.components[]; .name == "cryptography" and .version == "50.0.0")
          ' "$RUNNER_TEMP/cloud-runtime.cdx.json" >/dev/null; then
            echo "::error title=Cloud runtime SBOM gate::required exact CycloneDX component is absent; inspect retained redacted diagnostics"
            gate_status=1
          fi
          if ! jq -e '
            .spdxVersion | startswith("SPDX-")
          ' "$RUNNER_TEMP/cloud-runtime.spdx.json" >/dev/null; then
            echo "::error title=Cloud runtime SBOM gate::SPDX document is malformed"
            gate_status=1
          fi
          exit "$gate_status"

      - name: Stage complete pre-gate security evidence
        id: security_evidence
        if: >-
          always() &&
          (steps.security_gate.outcome == 'success' ||
          steps.security_gate.outcome == 'failure')
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/cloud-runtime-security-evidence"
          sources=(
            "$RUNNER_TEMP/cloud-runtime-sca.raw.sarif"
            "$RUNNER_TEMP/cloud-runtime-sca.sarif"
            "$RUNNER_TEMP/cloud-runtime-image.raw.sarif"
            "$RUNNER_TEMP/cloud-runtime-image.sarif"
            "$RUNNER_TEMP/cloud-runtime.cdx.json"
            "$RUNNER_TEMP/cloud-runtime.spdx.json"
            "$RUNNER_TEMP/cloud-runtime-gate-diagnostics.json"
          )
          for source in "${sources[@]}"; do
            test -f "$source"
            test ! -L "$source"
          done
          test -f "$VEX_PATH"
          test ! -L "$VEX_PATH"
          mkdir -m 0755 "$evidence"
          for source in "${sources[@]}"; do
            install -m 0644 "$source" "$evidence/$(basename "$source")"
          done
          install -m 0644 "$VEX_PATH" "$evidence/image.openvex.json"
          (
            cd "$evidence"
            sha256sum \
              cloud-runtime-sca.raw.sarif \
              cloud-runtime-sca.sarif \
              cloud-runtime-image.raw.sarif \
              cloud-runtime-image.sarif \
              cloud-runtime.cdx.json \
              cloud-runtime.spdx.json \
              cloud-runtime-gate-diagnostics.json \
              image.openvex.json >SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Retain pre-gate scan and SBOM evidence
        id: security_evidence_upload
        if: >-
          always() &&
          steps.security_evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datahub-cloud-runtime-security-evidence-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/cloud-runtime-security-evidence/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}
          overwrite: true

      - name: Upload trusted image SARIF
        if: >-
          always() &&
          steps.security_evidence.outcome == 'success' &&
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: ${{ runner.temp }}/cloud-runtime-image.sarif
          category: trivy-datahub-cloud-runtime-v2

      - name: Fail closed after security evidence retention
        if: >-
          steps.security_gate.outcome == 'failure' &&
          steps.security_evidence_upload.outcome == 'success'
        run: |
          echo "::error title=Cloud runtime candidate rejected::Security or exact SBOM gate failed; retained evidence is attached to this run"
          exit 1
      - name: Seal candidate, SBOM and provenance
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/cloud-runtime-candidate"
          mkdir -p "$evidence"
          cp "$RUNNER_TEMP/cloud-runtime-sca.raw.sarif" "$evidence/sca.raw.sarif"
          cp "$RUNNER_TEMP/cloud-runtime-sca.sarif" "$evidence/sca.sarif"
          cp "$RUNNER_TEMP/cloud-runtime-image.raw.sarif" "$evidence/image.raw.sarif"
          cp "$RUNNER_TEMP/cloud-runtime-image.sarif" "$evidence/image.sarif"
          cp "$RUNNER_TEMP/cloud-runtime.cdx.json" "$evidence/runtime.cdx.json"
          cp "$RUNNER_TEMP/cloud-runtime.spdx.json" "$evidence/runtime.spdx.json"
          cp "$RUNNER_TEMP/cloud-runtime-gate-diagnostics.json" \
            "$evidence/gate-diagnostics.json"
          cp "$VEX_PATH" "$evidence/image.openvex.json"
          docker save --output "$evidence/candidate.tar" "$IMAGE_REF"
          image_id="$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')"
          jq -n             --arg schemaVersion "archon.datahub-cloud-runtime-provenance/v1"             --arg sourceSha "$SOURCE_SHA"             --arg imageRef "$IMAGE_REF"             --arg imageId "$image_id"             --arg buildDigest "${{ steps.image.outputs.digest }}"             --arg lockDigest "sha256:$(sha256sum "$LOCK_PATH" | cut -d' ' -f1)"             '{
              schemaVersion:$schemaVersion,
              sourceSha:$sourceSha,
              imageRef:$imageRef,
              imageId:$imageId,
              buildDigest:$buildDigest,
              lockDigest:$lockDigest,
              platform:"linux/amd64",
              architecture:"x86_64",
              networkDuringTests:"none",
              sourceBuilds:"deny",
              localArtifactsPersisted:false
            }' >"$evidence/provenance.json"
          (
            cd "$evidence"
            sha256sum \
              candidate.tar \
              gate-diagnostics.json \
              image.openvex.json \
              image.raw.sarif \
              image.sarif \
              provenance.json \
              runtime.cdx.json \
              runtime.spdx.json \
              sca.raw.sarif \
              sca.sarif >SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload exact sealed candidate
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datahub-cloud-runtime-candidate-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/cloud-runtime-candidate
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove runner-local images and transient source
        if: always()
        run: |
          docker image rm --force             "archon-datahub-cloud-runtime-test:$SOURCE_SHA"             "$IMAGE_REF" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/datahub-skills"             "$RUNNER_TEMP/cloud-runtime-candidate"

  publish:
    name: Publish immutable ECR digest and signed attestations
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download candidate by immutable artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate

      - name: Revalidate candidate before acquiring AWS authority
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/candidate"
          (cd "$evidence" && sha256sum --check --strict SHA256SUMS)
          test "$(jq -r .sourceSha "$evidence/provenance.json")" = "$SOURCE_SHA"
          test "$(jq -r .buildDigest "$evidence/provenance.json")" =             "${{ needs.candidate.outputs.build_digest }}"

      - name: Validate exact publisher binding before AWS trust
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION_VALUE: ${{ vars.AWS_REGION }}
          AWS_CLOUD_RUNTIME_IMAGE_ROLE_ARN: ${{ vars.AWS_CLOUD_RUNTIME_IMAGE_ROLE_ARN }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          : "${AWS_ACCOUNT_ID:?production AWS_ACCOUNT_ID is required}"
          : "${AWS_REGION_VALUE:?production AWS_REGION is required}"
          : "${AWS_CLOUD_RUNTIME_IMAGE_ROLE_ARN:?production AWS_CLOUD_RUNTIME_IMAGE_ROLE_ARN is required}"
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_REPOSITORY}" = "upgradedev/archon-datahub"
          test "${GITHUB_REF}" = "refs/heads/master"
          test "${GITHUB_REF_NAME}" = "master"
          test "${CONTROL_PLANE_SHA}" = "${SOURCE_SHA}"
          test "${WORKFLOW_SHA}" = "${SOURCE_SHA}"
          test "${WORKFLOW_REF}" = \
            "upgradedev/archon-datahub/.github/workflows/datahub-cloud-runtime-image.yml@refs/heads/master"
          case "${EVENT_NAME}" in
            push | workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "${AWS_REGION_VALUE}" = "eu-west-1"
          expected_role_arn="arn:aws:iam::${AWS_ACCOUNT_ID}:role/archon-datahub-cloud-runtime-publish-production"
          test "${AWS_CLOUD_RUNTIME_IMAGE_ROLE_ARN}" = "${expected_role_arn}"
          echo "::add-mask::${AWS_ACCOUNT_ID}"
          echo "::add-mask::${AWS_CLOUD_RUNTIME_IMAGE_ROLE_ARN}"
      - name: Acquire short-lived image publisher credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_CLOUD_RUNTIME_IMAGE_ROLE_ARN }}
          role-session-name: archon-cloud-runtime-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 1800
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Ensure the exact pipeline-owned immutable ECR repository
        run: |
          set -euo pipefail
          test "$ECR_REPOSITORY" = "archon-datahub-cloud-runtime-v2"
          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1
          then
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=KMS \
              --tags Key=archon:component,Value=datahub-cloud-runtime-v2 \
                Key=archon:owner,Value=github-actions >/dev/null
          fi
          repository="$RUNNER_TEMP/ecr-repository.json"
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" --output json >"$repository"
          jq -e --arg name "$ECR_REPOSITORY" '
            (.repositories | length) == 1 and
            .repositories[0].repositoryName == $name and
            .repositories[0].imageTagMutability == "IMMUTABLE" and
            .repositories[0].imageScanningConfiguration.scanOnPush == true and
            .repositories[0].encryptionConfiguration.encryptionType == "KMS"
          ' "$repository" >/dev/null

      - name: Push one immutable ECR tag and resolve canonical digest
        id: publish
        env:
          AWS_REGION_VALUE: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="$account.dkr.ecr.$AWS_REGION_VALUE.amazonaws.com"
          repository_uri="$registry/$ECR_REPOSITORY"
          aws ecr get-login-password |
            docker login --username AWS --password-stdin "$registry"
          docker load --input "$RUNNER_TEMP/candidate/candidate.tar"
          tag="cloud-v2-$SOURCE_SHA"
          docker tag "$IMAGE_REF" "$repository_uri:$tag"
          docker push "$repository_uri:$tag"
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$tag" \
            --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          image_uri="$repository_uri:$tag"
          printf 'image_uri=%s\nimage_digest=%s\nrepository_uri=%s\n' \
            "$image_uri" "$digest" "$repository_uri" >>"$GITHUB_OUTPUT"
          printf '%s  %s\n' "${digest#sha256:}" "$image_uri" \
            >"$RUNNER_TEMP/candidate/image-subject.sha256"

      - name: Sign provenance with GitHub Artifact Attestations
        id: provenance_attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ runner.temp }}/candidate/image-subject.sha256
          predicate-type: https://github.com/upgradedev/archon-datahub/attestations/datahub-cloud-runtime/v1
          predicate-path: ${{ runner.temp }}/candidate/provenance.json

      - name: Sign SPDX SBOM with GitHub Artifact Attestations
        id: sbom_attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ runner.temp }}/candidate/image-subject.sha256
          sbom-path: ${{ runner.temp }}/candidate/runtime.spdx.json

      - name: Generate the immutable release contract
        env:
          IMAGE_URI: ${{ steps.publish.outputs.image_uri }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.image_digest }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/candidate"
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "candidate"
          def sha(path: str) -> str:
              return "sha256:" + hashlib.sha256((root / path).read_bytes()).hexdigest()

          release = {
              "schemaVersion": "archon.datahub-cloud-runtime-release/v1",
              "sourceSha": os.environ["SOURCE_SHA"],
              "imageUri": os.environ["IMAGE_URI"],
              "imageDigest": os.environ["IMAGE_DIGEST"],
              "architecture": "x86_64",
              "platform": "linux/amd64",
              "handlers": {
                  "read": "handlers.read_handler",
                  "mutation": "handlers.mutation_handler",
                  "fixtureReset": "handlers.fixture_reset_handler",
              },
              "gates": {
                  "unitTests": True,
                  "trivy": True,
                  "sca": True,
                  "sbom": True,
                  "provenance": True,
                  "signature": True,
                  "attestations": True,
              },
              "sbomDigests": {
                  "cycloneDx": sha("runtime.cdx.json"),
                  "spdx": sha("runtime.spdx.json"),
              },
              "provenanceDigest": sha("provenance.json"),
              "attestationSubjects": [
                  {
                      "name": os.environ["IMAGE_URI"],
                      "digest": os.environ["IMAGE_DIGEST"],
                  }
              ],
              "generatedAt": datetime.now(UTC).isoformat(
                  timespec="milliseconds"
              ).replace("+00:00", "Z"),
          }
          encoded = json.dumps(
              release, sort_keys=True, separators=(",", ":"), ensure_ascii=False
          ).encode()
          release["digest"] = "sha256:" + hashlib.sha256(encoded).hexdigest()
          (root / "release.json").write_text(
              json.dumps(release, indent=2) + "\n", encoding="utf-8"
          )
          PY
          jq -e '
            .schemaVersion == "archon.datahub-cloud-runtime-release/v1" and
            (.sourceSha | test("^[a-f0-9]{40}$")) and
            (.imageDigest | test("^sha256:[a-f0-9]{64}$")) and
            .architecture == "x86_64" and
            .platform == "linux/amd64" and
            all(.gates[]; . == true)
          ' "$evidence/release.json" >/dev/null

      - name: Upload immutable release contract and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datahub-cloud-runtime-release-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/candidate/release.json
            ${{ runner.temp }}/candidate/provenance.json
            ${{ runner.temp }}/candidate/runtime.cdx.json
            ${{ runner.temp }}/candidate/runtime.spdx.json
            ${{ runner.temp }}/candidate/image-subject.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Bounded cleanup of only cloud-v2 tags and stale untagged images
        run: |
          set -euo pipefail
          inventory="$RUNNER_TEMP/ecr-inventory.json"
          aws ecr describe-images --repository-name "$ECR_REPOSITORY"             --output json >"$inventory"
          mapfile -t old_tags < <(
            jq -r '[
              .imageDetails[] as $image |
              ($image.imageTags // [])[] |
              select(startswith("cloud-v2-")) |
              {tag:., pushed:($image.imagePushedAt // "")}
            ] | sort_by(.pushed) | reverse | .[20:70] | .[].tag' "$inventory"
          )
          for tag in "${old_tags[@]}"; do
            aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY"               --image-ids "imageTag=$tag" >/dev/null
          done
          cutoff="$(date --utc --date='7 days ago' +%s)"
          mapfile -t untagged < <(
            jq -r --argjson cutoff "$cutoff" '[
              .imageDetails[] |
              select((.imageTags // [] | length) == 0) |
              select((.imagePushedAt | fromdateiso8601) < $cutoff) |
              .imageDigest
            ][0:50][]' "$inventory"
          )
          for digest in "${untagged[@]}"; do
            aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY"               --image-ids "imageDigest=$digest" >/dev/null
          done

      - name: Remove all runner-local candidate material
        if: always()
        run: |
          docker logout >/dev/null 2>&1 || true
          docker image rm --force "$IMAGE_REF" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/candidate"
