name: Hosted demo deploy

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: Build and deploy the Cloud Run audit API
        required: false
        default: true
        type: boolean
      deploy_web:
        description: Build and deploy the Firebase Hosting bundle
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: hosted-demo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy audit API and hosted SPA
    if: github.repository == 'upgradedev/archon-datahub'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_API: ${{ inputs.deploy_api }}
      DEPLOY_WEB: ${{ inputs.deploy_web }}
      GCP_PROJECT: upgradegr-challenges
    steps:
      - name: Probe startup
        run: echo "ok ${DEPLOY_API} ${DEPLOY_WEB}"
