name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.1"
  INFRA_NODE_VERSION: "22.23.1"
  CFN_GUARD_VERSION: "3.2.0"
  CFN_GUARD_ARCHIVE_SHA256: 9f8c4d9f15f7dd54a37ea70a5237ba00aba682fb1e6521a744d12259961dfc13
  DATAHUB_BENCHMARK_DATASET_VERSION: "2026-07-25"
  DATAHUB_BENCHMARK_DATASET_DIGEST: sha256:ef244f25fe085245b9153814d9c36e1a5f12112a5dc0dc39a315e40df586f42b

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks 8.30.1 (checksum-pinned)
        run: |
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${RUNNER_TEMP}/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/gitleaks.tar.gz" --directory "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --no-banner

  build-test:
    name: Build, test, coverage
    needs: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate AWS security contract scripts and drift rejection
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            scripts/manage-cognito-judge-user.sh \
            scripts/materialize-datahub-mcp-lock.sh \
            scripts/npm-audit-retry.sh \
            scripts/patch-cdk-brace-expansion.sh \
            scripts/render-inline-cloudformation-template.sh \
            scripts/seal-cdk-bootstrap-templates.sh \
            scripts/observe-aws-live-runtime.sh \
            scripts/bootstrap-aws-foundation-role.sh \
            scripts/reconcile-aws-foundation.sh \
            scripts/verify-cdk-npm-audit-compensation.sh \
            scripts/verify-github-control-plane.sh \
            scripts/verify-github-repository-posture.sh \
            scripts/verify-judge-emergency-control-plane.sh \
            scripts/verify-judge-environment-approval.sh \
            scripts/collect-submission-evidence-source.sh \
            scripts/verify-submission-readiness-source.sh \
            scripts/validate-model-provenance-corpus.sh \
            scripts/validate-aws-api-origin-contract.sh \
            scripts/validate-aws-network-contract.sh \
            scripts/validate-datahub-private-link-service.sh \
            scripts/validate-aws-runtime-boundaries.sh \
            scripts/validate-aws-waf-contract.sh \
            scripts/validate-cloudformation-role-bindings.sh \
            tests/pipeline/judge-user-contracts.test.sh \
            tests/pipeline/openvex-maintenance-contracts.test.sh \
            tests/pipeline/aws-foundation-contracts.test.sh \
            tests/pipeline/aws-security-contracts.test.sh; do
            bash -n "${script}"
          done
          for script in \
            scripts/patch-cdk-bootstrap-template.mjs \
            scripts/render-canonical-flow-yaml.mjs \
            scripts/render-aws-foundation-policy.mjs \
            scripts/verify-aws-runtime-boundary.mjs; do
            node --check "${script}"
          done
          bash tests/pipeline/aws-security-contracts.test.sh
          bash tests/pipeline/aws-foundation-contracts.test.sh
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/pipeline/datahub_demo_state_contracts_test.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/pipeline/datahub_canary_fixture_contracts_test.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/pipeline/datahub_canary_fixture_workflow_contracts_test.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/pipeline/github_repository_posture_contracts_test.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/pipeline/submission_evidence_contracts_test.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/pipeline/submission_devpost_confirmation_contracts_test.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/pipeline/submission_bonus_oss_contracts_test.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/pipeline/submission_bonus_feedback_contracts_test.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/pipeline/submission_content_review_contracts_test.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/pipeline/submission_judge_journey_contracts_test.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/pipeline/submission_judge_pack_contracts_test.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/pipeline/submission_project_access_contracts_test.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/pipeline/submission_operations_contracts_test.py
          bash tests/pipeline/judge-user-contracts.test.sh
          bash tests/pipeline/openvex-maintenance-contracts.test.sh
          bash scripts/validate-model-provenance-corpus.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify every exact npm override
        run: node scripts/verify-exact-npm-overrides.mjs .
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Full hermetic test suite
        run: npm test
      - name: Coverage gate
        run: npm run coverage
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

  web:
    name: Web typecheck, coverage, browser journey, build
    needs: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure ephemeral browser cache
        shell: bash
        run: |
          set -euo pipefail
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "${RUNNER_TEMP}/playwright-browsers" >>"${GITHUB_ENV}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Application and browser test typecheck
        working-directory: web
        run: |
          npm run typecheck
          npm run typecheck:e2e
      - name: Component and API contract tests
        working-directory: web
        run: npm test
      - name: Web coverage and decision-critical ratchets
        working-directory: web
        run: |
          npm run test:coverage
          npm run coverage:critical
      - name: Upload web coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-coverage-${{ github.sha }}
          path: web/coverage/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Web SCA gate
        working-directory: web
        run: >-
          bash "${GITHUB_WORKSPACE}/scripts/npm-audit-retry.sh"
          --audit-level=moderate
      - name: Build immutable SPA candidate
        working-directory: web
        env:
          VITE_ARCHON_RELEASE_SHA: ${{ github.sha }}
        run: npm run build
      - name: Install pinned Chromium runtime
        working-directory: web
        run: npm run browser:install
      - name: Fixture judge journey, responsive, keyboard, and Axe gates
        working-directory: web
        run: npm run test:e2e
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-browser-${{ github.sha }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Package deterministic SPA candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f web/dist/index.html
          if find web/dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "::error::Public source maps must not be present in the promoted SPA"
            exit 1
          fi
          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --directory web/dist \
            --create \
            --file - \
            . | gzip --no-name --best > "${RUNNER_TEMP}/archon-web.tar.gz"
          (
            cd "${RUNNER_TEMP}"
            sha256sum archon-web.tar.gz > archon-web.tar.gz.sha256
          )
      - name: Upload exact SPA candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-${{ github.sha }}
          path: |
            ${{ runner.temp }}/archon-web.tar.gz
            ${{ runner.temp }}/archon-web.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  infra-lock-candidate:
    name: Generate and validate reviewed lock candidates
    if: github.event_name == 'pull_request'
    needs: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.INFRA_NODE_VERSION }}
          package-manager-cache: false
      - name: Bind the generator to the exact PR head and package manager
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PR_HEAD_SHA}"
          test "$(node --version)" = "v${INFRA_NODE_VERSION}"
          test "$(npm --version)" = "10.9.8"
      - name: Verify exact parent-run lock candidate adoption
        id: parent_candidate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/verify-parent-lock-candidate-adoption.sh
      - name: Resolve all reviewed dependency policies into candidate locks
        if: steps.parent_candidate.outputs.adopted != 'true'
        id: resolve-locks
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_ENGINE_STRICT: "true"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_STRICT_SSL: "true"
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          set -euo pipefail
          lock_drift=false
          generation_root="${RUNNER_TEMP}/clean-lock-generation"
          mkdir -p \
            "${generation_root}/root" \
            "${generation_root}/infra" \
            "${generation_root}/web"
          install -m 0644 package.json "${generation_root}/root/package.json"
          install -m 0644 infra/aws/package.json \
            "${generation_root}/infra/package.json"
          install -m 0644 web/package.json \
            "${generation_root}/web/package.json"
          for directory in root infra web; do
            (
              cd "${generation_root}/${directory}"
              npm install \
                --package-lock-only \
                --no-audit \
                --no-fund
            )
          done
          if ! cmp --silent \
            "${generation_root}/root/package-lock.json" \
            package-lock.json; then
            lock_drift=true
            echo "::warning::Committed root lock differs from clean npm 10.9.8 resolution"
            diff -u \
              --label committed/package-lock.json \
              --label candidate/package-lock.json \
              package-lock.json \
              "${generation_root}/root/package-lock.json" || true
          fi
          if ! cmp --silent \
            "${generation_root}/infra/package-lock.json" \
            infra/aws/package-lock.json; then
            lock_drift=true
            echo "::warning::Committed infrastructure lock differs from clean npm 10.9.8 resolution"
            diff -u \
              --label committed/infra/aws/package-lock.json \
              --label candidate/infra/aws/package-lock.json \
              infra/aws/package-lock.json \
              "${generation_root}/infra/package-lock.json" || true
          fi
          if ! cmp --silent \
            "${generation_root}/web/package-lock.json" \
            web/package-lock.json; then
            lock_drift=true
            echo "::warning::Committed web lock differs from clean npm 10.9.8 resolution"
            diff -u \
              --label committed/web/package-lock.json \
              --label candidate/web/package-lock.json \
              web/package-lock.json \
              "${generation_root}/web/package-lock.json" || true
          fi
          install -m 0644 \
            "${generation_root}/root/package-lock.json" \
            package-lock.json
          install -m 0644 \
            "${generation_root}/infra/package-lock.json" \
            infra/aws/package-lock.json
          install -m 0644 \
            "${generation_root}/web/package-lock.json" \
            web/package-lock.json
          printf 'drift=%s\n' "${lock_drift}" >>"${GITHUB_OUTPUT}"
      - name: Seal candidate provenance before validation
        if: steps.parent_candidate.outputs.adopted != 'true'
        id: sealed_candidates
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          candidate_dir="${RUNNER_TEMP}/lock-candidates"
          mkdir -p "${candidate_dir}"
          install -m 0644 package-lock.json \
            "${candidate_dir}/root-package-lock.json"
          install -m 0644 infra/aws/package-lock.json \
            "${candidate_dir}/infra-package-lock.json"
          install -m 0644 web/package-lock.json \
            "${candidate_dir}/web-package-lock.json"

          checkout_sha="$(git rev-parse HEAD)"
          test "${checkout_sha}" = "${PR_HEAD_SHA}"
          root_manifest_sha="$(sha256sum package.json | cut -d' ' -f1)"
          root_lock_sha="$(sha256sum package-lock.json | cut -d' ' -f1)"
          infra_manifest_sha="$(sha256sum infra/aws/package.json | cut -d' ' -f1)"
          infra_lock_sha="$(sha256sum infra/aws/package-lock.json | cut -d' ' -f1)"
          web_manifest_sha="$(sha256sum web/package.json | cut -d' ' -f1)"
          web_lock_sha="$(sha256sum web/package-lock.json | cut -d' ' -f1)"
          jq -nS \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg checkoutSha "${checkout_sha}" \
            --arg headRepository "${PR_HEAD_REPOSITORY}" \
            --arg headSha "${PR_HEAD_SHA}" \
            --arg baseSha "${PR_BASE_SHA}" \
            --arg eventSha "${EVENT_SHA}" \
            --arg pullRequestNumber "${PR_NUMBER}" \
            --arg workflowRef "${WORKFLOW_REF}" \
            --arg workflowSha "${WORKFLOW_SHA}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg nodeVersion "$(node --version)" \
            --arg npmVersion "$(npm --version)" \
            --arg rootManifestSha256 "${root_manifest_sha}" \
            --arg rootLockSha256 "${root_lock_sha}" \
            --arg infraManifestSha256 "${infra_manifest_sha}" \
            --arg infraLockSha256 "${infra_lock_sha}" \
            --arg webManifestSha256 "${web_manifest_sha}" \
            --arg webLockSha256 "${web_lock_sha}" \
            '{
              schemaVersion: 1,
              repository: $repository,
              source: {
                checkoutSha: $checkoutSha,
                headRepository: $headRepository,
                pullRequestHeadSha: $headSha,
                pullRequestBaseSha: $baseSha,
                pullRequestNumber: $pullRequestNumber,
                eventMergeSha: $eventSha,
                workflowRef: $workflowRef,
                workflowSha: $workflowSha
              },
              generator: {
                runId: $runId,
                runAttempt: $runAttempt,
                nodeVersion: $nodeVersion,
                npmVersion: $npmVersion
              },
              candidates: {
                root: {
                  packageJsonSha256: $rootManifestSha256,
                  lockFile: "root-package-lock.json",
                  lockSha256: $rootLockSha256
                },
                infrastructure: {
                  packageJsonSha256: $infraManifestSha256,
                  lockFile: "infra-package-lock.json",
                  lockSha256: $infraLockSha256
                },
                web: {
                  packageJsonSha256: $webManifestSha256,
                  lockFile: "web-package-lock.json",
                  lockSha256: $webLockSha256
                }
              }
            }' >"${candidate_dir}/provenance.json"
          (
            cd "${candidate_dir}"
            sha256sum \
              infra-package-lock.json \
              provenance.json \
              root-package-lock.json \
              web-package-lock.json >SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          candidate_set_digest="$(
            bash scripts/compute-lock-candidate-set-digest.sh
          )"
          candidate_inventory_sha256="$(
            sha256sum "${candidate_dir}/SHA256SUMS" | cut -d' ' -f1
          )"
          [[ "${candidate_set_digest}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${candidate_inventory_sha256}" =~ ^[0-9a-f]{64}$ ]]
          {
            printf 'candidate_set_digest=%s\n' "${candidate_set_digest}"
            printf 'candidate_inventory_sha256=%s\n' \
              "${candidate_inventory_sha256}"
          } >>"${GITHUB_OUTPUT}"
      - name: Validate the root candidate exactly
        if: steps.parent_candidate.outputs.adopted != 'true'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/verify-exact-npm-overrides.mjs .
          npm run typecheck
          npm run build
          npm test
          npm run coverage
          bash "${GITHUB_WORKSPACE}/scripts/npm-audit-retry.sh" \
            --audit-level=moderate
      - name: Validate the infrastructure candidate exactly
        if: steps.parent_candidate.outputs.adopted != 'true'
        run: |
          set -euo pipefail
          npm --prefix infra/aws ci --ignore-scripts
          node scripts/verify-exact-npm-overrides.mjs infra/aws
          bash scripts/patch-cdk-brace-expansion.sh infra/aws
          npm --prefix infra/aws run build
          npm --prefix infra/aws test -- --ci --coverage
          bash scripts/verify-cdk-npm-audit-compensation.sh infra/aws
      - name: Validate the web candidate exactly
        if: steps.parent_candidate.outputs.adopted != 'true'
        working-directory: web
        env:
          VITE_ARCHON_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          npm run typecheck:e2e
          npm test
          npm run test:coverage
          npm run coverage:critical
          npm run build
          bash "${GITHUB_WORKSPACE}/scripts/npm-audit-retry.sh" \
            --audit-level=moderate
      - name: Mark the exact candidates as remotely validated
        if: steps.parent_candidate.outputs.adopted != 'true'
        id: validated_candidates
        env:
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SEALED_CANDIDATE_INVENTORY_SHA256: ${{ steps.sealed_candidates.outputs.candidate_inventory_sha256 }}
          SEALED_CANDIDATE_SET_DIGEST: ${{ steps.sealed_candidates.outputs.candidate_set_digest }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          candidate_dir="${RUNNER_TEMP}/lock-candidates"
          checkout_sha="$(git rev-parse HEAD)"
          test "${checkout_sha}" = "${PR_HEAD_SHA}"
          [[ "${SEALED_CANDIDATE_SET_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${SEALED_CANDIDATE_INVENTORY_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "$(bash scripts/compute-lock-candidate-set-digest.sh)" = \
            "${SEALED_CANDIDATE_SET_DIGEST}"
          test "$(
            sha256sum "${candidate_dir}/SHA256SUMS" | cut -d' ' -f1
          )" = "${SEALED_CANDIDATE_INVENTORY_SHA256}"
          (
            cd "${candidate_dir}"
            sha256sum --check --strict SHA256SUMS
          )
          cmp --silent \
            "${candidate_dir}/root-package-lock.json" \
            package-lock.json
          cmp --silent \
            "${candidate_dir}/infra-package-lock.json" \
            infra/aws/package-lock.json
          cmp --silent \
            "${candidate_dir}/web-package-lock.json" \
            web/package-lock.json
          root_lock_sha="$(sha256sum package-lock.json | cut -d' ' -f1)"
          infra_lock_sha="$(
            sha256sum infra/aws/package-lock.json | cut -d' ' -f1
          )"
          web_lock_sha="$(sha256sum web/package-lock.json | cut -d' ' -f1)"
          test "$(
            sha256sum "${candidate_dir}/root-package-lock.json" |
              cut -d' ' -f1
          )" = "${root_lock_sha}"
          test "$(
            sha256sum "${candidate_dir}/infra-package-lock.json" |
              cut -d' ' -f1
          )" = "${infra_lock_sha}"
          test "$(
            sha256sum "${candidate_dir}/web-package-lock.json" |
              cut -d' ' -f1
          )" = "${web_lock_sha}"
          jq --exit-status \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg baseSha "${PR_BASE_SHA}" \
            --arg eventSha "${EVENT_SHA}" \
            --arg headRepository "${PR_HEAD_REPOSITORY}" \
            --arg headSha "${checkout_sha}" \
            --arg pullRequestNumber "${PR_NUMBER}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg workflowRef "${WORKFLOW_REF}" \
            --arg workflowSha "${WORKFLOW_SHA}" \
            --arg rootManifestSha256 "$(sha256sum package.json | cut -d' ' -f1)" \
            --arg rootLockSha256 "${root_lock_sha}" \
            --arg infraManifestSha256 "$(sha256sum infra/aws/package.json | cut -d' ' -f1)" \
            --arg infraLockSha256 "${infra_lock_sha}" \
            --arg webManifestSha256 "$(sha256sum web/package.json | cut -d' ' -f1)" \
            --arg webLockSha256 "${web_lock_sha}" \
            '
              .schemaVersion == 1 and
              .repository == $repository and
              .source.checkoutSha == $headSha and
              .source.headRepository == $headRepository and
              .source.pullRequestHeadSha == $headSha and
              .source.pullRequestBaseSha == $baseSha and
              .source.pullRequestNumber == $pullRequestNumber and
              .source.eventMergeSha == $eventSha and
              .source.workflowRef == $workflowRef and
              .source.workflowSha == $workflowSha and
              .generator.runId == $runId and
              .generator.runAttempt == $runAttempt and
              .generator.nodeVersion == "v22.23.1" and
              .generator.npmVersion == "10.9.8" and
              .candidates.root.packageJsonSha256 == $rootManifestSha256 and
              .candidates.root.lockFile == "root-package-lock.json" and
              .candidates.root.lockSha256 == $rootLockSha256 and
              .candidates.infrastructure.packageJsonSha256 == $infraManifestSha256 and
              .candidates.infrastructure.lockFile == "infra-package-lock.json" and
              .candidates.infrastructure.lockSha256 == $infraLockSha256 and
              .candidates.web.packageJsonSha256 == $webManifestSha256 and
              .candidates.web.lockFile == "web-package-lock.json" and
              .candidates.web.lockSha256 == $webLockSha256
            ' "${candidate_dir}/provenance.json" >/dev/null
          jq -nS \
            --arg baseSha "${PR_BASE_SHA}" \
            --arg headSha "${checkout_sha}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg candidateSetDigest "${SEALED_CANDIDATE_SET_DIGEST}" \
            --arg sealedInventorySha256 "${SEALED_CANDIDATE_INVENTORY_SHA256}" \
            '{
              schemaVersion: 1,
              result: "root-infrastructure-and-web-candidates-validated",
              baseSha: $baseSha,
              headSha: $headSha,
              runId: $runId,
              runAttempt: $runAttempt,
              candidateSetDigest: $candidateSetDigest,
              sealedInventorySha256: $sealedInventorySha256,
              gates: [
                "root-typecheck-build-test-coverage-sca",
                "infra-typecheck-test-coverage-exact-compensated-sca",
                "web-typecheck-test-coverage-build-sca"
              ]
            }' >"${candidate_dir}/validation.json"
          (
            cd "${candidate_dir}"
            sha256sum validation.json >>SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          candidate_set_digest="$(
            jq -er '.candidateSetDigest' "${candidate_dir}/validation.json"
          )"
          test "${candidate_set_digest}" = "${SEALED_CANDIDATE_SET_DIGEST}"
      - name: Upload short-lived, source-bound validated lock candidates
        if: steps.parent_candidate.outputs.adopted != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-lock-candidates-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}-${{ steps.sealed_candidates.outputs.candidate_set_digest }}
          path: ${{ runner.temp }}/lock-candidates/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Require adoption of the remotely validated lock candidates
        if: steps.parent_candidate.outputs.adopted != 'true' && steps.resolve-locks.outputs.drift == 'true'
        run: |
          echo "::error::Committed locks differ from the remotely validated npm 10.9.8 candidates"
          exit 1

  infra:
    name: AWS CDK build, test, synth, IaC gate
    needs: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CDK_DEFAULT_ACCOUNT: "111111111111"
      AWS_REGION: eu-west-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.INFRA_NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            infra/aws/package-lock.json
            infra/aws/lambda/approval/package-lock.json
            infra/aws/lambda/control/package-lock.json
      - name: Install locked infrastructure dependencies
        working-directory: infra/aws
        run: npm ci --ignore-scripts
      - name: Verify every exact infrastructure override
        run: node scripts/verify-exact-npm-overrides.mjs infra/aws
      - name: Repair the exact vulnerable CDK bundled dependency
        run: bash scripts/patch-cdk-brace-expansion.sh infra/aws
      - name: Seal the exact CDK bootstrap templates without AWS access
        env:
          EXPECTED_BOOTSTRAP_VERSION: "32"
        run: bash scripts/seal-cdk-bootstrap-templates.sh
      - name: Render the exact inline-safe IAM foundation template
        run: |
          bash scripts/render-inline-cloudformation-template.sh \
            infra/aws/foundation/cdk-execution-policy.yml \
            "${RUNNER_TEMP}/archon-cdk-execution-policy.yaml" \
            "${RUNNER_TEMP}/archon-cdk-execution-policy.canonical.json"
      - name: Package locked approval Lambda dependencies
        working-directory: infra/aws/lambda/approval
        run: npm ci --omit=dev --ignore-scripts
      - name: Package locked control Lambda dependencies
        working-directory: infra/aws/lambda/control
        run: npm ci --omit=dev --ignore-scripts
      - name: Typecheck CDK and Lambda contract tests
        working-directory: infra/aws
        run: npm run build
      - name: Validate packaged Lambda entry points
        working-directory: infra/aws
        run: |
          node --check lambda/approval/index.js
          node -e "require('./lambda/approval/index.js')"
          node --check lambda/approval/handoff.js
          node -e "require('./lambda/approval/handoff.js')"
          node --check lambda/control/index.js
          node -e "require('./lambda/control/index.js')"
      - name: CDK assertion tests and coverage gate
        working-directory: infra/aws
        run: npm test -- --ci --coverage
      - name: Infrastructure SCA gate
        run: bash scripts/verify-cdk-npm-audit-compensation.sh infra/aws
      - name: Retain exact CDK dependency-compensation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdk-dependency-compensation-${{ github.sha }}
          path: ${{ runner.temp }}/cdk-brace-expansion-compensation/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Approval Lambda SCA gate
        working-directory: infra/aws/lambda/approval
        run: >-
          bash "${GITHUB_WORKSPACE}/scripts/npm-audit-retry.sh"
          --omit=dev
          --audit-level=moderate
      - name: Control Lambda SCA gate
        working-directory: infra/aws/lambda/control
        run: >-
          bash "${GITHUB_WORKSPACE}/scripts/npm-audit-retry.sh"
          --omit=dev
          --audit-level=moderate
      - name: Package deterministic Lambda release candidate
        shell: bash
        run: |
          set -euo pipefail
          for directory in \
            infra/aws/lambda/approval \
            infra/aws/lambda/control; do
            test -f "${directory}/package.json"
            test -f "${directory}/package-lock.json"
            test -d "${directory}/node_modules"
            if find "${directory}" \
              \( ! -type f -a ! -type d \) -print -quit | grep -q .; then
              echo "::error::Lambda release inputs may contain only regular files and directories"
              exit 1
            fi
          done
          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --directory infra/aws/lambda \
            --create \
            --file - \
            approval control |
            gzip --no-name --best >"${RUNNER_TEMP}/archon-lambdas.tar.gz"
          (
            cd "${RUNNER_TEMP}"
            sha256sum archon-lambdas.tar.gz >archon-lambdas.tar.gz.sha256
          )
      - name: Upload exact Lambda release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambdas-${{ github.sha }}
          path: |
            ${{ runner.temp }}/archon-lambdas.tar.gz
            ${{ runner.temp }}/archon-lambdas.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Synthesize staging and production CloudFormation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cdk.out"
          for stage in staging production; do
            (
              cd infra/aws
              npm run synth -- \
                --no-lookups \
                --output "${RUNNER_TEMP}/cdk.out/${stage}" \
                --context "stage=${stage}"
            )
          done
      - name: Validate both synthesized assemblies
        shell: bash
        run: |
          set -euo pipefail
          for stage in staging production; do
            assembly="${RUNNER_TEMP}/cdk.out/${stage}"
            test -f "${assembly}/manifest.json"
            mapfile -d '' templates < <(
              find "${assembly}" -maxdepth 1 -name '*.template.json' -print0
            )
            case "${stage}" in
              staging) expected_template_count=3 ;;
              production) expected_template_count=2 ;;
              *) exit 1 ;;
            esac
            test "${#templates[@]}" -eq "${expected_template_count}"
            for template in "${templates[@]}"; do
              jq --exit-status \
                'type == "object" and (.Resources | type == "object")' \
                "${template}" >/dev/null
            done
          done
      - name: Prove runtime permissions boundaries cover only synthesized role actions
        shell: bash
        run: |
          set -euo pipefail
          for stage in staging production; do
            node scripts/verify-aws-runtime-boundary.mjs \
              --contract contracts/aws-foundation-v1.json \
              --stage "${stage}" \
              --templates "${RUNNER_TEMP}/cdk.out/${stage}"
          done
      - name: Install checksum-pinned CloudFormation Guard
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/cfn-guard.tar.gz"
          tool_dir="${RUNNER_TEMP}/cfn-guard"
          mkdir -p "${tool_dir}"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/aws-cloudformation/cloudformation-guard/releases/download/${CFN_GUARD_VERSION}/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz"
          echo "${CFN_GUARD_ARCHIVE_SHA256}  ${archive}" |
            sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${tool_dir}"
          guard_bin="$(find "${tool_dir}" -type f -name cfn-guard -print -quit)"
          test -n "${guard_bin}"
          chmod 0755 "${guard_bin}"
          "${guard_bin}" --version
          echo "bin=${guard_bin}" >>"${GITHUB_OUTPUT}"
      - name: Unit-test project-owned IaC security policy
        env:
          GUARD_BIN: ${{ steps.guard.outputs.bin }}
        run: |
          set -euo pipefail
          "${GUARD_BIN}" test \
            --verbose \
            --rules-file infra/aws/policy/archon.guard \
            --test-data infra/aws/policy/archon_tests.yaml
      - name: Enforce preventive controls on synthesized templates
        env:
          GUARD_BIN: ${{ steps.guard.outputs.bin }}
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/cfn-guard-results.txt"
          : >"${report}"
          for stage in staging production; do
            for template in "${RUNNER_TEMP}"/cdk.out/"${stage}"/*.template.json; do
              "${GUARD_BIN}" validate \
                --data "${template}" \
                --rules infra/aws/policy/archon.guard \
                --type CFNTemplate \
                --show-summary all |
                tee --append "${report}"
            done
          done
      - name: Scan synthesized IaC
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ runner.temp }}/cdk.out
          format: sarif
          output: ${{ runner.temp }}/trivy-iac.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          hide-progress: true
          version: v0.72.0
      - name: Retain partial synth and Guard failure evidence
        if: always() && steps.trivy.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-partial-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cdk.out/**/*.template.json
            ${{ runner.temp }}/cdk.out/**/manifest.json
            ${{ runner.temp }}/cdk.out/**/tree.json
            ${{ runner.temp }}/cfn-guard-results.txt
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
      - name: Retain synthesized IaC and scan evidence
        if: always() && steps.trivy.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cdk.out/**/*.template.json
            ${{ runner.temp }}/cdk.out/**/manifest.json
            ${{ runner.temp }}/cdk.out/**/tree.json
            ${{ runner.temp }}/cfn-guard-results.txt
            ${{ runner.temp }}/trivy-iac.sarif
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Fail on any IaC finding or malformed scan evidence
        shell: bash
        run: |
          set -euo pipefail
          jq --exit-status \
            '
              .version == "2.1.0" and
              (.runs | type == "array" and length > 0) and
              all(
                .runs[];
                (.tool.driver.name | ascii_downcase | contains("trivy")) and
                (.results | type == "array")
              ) and
              ([.runs[].results[]] | length) == 0
            ' \
            "${RUNNER_TEMP}/trivy-iac.sarif" >/dev/null

  publish-infra-sarif:
    name: Publish trusted default-branch IaC SARIF
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    needs: infra
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download the exact successful IaC evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: infra-${{ github.sha }}
          path: ${{ runner.temp }}/infra-evidence
      - name: Revalidate zero-finding SARIF before publication
        run: |
          set -euo pipefail
          sarif="${RUNNER_TEMP}/infra-evidence/trivy-iac.sarif"
          test -f "${sarif}"
          test ! -L "${sarif}"
          test "$(find "${RUNNER_TEMP}/infra-evidence" \
            -name trivy-iac.sarif -type f | wc -l)" = "1"
          jq --exit-status \
            '
              .version == "2.1.0" and
              (.runs | type == "array" and length > 0) and
              all(
                .runs[];
                (.tool.driver.name | ascii_downcase | contains("trivy")) and
                (.results | type == "array")
              ) and
              ([.runs[].results[]] | length) == 0
            ' "${sarif}" >/dev/null
      - name: Upload trusted IaC SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: ${{ runner.temp }}/infra-evidence/trivy-iac.sarif
          category: trivy-aws-cdk

  readiness:
    name: Hackathon readiness
    needs: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Readiness gate
        run: npm run readiness
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readiness-${{ github.sha }}
          path: readiness.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  benchmark:
    name: DataHub capability benchmark
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_digest: sha256:${{ steps.evidence.outputs['artifact-digest'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Measure current-view boundary against retained history
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/datahub-benchmark"
          npm run benchmark:datahub -- --output "${output}"
          test -f "${output}/datahub-benchmark.json"
          test ! -L "${output}/datahub-benchmark.json"
          test -f "${output}/datahub-benchmark.md"
          test ! -L "${output}/datahub-benchmark.md"
          test "$(find "${output}" -mindepth 1 -maxdepth 1 -type f | wc -l)" = "2"
          test -z "$(find "${output}" -mindepth 1 -type l -print -quit)"
          jq --exit-status \
            --arg datasetVersion "${DATAHUB_BENCHMARK_DATASET_VERSION}" \
            --arg datasetDigest "${DATAHUB_BENCHMARK_DATASET_DIGEST}" '
            .schemaVersion == "archon.datahub-benchmark/v1" and
            .dataset.version == $datasetVersion and
            .dataset.digest == $datasetDigest and
            .dataset.cases == 7 and
            .dataset.positiveCases == 3 and
            .dataset.negativeCases == 4 and
            .systems.currentView.metrics.recall == 0 and
            .systems.currentView.metrics.precision == null and
            .systems.currentView.metrics.falsePositives == 0 and
            .systems.retainedHistory.metrics.recall == 1 and
            .systems.retainedHistory.metrics.precision == 1 and
            .systems.retainedHistory.metrics.f1 == 1 and
            .systems.retainedHistory.metrics.falsePositives == 0 and
            .controlCoverage.governanceRulesEvaluated ==
              ["G1", "G2", "G3", "G4", "G5", "G6"] and
            .controlCoverage.lineageGapFindings >= 1 and
            all(.cases[] | select(.expectedConflict == false);
              .retainedHistory.detected == false)
          ' "${output}/datahub-benchmark.json" >/dev/null
          (
            cd "${output}"
            sha256sum datahub-benchmark.json datahub-benchmark.md >SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
      - name: Upload immutable benchmark evidence
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datahub-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/datahub-benchmark/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  judge-evidence:
    name: Reproducible judge evidence
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.evidence.outputs['artifact-id'] }}
      artifact_name: judge-evidence-${{ github.sha }}-${{ github.run_attempt }}
      artifact_digest: sha256:${{ steps.evidence.outputs['artifact-digest'] }}
      producer_attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate, replay, and verify the public judge pack
        shell: bash
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/judge-evidence-a"
          replay="${RUNNER_TEMP}/judge-evidence-b"
          npm run evidence:judge:generate -- \
            --release-sha "${GITHUB_SHA}" \
            --output "${first}"
          npm run evidence:judge:generate -- \
            --release-sha "${GITHUB_SHA}" \
            --output "${replay}"
          diff --recursive --no-dereference "${first}" "${replay}"
          npm run evidence:judge:verify -- \
            --release-sha "${GITHUB_SHA}" \
            --input "${first}"
          package_version="$(jq -er '.version' package.json)"
          jq --exit-status \
            --arg release "${GITHUB_SHA}" \
            --arg toolVersion "${package_version}" '
              .source.releaseSha == $release and
              .source.toolVersion == $toolVersion
            ' "${first}/manifest.json" >/dev/null
          (
            cd "${first}"
            sha256sum --check --strict SHA256SUMS
          )
      - name: Upload only the verified judge evidence pack
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: judge-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/judge-evidence-a/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  contrib:
    name: DataHub ecosystem contribution
    needs: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      validation_receipt_digest: sha256:${{ steps.evidence.outputs['artifact-digest'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind validation to the exact source head
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          test "${actual_source_sha}" = "${EXPECTED_SOURCE_SHA}"
          test "${actual_source_sha}" = "$(
            git rev-parse "${actual_source_sha}^{commit}"
          )"
          case "${EVENT_NAME}" in
            pull_request)
              test -n "${PR_HEAD_SHA}"
              test "${actual_source_sha}" = "${PR_HEAD_SHA}"
              ;;
            push)
              test -z "${PR_HEAD_SHA}"
              ;;
            *)
              echo "::error::Unsupported contribution validation event ${EVENT_NAME}"
              exit 1
              ;;
          esac
          test -n "${EXPECTED_SOURCE_REPOSITORY}"
          {
            printf 'head_sha=%s\n' "${actual_source_sha}"
            printf 'pull_request_head_sha=%s\n' "${PR_HEAD_SHA}"
            printf 'source_repository=%s\n' "${EXPECTED_SOURCE_REPOSITORY}"
          } >>"${GITHUB_OUTPUT}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: false
      - name: Validate staged contribution contracts
        run: |
          set -euo pipefail
          npm run verify:contrib
          node --test contrib/mcp-get-aspect-history/tests/validation-receipt.test.mjs
      - name: Apply the candidate to its exact upstream revision
        id: upstream
        shell: bash
        env:
          UPSTREAM_COMMIT: 9a6946daa7d30eb481c82dd8ee5e15ae6526a3c9
          UPSTREAM_REPOSITORY: https://github.com/acryldata/mcp-server-datahub.git
        run: |
          set -euo pipefail
          upstream="${RUNNER_TEMP}/mcp-server-datahub"
          test ! -e "${upstream}"
          git init --quiet "${upstream}"
          git -C "${upstream}" remote add origin "${UPSTREAM_REPOSITORY}"
          git -C "${upstream}" fetch --quiet --depth=1 origin "${UPSTREAM_COMMIT}"
          git -C "${upstream}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${upstream}" rev-parse HEAD)" = "${UPSTREAM_COMMIT}"
          test -z "$(git -C "${upstream}" status --short)"

          install -D -m 0644 \
            contrib/mcp-get-aspect-history/upstream/src/mcp_server_datahub/tools/aspect_history.py \
            "${upstream}/src/mcp_server_datahub/tools/aspect_history.py"
          install -D -m 0644 \
            contrib/mcp-get-aspect-history/upstream/tests/test_mcp/test_get_aspect_history.py \
            "${upstream}/tests/test_mcp/test_get_aspect_history.py"
          cmp --silent \
            contrib/mcp-get-aspect-history/upstream/src/mcp_server_datahub/tools/aspect_history.py \
            "${upstream}/src/mcp_server_datahub/tools/aspect_history.py"
          cmp --silent \
            contrib/mcp-get-aspect-history/upstream/tests/test_mcp/test_get_aspect_history.py \
            "${upstream}/tests/test_mcp/test_get_aspect_history.py"
          git -C "${upstream}" apply --check \
            "${GITHUB_WORKSPACE}/contrib/mcp-get-aspect-history/integration.patch"
          git -C "${upstream}" apply \
            "${GITHUB_WORKSPACE}/contrib/mcp-get-aspect-history/integration.patch"
          git -C "${upstream}" add --intent-to-add \
            src/mcp_server_datahub/tools/aspect_history.py \
            tests/test_mcp/test_get_aspect_history.py
          git -C "${upstream}" diff --check
          test "$(
            git -C "${upstream}" status --short | wc -l
          )" = "4"
          echo "directory=${upstream}" >>"${GITHUB_OUTPUT}"
      - name: Install the exact pinned upstream environment
        shell: bash
        env:
          MANIFEST: ${{ github.workspace }}/contrib/mcp-get-aspect-history/manifest.json
          UPSTREAM_DIRECTORY: ${{ steps.upstream.outputs.directory }}
        run: |
          set -euo pipefail
          setup_command="$(jq -er '.ciEnvironment.setupCommand' "${MANIFEST}")"
          test "${setup_command}" = \
            "uv sync --frozen --all-groups --no-cache"
          cd "${UPSTREAM_DIRECTORY}"
          bash --noprofile --norc -e -u -o pipefail -c "${setup_command}"
      - name: Run every manifest-declared upstream command
        shell: bash
        env:
          MANIFEST: ${{ github.workspace }}/contrib/mcp-get-aspect-history/manifest.json
          UPSTREAM_DIRECTORY: ${{ steps.upstream.outputs.directory }}
        run: |
          set -euo pipefail
          mapfile -t command_rows < <(
            jq -er '.requiredCi[] | [.id, .command] | @tsv' "${MANIFEST}"
          )
          test "${#command_rows[@]}" -gt 0
          cd "${UPSTREAM_DIRECTORY}"
          for command_row in "${command_rows[@]}"; do
            IFS=$'\t' read -r command_id command <<<"${command_row}"
            test -n "${command_id}"
            test -n "${command}"
            echo "::group::${command_id}"
            if ! bash --noprofile --norc -e -u -o pipefail -c "${command}"; then
              echo "::endgroup::"
              echo "::error::OSS validation command ${command_id} failed"
              exit 1
            fi
            echo "::endgroup::"
          done
      - name: Seal the source-bound OSS validation receipt
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANIFEST: ${{ github.workspace }}/contrib/mcp-get-aspect-history/manifest.json
          PR_HEAD_SHA: ${{ steps.source.outputs.pull_request_head_sha }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_REPOSITORY: ${{ steps.source.outputs.source_repository }}
          UPSTREAM_COMMIT: 9a6946daa7d30eb481c82dd8ee5e15ae6526a3c9
          UPSTREAM_DIRECTORY: ${{ steps.upstream.outputs.directory }}
          UPSTREAM_REPOSITORY: https://github.com/acryldata/mcp-server-datahub
        run: |
          set -euo pipefail
          receipt_directory="${RUNNER_TEMP}/oss-validation-receipt"
          test ! -e "${receipt_directory}"
          mkdir -p "${receipt_directory}"

          cmp --silent \
            contrib/mcp-get-aspect-history/upstream/src/mcp_server_datahub/tools/aspect_history.py \
            "${UPSTREAM_DIRECTORY}/src/mcp_server_datahub/tools/aspect_history.py"
          cmp --silent \
            contrib/mcp-get-aspect-history/upstream/tests/test_mcp/test_get_aspect_history.py \
            "${UPSTREAM_DIRECTORY}/tests/test_mcp/test_get_aspect_history.py"
          actual_paths="$(
            git -C "${UPSTREAM_DIRECTORY}" diff \
              --name-only \
              --no-ext-diff \
              HEAD -- |
              LC_ALL=C sort
          )"
          expected_paths="$(
            printf '%s\n' \
              src/mcp_server_datahub/mcp_server.py \
              src/mcp_server_datahub/tools/__init__.py \
              src/mcp_server_datahub/tools/aspect_history.py \
              tests/test_mcp/test_get_aspect_history.py
          )"
          test "${actual_paths}" = "${expected_paths}"
          LC_ALL=C git -C "${UPSTREAM_DIRECTORY}" --no-pager diff \
            --binary \
            --full-index \
            --no-color \
            --no-ext-diff \
            --src-prefix=a/ \
            --dst-prefix=b/ \
            HEAD -- \
            src/mcp_server_datahub/mcp_server.py \
            src/mcp_server_datahub/tools/__init__.py \
            src/mcp_server_datahub/tools/aspect_history.py \
            tests/test_mcp/test_get_aspect_history.py \
            >"${receipt_directory}/applied.diff"
          test -s "${receipt_directory}/applied.diff"

          node \
            contrib/mcp-get-aspect-history/scripts/render-validation-receipt.mjs \
            --manifest "${MANIFEST}" \
            --applied-diff "${receipt_directory}/applied.diff" \
            --event-name "${EVENT_NAME}" \
            --source-repository "${SOURCE_REPOSITORY}" \
            --source-head-sha "${SOURCE_HEAD_SHA}" \
            --pull-request-head-sha "${PR_HEAD_SHA}" \
            --output "${receipt_directory}/receipt.json"
          install -m 0644 "${MANIFEST}" \
            "${receipt_directory}/manifest.json"
          chmod 0644 \
            "${receipt_directory}/applied.diff" \
            "${receipt_directory}/receipt.json"

          jq --exit-status \
            --arg eventName "${EVENT_NAME}" \
            --arg pullRequestHeadSha "${PR_HEAD_SHA}" \
            --arg sourceHeadSha "${SOURCE_HEAD_SHA}" \
            --arg sourceRepository "${SOURCE_REPOSITORY}" \
            --arg upstreamCommit "${UPSTREAM_COMMIT}" \
            --arg upstreamRepository "${UPSTREAM_REPOSITORY}" '
              .schemaVersion == "archon.oss-validation-receipt/v1" and
              .source.eventName == $eventName and
              .source.headSha == $sourceHeadSha and
              .source.repository == $sourceRepository and
              .source.pullRequestHeadSha ==
                (if $pullRequestHeadSha == "" then null
                 else $pullRequestHeadSha end) and
              .target.baseCommit == $upstreamCommit and
              .target.repository == $upstreamRepository and
              .dataHandling.credentialsIncluded == false and
              (.candidate.files | length) == 2 and
              all(.candidate.files[];
                .sha256 | test("^[0-9a-f]{64}$")) and
              (.candidate.integrationPatch.sha256 |
                test("^[0-9a-f]{64}$")) and
              (.candidate.appliedDiff.sha256 |
                test("^[0-9a-f]{64}$")) and
              (.candidate.manifest.sha256 |
                test("^[0-9a-f]{64}$")) and
              .validation.result == "pass" and
              all(.validation.commands[]; .result == "pass")
            ' "${receipt_directory}/receipt.json" >/dev/null
          (
            cd "${receipt_directory}"
            sha256sum \
              applied.diff \
              manifest.json \
              receipt.json >SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          test "$(
            find "${receipt_directory}" \
              -mindepth 1 \
              -maxdepth 1 \
              -type f |
              wc -l
          )" = "4"
          test -z "$(
            find "${receipt_directory}" \
              -mindepth 1 \
              -type l \
              -print \
              -quit
          )"
      - name: Upload immutable OSS validation receipt
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-validation-receipt-${{ steps.source.outputs.head_sha }}
          path: ${{ runner.temp }}/oss-validation-receipt/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  security:
    name: Security and dependencies
    needs: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify every exact npm override
        run: node scripts/verify-exact-npm-overrides.mjs .
      - name: Application-security suite
        run: npm run test:security
      - name: SCA gate
        run: >-
          bash "${GITHUB_WORKSPACE}/scripts/npm-audit-retry.sh"
          --audit-level=moderate

  mcp-dependency:
    name: Locked DataHub MCP SCA and SBOM
    needs: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_digest: sha256:${{ steps.evidence.outputs['artifact-digest'] }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce the OpenVEX renewal horizon
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/materialize-datahub-mcp-lock.sh \
            --openvex-maintenance-only \
            --minimum-remaining-days 14
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: .github/locks/datahub-mcp-v0.6.0.json
      - name: Verify upstream and derive the wheel-only runtime lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/materialize-datahub-mcp-lock.sh
          project="${RUNNER_TEMP}/datahub-mcp-v0.6.0"
          ARCHON_ALLOW_UNSEALED_RESOLVED_LOCK=true \
            bash scripts/materialize-datahub-mcp-lock.sh "${project}"
          test -x "${project}/.venv/bin/mcp-server-datahub"
          PYTHONDONTWRITEBYTECODE=1 \
            "${project}/.venv/bin/python" scripts/datahub-demo-state.py \
              validate-runtime \
              --contract contracts/datahub-demo-state-v1.json
          binding="${project}/.archon-evidence/resolved-lock-binding.json"
          observed="$(jq -er '.observedResolvedLockSha256' "${binding}")"
          expected="$(jq -er '.expectedResolvedLockSha256' "${binding}")"
          {
            echo "project=${project}"
            echo "resolved_lock_sha=${observed}"
            echo "expected_resolved_lock_sha=${expected}"
          } >>"${GITHUB_OUTPUT}"
          echo "::notice title=DataHub MCP resolved lock::Observed SHA-256 ${observed}"
          {
            echo "### DataHub MCP deterministic resolution"
            echo
            echo "- Upstream lock: retained and byte-verified"
            echo "- Runtime graph: full upgrade, fixed cutoff, wheel-only"
            echo "- Observed resolved lock SHA-256: \`${observed}\`"
            echo "- Contract resolved lock SHA-256: \`${expected}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
      - name: Validate governed-canary fixture proposals in the locked SDK
        env:
          FIXTURE_RUNTIME: ${{ steps.lock.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          validation="${RUNNER_TEMP}/fixture-runtime-validation-ci.json"
          canonical="${RUNNER_TEMP}/fixture-runtime-validation-ci.canonical.json"
          test ! -e "${validation}"
          test ! -e "${canonical}"
          trap 'rm -f -- "${validation}" "${canonical}"' EXIT
          if ! env -i \
              PYTHONDONTWRITEBYTECODE=1 \
              "${FIXTURE_RUNTIME}/.venv/bin/python" \
              scripts/datahub-canary-fixture.py validate-runtime \
              --contract contracts/datahub-canary-fixture-v1.json \
              >"${validation}" 2>/dev/null; then
            echo "::error::credentialless fixture runtime validation failed"
            exit 1
          fi
          test -f "${validation}"
          test ! -L "${validation}"
          test "$(stat --format=%s "${validation}")" -le 1024
          expected_contract_sha256="$(
            jq -cS . contracts/datahub-canary-fixture-v1.json |
              sha256sum |
              awk '{print $1}'
          )"
          jq -e \
            --arg contractSha256 "${expected_contract_sha256}" '
              (keys | sort) == [
                "proposalCount",
                "proposalSetSha256",
                "schemaVersion",
                "stateContractSha256"
              ] and
              .schemaVersion ==
                "archon.datahub-canary-fixture-runtime-validation/v1" and
              .proposalCount == 6 and
              .stateContractSha256 == $contractSha256 and
              (.stateContractSha256 | test("^[0-9a-f]{64}$")) and
              (.proposalSetSha256 | test("^[0-9a-f]{64}$"))
            ' "${validation}" >/dev/null
          jq -cS . "${validation}" >"${canonical}"
          cmp --silent "${validation}" "${canonical}"
      - name: Exercise the credentialless read-only MCP protocol
        shell: bash
        env:
          MCP_PROJECT: ${{ steps.lock.outputs.project }}
        run: |
          set -euo pipefail
          server="${MCP_PROJECT}/.venv/bin/mcp-server-datahub"
          smoke="${MCP_PROJECT}/.archon-evidence/runtime-smoke.json"
          test -x "${server}"
          test "$("${server}" --version)" = \
            "mcp-server-datahub, version 0.6.0"
          test ! -e "${smoke}"
          timeout 60 \
            "${MCP_PROJECT}/.venv/bin/python" \
            scripts/smoke-datahub-mcp-runtime.py \
            --server "${server}" \
            --output "${smoke}" \
            --timeout-seconds 45
          jq --exit-status '
            .schemaVersion == "archon.datahub-mcp-runtime-smoke/v1" and
            .protocol == "mcp-stdio" and
            .packageVersion == "0.6.0" and
            (.fastMcpVersion | test("^[0-9]+\\.[0-9]+\\.[0-9]+")) and
            .serverInfoVersion == .fastMcpVersion and
            .initialized == true and
            .pinged == true and
            .credentialsUsed == false and
            .networkToolCalls == 0 and
            .loopbackConfigRequests == 1 and
            .unexpectedHttpRequests == 0 and
            .readOnlyHints == true and
            .tools == [
              "get_dataset_queries",
              "get_entities",
              "get_lineage",
              "get_lineage_paths_between",
              "list_schema_fields",
              "search"
            ] and
            (.stderrBytes | type == "number" and . >= 0) and
            (.stderrSha256 | test("^[0-9a-f]{64}$"))
          ' "${smoke}" >/dev/null
      - name: Audit the exact resolved MCP dependency closure
        id: audit
        shell: bash
        env:
          MCP_PROJECT: ${{ steps.lock.outputs.project }}
        run: |
          set -euo pipefail
          sarif="${RUNNER_TEMP}/datahub-mcp-audit.raw.sarif"
          set +e
          uv audit \
            --project "${MCP_PROJECT}" \
            --frozen \
            --no-dev \
            --no-build \
            --no-cache \
            --python-version "$(
              jq -er '.runtime.pythonVersion' \
                .github/locks/datahub-mcp-v0.6.0.json
            )" \
            --python-platform linux \
            --output-format sarif >"${sarif}"
          status=$?
          set -e
          echo "status=${status}" >>"${GITHUB_OUTPUT}"
          test -s "${sarif}"
      - name: Export the frozen CycloneDX dependency inventory
        shell: bash
        env:
          MCP_PROJECT: ${{ steps.lock.outputs.project }}
        run: |
          set -euo pipefail
          uv export \
            --project "${MCP_PROJECT}" \
            --frozen \
            --no-dev \
            --format cyclonedx1.5 \
            --output-file "${RUNNER_TEMP}/datahub-mcp.cdx.json"
          uv pip list \
            --python "${MCP_PROJECT}/.venv/bin/python" \
            --format json >"${RUNNER_TEMP}/datahub-mcp-installed.json"
          jq --exit-status '
            .bomFormat == "CycloneDX" and
            .specVersion == "1.5" and
            (.components | type == "array" and length > 10) and
            any(.components[];
              .name == "mcp-server-datahub" and
              .version == "0.6.0"
            ) and
            any(.components[];
              .name == "acryl-datahub" and
              .version == "1.6.0.15"
            ) and
            any(.components[];
              .name == "setuptools" and
              .version == "81.0.0"
            )
          ' "${RUNNER_TEMP}/datahub-mcp.cdx.json" >/dev/null
          jq --exit-status '
            (type == "array" and length > 10) and
            any(.[];
              .name == "mcp-server-datahub" and
              .version == "0.6.0"
            ) and
            any(.[];
              .name == "acryl-datahub" and
              .version == "1.6.0.15"
            ) and
            any(.[];
              .name == "setuptools" and
              .version == "81.0.0"
            )
          ' "${RUNNER_TEMP}/datahub-mcp-installed.json" >/dev/null
      - name: Bind MCP lock, audit, and SBOM evidence
        id: bind
        shell: bash
        env:
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
          EXPECTED_RESOLVED_LOCK_SHA: ${{ steps.lock.outputs.expected_resolved_lock_sha }}
          MCP_PROJECT: ${{ steps.lock.outputs.project }}
          OBSERVED_RESOLVED_LOCK_SHA: ${{ steps.lock.outputs.resolved_lock_sha }}
        run: |
          set -euo pipefail
          raw_audit="${RUNNER_TEMP}/datahub-mcp-audit.raw.sarif"
          actionable_audit="${RUNNER_TEMP}/datahub-mcp-audit.actionable.sarif"
          sbom="${RUNNER_TEMP}/datahub-mcp.cdx.json"
          installed="${RUNNER_TEMP}/datahub-mcp-installed.json"
          runtime_smoke="${MCP_PROJECT}/.archon-evidence/runtime-smoke.json"
          contract=".github/locks/datahub-mcp-v0.6.0.json"
          evidence_dir="${RUNNER_TEMP}/datahub-mcp-security"
          mkdir -p "${evidence_dir}"
          cp "${raw_audit}" "${actionable_audit}"
          cp "${contract}" "${evidence_dir}/lock-contract.json"
          cp "${MCP_PROJECT}/.archon-evidence/openvex.json" \
            "${evidence_dir}/openvex.json"
          cp "${MCP_PROJECT}/.archon-evidence/pypi-provenance.json" \
            "${evidence_dir}/pypi-provenance.json"
          cp "${MCP_PROJECT}/.archon-evidence/upstream-pyproject.toml" \
            "${evidence_dir}/upstream-pyproject.toml"
          cp "${MCP_PROJECT}/.archon-evidence/upstream-uv.lock" \
            "${evidence_dir}/upstream-uv.lock"
          cp "${MCP_PROJECT}/.archon-evidence/resolved-uv.lock" \
            "${evidence_dir}/resolved-uv.lock"
          cp "${MCP_PROJECT}/.archon-evidence/resolved-pyproject.toml" \
            "${evidence_dir}/resolved-pyproject.toml"
          cp "${MCP_PROJECT}/.archon-evidence/project-overlay.json" \
            "${evidence_dir}/project-overlay.json"
          cp "${MCP_PROJECT}/.archon-evidence/wheel-only-graph.json" \
            "${evidence_dir}/wheel-only-graph.json"
          cp "${MCP_PROJECT}/.archon-evidence/resolved-lock-binding.json" \
            "${evidence_dir}/resolved-lock-binding.json"
          cp "${raw_audit}" "${evidence_dir}/audit.raw.sarif"
          cp "${installed}" "${evidence_dir}/installed-packages.json"
          cp "${runtime_smoke}" "${evidence_dir}/runtime-smoke.json"
          cp "${sbom}" "${evidence_dir}/sbom.cdx.json"
          python3 scripts/validate-datahub-mcp-audit.py --self-test
          python3 scripts/validate-datahub-mcp-audit.py \
            --contract "${contract}" \
            --vex "${evidence_dir}/openvex.json" \
            --sarif "${raw_audit}" \
            --installed "${installed}" \
            --wheel-graph \
              "${MCP_PROJECT}/.archon-evidence/wheel-only-graph.json" \
            --runtime-smoke "${runtime_smoke}" \
            --audit-exit "${AUDIT_STATUS}" \
            --actionable-sarif "${actionable_audit}" \
            --disposition-receipt \
              "${evidence_dir}/audit-disposition.json"
          jq --exit-status '
              .schemaVersion ==
                "archon.datahub-mcp-audit-disposition/v1" and
              .decision == "approved" and
              .scanner == {
                name: "uv",
                version: "0.11.31",
                exitCode: 1
              } and
              .policy.canonicalId == "CVE-2026-59890" and
              .policy.scannerRuleIds == [
                "GHSA-h35f-9h28-mq5c",
                "PYSEC-2026-3447"
              ] and
              .policy.status == "not_affected" and
              .findings == {
                raw: 2,
                approved: 2,
                unapproved: 0,
                actionable: 0
              } and
              .runtimeSmoke.protocol == "mcp-stdio" and
              .runtimeSmoke.initialized == true and
              .runtimeSmoke.pinged == true and
              .runtimeSmoke.credentialsUsed == false and
              .runtimeSmoke.readOnlyHints == true and
              .runtimeSmoke.loopbackConfigRequests == 1 and
              .runtimeSmoke.unexpectedHttpRequests == 0 and
              .runtimeSmoke.toolCount == 6
            ' "${evidence_dir}/audit-disposition.json" >/dev/null
          cp "${actionable_audit}" \
            "${evidence_dir}/audit.actionable.sarif"
          test "$(
            sha256sum "${evidence_dir}/upstream-uv.lock" |
              awk '{print $1}'
          )" = \
            "$(jq -er '.files["uv.lock"].sha256' "${contract}")"
          test "$(
            sha256sum "${evidence_dir}/upstream-pyproject.toml" |
              awk '{print $1}'
          )" = "$(
            jq -er '.files["pyproject.toml"].sha256' "${contract}"
          )"
          test "$(
            sha256sum "${evidence_dir}/resolved-uv.lock" |
              awk '{print $1}'
          )" = "${OBSERVED_RESOLVED_LOCK_SHA}"
          test "$(
            sha256sum "${MCP_PROJECT}/uv.lock" |
              awk '{print $1}'
          )" = "${OBSERVED_RESOLVED_LOCK_SHA}"
          test "$(
            jq -er '.observedResolvedLockSha256' \
              "${evidence_dir}/resolved-lock-binding.json"
          )" = "${OBSERVED_RESOLVED_LOCK_SHA}"
          test "$(
            jq -er '.expectedResolvedLockSha256' \
              "${evidence_dir}/resolved-lock-binding.json"
          )" = "${EXPECTED_RESOLVED_LOCK_SHA}"
          jq -cnS \
            --arg sourceSha "${GITHUB_SHA}" \
            --arg generatedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg uvVersion "$(uv --version | awk '{print $2}')" \
            --arg auditStatus "${AUDIT_STATUS}" \
            --arg upstreamLockSha256 "$(
              jq -er '.files["uv.lock"].sha256' "${contract}"
            )" \
            --arg resolvedLockSha256 "${OBSERVED_RESOLVED_LOCK_SHA}" \
            --arg expectedResolvedLockSha256 \
              "${EXPECTED_RESOLVED_LOCK_SHA}" \
            --arg wheelSha256 "$(jq -er '.package.wheel.sha256' "${contract}")" \
            --arg virtualRootName "$(
              jq -er '.resolution.virtualRootName' "${contract}"
            )" \
            --arg virtualRootVersion "$(
              jq -er '.resolution.virtualRootVersion' "${contract}"
            )" \
            --arg mcpDependency "$(
              jq -er '.resolution.mcpDependency' "${contract}"
            )" \
            --arg registry "$(jq -er '.resolution.registry' "${contract}")" \
            --arg resolutionStrategy "$(
              jq -er '.resolution.strategy' "${contract}"
            )" \
            --arg resolutionUpgrade "$(
              jq -er '.resolution.upgrade' "${contract}"
            )" \
            --arg excludeNewer "$(
              jq -er '.resolution.excludeNewer' "${contract}"
            )" \
            --argjson resolutionConstraints "$(
              jq -c '.resolution.constraints' "${contract}"
            )" \
            --arg projectOverlaySha256 "$(
              sha256sum "${evidence_dir}/project-overlay.json" |
                awk '{print $1}'
            )" \
            --arg wheelOnlyGraphSha256 "$(
              sha256sum "${evidence_dir}/wheel-only-graph.json" |
                awk '{print $1}'
            )" \
            --arg rawAuditSha256 "$(
              sha256sum "${evidence_dir}/audit.raw.sarif" |
                awk '{print $1}'
            )" \
            --arg actionableAuditSha256 "$(
              sha256sum "${evidence_dir}/audit.actionable.sarif" |
                awk '{print $1}'
            )" \
            --arg auditDispositionSha256 "$(
              sha256sum "${evidence_dir}/audit-disposition.json" |
                awk '{print $1}'
            )" \
            --arg openVexSha256 "$(
              sha256sum "${evidence_dir}/openvex.json" |
                awk '{print $1}'
            )" \
            --arg runtimeSmokeSha256 "$(
              sha256sum "${evidence_dir}/runtime-smoke.json" |
                awk '{print $1}'
            )" \
            --slurpfile disposition \
              "${evidence_dir}/audit-disposition.json" '
              {
                schemaVersion: "archon.datahub-mcp-security-evidence/v5",
                sourceSha: $sourceSha,
                generatedAt: $generatedAt,
                scanner: {
                  name: "uv audit",
                  version: $uvVersion,
                  exitCode: ($auditStatus | tonumber)
                },
                dependencyInputs: {
                  upstreamUvLockSha256: $upstreamLockSha256,
                  resolvedUvLockSha256: $resolvedLockSha256,
                  expectedResolvedUvLockSha256:
                    $expectedResolvedLockSha256,
                  mcpWheelSha256: $wheelSha256,
                  resolution: {
                    registry: $registry,
                    strategy: $resolutionStrategy,
                    upgrade: $resolutionUpgrade,
                    excludeNewer: $excludeNewer,
                    constraints: $resolutionConstraints,
                    sourceBuilds: "deny",
                    projectMode: "virtual-static-metadata",
                    virtualRootName: $virtualRootName,
                    virtualRootVersion: $virtualRootVersion,
                    mcpDependency: $mcpDependency,
                    projectOverlaySha256: $projectOverlaySha256
                  },
                  wheelOnlyGraphSha256: $wheelOnlyGraphSha256,
                  pypiTrustedPublisherProvenance:
                    "matched-pinned-pypi-record",
                  runtimeCompatibility: {
                    mcpServerDatahub: "0.6.0",
                    acrylDatahub: "1.6.0.15",
                    setuptools: "81.0.0"
                  }
                },
                advisoryDisposition: {
                  openVexSha256: $openVexSha256,
                  applicationReceiptSha256: $auditDispositionSha256,
                  rawAuditSha256: $rawAuditSha256,
                  actionableAuditSha256: $actionableAuditSha256,
                  receipt: $disposition[0]
                },
                runtimeSmoke: {
                  sha256: $runtimeSmokeSha256,
                  protocol: "mcp-stdio",
                  credentialPolicy: "no-datahub-token",
                  toolProfile: "read-only-exact"
                },
                sbom: {
                  format: "CycloneDX",
                  specVersion: "1.5"
                }
              }
            ' >"${evidence_dir}/metadata.json"
          (
            cd "${evidence_dir}"
            sha256sum \
              audit-disposition.json \
              audit.actionable.sarif \
              audit.raw.sarif \
              installed-packages.json \
              lock-contract.json \
              metadata.json \
              openvex.json \
              pypi-provenance.json \
              project-overlay.json \
              resolved-lock-binding.json \
              resolved-pyproject.toml \
              resolved-uv.lock \
              runtime-smoke.json \
              sbom.cdx.json \
              upstream-pyproject.toml \
              upstream-uv.lock \
              wheel-only-graph.json >evidence.manifest.sha256
            sha256sum --check evidence.manifest.sha256
          )
          gate_status=0
          if ! jq --exit-status '
              .version == "2.1.0" and
              (.runs | type == "array" and length == 1) and
              all(
                .runs[];
                (.tool.driver.name | ascii_downcase | contains("uv")) and
                (.results | type == "array")
              ) and
              ([.runs[].results[]] | length) == 0
            ' "${actionable_audit}" >/dev/null; then
            echo "::error title=DataHub MCP SCA::Actionable SARIF is not empty"
            gate_status=1
          fi
          if ! jq --exit-status '
              .version == "2.1.0" and
              (.runs | type == "array" and length == 1) and
              ([.runs[].results[]] | length) == 2
            ' "${raw_audit}" >/dev/null; then
            echo "::error title=DataHub MCP SCA::Raw SARIF lost expected evidence"
            gate_status=1
          fi
          if [[ "${AUDIT_STATUS}" != "1" ]]; then
            echo "::error title=DataHub MCP SCA::Expected approved-findings exit 1; got ${AUDIT_STATUS}"
            gate_status=1
          fi
          zero_sha256="$(printf '0%.0s' {1..64})"
          if [[ "${EXPECTED_RESOLVED_LOCK_SHA}" == "${zero_sha256}" ]]; then
            echo "::error title=Resolved lock binding required::Replace the placeholder with ${OBSERVED_RESOLVED_LOCK_SHA}"
            gate_status=1
          elif [[ "${OBSERVED_RESOLVED_LOCK_SHA}" != \
            "${EXPECTED_RESOLVED_LOCK_SHA}" ]]; then
            echo "::error title=Resolved lock drift::Expected ${EXPECTED_RESOLVED_LOCK_SHA}; observed ${OBSERVED_RESOLVED_LOCK_SHA}"
            gate_status=1
          fi
          if ! jq --exit-status '
              .matches == true and
              .placeholder == false
            ' "${evidence_dir}/resolved-lock-binding.json" >/dev/null; then
            echo "::error title=Resolved lock evidence::Contract binding is not sealed"
            gate_status=1
          fi
          exit "${gate_status}"
      - name: Project fail-safe MCP SARIF
        id: sarif_projection
        if: always() && steps.audit.outcome == 'success'
        shell: bash
        env:
          BIND_OUTCOME: ${{ steps.bind.outcome }}
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/datahub-mcp-audit.raw.sarif"
          actionable="${RUNNER_TEMP}/datahub-mcp-audit.actionable.sarif"
          test -s "${raw}"
          if [[ "${BIND_OUTCOME}" != "success" ]]; then
            cp "${raw}" "${actionable}"
            echo "::warning title=DataHub MCP SCA::Evidence binding failed; publishing raw findings"
          fi
          test -s "${actionable}"
      - name: Upload fail-safe MCP SCA projection
        if: >-
          always() &&
          steps.audit.outcome == 'success' &&
          steps.sarif_projection.outcome == 'success' &&
          (
            github.event_name == 'push' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: ${{ runner.temp }}/datahub-mcp-audit.actionable.sarif
          category: uv-datahub-mcp
      - name: Retain locked MCP SCA and SBOM evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datahub-mcp-security-${{ github.sha }}
          path: ${{ runner.temp }}/datahub-mcp-security/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # aws-cdk-lib@2.262.1 immutably bundles the sole affected path.
          # The infra job replaces it with integrity-pinned 5.0.8 and accepts
          # no other advisory/path through its exact compensating audit gate.
          allow-ghsas: GHSA-mh99-v99m-4gvg

  load:
    name: Offline SLO
    needs: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Load test (zero errors, p95 SLO)
        run: npm run load

  container:
    name: Production container
    needs: [secret-scan, build-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.candidate.outputs['artifact-id'] }}
      artifact_name: container-${{ github.sha }}
      artifact_digest: sha256:${{ steps.candidate.outputs['artifact-digest'] }}
      producer_attempt: ${{ github.run_attempt }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build once and load the exact candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: archon-datahub:${{ github.sha }}
          build-args: |
            ARCHON_RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assert non-root image configuration
        run: test "$(docker image inspect "archon-datahub:${GITHUB_SHA}" --format '{{.Config.User}}')" = "node"
      - name: Assert isolated worker entrypoints in the exact candidate
        run: |
          docker run --rm \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=4m \
            --cap-drop ALL --security-opt no-new-privileges \
            --network none \
            --entrypoint node \
            "archon-datahub:${GITHUB_SHA}" \
            -e 'const fs=require("node:fs"); for (const file of ["/app/dist/audit-worker.js","/app/dist/remediation-worker.js"]) { if (!fs.statSync(file).isFile()) process.exit(1); }'
      - name: Boot hardened candidate
        run: |
          docker run --detach --name archon-candidate \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges \
            --publish 127.0.0.1:8080:8080 \
            --env ARCHON_RELEASE_SHA="${GITHUB_SHA}" \
            "archon-datahub:${GITHUB_SHA}"
      - name: Hosted health contract
        run: |
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz > "${RUNNER_TEMP}/health.json"; then
              break
            fi
            sleep 1
          done
          grep -F "\"releaseSha\":\"${GITHUB_SHA}\"" "${RUNNER_TEMP}/health.json"
      - name: Scan the exact production container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: archon-datahub:${{ github.sha }}
          scanners: vuln
          format: sarif
          output: ${{ runner.temp }}/trivy-container.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: "0"
          hide-progress: true
          version: v0.72.0
      - name: Upload trusted container SARIF
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: ${{ runner.temp }}/trivy-container.sarif
          category: trivy-production-container
      - name: Retain container security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-${{ github.sha }}
          path: ${{ runner.temp }}/trivy-container.sarif
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
      - name: Fail on high or critical container findings or malformed evidence
        run: |
          set -euo pipefail
          jq --exit-status \
            '
              .version == "2.1.0" and
              (.runs | type == "array" and length > 0) and
              all(
                .runs[];
                (.tool.driver.name | ascii_downcase | contains("trivy")) and
                (.results | type == "array")
              ) and
              ([.runs[].results[]] | length) == 0
            ' \
            "${RUNNER_TEMP}/trivy-container.sarif" >/dev/null
      - name: Export immutable candidate and manifest
        run: |
          docker save "archon-datahub:${GITHUB_SHA}" | gzip -9 > "${RUNNER_TEMP}/archon-image.tar.gz"
          (
            cd "${RUNNER_TEMP}"
            sha256sum archon-image.tar.gz > archon-image.tar.gz.sha256
          )
          docker image inspect "archon-datahub:${GITHUB_SHA}" > "${RUNNER_TEMP}/image-inspect.json"
      - name: Upload exact candidate
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-${{ github.sha }}
          path: |
            ${{ runner.temp }}/archon-image.tar.gz
            ${{ runner.temp }}/archon-image.tar.gz.sha256
            ${{ runner.temp }}/image-inspect.json
            ${{ runner.temp }}/health.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Candidate logs
        if: failure()
        run: docker logs archon-candidate
      - name: Stop candidate
        if: always()
        run: docker rm --force archon-candidate >/dev/null 2>&1 || true

  attest-release:
    name: Sign exact CI release candidates
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - secret-scan
      - build-test
      - benchmark
      - judge-evidence
      - web
      - contrib
      - infra
      - readiness
      - security
      - mcp-dependency
      - load
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download exact container candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.container.outputs.artifact_id }}
          path: ${{ runner.temp }}/container
          merge-multiple: true

      - name: Download exact SPA candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-${{ github.sha }}
          path: ${{ runner.temp }}/web

      - name: Download exact Lambda candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambdas-${{ github.sha }}
          path: ${{ runner.temp }}/lambdas

      - name: Bind successful CI gates to exact release bytes
        env:
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
          BENCHMARK_ARTIFACT_DIGEST: ${{ needs.benchmark.outputs.artifact_digest }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CONTAINER_ARTIFACT_DIGEST: ${{ needs.container.outputs.artifact_digest }}
          CONTAINER_ARTIFACT_ID: ${{ needs.container.outputs.artifact_id }}
          CONTAINER_ARTIFACT_NAME: ${{ needs.container.outputs.artifact_name }}
          CONTAINER_PRODUCER_ATTEMPT: ${{ needs.container.outputs.producer_attempt }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          CONTRIB_ARTIFACT_DIGEST: ${{ needs.contrib.outputs.validation_receipt_digest }}
          CONTRIB_RESULT: ${{ needs.contrib.result }}
          INFRA_RESULT: ${{ needs.infra.result }}
          JUDGE_EVIDENCE_ARTIFACT_DIGEST: ${{ needs.judge-evidence.outputs.artifact_digest }}
          JUDGE_EVIDENCE_ARTIFACT_ID: ${{ needs.judge-evidence.outputs.artifact_id }}
          JUDGE_EVIDENCE_ARTIFACT_NAME: ${{ needs.judge-evidence.outputs.artifact_name }}
          JUDGE_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.judge-evidence.outputs.producer_attempt }}
          JUDGE_EVIDENCE_RESULT: ${{ needs.judge-evidence.result }}
          LOAD_RESULT: ${{ needs.load.result }}
          MCP_DEPENDENCY_ARTIFACT_DIGEST: ${{ needs.mcp-dependency.outputs.artifact_digest }}
          MCP_DEPENDENCY_RESULT: ${{ needs.mcp-dependency.result }}
          READINESS_RESULT: ${{ needs.readiness.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          set -euo pipefail
          container_dir="${RUNNER_TEMP}/container"
          web_dir="${RUNNER_TEMP}/web"
          lambda_dir="${RUNNER_TEMP}/lambdas"
          evidence_dir="${RUNNER_TEMP}/ci-release-attestation"
          mkdir -p "${evidence_dir}"

          [[ "${CI_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${JUDGE_EVIDENCE_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${JUDGE_EVIDENCE_PRODUCER_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${JUDGE_EVIDENCE_ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${JUDGE_EVIDENCE_ARTIFACT_NAME}" = \
            "judge-evidence-${GITHUB_SHA}-${JUDGE_EVIDENCE_PRODUCER_ATTEMPT}"
          [[ "${CONTAINER_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CONTAINER_PRODUCER_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CONTAINER_ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${CONTAINER_ARTIFACT_NAME}" = "container-${GITHUB_SHA}"
          (( JUDGE_EVIDENCE_PRODUCER_ATTEMPT <= CI_RUN_ATTEMPT ))
          (( CONTAINER_PRODUCER_ATTEMPT <= CI_RUN_ATTEMPT ))

          test -f "${container_dir}/archon-image.tar.gz"
          test -f "${container_dir}/archon-image.tar.gz.sha256"
          test -f "${web_dir}/archon-web.tar.gz"
          test -f "${web_dir}/archon-web.tar.gz.sha256"
          test -f "${lambda_dir}/archon-lambdas.tar.gz"
          test -f "${lambda_dir}/archon-lambdas.tar.gz.sha256"
          container_sha="$(sha256sum "${container_dir}/archon-image.tar.gz" | awk '{print $1}')"
          web_sha="$(sha256sum "${web_dir}/archon-web.tar.gz" | awk '{print $1}')"
          lambda_sha="$(sha256sum "${lambda_dir}/archon-lambdas.tar.gz" | awk '{print $1}')"
          test "$(awk 'NR == 1 {print $1}' \
            "${container_dir}/archon-image.tar.gz.sha256")" = "${container_sha}"
          test "$(awk 'NR == 1 {print $1}' \
            "${web_dir}/archon-web.tar.gz.sha256")" = "${web_sha}"
          test "$(awk 'NR == 1 {print $1}' \
            "${lambda_dir}/archon-lambdas.tar.gz.sha256")" = "${lambda_sha}"

          printf '%s  %s\n' "${container_sha}" archon-image.tar.gz \
            >"${evidence_dir}/release-subjects.sha256"
          printf '%s  %s\n' "${web_sha}" archon-web.tar.gz \
            >>"${evidence_dir}/release-subjects.sha256"
          printf '%s  %s\n' "${lambda_sha}" archon-lambdas.tar.gz \
            >>"${evidence_dir}/release-subjects.sha256"
          jq -cnS \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF}" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson runAttempt "${CI_RUN_ATTEMPT}" \
            --arg secretScan "${SECRET_SCAN_RESULT}" \
            --arg buildTest "${BUILD_TEST_RESULT}" \
            --arg benchmarkArtifactDigest "${BENCHMARK_ARTIFACT_DIGEST}" \
            --arg benchmark "${BENCHMARK_RESULT}" \
            --arg judgeEvidenceArtifactDigest \
              "${JUDGE_EVIDENCE_ARTIFACT_DIGEST}" \
            --argjson judgeEvidenceArtifactId \
              "${JUDGE_EVIDENCE_ARTIFACT_ID}" \
            --arg judgeEvidenceArtifactName \
              "${JUDGE_EVIDENCE_ARTIFACT_NAME}" \
            --argjson judgeEvidenceProducerAttempt \
              "${JUDGE_EVIDENCE_PRODUCER_ATTEMPT}" \
            --arg judgeEvidence "${JUDGE_EVIDENCE_RESULT}" \
            --arg web "${WEB_RESULT}" \
            --arg contribArtifactDigest "${CONTRIB_ARTIFACT_DIGEST}" \
            --arg contrib "${CONTRIB_RESULT}" \
            --arg infra "${INFRA_RESULT}" \
            --arg readiness "${READINESS_RESULT}" \
            --arg security "${SECURITY_RESULT}" \
            --arg load "${LOAD_RESULT}" \
            --arg mcpDependencyArtifactDigest \
              "${MCP_DEPENDENCY_ARTIFACT_DIGEST}" \
            --arg mcpDependency "${MCP_DEPENDENCY_RESULT}" \
            --arg container "${CONTAINER_RESULT}" \
            --argjson containerArtifactId "${CONTAINER_ARTIFACT_ID}" \
            --arg containerArtifactName "${CONTAINER_ARTIFACT_NAME}" \
            --arg containerArtifactDigest "${CONTAINER_ARTIFACT_DIGEST}" \
            --argjson containerProducerAttempt \
              "${CONTAINER_PRODUCER_ATTEMPT}" '
              {
                schemaVersion: "archon.ci-release/v1",
                source: {
                  repository: $repository,
                  commit: $commit,
                  ref: $ref,
                  event: "push",
                  workflowRun: $runUrl,
                  runAttempt: $runAttempt
                },
                gates: {
                  secretScan: $secretScan,
                  buildTest: $buildTest,
                  dataHubBenchmark: $benchmark,
                  judgeEvidence: $judgeEvidence,
                  web: $web,
                  contribution: $contrib,
                  infrastructure: $infra,
                  readiness: $readiness,
                  security: $security,
                  dataHubMcpDependency: $mcpDependency,
                  load: $load,
                  container: $container
                },
                dependencyEvidence: {
                  dataHubMcpSecurityArtifactDigest:
                    $mcpDependencyArtifactDigest
                },
                capabilityEvidence: {
                  dataHubBenchmarkArtifactDigest:
                    $benchmarkArtifactDigest,
                  judgeEvidenceArtifactDigest:
                    $judgeEvidenceArtifactDigest,
                  ossContributionValidationArtifactDigest:
                    $contribArtifactDigest
                },
                releaseArtifacts: {
                  judgeEvidence: {
                    id: $judgeEvidenceArtifactId,
                    name: $judgeEvidenceArtifactName,
                    digest: $judgeEvidenceArtifactDigest,
                    producerAttempt: $judgeEvidenceProducerAttempt
                  },
                  container: {
                    id: $containerArtifactId,
                    name: $containerArtifactName,
                    digest: $containerArtifactDigest,
                    producerAttempt: $containerProducerAttempt
                  }
                }
              }
            ' >"${evidence_dir}/predicate.json"
          jq -e '
            (keys | sort) == [
              "capabilityEvidence",
              "dependencyEvidence",
              "gates",
              "releaseArtifacts",
              "schemaVersion",
              "source"
            ] and
            .source.ref == "refs/heads/master" and
            (.source.runAttempt | type) == "number" and
            .source.runAttempt > 0 and
            ([.gates[]] | all(. == "success")) and
            (.dependencyEvidence.dataHubMcpSecurityArtifactDigest |
              test("^sha256:[0-9a-f]{64}$")) and
            (.capabilityEvidence.dataHubBenchmarkArtifactDigest |
              test("^sha256:[0-9a-f]{64}$")) and
            (.capabilityEvidence.judgeEvidenceArtifactDigest |
              test("^sha256:[0-9a-f]{64}$")) and
            (.capabilityEvidence.ossContributionValidationArtifactDigest |
              test("^sha256:[0-9a-f]{64}$")) and
            (.releaseArtifacts | keys | sort) ==
              ["container", "judgeEvidence"] and
            (.releaseArtifacts.judgeEvidence | keys | sort) ==
              ["digest", "id", "name", "producerAttempt"] and
            (.releaseArtifacts.judgeEvidence.id | type) == "number" and
            .releaseArtifacts.judgeEvidence.id > 0 and
            (.releaseArtifacts.judgeEvidence.producerAttempt | type) ==
              "number" and
            .releaseArtifacts.judgeEvidence.producerAttempt > 0 and
            .releaseArtifacts.judgeEvidence.producerAttempt <=
              .source.runAttempt and
            .releaseArtifacts.judgeEvidence.name ==
              (
                "judge-evidence-" + .source.commit + "-" +
                (.releaseArtifacts.judgeEvidence.producerAttempt | tostring)
              ) and
            .releaseArtifacts.judgeEvidence.digest ==
              .capabilityEvidence.judgeEvidenceArtifactDigest and
            (.releaseArtifacts.container | keys | sort) ==
              ["digest", "id", "name", "producerAttempt"] and
            (.releaseArtifacts.container.id | type) == "number" and
            .releaseArtifacts.container.id > 0 and
            (.releaseArtifacts.container.producerAttempt | type) ==
              "number" and
            .releaseArtifacts.container.producerAttempt > 0 and
            .releaseArtifacts.container.producerAttempt <=
              .source.runAttempt and
            .releaseArtifacts.container.name ==
              ("container-" + .source.commit) and
            (.releaseArtifacts.container.digest |
              test("^sha256:[0-9a-f]{64}$"))
          ' "${evidence_dir}/predicate.json" >/dev/null

      - name: Sign exact CI release candidates
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ runner.temp }}/ci-release-attestation/release-subjects.sha256
          predicate-type: https://github.com/upgradedev/archon-datahub/attestations/ci-release/v1
          predicate-path: ${{ runner.temp }}/ci-release-attestation/predicate.json
