name: Production Supply Chain

# The default-branch CI path scans the exact retained SPA and Lambda subjects.
# Scheduled and manual paths additionally bind those subjects to the lean AWS
# production topology, its attested deployment evidence, and the deployed Cloud
# runtime OCI digest. The retired monolith container is never a production subject.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional expected deployed lowercase 40-character release SHA
        required: false
        default: ""
        type: string
      ci_run_id:
        description: Optional expected deployed successful master CI run ID
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: supply-chain-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

env:
  SYFT_VERSION: "1.49.0"
  SYFT_ARCHIVE_SHA256: 7aa2f03ee92739cf643279ba3990548b9925d4e22cae13f46831ee62821147fe
  SYFT_BINARY_SHA256: 6368bf376b578991192e2e94f5e276e6c70d313d6368ad8c249866f020a86cb0
  GRYPE_VERSION: "0.116.0"
  GRYPE_ARCHIVE_SHA256: 40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5
  GRYPE_BINARY_SHA256: 766fec22cd9eb84aa5efc854a8bd569305c7d96da4e1dbd7e2940b556c4d21ff
  GRYPE_CHECK_FOR_APP_UPDATE: "false"
  GRYPE_DB_AUTO_UPDATE: "true"
  GRYPE_DB_REQUIRE_UPDATE_CHECK: "true"
  GRYPE_DB_VALIDATE_BY_HASH_ON_START: "true"
  GRYPE_DB_VALIDATE_AGE: "true"
  GRYPE_DB_MAX_ALLOWED_BUILT_AGE: "24h"
  GRYPE_EXTERNAL_SOURCES_ENABLE: "false"
  SYFT_CHECK_FOR_APP_UPDATE: "false"

jobs:
  openvex-maintenance:
    name: Daily OpenVEX renewal horizon
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Enforce reviewed OpenVEX validity
        run: >-
          bash scripts/materialize-datahub-mcp-lock.sh
          --openvex-maintenance-only
          --minimum-remaining-days 14

  resolve-production:
    name: Seal lean production binding v2
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-observer
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      binding: ${{ steps.production.outputs.binding }}
      binding_digest: ${{ steps.production.outputs.binding_digest }}
      ci_run_id: ${{ steps.production.outputs.ci_run_id }}
      ci_lambda_artifact_digest: ${{ steps.production.outputs.ci_lambda_artifact_digest }}
      ci_lambda_artifact_id: ${{ steps.production.outputs.ci_lambda_artifact_id }}
      ci_web_artifact_digest: ${{ steps.production.outputs.ci_web_artifact_digest }}
      ci_web_artifact_id: ${{ steps.production.outputs.ci_web_artifact_id }}
      cloud_image_digest: ${{ steps.production.outputs.cloud_image_digest }}
      cloud_runtime_release_digest: ${{ steps.production.outputs.cloud_runtime_release_digest }}
      core_capability_digest: ${{ steps.production.outputs.core_capability_digest }}
      core_image_manifest_digest: ${{ steps.production.outputs.core_image_manifest_digest }}
      deployment_artifact_digest: ${{ steps.production.outputs.deployment_artifact_digest }}
      deployment_artifact_id: ${{ steps.production.outputs.deployment_artifact_id }}
      deployment_artifact_name: ${{ steps.production.outputs.deployment_artifact_name }}
      deployment_evidence: ${{ steps.production.outputs.deployment_evidence }}
      deployment_run_attempt: ${{ steps.production.outputs.deployment_run_attempt }}
      deployment_run_id: ${{ steps.production.outputs.deployment_run_id }}
      lambda_artifact_digest: ${{ steps.production.outputs.lambda_artifact_digest }}
      observation: ${{ steps.production.outputs.observation }}
      release_sha: ${{ steps.production.outputs.release_sha }}
      web_artifact_digest: ${{ steps.production.outputs.web_artifact_digest }}
    env:
      BASH_ENV: /dev/null
      EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      DEPLOY_REGION: ${{ vars.AWS_REGION }}
      READ_ROLE_ARN: ${{ vars.AWS_RUNTIME_READ_ROLE_ARN }}
      REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
      REQUESTED_CI_RUN_ID: ${{ inputs.ci_run_id }}
    steps:
      - name: Validate observer identity and default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${DEPLOY_REGION}" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          partition="$(cut -d: -f2 <<<"${READ_ROLE_ARN}")"
          test "${READ_ROLE_ARN}" = \
            "arn:${partition}:iam::${EXPECTED_ACCOUNT_ID}:role/archon-production-runtime-read"
          test "${GITHUB_REF}" = "refs/heads/master"
          repository="$(gh api "/repos/${GITHUB_REPOSITORY}")"
          test "$(jq -r .default_branch <<<"${repository}")" = master
          master_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
              --jq '.object.sha'
          )"
          test "${master_sha}" = "${GITHUB_SHA}"
          if [[ -n "${REQUESTED_RELEASE_SHA}" ]]; then
            [[ "${REQUESTED_RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          fi
          if [[ -n "${REQUESTED_CI_RUN_ID}" ]]; then
            [[ "${REQUESTED_CI_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Seal current observer control-plane gates before AWS trust
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          OUTPUT_PATH: ${{ runner.temp }}/control-plane-security-gates.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          bash scripts/verify-github-control-plane.sh
          jq -cS . "${OUTPUT_PATH}" >"${OUTPUT_PATH}.canonical"
          mv "${OUTPUT_PATH}.canonical" "${OUTPUT_PATH}"
          jq -e \
            --arg sha "${GITHUB_SHA}" '
              .schemaVersion == "archon.deployment-control-plane-gates/v1" and
              .branch == "master" and
              .sourceSha == $sha and
              ([.workflows[].path] | sort) == [
                ".github/workflows/ci.yml",
                ".github/workflows/codeql.yml",
                ".github/workflows/workflow-security.yml"
              ] and
              all(.workflows[]; .conclusion == "success")
            ' "${OUTPUT_PATH}" >/dev/null

      - name: Configure read-only production observer through OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RUNTIME_READ_ROLE_ARN }}
          role-session-name: archon-${{ github.run_id }}-lean-resolve
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Resolve evidence, re-observe and seal exact binding
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP}/lean-production-resolve"
          mkdir -p "${root}"
          test "$(
            aws sts get-caller-identity --query Account --output text
          )" = "${EXPECTED_ACCOUNT_ID}"

          aws cloudformation describe-stacks \
            --stack-name Archon-production-Judge \
            --region "${DEPLOY_REGION}" --no-paginate --output json \
            >"${root}/judge.json"
          aws cloudformation describe-stacks \
            --stack-name Archon-production-Core \
            --region "${DEPLOY_REGION}" --no-paginate --output json \
            >"${root}/core.json"
          jq -e '
            (.Stacks | length == 1) and
            (
              .Stacks[0].StackStatus == "CREATE_COMPLETE" or
              .Stacks[0].StackStatus == "UPDATE_COMPLETE"
            )
          ' "${root}/judge.json" >/dev/null
          jq -e '
            (.Stacks | length == 1) and
            (
              .Stacks[0].StackStatus == "CREATE_COMPLETE" or
              .Stacks[0].StackStatus == "UPDATE_COMPLETE"
            )
          ' "${root}/core.json" >/dev/null

          output_value() {
            local file="$1" key="$2"
            jq -er --arg key "${key}" '
              [.Stacks[0].Outputs[] | select(.OutputKey == $key)] as $x |
              if ($x | length) == 1 then $x[0].OutputValue
              else error("missing or duplicate output " + $key) end
            ' "${file}"
          }
          parameter_value() {
            local file="$1" key="$2"
            jq -er --arg key "${key}" '
              [.Stacks[0].Parameters[] | select(.ParameterKey == $key)] as $x |
              if ($x | length) == 1 then $x[0].ParameterValue
              else error("missing or duplicate parameter " + $key) end
            ' "${file}"
          }

          release_sha="$(output_value "${root}/judge.json" ArchonReleaseSha)"
          ci_run_id="$(output_value "${root}/judge.json" ArchonCiRunId)"
          deployment_run_id="$(
            output_value "${root}/judge.json" ArchonDeploymentWorkflowRunId
          )"
          web_digest="$(
            output_value "${root}/judge.json" ArchonSpaArtifactSha256
          )"
          lambda_digest="$(
            output_value "${root}/judge.json" ArchonLambdaArtifactSha256
          )"
          cloud_release="$(
            output_value "${root}/judge.json" ArchonCloudRuntimeReleaseDigest
          )"
          cloud_image_uri="$(
            output_value "${root}/judge.json" ArchonCloudRuntimeImageUri
          )"
          cloud_image_digest="${cloud_image_uri##*@}"
          judge_core_capability="$(
            output_value "${root}/judge.json" ArchonCoreCapabilityDigest
          )"
          core_capability="$(
            output_value "${root}/core.json" ArchonCoreCapabilityDigest
          )"
          core_manifest="$(
            parameter_value "${root}/core.json" DataHubCoreImageManifestDigest
          )"
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${ci_run_id}" =~ ^[1-9][0-9]*$ ]]
          [[ "${deployment_run_id}" =~ ^[1-9][0-9]*$ ]]
          for digest in \
            "${web_digest}" "${lambda_digest}" "${cloud_release}" \
            "${cloud_image_digest}" "${core_capability}" "${core_manifest}"; do
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          test "${judge_core_capability}" = "${core_capability}"
          [[ "${cloud_image_uri}" == *@${cloud_image_digest} ]]
          if [[ -n "${REQUESTED_RELEASE_SHA}" ]]; then
            test "${release_sha}" = "${REQUESTED_RELEASE_SHA}"
          fi
          if [[ -n "${REQUESTED_CI_RUN_ID}" ]]; then
            test "${ci_run_id}" = "${REQUESTED_CI_RUN_ID}"
          fi

          deployment_run="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${deployment_run_id}"
          )"
          deployment_attempt="$(
            jq -er '.run_attempt | select(type == "number" and . >= 1)' \
              <<<"${deployment_run}"
          )"
          deployment_control_sha="$(jq -er .head_sha <<<"${deployment_run}")"
          jq -e '
            .path == ".github/workflows/deploy.yml" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success"
          ' <<<"${deployment_run}" >/dev/null
          artifact_name="deployment-evidence-production-${release_sha}-${deployment_run_id}"
          deployment_artifacts="$(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${deployment_run_id}/artifacts?per_page=100"
          )"
          deployment_artifact="$(
            jq -sce --arg name "${artifact_name}" \
              --argjson run "${deployment_run_id}" '
                [.[] | .artifacts[] |
                  select(
                    .name == $name and .expired == false and
                    .workflow_run.id == $run and
                    (.digest | test("^sha256:[0-9a-f]{64}$"))
                  )
                ] |
                if length == 1 then .[0]
                else error("expected one exact deployment artifact") end
              ' <<<"${deployment_artifacts}"
          )"
          deployment_artifact_id="$(jq -er .id <<<"${deployment_artifact}")"
          deployment_artifact_digest="$(
            jq -er .digest <<<"${deployment_artifact}"
          )"
          deployment_zip="${root}/deployment.zip"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${deployment_artifact_id}/zip" \
            >"${deployment_zip}"
          test "sha256:$(sha256sum "${deployment_zip}" | awk '{print $1}')" = \
            "${deployment_artifact_digest}"
          mapfile -t entries < <(unzip -Z1 "${deployment_zip}")
          test "${#entries[@]}" = 2
          diff -u \
            <(printf '%s\n' "${entries[@]}" | LC_ALL=C sort) \
            <(printf '%s\n' deployment-evidence.json observation.json) \
            >/dev/null
          if zipinfo -l "${deployment_zip}" |
            awk '$1 ~ /^l[rwxStTs-]{9}$/ {found=1} END {exit found ? 0 : 1}'
          then
            echo "::error::deployment evidence archive contains a symlink"
            exit 1
          fi
          unzip -p "${deployment_zip}" deployment-evidence.json \
            >"${root}/deployment-evidence.raw.json"
          unzip -p "${deployment_zip}" observation.json \
            >"${root}/observation.raw.json"
          test -s "${root}/deployment-evidence.raw.json"
          test -s "${root}/observation.raw.json"

          gh attestation verify "${root}/deployment-evidence.raw.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type \
              "https://github.com/upgradedev/archon-datahub/attestations/aws-deployment/v2" \
            --signer-workflow \
              "github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml" \
            --source-digest "${deployment_control_sha}" \
            --deny-self-hosted-runners >/dev/null

          jq -cnS \
            --arg stage production \
            --arg releaseSha "${release_sha}" \
            --argjson ciRunId "${ci_run_id}" \
            --argjson deploymentRunId "${deployment_run_id}" \
            --arg webArtifactDigest "${web_digest}" \
            --arg lambdaArtifactDigest "${lambda_digest}" \
            --arg cloudRuntimeReleaseDigest "${cloud_release}" \
            --arg coreCapabilityDigest "${core_capability}" \
            --arg coreImageManifestDigest "${core_manifest}" \
            --arg cloudImageDigest "${cloud_image_digest}" \
            '{$stage,$releaseSha,$ciRunId,$deploymentRunId,
              $webArtifactDigest,$lambdaArtifactDigest,
              $cloudRuntimeReleaseDigest,$coreCapabilityDigest,
              $coreImageManifestDigest,$cloudImageDigest}' \
            >"${root}/expectations.json"
          node scripts/validate-lean-production-evidence.mjs pair \
            "${root}/deployment-evidence.raw.json" \
            "${root}/observation.raw.json" \
            "${root}/expectations.json" \
            "${root}/deployment-evidence.json" \
            "${root}/observation.json"
          jq -e '
            .schemaVersion == "archon.aws-deployment-evidence/v2"
          ' "${root}/deployment-evidence.json" >/dev/null
          jq -e '
            .schemaVersion == "archon.lean-runtime-observation/v1"
          ' "${root}/observation.json" >/dev/null

          ci_run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}")"
          ci_attempt="$(jq -er '.run_attempt | select(. >= 1)' <<<"${ci_run}")"
          jq -e --arg sha "${release_sha}" '
            .path == ".github/workflows/ci.yml" and
            .event == "push" and .head_branch == "master" and
            .head_sha == $sha and .status == "completed" and
            .conclusion == "success"
          ' <<<"${ci_run}" >/dev/null
          ci_artifacts="$(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}/artifacts?per_page=100"
          )"
          artifact_for() {
            local name="$1"
            jq -sce --arg name "${name}" --argjson run "${ci_run_id}" '
              [.[] | .artifacts[] |
                select(
                  .name == $name and .expired == false and
                  .workflow_run.id == $run and
                  (.digest | test("^sha256:[0-9a-f]{64}$"))
                )
              ] |
              if length == 1 then .[0]
              else error("expected one exact CI artifact") end
            ' <<<"${ci_artifacts}"
          }
          web_artifact="$(artifact_for "web-${release_sha}")"
          lambda_artifact="$(artifact_for "lambdas-${release_sha}")"
          web_artifact_id="$(jq -er .id <<<"${web_artifact}")"
          web_artifact_outer="$(jq -er .digest <<<"${web_artifact}")"
          lambda_artifact_id="$(jq -er .id <<<"${lambda_artifact}")"
          lambda_artifact_outer="$(jq -er .digest <<<"${lambda_artifact}")"

          ARCHON_STAGE=production \
          ARCHON_OBSERVATION_OUTPUT="${root}/fresh-observation.raw.json" \
          EXPECT_CORE_IDLE=true \
            bash scripts/observe-aws-live-runtime.sh
          node scripts/validate-lean-production-evidence.mjs observation \
            "${root}/fresh-observation.raw.json" \
            "${root}/expectations.json" \
            "${root}/fresh-observation.json"
          node scripts/validate-lean-production-evidence.mjs stable \
            "${root}/observation.json" "${root}/sealed.stable.json"
          node scripts/validate-lean-production-evidence.mjs stable \
            "${root}/fresh-observation.json" "${root}/fresh.stable.json"
          cmp --silent "${root}/sealed.stable.json" "${root}/fresh.stable.json"

          registry="${cloud_image_uri%%/*}"
          aws ecr get-login-password --region "${DEPLOY_REGION}" |
            docker login --username AWS --password-stdin "${registry}"
          gh attestation verify "oci://${cloud_image_uri}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type \
              "https://github.com/upgradedev/archon-datahub/attestations/datahub-cloud-runtime/v1" \
            --signer-workflow \
              "github.com/${GITHUB_REPOSITORY}/.github/workflows/datahub-cloud-runtime-image.yml" \
            --deny-self-hosted-runners --format json \
            >"${root}/cloud-runtime-attestation.json"
          docker logout "${registry}" >/dev/null
          jq -e --arg digest "${cloud_image_digest#sha256:}" '
            length >= 1 and any(.[];
              .verificationResult.statement.predicateType ==
                "https://github.com/upgradedev/archon-datahub/attestations/datahub-cloud-runtime/v1" and
              .verificationResult.statement.predicate.schemaVersion ==
                "archon.datahub-cloud-runtime-provenance/v1" and
              any(.verificationResult.statement.subject[];
                .digest.sha256 == $digest)
            )
          ' "${root}/cloud-runtime-attestation.json" >/dev/null

          evidence_raw_digest="sha256:$(
            sha256sum "${root}/deployment-evidence.raw.json" | awk '{print $1}'
          )"
          evidence_digest="sha256:$(
            sha256sum "${root}/deployment-evidence.json" | awk '{print $1}'
          )"
          sealed_digest="sha256:$(
            sha256sum "${root}/observation.json" | awk '{print $1}'
          )"
          fresh_digest="sha256:$(
            sha256sum "${root}/fresh-observation.json" | awk '{print $1}'
          )"
          projection_digest="sha256:$(
            sha256sum "${root}/sealed.stable.json" | awk '{print $1}'
          )"
          gate_digest="sha256:$(
            sha256sum "${RUNNER_TEMP}/control-plane-security-gates.json" |
              awk '{print $1}'
          )"
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -cnS \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg releaseSha "${release_sha}" \
            --arg observedAt "${observed_at}" \
            --arg workflowRun \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg stackFingerprint "$(
              jq -r .topology.stackFingerprintSha256 "${root}/observation.json"
            )" \
            --arg deploymentControlSha "${deployment_control_sha}" \
            --argjson deploymentRunId "${deployment_run_id}" \
            --argjson deploymentRunAttempt "${deployment_attempt}" \
            --argjson deploymentArtifactId "${deployment_artifact_id}" \
            --arg deploymentArtifactName "${artifact_name}" \
            --arg deploymentArtifactDigest "${deployment_artifact_digest}" \
            --arg evidenceRawDigest "${evidence_raw_digest}" \
            --arg evidenceDigest "${evidence_digest}" \
            --argjson ciRunId "${ci_run_id}" \
            --argjson ciRunAttempt "${ci_attempt}" \
            --argjson webArtifactId "${web_artifact_id}" \
            --arg webArtifactName "web-${release_sha}" \
            --arg webArtifactOuter "${web_artifact_outer}" \
            --argjson lambdaArtifactId "${lambda_artifact_id}" \
            --arg lambdaArtifactName "lambdas-${release_sha}" \
            --arg lambdaArtifactOuter "${lambda_artifact_outer}" \
            --arg webDigest "${web_digest}" \
            --arg lambdaDigest "${lambda_digest}" \
            --arg cloudRelease "${cloud_release}" \
            --arg cloudImage "${cloud_image_digest}" \
            --arg coreCapability "${core_capability}" \
            --arg coreManifest "${core_manifest}" \
            --arg sealedDigest "${sealed_digest}" \
            --arg freshDigest "${fresh_digest}" \
            --arg projectionDigest "${projection_digest}" \
            --arg observerCommit "${GITHUB_SHA}" \
            --arg observerGatesDigest "${gate_digest}" '
              {
                schemaVersion:"archon.lean-production-binding/v2",
                repository:$repository,
                stage:"production",
                releaseSha:$releaseSha,
                topology:{
                  stackNames:[
                    "Archon-production-Core",
                    "Archon-production-Edge",
                    "Archon-production-Judge"
                  ],
                  stackFingerprintSha256:$stackFingerprint,
                  zeroIdleCore:true,
                  legacyAlwaysOnRuntimeAbsent:true
                },
                deployment:{
                  runId:$deploymentRunId,
                  runAttempt:$deploymentRunAttempt,
                  controlPlaneSha:$deploymentControlSha,
                  artifact:{
                    id:$deploymentArtifactId,
                    name:$deploymentArtifactName,
                    digest:$deploymentArtifactDigest
                  },
                  evidence:{
                    rawDigest:$evidenceRawDigest,
                    canonicalDigest:$evidenceDigest,
                    attestationVerified:true
                  }
                },
                ci:{
                  runId:$ciRunId,
                  runAttempt:$ciRunAttempt,
                  artifacts:{
                    web:{
                      id:$webArtifactId,
                      name:$webArtifactName,
                      archiveDigest:$webArtifactOuter,
                      subjectDigest:$webDigest
                    },
                    lambda:{
                      id:$lambdaArtifactId,
                      name:$lambdaArtifactName,
                      archiveDigest:$lambdaArtifactOuter,
                      subjectDigest:$lambdaDigest
                    }
                  }
                },
                promotion:{
                  webArtifactDigest:$webDigest,
                  lambdaArtifactDigest:$lambdaDigest,
                  cloudRuntimeReleaseDigest:$cloudRelease,
                  cloudImageDigest:$cloudImage,
                  coreCapabilityDigest:$coreCapability,
                  coreImageManifestDigest:$coreManifest
                },
                observation:{
                  sealedDigest:$sealedDigest,
                  freshDigest:$freshDigest,
                  stableProjectionDigest:$projectionDigest,
                  exactStableProjectionMatch:true,
                  excludedFields:["observedAt"]
                },
                observerControlPlane:{
                  commit:$observerCommit,
                  gatesDigest:$observerGatesDigest
                },
                observedAt:$observedAt,
                workflowRun:$workflowRun
              }
            ' >"${root}/binding.json"
          jq -e '
            .schemaVersion == "archon.lean-production-binding/v2" and
            .observation.excludedFields == ["observedAt"] and
            .observation.exactStableProjectionMatch == true and
            .topology.legacyAlwaysOnRuntimeAbsent == true and
            .deployment.artifact.name ==
              ("deployment-evidence-production-" + .releaseSha + "-" +
               (.deployment.runId | tostring))
          ' "${root}/binding.json" >/dev/null
          binding_digest="sha256:$(
            sha256sum "${root}/binding.json" | awk '{print $1}'
          )"
          {
            echo "binding=$(base64 --wrap=0 "${root}/binding.json")"
            echo "binding_digest=${binding_digest}"
            echo "ci_run_id=${ci_run_id}"
            echo "ci_web_artifact_id=${web_artifact_id}"
            echo "ci_web_artifact_digest=${web_artifact_outer}"
            echo "ci_lambda_artifact_id=${lambda_artifact_id}"
            echo "ci_lambda_artifact_digest=${lambda_artifact_outer}"
            echo "cloud_image_digest=${cloud_image_digest}"
            echo "cloud_runtime_release_digest=${cloud_release}"
            echo "core_capability_digest=${core_capability}"
            echo "core_image_manifest_digest=${core_manifest}"
            echo "deployment_artifact_digest=${deployment_artifact_digest}"
            echo "deployment_artifact_id=${deployment_artifact_id}"
            echo "deployment_artifact_name=${artifact_name}"
            echo "deployment_evidence=$(base64 --wrap=0 "${root}/deployment-evidence.json")"
            echo "deployment_run_attempt=${deployment_attempt}"
            echo "deployment_run_id=${deployment_run_id}"
            echo "lambda_artifact_digest=${lambda_digest}"
            echo "observation=$(base64 --wrap=0 "${root}/observation.json")"
            echo "release_sha=${release_sha}"
            echo "web_artifact_digest=${web_digest}"
          } >>"${GITHUB_OUTPUT}"

  scan:
    name: Exact deployed-subject SBOM and vulnerability gate
    needs: resolve-production
    if: >-
      always() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'CI' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.status == 'completed' &&
          github.event.workflow_run.conclusion == 'success'
        ) ||
        (
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch') &&
          needs.resolve-production.result == 'success'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      evidence_artifact_digest: "sha256:${{ steps.upload.outputs['artifact-digest'] }}"
      evidence_artifact_id: ${{ steps.upload.outputs['artifact-id'] }}
      evidence_artifact_name: ${{ steps.subject.outputs.evidence_artifact_name }}
      lambda_subject_digest: ${{ steps.subject.outputs.lambda_subject_digest }}
      release_sha: ${{ steps.source.outputs.release_sha }}
      web_subject_digest: ${{ steps.subject.outputs.web_subject_digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      IS_PRODUCTION_SCAN: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
      PROD_CI_RUN_ID: ${{ needs.resolve-production.outputs.ci_run_id }}
      PROD_RELEASE_SHA: ${{ needs.resolve-production.outputs.release_sha }}
      PROD_WEB_ARTIFACT_ID: ${{ needs.resolve-production.outputs.ci_web_artifact_id }}
      PROD_WEB_ARTIFACT_DIGEST: ${{ needs.resolve-production.outputs.ci_web_artifact_digest }}
      PROD_LAMBDA_ARTIFACT_ID: ${{ needs.resolve-production.outputs.ci_lambda_artifact_id }}
      PROD_LAMBDA_ARTIFACT_DIGEST: ${{ needs.resolve-production.outputs.ci_lambda_artifact_digest }}
      EXPECTED_WEB_DIGEST: ${{ needs.resolve-production.outputs.web_artifact_digest }}
      EXPECTED_LAMBDA_DIGEST: ${{ needs.resolve-production.outputs.lambda_artifact_digest }}
      PRODUCTION_BINDING: ${{ needs.resolve-production.outputs.binding }}
    steps:
      - name: Resolve exact successful CI run and retained artifact identities
        id: source
        env:
          EVENT_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${IS_PRODUCTION_SCAN}" == true ]]; then
            ci_run_id="${PROD_CI_RUN_ID}"
            release_sha="${PROD_RELEASE_SHA}"
          else
            ci_run_id="${EVENT_CI_RUN_ID}"
            release_sha="${EVENT_RELEASE_SHA}"
          fi
          [[ "${ci_run_id}" =~ ^[1-9][0-9]*$ ]]
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]]
          run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}")"
          jq -e --arg sha "${release_sha}" '
            .path == ".github/workflows/ci.yml" and
            .event == "push" and .head_branch == "master" and
            .head_sha == $sha and .status == "completed" and
            .conclusion == "success"
          ' <<<"${run}" >/dev/null
          artifacts="$(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}/artifacts?per_page=100"
          )"
          artifact_for() {
            local name="$1"
            jq -sce --arg name "${name}" --argjson run "${ci_run_id}" '
              [.[] | .artifacts[] |
                select(
                  .name == $name and .expired == false and
                  .workflow_run.id == $run and
                  (.digest | test("^sha256:[0-9a-f]{64}$"))
                )
              ] |
              if length == 1 then .[0]
              else error("expected one exact CI artifact") end
            ' <<<"${artifacts}"
          }
          web="$(artifact_for "web-${release_sha}")"
          lambda="$(artifact_for "lambdas-${release_sha}")"
          web_id="$(jq -er .id <<<"${web}")"
          web_outer="$(jq -er .digest <<<"${web}")"
          lambda_id="$(jq -er .id <<<"${lambda}")"
          lambda_outer="$(jq -er .digest <<<"${lambda}")"
          if [[ "${IS_PRODUCTION_SCAN}" == true ]]; then
            test "${web_id}" = "${PROD_WEB_ARTIFACT_ID}"
            test "${web_outer}" = "${PROD_WEB_ARTIFACT_DIGEST}"
            test "${lambda_id}" = "${PROD_LAMBDA_ARTIFACT_ID}"
            test "${lambda_outer}" = "${PROD_LAMBDA_ARTIFACT_DIGEST}"
          fi
          {
            echo "ci_run_id=${ci_run_id}"
            echo "release_sha=${release_sha}"
            echo "web_id=${web_id}"
            echo "web_outer=${web_outer}"
            echo "lambda_id=${lambda_id}"
            echo "lambda_outer=${lambda_outer}"
          } >>"${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare ephemeral evidence and enforce OpenVEX horizon
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.release_sha }}"
          bash scripts/materialize-datahub-mcp-lock.sh \
            --openvex-maintenance-only --minimum-remaining-days 14
          mkdir -p \
            "${RUNNER_TEMP}/supply/evidence" \
            "${RUNNER_TEMP}/supply/web" \
            "${RUNNER_TEMP}/supply/lambda" \
            "${RUNNER_TEMP}/supply/tools" \
            "${RUNNER_TEMP}/supply/grype-db"
          cp .github/security/datahub-agent-stack.openvex.json \
            "${RUNNER_TEMP}/supply/evidence/openvex.json"
          if [[ "${IS_PRODUCTION_SCAN}" == true ]]; then
            printf '%s' "${PRODUCTION_BINDING}" | base64 --decode \
              >"${RUNNER_TEMP}/supply/evidence/production-binding.json"
            jq -e '
              .schemaVersion == "archon.lean-production-binding/v2" and
              .observation.excludedFields == ["observedAt"] and
              .topology.legacyAlwaysOnRuntimeAbsent == true
            ' "${RUNNER_TEMP}/supply/evidence/production-binding.json" \
              >/dev/null
          fi

      - name: Download and verify exact CI-built SPA and Lambda
        id: subject
        env:
          CI_RUN_ID: ${{ steps.source.outputs.ci_run_id }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
          WEB_ID: ${{ steps.source.outputs.web_id }}
          WEB_OUTER: ${{ steps.source.outputs.web_outer }}
          LAMBDA_ID: ${{ steps.source.outputs.lambda_id }}
          LAMBDA_OUTER: ${{ steps.source.outputs.lambda_outer }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/supply"
          evidence="${root}/evidence"
          download_artifact() {
            local id="$1" digest="$2" destination="$3"
            local archive="${destination}.zip"
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              >"${archive}"
            test "sha256:$(sha256sum "${archive}" | awk '{print $1}')" = \
              "${digest}"
            mapfile -t entries < <(unzip -Z1 "${archive}")
            test "${#entries[@]}" -ge 1
            test "${#entries[@]}" -le 8
            for entry in "${entries[@]}"; do
              [[ "${entry}" != /* ]]
              [[ "${entry}" != *\\* ]]
              [[ ! "${entry}" =~ (^|/)\.\.(/|$) ]]
            done
            if zipinfo -l "${archive}" |
              awk '$1 ~ /^l[rwxStTs-]{9}$/ {found=1} END {exit found ? 0 : 1}'
            then
              echo "::error::CI artifact contains a symlink"
              exit 1
            fi
            mkdir -p "${destination}"
            unzip -q "${archive}" -d "${destination}"
          }
          download_artifact "${WEB_ID}" "${WEB_OUTER}" "${root}/web-artifact"
          download_artifact \
            "${LAMBDA_ID}" "${LAMBDA_OUTER}" "${root}/lambda-artifact"

          web_tar="${root}/web-artifact/archon-web.tar.gz"
          lambda_tar="${root}/lambda-artifact/archon-lambdas.tar.gz"
          test -f "${web_tar}"
          test -f "${root}/web-artifact/archon-web.tar.gz.sha256"
          test -f "${lambda_tar}"
          test -f "${root}/lambda-artifact/archon-lambdas.tar.gz.sha256"
          web_sha="$(sha256sum "${web_tar}" | awk '{print $1}')"
          lambda_sha="$(sha256sum "${lambda_tar}" | awk '{print $1}')"
          test "$(
            awk 'NR == 1 {print $1}' \
              "${root}/web-artifact/archon-web.tar.gz.sha256"
          )" = "${web_sha}"
          test "$(
            awk 'NR == 1 {print $1}' \
              "${root}/lambda-artifact/archon-lambdas.tar.gz.sha256"
          )" = "${lambda_sha}"
          if [[ "${IS_PRODUCTION_SCAN}" == true ]]; then
            test "sha256:${web_sha}" = "${EXPECTED_WEB_DIGEST}"
            test "sha256:${lambda_sha}" = "${EXPECTED_LAMBDA_DIGEST}"
          fi

          tar -tzf "${web_tar}" >"${root}/web.members"
          while IFS= read -r member; do
            [[ "${member}" != /* ]]
            [[ ! "${member}" =~ (^|/)\.\.(/|$) ]]
            [[ "${member}" != *.map ]]
          done <"${root}/web.members"
          tar -xzf "${web_tar}" -C "${root}/web"
          test -f "${root}/web/index.html"

          tar -tzf "${lambda_tar}" >"${root}/lambda.members"
          while IFS= read -r member; do
            case "${member}" in
              control|control/*|runtime-control|runtime-control/*) ;;
              *)
                echo "::error::unexpected Lambda archive member ${member}"
                exit 1
                ;;
            esac
            [[ "${member}" != /* ]]
            [[ ! "${member}" =~ (^|/)\.\.(/|$) ]]
          done <"${root}/lambda.members"
          if LC_ALL=C sort "${root}/lambda.members" |
            uniq --repeated | grep -q .
          then
            echo "::error::duplicate Lambda archive member"
            exit 1
          fi
          for required in \
            control/index.js \
            control/remediation.js \
            runtime-control/index.js \
            runtime-control/session.js \
            runtime-control/node_modules; do
            grep -Eq "^${required}(/|$)" "${root}/lambda.members"
          done
          tar -xzf "${lambda_tar}" -C "${root}/lambda"
          printf '%s\n' \
            "archon-production-runtime-control:runtime-control.json" \
            "archon-production-runtime-remediation:control.json" \
            >"${evidence}/deployed-lambda-map.txt"

          gh attestation verify "${web_tar}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type \
              "https://github.com/upgradedev/archon-datahub/attestations/ci-release/v1" \
            --signer-workflow \
              "github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
            --source-digest "${RELEASE_SHA}" \
            --deny-self-hosted-runners >/dev/null
          gh attestation verify "${lambda_tar}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type \
              "https://github.com/upgradedev/archon-datahub/attestations/ci-release/v1" \
            --signer-workflow \
              "github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
            --source-digest "${RELEASE_SHA}" \
            --deny-self-hosted-runners >/dev/null

          printf '%s  %s\n' "${web_sha}" archon-web.tar.gz \
            >"${evidence}/web-subject.sha256"
          printf '%s  %s\n' "${lambda_sha}" archon-lambdas.tar.gz \
            >"${evidence}/lambda-subject.sha256"
          cat \
            "${evidence}/web-subject.sha256" \
            "${evidence}/lambda-subject.sha256" \
            >"${evidence}/release-subjects.sha256"
          cp "${web_tar}" "${evidence}/archon-web.tar.gz"
          cp "${lambda_tar}" "${evidence}/archon-lambdas.tar.gz"
          {
            echo "web_subject_digest=sha256:${web_sha}"
            echo "lambda_subject_digest=sha256:${lambda_sha}"
            echo "evidence_artifact_name=supply-chain-${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >>"${GITHUB_OUTPUT}"

      - name: Install checksum-pinned Syft and Grype
        env:
          TOOLS: ${{ runner.temp }}/supply/tools
        run: |
          set -euo pipefail
          mkdir -p "${TOOLS}/syft" "${TOOLS}/grype"
          syft="${TOOLS}/syft/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          grype="${TOOLS}/grype/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            --output "${syft}"
          curl --fail --silent --show-error --location \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            --output "${grype}"
          echo "${SYFT_ARCHIVE_SHA256}  ${syft}" | sha256sum --check --strict
          echo "${GRYPE_ARCHIVE_SHA256}  ${grype}" | sha256sum --check --strict
          tar -xzf "${syft}" -C "${TOOLS}/syft" syft
          tar -xzf "${grype}" -C "${TOOLS}/grype" grype
          chmod 0755 "${TOOLS}/syft/syft" "${TOOLS}/grype/grype"
          test "$(sha256sum "${TOOLS}/syft/syft" | awk '{print $1}')" = \
            "${SYFT_BINARY_SHA256}"
          test "$(sha256sum "${TOOLS}/grype/grype" | awk '{print $1}')" = \
            "${GRYPE_BINARY_SHA256}"

      - name: Refresh and seal vulnerability intelligence
        env:
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/supply/grype-db
          GRYPE: ${{ runner.temp }}/supply/tools/grype/grype
          EVIDENCE: ${{ runner.temp }}/supply/evidence
        run: |
          set -euo pipefail
          "${GRYPE}" db update
          "${GRYPE}" db check
          "${GRYPE}" db status >"${EVIDENCE}/grype-db-status.txt"
          (
            cd "${GRYPE_DB_CACHE_DIR}"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) >"${EVIDENCE}/grype-db-files.sha256"
          test -s "${EVIDENCE}/grype-db-files.sha256"
          printf '%s\n' \
            "maxAllowedBuiltAge=${GRYPE_DB_MAX_ALLOWED_BUILT_AGE}" \
            "hashValidationRequired=${GRYPE_DB_VALIDATE_BY_HASH_ON_START}" \
            "ageValidationRequired=${GRYPE_DB_VALIDATE_AGE}" \
            >"${EVIDENCE}/grype-db-policy.txt"

      - name: Generate Syft SBOMs and Grype reports for deployed subjects
        env:
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/supply/grype-db
          SYFT: ${{ runner.temp }}/supply/tools/syft/syft
          GRYPE: ${{ runner.temp }}/supply/tools/grype/grype
          ROOT: ${{ runner.temp }}/supply
          EVIDENCE: ${{ runner.temp }}/supply/evidence
        run: |
          set -euo pipefail
          "${SYFT}" "dir:${ROOT}/web" \
            -o "syft-json=${EVIDENCE}/archon-web.syft.json" \
            -o "spdx-json=${EVIDENCE}/archon-web.spdx.json" \
            -o "cyclonedx-json=${EVIDENCE}/archon-web.cyclonedx.json"
          "${SYFT}" "dir:${ROOT}/lambda" \
            -o "syft-json=${EVIDENCE}/archon-lambda.syft.json" \
            -o "spdx-json=${EVIDENCE}/archon-lambda.spdx.json" \
            -o "cyclonedx-json=${EVIDENCE}/archon-lambda.cyclonedx.json"
          "${GRYPE}" "sbom:${EVIDENCE}/archon-web.syft.json" --by-cve \
            -o "json=${EVIDENCE}/grype-web-report.json" \
            -o "sarif=${EVIDENCE}/grype-web-report.sarif" \
            -o "table=${EVIDENCE}/grype-web-report.txt"
          "${GRYPE}" "sbom:${EVIDENCE}/archon-lambda.syft.json" --by-cve \
            -o "json=${EVIDENCE}/grype-lambda-report.json" \
            -o "sarif=${EVIDENCE}/grype-lambda-report.sarif" \
            -o "table=${EVIDENCE}/grype-lambda-report.txt"
          jq -e '.packages | type == "array"' \
            "${EVIDENCE}/archon-web.spdx.json" \
            "${EVIDENCE}/archon-lambda.spdx.json" >/dev/null
          jq -e '.matches | type == "array"' \
            "${EVIDENCE}/grype-web-report.json" \
            "${EVIDENCE}/grype-lambda-report.json" >/dev/null

      - name: Seal canonical exact provenance
        env:
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
          CI_RUN_ID: ${{ steps.source.outputs.ci_run_id }}
          WEB_ID: ${{ steps.source.outputs.web_id }}
          WEB_OUTER: ${{ steps.source.outputs.web_outer }}
          LAMBDA_ID: ${{ steps.source.outputs.lambda_id }}
          LAMBDA_OUTER: ${{ steps.source.outputs.lambda_outer }}
          WEB_SUBJECT: ${{ steps.subject.outputs.web_subject_digest }}
          LAMBDA_SUBJECT: ${{ steps.subject.outputs.lambda_subject_digest }}
          EVIDENCE: ${{ runner.temp }}/supply/evidence
          TOOLS: ${{ runner.temp }}/supply/tools
        run: |
          set -euo pipefail
          production=null
          if [[ "${IS_PRODUCTION_SCAN}" == true ]]; then
            production="$(
              jq -cS . "${EVIDENCE}/production-binding.json"
            )"
          fi
          db_manifest="sha256:$(
            sha256sum "${EVIDENCE}/grype-db-files.sha256" | awk '{print $1}'
          )"
          jq -cnS \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg releaseSha "${RELEASE_SHA}" \
            --argjson ciRunId "${CI_RUN_ID}" \
            --argjson webId "${WEB_ID}" \
            --arg webOuter "${WEB_OUTER}" \
            --arg webSubject "${WEB_SUBJECT}" \
            --argjson lambdaId "${LAMBDA_ID}" \
            --arg lambdaOuter "${LAMBDA_OUTER}" \
            --arg lambdaSubject "${LAMBDA_SUBJECT}" \
            --arg syftVersion "${SYFT_VERSION}" \
            --arg syftBinary "sha256:${SYFT_BINARY_SHA256}" \
            --arg grypeVersion "${GRYPE_VERSION}" \
            --arg grypeBinary "sha256:${GRYPE_BINARY_SHA256}" \
            --arg databaseManifest "${db_manifest}" \
            --arg openVexDigest "sha256:$(
              sha256sum "${EVIDENCE}/openvex.json" | awk '{print $1}'
            )" \
            --arg webSpdx "sha256:$(
              sha256sum "${EVIDENCE}/archon-web.spdx.json" | awk '{print $1}'
            )" \
            --arg lambdaSpdx "sha256:$(
              sha256sum "${EVIDENCE}/archon-lambda.spdx.json" | awk '{print $1}'
            )" \
            --argjson productionDeployment "${production}" \
            --arg workflowRun \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '
              {
                schemaVersion:"archon.verified-ci-artifact/v4",
                repository:$repository,
                releaseSha:$releaseSha,
                ci:{runId:$ciRunId,branch:"master",result:"success"},
                subjects:[
                  {
                    name:"archon-web.tar.gz",
                    digest:$webSubject,
                    artifact:{id:$webId,digest:$webOuter}
                  },
                  {
                    name:"archon-lambdas.tar.gz",
                    digest:$lambdaSubject,
                    artifact:{id:$lambdaId,digest:$lambdaOuter}
                  }
                ],
                deployedScope:{
                  spa:true,
                  lambdas:true,
                  cloudRuntime:
                    ($productionDeployment != null),
                  legacyMonolithContainerProductionSubject:false
                },
                scanners:{
                  syft:{version:$syftVersion,binaryDigest:$syftBinary},
                  grype:{version:$grypeVersion,binaryDigest:$grypeBinary},
                  vulnerabilityDatabaseManifestDigest:$databaseManifest
                },
                openVex:{
                  path:".github/security/datahub-agent-stack.openvex.json",
                  digest:$openVexDigest,
                  minimumRemainingDays:14
                },
                sboms:{
                  webSpdxDigest:$webSpdx,
                  lambdaSpdxDigest:$lambdaSpdx
                },
                productionDeployment:$productionDeployment,
                workflowRun:$workflowRun
              }
            ' >"${EVIDENCE}/provenance.json"
          jq -e '
            .schemaVersion == "archon.verified-ci-artifact/v4" and
            .deployedScope.legacyMonolithContainerProductionSubject == false and
            (.subjects | map(.name)) ==
              ["archon-web.tar.gz","archon-lambdas.tar.gz"] and
            (if .productionDeployment == null then true
             else
               .productionDeployment.schemaVersion ==
                 "archon.lean-production-binding/v2" and
               .productionDeployment.observation.excludedFields ==
                 ["observedAt"]
             end)
          ' "${EVIDENCE}/provenance.json" >/dev/null
          sums_tmp="${RUNNER_TEMP}/supply/SHA256SUMS.tmp"
          rm -f -- "${sums_tmp}"
          (
            cd "${EVIDENCE}"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' |
              LC_ALL=C sort -z | xargs -0 sha256sum >"${sums_tmp}"
            mv -- "${sums_tmp}" SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Retain exact supply-chain evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.subject.outputs.evidence_artifact_name }}
          path: ${{ runner.temp }}/supply/evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Fail on high or critical deployed-subject vulnerabilities
        env:
          EVIDENCE: ${{ runner.temp }}/supply/evidence
        run: |
          set -euo pipefail
          for report in grype-web-report.json grype-lambda-report.json; do
            jq -e '
              [ .matches[] |
                select(
                  .vulnerability.severity == "High" or
                  .vulnerability.severity == "Critical"
                )
              ] | length == 0
            ' "${EVIDENCE}/${report}" >/dev/null
          done

  revalidate-production:
    name: Reject lean production TOCTOU v2
    needs: [resolve-production, scan]
    if: >-
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch') &&
      needs.resolve-production.result == 'success' &&
      needs.scan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-observer
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      artifact_digest: "sha256:${{ steps.upload.outputs['artifact-digest'] }}"
      artifact_id: ${{ steps.upload.outputs['artifact-id'] }}
      artifact_name: ${{ steps.revalidate.outputs.artifact_name }}
      revalidation_digest: ${{ steps.revalidate.outputs.revalidation_digest }}
    env:
      BASH_ENV: /dev/null
      EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      DEPLOY_REGION: ${{ vars.AWS_REGION }}
      READ_ROLE_ARN: ${{ vars.AWS_RUNTIME_READ_ROLE_ARN }}
      SEALED_BINDING: ${{ needs.resolve-production.outputs.binding }}
      SEALED_BINDING_DIGEST: ${{ needs.resolve-production.outputs.binding_digest }}
      SEALED_EVIDENCE: ${{ needs.resolve-production.outputs.deployment_evidence }}
      SEALED_OBSERVATION: ${{ needs.resolve-production.outputs.observation }}
      SCAN_ARTIFACT_DIGEST: ${{ needs.scan.outputs.evidence_artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate observer control plane before AWS trust
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          OUTPUT_PATH: ${{ runner.temp }}/control-plane-security-gates.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = "refs/heads/master"
          bash scripts/verify-github-control-plane.sh
          jq -e --arg sha "${GITHUB_SHA}" '
            .schemaVersion == "archon.deployment-control-plane-gates/v1" and
            .branch == "master" and .sourceSha == $sha and
            all(.workflows[]; .conclusion == "success")
          ' "${OUTPUT_PATH}" >/dev/null

      - name: Configure read-only production observer through OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RUNTIME_READ_ROLE_ARN }}
          role-session-name: archon-${{ github.run_id }}-lean-revalidate
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Re-download exact evidence and re-observe production
        id: revalidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP}/lean-production-revalidation"
          mkdir -p "${root}"
          printf '%s' "${SEALED_BINDING}" | base64 --decode \
            >"${root}/binding.json"
          printf '%s' "${SEALED_EVIDENCE}" | base64 --decode \
            >"${root}/sealed-evidence.json"
          printf '%s' "${SEALED_OBSERVATION}" | base64 --decode \
            >"${root}/sealed-observation.json"
          test "sha256:$(sha256sum "${root}/binding.json" | awk '{print $1}')" = \
            "${SEALED_BINDING_DIGEST}"
          jq -e '
            .schemaVersion == "archon.lean-production-binding/v2" and
            .observation.excludedFields == ["observedAt"] and
            .observation.exactStableProjectionMatch == true
          ' "${root}/binding.json" >/dev/null

          release_sha="$(jq -er .releaseSha "${root}/binding.json")"
          deployment_run_id="$(
            jq -er .deployment.runId "${root}/binding.json"
          )"
          deployment_attempt="$(
            jq -er .deployment.runAttempt "${root}/binding.json"
          )"
          deployment_artifact_id="$(
            jq -er .deployment.artifact.id "${root}/binding.json"
          )"
          deployment_artifact_name="$(
            jq -er .deployment.artifact.name "${root}/binding.json"
          )"
          deployment_artifact_digest="$(
            jq -er .deployment.artifact.digest "${root}/binding.json"
          )"
          test "${deployment_artifact_name}" = \
            "deployment-evidence-production-${release_sha}-${deployment_run_id}"
          artifact="$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${deployment_artifact_id}"
          )"
          jq -e \
            --arg name "${deployment_artifact_name}" \
            --arg digest "${deployment_artifact_digest}" \
            --argjson run "${deployment_run_id}" '
              .name == $name and .digest == $digest and
              .expired == false and .workflow_run.id == $run
            ' <<<"${artifact}" >/dev/null
          archive="${root}/deployment.zip"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${deployment_artifact_id}/zip" \
            >"${archive}"
          test "sha256:$(sha256sum "${archive}" | awk '{print $1}')" = \
            "${deployment_artifact_digest}"
          mapfile -t entries < <(unzip -Z1 "${archive}")
          test "${#entries[@]}" = 2
          diff -u \
            <(printf '%s\n' "${entries[@]}" | LC_ALL=C sort) \
            <(printf '%s\n' deployment-evidence.json observation.json) \
            >/dev/null
          unzip -p "${archive}" deployment-evidence.json \
            >"${root}/evidence.raw.json"
          unzip -p "${archive}" observation.json \
            >"${root}/observation.raw.json"

          web_digest="$(jq -er .promotion.webArtifactDigest "${root}/binding.json")"
          lambda_digest="$(
            jq -er .promotion.lambdaArtifactDigest "${root}/binding.json"
          )"
          cloud_release="$(
            jq -er .promotion.cloudRuntimeReleaseDigest "${root}/binding.json"
          )"
          cloud_image="$(
            jq -er .promotion.cloudImageDigest "${root}/binding.json"
          )"
          core_capability="$(
            jq -er .promotion.coreCapabilityDigest "${root}/binding.json"
          )"
          core_manifest="$(
            jq -er .promotion.coreImageManifestDigest "${root}/binding.json"
          )"
          ci_run_id="$(jq -er .ci.runId "${root}/binding.json")"
          jq -cnS \
            --arg stage production \
            --arg releaseSha "${release_sha}" \
            --argjson ciRunId "${ci_run_id}" \
            --argjson deploymentRunId "${deployment_run_id}" \
            --arg webArtifactDigest "${web_digest}" \
            --arg lambdaArtifactDigest "${lambda_digest}" \
            --arg cloudRuntimeReleaseDigest "${cloud_release}" \
            --arg coreCapabilityDigest "${core_capability}" \
            --arg coreImageManifestDigest "${core_manifest}" \
            --arg cloudImageDigest "${cloud_image}" \
            '{$stage,$releaseSha,$ciRunId,$deploymentRunId,
              $webArtifactDigest,$lambdaArtifactDigest,
              $cloudRuntimeReleaseDigest,$coreCapabilityDigest,
              $coreImageManifestDigest,$cloudImageDigest}' \
            >"${root}/expectations.json"
          node scripts/validate-lean-production-evidence.mjs pair \
            "${root}/evidence.raw.json" "${root}/observation.raw.json" \
            "${root}/expectations.json" \
            "${root}/artifact-evidence.json" \
            "${root}/artifact-observation.json"
          cmp --silent \
            "${root}/sealed-evidence.json" "${root}/artifact-evidence.json"
          cmp --silent \
            "${root}/sealed-observation.json" \
            "${root}/artifact-observation.json"

          deployment_control_sha="$(
            jq -er .deployment.controlPlaneSha "${root}/binding.json"
          )"
          gh attestation verify "${root}/evidence.raw.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type \
              "https://github.com/upgradedev/archon-datahub/attestations/aws-deployment/v2" \
            --signer-workflow \
              "github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml" \
            --source-digest "${deployment_control_sha}" \
            --deny-self-hosted-runners >/dev/null

          for kind in web lambda; do
            id="$(jq -er ".ci.artifacts.${kind}.id" "${root}/binding.json")"
            name="$(jq -er ".ci.artifacts.${kind}.name" "${root}/binding.json")"
            digest="$(
              jq -er ".ci.artifacts.${kind}.archiveDigest" \
                "${root}/binding.json"
            )"
            current="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            )"
            jq -e \
              --arg name "${name}" --arg digest "${digest}" \
              --argjson run "${ci_run_id}" '
                .name == $name and .digest == $digest and
                .expired == false and .workflow_run.id == $run
              ' <<<"${current}" >/dev/null
          done

          ARCHON_STAGE=production \
          ARCHON_OBSERVATION_OUTPUT="${root}/reobserved.raw.json" \
          EXPECT_CORE_IDLE=true \
            bash scripts/observe-aws-live-runtime.sh
          node scripts/validate-lean-production-evidence.mjs observation \
            "${root}/reobserved.raw.json" "${root}/expectations.json" \
            "${root}/reobserved.json"
          node scripts/validate-lean-production-evidence.mjs stable \
            "${root}/sealed-observation.json" "${root}/sealed.stable.json"
          node scripts/validate-lean-production-evidence.mjs stable \
            "${root}/reobserved.json" "${root}/reobserved.stable.json"
          cmp --silent \
            "${root}/sealed.stable.json" "${root}/reobserved.stable.json"

          aws cloudformation describe-stacks \
            --stack-name Archon-production-Judge \
            --region "${DEPLOY_REGION}" --no-paginate --output json \
            >"${root}/judge.json"
          cloud_image_uri="$(
            jq -er '
              [.Stacks[0].Outputs[] |
               select(.OutputKey == "ArchonCloudRuntimeImageUri")] |
              if length == 1 then .[0].OutputValue else error("image") end
            ' "${root}/judge.json"
          )"
          test "${cloud_image_uri##*@}" = "${cloud_image}"
          registry="${cloud_image_uri%%/*}"
          aws ecr get-login-password --region "${DEPLOY_REGION}" |
            docker login --username AWS --password-stdin "${registry}"
          gh attestation verify "oci://${cloud_image_uri}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type \
              "https://github.com/upgradedev/archon-datahub/attestations/datahub-cloud-runtime/v1" \
            --signer-workflow \
              "github.com/${GITHUB_REPOSITORY}/.github/workflows/datahub-cloud-runtime-image.yml" \
            --deny-self-hosted-runners >/dev/null
          docker logout "${registry}" >/dev/null

          sealed_digest="sha256:$(
            sha256sum "${root}/sealed-observation.json" | awk '{print $1}'
          )"
          reobserved_digest="sha256:$(
            sha256sum "${root}/reobserved.json" | awk '{print $1}'
          )"
          stable_digest="sha256:$(
            sha256sum "${root}/sealed.stable.json" | awk '{print $1}'
          )"
          revalidated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          web_id="$(jq -er .ci.artifacts.web.id "${root}/binding.json")"
          web_outer="$(
            jq -er .ci.artifacts.web.archiveDigest "${root}/binding.json"
          )"
          lambda_id="$(jq -er .ci.artifacts.lambda.id "${root}/binding.json")"
          lambda_outer="$(
            jq -er .ci.artifacts.lambda.archiveDigest "${root}/binding.json"
          )"
          jq -cnS \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg releaseSha "${release_sha}" \
            --arg bindingDigest "${SEALED_BINDING_DIGEST}" \
            --arg scanDigest "${SCAN_ARTIFACT_DIGEST}" \
            --argjson deploymentRunId "${deployment_run_id}" \
            --argjson deploymentAttempt "${deployment_attempt}" \
            --argjson deploymentArtifactId "${deployment_artifact_id}" \
            --arg deploymentArtifactName "${deployment_artifact_name}" \
            --arg deploymentArtifactDigest "${deployment_artifact_digest}" \
            --argjson ciRunId "${ci_run_id}" \
            --argjson webId "${web_id}" \
            --arg webOuter "${web_outer}" \
            --argjson lambdaId "${lambda_id}" \
            --arg lambdaOuter "${lambda_outer}" \
            --arg webDigest "${web_digest}" \
            --arg lambdaDigest "${lambda_digest}" \
            --arg cloudRelease "${cloud_release}" \
            --arg cloudImage "${cloud_image}" \
            --arg coreCapability "${core_capability}" \
            --arg coreManifest "${core_manifest}" \
            --arg sealedDigest "${sealed_digest}" \
            --arg reobservedDigest "${reobserved_digest}" \
            --arg stableDigest "${stable_digest}" \
            --arg revalidatedAt "${revalidated_at}" \
            --arg workflowRun \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '
              {
                schemaVersion:"archon.lean-production-revalidation/v2",
                repository:$repository,
                stage:"production",
                releaseSha:$releaseSha,
                originalBindingDigest:$bindingDigest,
                scanEvidenceArtifactDigest:$scanDigest,
                deployment:{
                  runId:$deploymentRunId,
                  runAttempt:$deploymentAttempt,
                  artifactId:$deploymentArtifactId,
                  artifactName:$deploymentArtifactName,
                  artifactDigest:$deploymentArtifactDigest
                },
                ci:{
                  runId:$ciRunId,
                  webArtifactId:$webId,
                  webArtifactDigest:$webOuter,
                  lambdaArtifactId:$lambdaId,
                  lambdaArtifactDigest:$lambdaOuter
                },
                promotion:{
                  webArtifactDigest:$webDigest,
                  lambdaArtifactDigest:$lambdaDigest,
                  cloudRuntimeReleaseDigest:$cloudRelease,
                  cloudImageDigest:$cloudImage,
                  coreCapabilityDigest:$coreCapability,
                  coreImageManifestDigest:$coreManifest
                },
                observations:{
                  sealedDigest:$sealedDigest,
                  reobservedDigest:$reobservedDigest,
                  stableProjectionDigest:$stableDigest,
                  exactStableProjectionMatch:true,
                  excludedFields:["observedAt"]
                },
                deploymentAttestationReverified:true,
                cloudRuntimeAttestationReverified:true,
                unchanged:true,
                revalidatedAt:$revalidatedAt,
                workflowRun:$workflowRun
              }
            ' >"${root}/revalidation.json"
          jq -e '
            .schemaVersion == "archon.lean-production-revalidation/v2" and
            .observations.excludedFields == ["observedAt"] and
            .observations.exactStableProjectionMatch == true and
            .deploymentAttestationReverified == true and
            .cloudRuntimeAttestationReverified == true and
            .unchanged == true
          ' "${root}/revalidation.json" >/dev/null
          cp "${root}/binding.json" "${root}/production-binding.json"
          (
            cd "${root}"
            sha256sum \
              production-binding.json \
              revalidation.json \
              reobserved.json \
              sealed-observation.json >SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          artifact_name="lean-production-revalidation-${release_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "artifact_name=${artifact_name}"
            echo "revalidation_digest=sha256:$(
              sha256sum "${root}/revalidation.json" | awk '{print $1}'
            )"
          } >>"${GITHUB_OUTPUT}"

      - name: Retain exact production revalidation
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.revalidate.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/lean-production-revalidation/SHA256SUMS
            ${{ runner.temp }}/lean-production-revalidation/production-binding.json
            ${{ runner.temp }}/lean-production-revalidation/revalidation.json
            ${{ runner.temp }}/lean-production-revalidation/reobserved.json
            ${{ runner.temp }}/lean-production-revalidation/sealed-observation.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  publish-sarif:
    name: Publish deployed-subject Grype SARIF
    needs: scan
    if: needs.scan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.scan.outputs.evidence_artifact_id }}
          path: ${{ runner.temp }}/evidence
      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: ${{ runner.temp }}/evidence/grype-web-report.sarif
          category: grype-deployed-spa
      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: ${{ runner.temp }}/evidence/grype-lambda-report.sarif
          category: grype-deployed-lambdas

  attest:
    name: Sign exact deployed-subject provenance and SBOMs
    needs: [resolve-production, scan, revalidate-production]
    if: >-
      always() &&
      needs.scan.result == 'success' &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.revalidate-production.result == 'skipped'
        ) ||
        (
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch') &&
          needs.resolve-production.result == 'success' &&
          needs.revalidate-production.result == 'success'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      IS_PRODUCTION_SCAN: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
      EXPECTED_SCAN_DIGEST: ${{ needs.scan.outputs.evidence_artifact_digest }}
      EXPECTED_REVALIDATION_DIGEST: ${{ needs.revalidate-production.outputs.revalidation_digest }}
    steps:
      - name: Download exact scan evidence by immutable artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.scan.outputs.evidence_artifact_id }}
          path: ${{ runner.temp }}/evidence

      - name: Verify evidence envelope and bind final gate
        env:
          RELEASE_SHA: ${{ needs.scan.outputs.release_sha }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/evidence"
          scan_artifact="$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ needs.scan.outputs.evidence_artifact_id }}"
          )"
          test "$(jq -r .digest <<<"${scan_artifact}")" = \
            "${EXPECTED_SCAN_DIGEST}"
          test "$(jq -r .expired <<<"${scan_artifact}")" = false
          (
            cd "${evidence}"
            sha256sum --check --strict SHA256SUMS
          )
          jq -e --arg sha "${RELEASE_SHA}" '
            .schemaVersion == "archon.verified-ci-artifact/v4" and
            .releaseSha == $sha and
            .deployedScope.legacyMonolithContainerProductionSubject == false and
            (.subjects | map(.name)) ==
              ["archon-web.tar.gz","archon-lambdas.tar.gz"]
          ' "${evidence}/provenance.json" >/dev/null
          test "$(
            awk '$2 == "archon-web.tar.gz" {print "sha256:" $1}' \
              "${evidence}/release-subjects.sha256"
          )" = "${{ needs.scan.outputs.web_subject_digest }}"
          test "$(
            awk '$2 == "archon-lambdas.tar.gz" {print "sha256:" $1}' \
              "${evidence}/release-subjects.sha256"
          )" = "${{ needs.scan.outputs.lambda_subject_digest }}"

          revalidation=null
          if [[ "${IS_PRODUCTION_SCAN}" == true ]]; then
            mkdir -p "${RUNNER_TEMP}/revalidation"
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ needs.revalidate-production.outputs.artifact_id }}/zip" \
              >"${RUNNER_TEMP}/revalidation.zip"
            artifact="$(
              gh api \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ needs.revalidate-production.outputs.artifact_id }}"
            )"
            test "$(jq -r .digest <<<"${artifact}")" = \
              "${{ needs.revalidate-production.outputs.artifact_digest }}"
            test "sha256:$(
              sha256sum "${RUNNER_TEMP}/revalidation.zip" | awk '{print $1}'
            )" = "${{ needs.revalidate-production.outputs.artifact_digest }}"
            mapfile -t revalidation_entries < <(
              unzip -Z1 "${RUNNER_TEMP}/revalidation.zip"
            )
            test "${#revalidation_entries[@]}" = 5
            for entry in "${revalidation_entries[@]}"; do
              [[ "${entry}" != /* ]]
              [[ "${entry}" != *\\* ]]
              [[ ! "${entry}" =~ (^|/)\.\.(/|$) ]]
            done
            if zipinfo -l "${RUNNER_TEMP}/revalidation.zip" |
              awk '$1 ~ /^l[rwxStTs-]{9}$/ {found=1} END {exit found ? 0 : 1}'
            then
              echo "::error::revalidation artifact contains a symlink"
              exit 1
            fi
            unzip -q "${RUNNER_TEMP}/revalidation.zip" \
              -d "${RUNNER_TEMP}/revalidation"
            (
              cd "${RUNNER_TEMP}/revalidation"
              sha256sum --check --strict SHA256SUMS
            )
            test "sha256:$(
              sha256sum "${RUNNER_TEMP}/revalidation/revalidation.json" |
                awk '{print $1}'
            )" = "${EXPECTED_REVALIDATION_DIGEST}"
            revalidation="$(
              jq -cS . "${RUNNER_TEMP}/revalidation/revalidation.json"
            )"
          fi
          jq -cS \
            --arg scanArtifactDigest "${EXPECTED_SCAN_DIGEST}" \
            --argjson productionRevalidation "${revalidation}" \
            --arg signedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
              . + {
                signedGate:{
                  scanEvidenceArtifactDigest:$scanArtifactDigest,
                  productionRevalidation:$productionRevalidation,
                  exactSubjectsReverified:true,
                  signedAt:$signedAt
                }
              }
            ' "${evidence}/provenance.json" \
            >"${evidence}/signed-predicate.json"
          jq -e '
            .schemaVersion == "archon.verified-ci-artifact/v4" and
            .signedGate.exactSubjectsReverified == true and
            (if .productionDeployment == null
             then .signedGate.productionRevalidation == null
             else
               .signedGate.productionRevalidation.schemaVersion ==
                 "archon.lean-production-revalidation/v2" and
               .signedGate.productionRevalidation.unchanged == true
             end)
          ' "${evidence}/signed-predicate.json" >/dev/null

      - name: Sign verified exact-subject provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ runner.temp }}/evidence/release-subjects.sha256
          predicate-type: https://github.com/upgradedev/archon-datahub/attestations/verified-ci-artifact/v4
          predicate-path: ${{ runner.temp }}/evidence/signed-predicate.json

      - name: Sign deployed SPA SPDX SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ runner.temp }}/evidence/web-subject.sha256
          sbom-path: ${{ runner.temp }}/evidence/archon-web.spdx.json

      - name: Sign deployed Lambda SPDX SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ runner.temp }}/evidence/lambda-subject.sha256
          sbom-path: ${{ runner.temp }}/evidence/archon-lambda.spdx.json

      - name: Retain signed gate projection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-supply-chain-${{ needs.scan.outputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/evidence/signed-predicate.json
            ${{ runner.temp }}/evidence/release-subjects.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
