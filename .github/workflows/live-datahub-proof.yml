name: Live dual-runtime DataHub proof

run-name: Prove ${{ inputs.profile }} runtime for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Exact deployed environment
        required: true
        type: choice
        options: [staging, production]
      release_sha:
        description: Exact deployed merged master SHA
        required: true
        type: string
      deployment_run_id:
        description: Successful lean deploy workflow run ID
        required: true
        type: string
      deployment_artifact_id:
        description: Exact deployment-evidence artifact ID
        required: true
        type: string
      deployment_artifact_digest:
        description: Exact GitHub sha256 artifact digest
        required: true
        type: string
      governed_canary_run_id:
        description: Successful governed-canary workflow run ID that proves rollback
        required: true
        type: string
      profile:
        description: Runtime binding to prove
        required: true
        type: choice
        options: [cloud, core]
      runtime_session_id:
        description: Required only for Core; active judge runtime session ID
        required: false
        type: string
      query:
        description: Exact canonical synthetic dataset URN
        required: true
        type: string

permissions: {}

concurrency:
  group: live-datahub-proof-${{ inputs.stage }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  prove:
    name: Bind deployment, runtime health, and semantic proof
    if: >-
      github.repository == 'upgradedev/archon-datahub' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: datahub-demo
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: ${{ inputs.stage }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
      DEPLOYMENT_ARTIFACT_ID: ${{ inputs.deployment_artifact_id }}
      DEPLOYMENT_ARTIFACT_DIGEST: ${{ inputs.deployment_artifact_digest }}
      GOVERNED_CANARY_RUN_ID: ${{ inputs.governed_canary_run_id }}
      PROFILE: ${{ inputs.profile }}
      RUNTIME_SESSION_ID: ${{ inputs.runtime_session_id }}
      ARCHON_DEMO_QUERY: ${{ inputs.query }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate immutable proof coordinates
        run: |
          set -euo pipefail
          [[ "${STAGE}" =~ ^(staging|production)$ ]]
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${DEPLOYMENT_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${DEPLOYMENT_ARTIFACT_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${DEPLOYMENT_ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${GOVERNED_CANARY_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${PROFILE}" =~ ^(cloud|core)$ ]]
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)" = \
            "${RELEASE_SHA}"
          canonical_query="$(jq -er '.binding.targetUrn' contracts/datahub-demo-state-v1.json)"
          test "${ARCHON_DEMO_QUERY}" = "${canonical_query}"
          if [[ "${PROFILE}" == core ]]; then
            [[ "${RUNTIME_SESSION_ID}" =~ ^rs_[A-Za-z0-9_-]{43}$ ]]
          else
            test -z "${RUNTIME_SESSION_ID}"
          fi

      - name: Bind current green GitHub control plane
        env:
          ATTEMPTS: "40"
          BACKOFF_SECONDS: "15"
          OUTPUT_PATH: ${{ runner.temp }}/live-proof/control-plane-gates.json
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/live-proof"
          bash scripts/verify-github-control-plane.sh

      - name: Download and verify exact deployment evidence
        id: deployment
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/live-proof/deployment"
          mkdir -p "${root}"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}")"
          jq -e --arg sha "${RELEASE_SHA}" '
            .path == ".github/workflows/deploy.yml" and
            .event == "workflow_dispatch" and
            .head_branch == "master" and .head_sha == $sha and
            .status == "completed" and .conclusion == "success"
          ' <<<"${run_json}" >/dev/null
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${DEPLOYMENT_ARTIFACT_ID}")"
          expected_name="deployment-evidence-${STAGE}-${RELEASE_SHA}-${DEPLOYMENT_RUN_ID}"
          jq -e \
            --arg name "${expected_name}" \
            --arg digest "${DEPLOYMENT_ARTIFACT_DIGEST}" \
            --argjson run "${DEPLOYMENT_RUN_ID}" '
              .name == $name and .digest == $digest and
              .expired == false and .workflow_run.id == $run
            ' <<<"${artifact}" >/dev/null
          archive="${root}/artifact.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${DEPLOYMENT_ARTIFACT_ID}/zip" \
            >"${archive}"
          test "sha256:$(sha256sum "${archive}" | awk '{print $1}')" = \
            "${DEPLOYMENT_ARTIFACT_DIGEST}"
          python3 - "${archive}" "${root}/subjects" <<'PY'
          import pathlib
          import shutil
          import stat
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          destination.mkdir(mode=0o700)
          expected = {"deployment-evidence.json", "observation.json"}
          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
              if set(names) != expected or len(names) != len(expected):
                  raise SystemExit("deployment artifact inventory is not exact")
              for info in bundle.infolist():
                  path = pathlib.PurePosixPath(info.filename)
                  mode = info.external_attr >> 16
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or stat.S_ISLNK(mode)
                      or (mode and not stat.S_ISREG(mode))
                      or info.file_size > 2 * 1024 * 1024
                  ):
                      raise SystemExit("unsafe deployment artifact member")
                  target = destination / info.filename
                  with bundle.open(info) as source, target.open("xb") as output:
                      shutil.copyfileobj(source, output)
          PY
          evidence="${root}/subjects/deployment-evidence.json"
          observation="${root}/subjects/observation.json"
          gh attestation verify "${evidence}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml" \
            --signer-digest "${RELEASE_SHA}" \
            --source-digest "${RELEASE_SHA}" \
            --predicate-type "https://github.com/upgradedev/archon-datahub/attestations/aws-deployment/v2" \
            >/dev/null
          jq -e \
            --arg stage "${STAGE}" \
            --arg sha "${RELEASE_SHA}" \
            --argjson run "${DEPLOYMENT_RUN_ID}" '
              .schemaVersion == "archon.aws-deployment-evidence/v2" and
              .stage == $stage and .releaseSha == $sha and
              .deploymentRunId == $run and
              .promotion.policy == "build-once-promote-exact-artifacts" and
              .verification.result == "passed" and
              .verification.zeroIdleCore == true and
              .secretsProjected == false
            ' "${evidence}" >/dev/null
          test "$(sha256sum "${observation}" | awk '{print $1}')" = \
            "$(jq -er .verification.observationSha256 "${evidence}")"
          jq -e --arg stage "${STAGE}" --arg sha "${RELEASE_SHA}" '
            .schemaVersion == "archon.lean-runtime-observation/v1" and
            .stage == $stage and .releaseSha == $sha and
            .topology.legacyAlwaysOnRuntimeAbsent == true and
            .security.rawIdentifiersProjected == false
          ' "${observation}" >/dev/null
          {
            echo "evidence=${evidence}"
            echo "observation=${observation}"
            echo "application_url=$(jq -er .applicationUrl "${evidence}")"
            echo "deployment_digest=sha256:$(sha256sum "${evidence}" | awk '{print $1}')"
          } >>"${GITHUB_OUTPUT}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.profile == 'cloud'
        with:
          node-version: 22.23.1
          cache: npm

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: inputs.profile == 'cloud'
        with:
          version: "0.11.31"
          enable-cache: false

      - name: Resolve exact deployed runtime binding
        id: runtime
        env:
          APPLICATION_URL: ${{ steps.deployment.outputs.application_url }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/live-proof/runtime"
          mkdir -p "${work}"
          if [[ "${PROFILE}" == core ]]; then
            session_url="${APPLICATION_URL}/api/runtime-sessions/${RUNTIME_SESSION_ID}"
            ready=false
            for ((attempt = 1; attempt <= 60; attempt++)); do
              curl --fail --silent --show-error \
                --proto '=https' --tlsv1.2 --retry 2 --retry-all-errors \
                --max-time 20 --output "${work}/session.json" "${session_url}"
              if jq -e \
                --arg session "${RUNTIME_SESSION_ID}" '
                  .schemaVersion == "archon.runtime-session-status/v1" and
                  .sessionId == $session and
                  .resolvedProfile == "core" and
                  .state == "READY" and .canRun == true and
                  .remainingSeconds > 0
                ' "${work}/session.json" >/dev/null; then
                ready=true
                break
              fi
              sleep 10
            done
            test "${ready}" = true
          fi

          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 4 --retry-all-errors \
            --max-time 30 --output "${work}/profiles.json" \
            "${APPLICATION_URL}/api/runtime-profiles"
          jq -e '
            .schemaVersion == "archon.runtime-profiles/v1" and
            (.serverTime | fromdateiso8601) and
            (.profiles | length) == 2 and
            ([.profiles[].profileId] | sort) == ["cloud","core"]
          ' "${work}/profiles.json" >/dev/null
          jq -e --arg profile "${PROFILE}" '
            [.profiles[] | select(.profileId == $profile)] |
            length == 1 and
            .[0].generation != null and
            (.[0].generation | test("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$")) and
            (.[0].capabilityDigest | test("^sha256:[0-9a-f]{64}$")) and
            (.[0].capabilities |
              keys == ["agentContextKit","analyticsAgent","dataHubSkills","mcpGovernedWrite","mcpRead"] and
              all(.[]; . == true)) and
            (if $profile == "cloud"
             then .[0].availability == "READY"
             else .[0].availability == "BUSY"
             end)
          ' "${work}/profiles.json" >/dev/null
          jq -cS --arg profile "${PROFILE}" '
            .profiles[] | select(.profileId == $profile)
          ' "${work}/profiles.json" >"${work}/binding.json"
          generation="$(jq -er .generation "${work}/binding.json")"
          capability="$(jq -er .capabilityDigest "${work}/binding.json")"
          session_digest=null
          session_status_digest=null
          if [[ "${PROFILE}" == core ]]; then
            session_digest="sha256:$(printf '%s' "${RUNTIME_SESSION_ID}" | sha256sum | awk '{print $1}')"
            session_status_digest="sha256:$(sha256sum "${work}/session.json" | awk '{print $1}')"
          fi
          {
            echo "binding=${work}/binding.json"
            echo "generation=${generation}"
            echo "capability=${capability}"
            echo "session_digest=${session_digest}"
            echo "session_status_digest=${session_status_digest}"
          } >>"${GITHUB_OUTPUT}"

      - name: Install locked application dependencies
        if: inputs.profile == 'cloud'
        run: npm ci --ignore-scripts

      - name: Typecheck credentialed live-proof code
        if: inputs.profile == 'cloud'
        run: npm run typecheck

      - name: Materialize exact locked DataHub MCP runtime
        if: inputs.profile == 'cloud'
        id: mcp
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/live-proof/datahub-mcp-v0.6.0"
          bash scripts/materialize-datahub-mcp-lock.sh "${project}"
          python_version="$(
            jq -er '.runtime.pythonVersion' \
              .github/locks/datahub-mcp-v0.6.0.json
          )"
          server="${project}/.venv/bin/mcp-server-datahub"
          test -x "${server}"
          test "$("${server}" --version)" = \
            "mcp-server-datahub, version 0.6.0"
          {
            echo "project=${project}"
            echo "python_version=${python_version}"
          } >>"${GITHUB_OUTPUT}"

      - name: Prove live Cloud MCP, retention, provenance, and contradiction
        if: inputs.profile == 'cloud'
        id: semantic
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_CLOUD_GMS_URL }}
          DATAHUB_GMS_TOKEN: ${{ secrets.DATAHUB_CLOUD_GMS_TOKEN }}
          DATAHUB_MCP_COMMAND: uv
          DATAHUB_MCP_ARGS: >-
            run --project ${{ steps.mcp.outputs.project }}
            --python ${{ steps.mcp.outputs.python_version }} --frozen --no-sync
            --no-dev mcp-server-datahub
          TOOLS_IS_MUTATION_ENABLED: "false"
          TOOLS_IS_USER_ENABLED: "false"
          DATAHUB_MCP_DOCUMENT_TOOLS_DISABLED: "true"
          SAVE_DOCUMENT_TOOL_ENABLED: "false"
          SEMANTIC_SEARCH_ENABLED: "false"
        run: |
          set -euo pipefail
          : "${DATAHUB_GMS_URL:?DATAHUB_CLOUD_GMS_URL is required}"
          : "${DATAHUB_GMS_TOKEN:?DATAHUB_CLOUD_GMS_TOKEN is required}"
          raw="${RUNNER_TEMP}/live-proof/runtime/cloud-semantic-proof.json"
          npm run --silent verify:live >"${raw}"
          query_sha="$(
            jq -cn --arg query "${ARCHON_DEMO_QUERY}" '{query:$query}' |
              sha256sum | awk '{print $1}'
          )"
          urn_sha="$(
            printf '%s' "${ARCHON_DEMO_QUERY}" | sha256sum | awk '{print $1}'
          )"
          jq -e --arg query "${query_sha}" --arg urn "${urn_sha}" '
            .schemaVersion == "archon.live-datahub-proof/v1" and
            .ok == true and
            .result == "retained-history-contradiction-proven" and
            .querySha256 == $query and .datasetUrnSha256 == $urn and
            .datasetsDiscovered == 1 and
            .retainedHistories >= 1 and
            .stableSourceCount == 2 and
            .recoveredContradictions == 1 and
            .retainedHistories == 1 and
            .contradictionAttributeCount == 1 and
            (.semanticProof |
              .schemaVersion == "archon.deployed-datahub-semantic-proof/v2" and
              .evidenceClass == "credentialed-live-cloud" and
              keys == ["classification","evidenceClass","findings","schemaVersion"])
          ' "${raw}" >/dev/null
          semantic="${RUNNER_TEMP}/live-proof/runtime/deployed-datahub-semantic-proof.json"
          jq -cS '.semanticProof' "${raw}" >"${semantic}"
          jq -e '
            .schemaVersion == "archon.deployed-datahub-semantic-proof/v2" and
            .evidenceClass == "credentialed-live-cloud"
          ' "${semantic}" >/dev/null
          {
            echo "path=${raw}"
            echo "digest=sha256:$(sha256sum "${raw}" | awk '{print $1}')"
            echo "semantic_path=${semantic}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify exact governed canary rollback attestation
        if: inputs.profile == 'cloud' && inputs.stage == 'production'
        id: canary
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/live-proof/governed-canary"
          source="${root}/source"
          mkdir -p "${source}"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GOVERNED_CANARY_RUN_ID}")"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release "${RELEASE_SHA}" \
            --argjson runId "${GOVERNED_CANARY_RUN_ID}" '
              .id == $runId and
              .path == ".github/workflows/governed-canary.yml" and
              .event == "workflow_dispatch" and
              .head_branch == "master" and .head_sha == $release and
              .head_repository.full_name == $repository and
              .repository.full_name == $repository and
              .status == "completed" and .conclusion == "success" and
              .run_attempt == 1
            ' <<<"${run_json}" >/dev/null
          artifacts="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GOVERNED_CANARY_RUN_ID}/artifacts?per_page=100"
          )"
          expected_name="governed-canary-rollback-${GOVERNED_CANARY_RUN_ID}-1"
          artifact="$(
            jq -ce \
              --arg name "${expected_name}" \
              --argjson runId "${GOVERNED_CANARY_RUN_ID}" '
                [.[].artifacts[] |
                  select(
                    .name == $name and .expired == false and
                    .workflow_run.id == $runId and
                    (.id | type) == "number" and .id > 0 and
                    (.size_in_bytes | type) == "number" and
                    .size_in_bytes > 0 and .size_in_bytes <= 52428800 and
                    (.digest | test("^sha256:[0-9a-f]{64}$"))
                  )] |
                if length == 1 then .[0]
                else error("exact governed-canary rollback artifact is not unique") end
              ' <<<"${artifacts}"
          )"
          artifact_id="$(jq -er .id <<<"${artifact}")"
          artifact_digest="$(jq -er .digest <<<"${artifact}")"
          archive="${root}/source.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" >"${archive}"
          test "sha256:$(sha256sum "${archive}" | awk '{print $1}')" = \
            "${artifact_digest}"
          python3 - "${archive}" "${source}" <<'PY'
          import pathlib
          import shutil
          import stat
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          expected = {
              "attestation-predicate.json",
              "recovery-evidence.json",
              "recovery-evidence.sha256",
              "recovery.json",
          }
          total = 0
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              names = [entry.filename for entry in entries]
              if set(names) != expected or len(names) != len(expected):
                  raise SystemExit("governed-canary artifact inventory is not exact")
              for entry in entries:
                  path = pathlib.PurePosixPath(entry.filename)
                  mode = stat.S_IFMT(entry.external_attr >> 16)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or entry.is_dir()
                      or mode not in (0, stat.S_IFREG)
                      or entry.flag_bits & 0x1
                      or entry.file_size > 2 * 1024 * 1024
                  ):
                      raise SystemExit("unsafe governed-canary artifact member")
                  total += entry.file_size
                  if total > 6 * 1024 * 1024:
                      raise SystemExit("governed-canary artifact is oversized")
                  target = destination / entry.filename
                  with bundle.open(entry) as input_file, target.open("xb") as output:
                      shutil.copyfileobj(input_file, output)
          PY
          test "$(wc -l <"${source}/recovery-evidence.sha256" | tr -d ' ')" = 1
          grep -Eq '^[0-9a-f]{64}  recovery-evidence\.json$' \
            "${source}/recovery-evidence.sha256"
          (
            cd "${source}"
            sha256sum --check --strict recovery-evidence.sha256
          )
          cmp --silent \
            "${source}/recovery-evidence.json" \
            "${source}/attestation-predicate.json"
          evidence="${source}/recovery-evidence.json"
          jq -e \
            --arg run "${GOVERNED_CANARY_RUN_ID}" \
            --arg release "${RELEASE_SHA}" '
              keys == [
                "afterDigest","beforeDigest","deploymentEvidenceSha256","digest",
                "disposition","endpointBindingSha256","mutation","recoveredAt",
                "recoveryDigest","runtimeProfile","schemaVersion","sourceWorkflow","target"
              ] and
              .schemaVersion == "archon.governed-canary-recovery-evidence/v2" and
              .runtimeProfile == "cloud" and .disposition == "restored" and
              (.sourceWorkflow |
                keys == ["controlPlaneGatesSha256","controlPlaneSha","runAttempt","runId"] and
                .runId == $run and .runAttempt == "1" and
                .controlPlaneSha == $release) and
              (.target |
                keys == ["columnPath","entityUrn","tagUrn"] and
                .entityUrn == "urn:li:dataset:(urn:li:dataPlatform:sqlite,archon_demo.customers,PROD)" and
                .columnPath == "customer_email" and .tagUrn == "urn:li:tag:PII") and
              (.mutation |
                keys == ["performed","requestDigest","responseDigest"] and
                .performed == true) and
              ([
                .recoveryDigest,.deploymentEvidenceSha256,.endpointBindingSha256,
                .beforeDigest,.afterDigest,.mutation.requestDigest,
                .mutation.responseDigest,.sourceWorkflow.controlPlaneGatesSha256,.digest
              ] | all(.[]; test("^sha256:[0-9a-f]{64}$")))
            ' "${evidence}" >/dev/null
          stored_digest="$(jq -er .digest "${evidence}")"
          calculated_digest="$(
            jq -cS 'del(.digest)' "${evidence}" |
              sha256sum | awk '{print "sha256:" $1}'
          )"
          test "${stored_digest}" = "${calculated_digest}"
          expected_predicate="$(jq -cS . "${source}/attestation-predicate.json")"
          expected_subjects="$(
            jq -Rn '
              [inputs |
                capture("^(?<sha>[0-9a-f]{64})  (?<name>[A-Za-z0-9][A-Za-z0-9._-]*)$") |
                {name:.name,digest:{sha256:.sha}}] | sort_by(.name)
            ' <"${source}/recovery-evidence.sha256"
          )"
          raw_verification="${root}/attestation.raw.json"
          statement="${root}/attestation-statement.json"
          gh attestation verify "${evidence}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/governed-canary.yml" \
            --signer-digest "${RELEASE_SHA}" \
            --source-digest "${RELEASE_SHA}" \
            --source-ref refs/heads/master \
            --predicate-type "https://github.com/upgradedev/archon-datahub/attestations/governed-canary-cloud-v2" \
            --deny-self-hosted-runners \
            --format json >"${raw_verification}"
          jq -ceS \
            --arg predicateType "https://github.com/upgradedev/archon-datahub/attestations/governed-canary-cloud-v2" \
            --arg subjectName "recovery-evidence.json" \
            --arg subjectSha "$(awk '{print $1}' "${source}/recovery-evidence.sha256")" \
            --argjson expectedPredicate "${expected_predicate}" \
            --argjson expectedSubjects "${expected_subjects}" '
              [.[] |
                select(
                  .verificationResult.statement.predicateType == $predicateType and
                  .verificationResult.statement.predicate == $expectedPredicate and
                  (.verificationResult.statement.subject | sort_by(.name)) == $expectedSubjects and
                  any(.verificationResult.statement.subject[];
                    .name == $subjectName and .digest.sha256 == $subjectSha)
                ) | .verificationResult.statement] |
              unique |
              if length == 1 then .[0]
              else error("exactly one governed-canary attestation must match") end
            ' "${raw_verification}" >"${statement}"
          {
            echo "workflow_run_id=${GOVERNED_CANARY_RUN_ID}"
            echo "rollback_subject_digest=sha256:$(sha256sum "${evidence}" | awk '{print $1}')"
            echo "rollback_evidence_digest=${stored_digest}"
            echo "attestation_predicate_digest=sha256:$(sha256sum "${source}/attestation-predicate.json" | awk '{print $1}')"
            echo "attestation_verification_digest=sha256:$(sha256sum "${statement}" | awk '{print $1}')"
          } >>"${GITHUB_OUTPUT}"
      - name: Seal exact runtime-bound live proof
        id: evidence
        env:
          DEPLOYMENT_EVIDENCE: ${{ steps.deployment.outputs.evidence }}
          DEPLOYMENT_DIGEST: ${{ steps.deployment.outputs.deployment_digest }}
          BINDING_PATH: ${{ steps.runtime.outputs.binding }}
          GENERATION: ${{ steps.runtime.outputs.generation }}
          CAPABILITY_DIGEST: ${{ steps.runtime.outputs.capability }}
          SESSION_DIGEST: ${{ steps.runtime.outputs.session_digest }}
          SESSION_STATUS_DIGEST: ${{ steps.runtime.outputs.session_status_digest }}
          SEMANTIC_DIGEST: ${{ steps.semantic.outputs.digest || 'null' }}
        run: |
          set -euo pipefail
          subjects="${RUNNER_TEMP}/live-proof/subjects"
          mkdir -p "${subjects}"
          query_digest="sha256:$(
            printf '%s' "${ARCHON_DEMO_QUERY}" | sha256sum | awk '{print $1}'
          )"
          binding_digest="sha256:$(sha256sum "${BINDING_PATH}" | awk '{print $1}')"
          jq -nS \
            --slurpfile binding "${BINDING_PATH}" \
            --arg stage "${STAGE}" \
            --arg releaseSha "${RELEASE_SHA}" \
            --argjson deploymentRunId "${DEPLOYMENT_RUN_ID}" \
            --arg deploymentEvidenceDigest "${DEPLOYMENT_DIGEST}" \
            --arg profileId "${PROFILE}" \
            --arg generation "${GENERATION}" \
            --arg capabilityDigest "${CAPABILITY_DIGEST}" \
            --arg bindingDigest "${binding_digest}" \
            --arg sessionIdDigest "${SESSION_DIGEST}" \
            --arg sessionStatusDigest "${SESSION_STATUS_DIGEST}" \
            --arg semanticDigest "${SEMANTIC_DIGEST}" \
            --arg queryDigest "${query_digest}" '
              {
                schemaVersion:"archon.live-dual-runtime-proof/v2",
                stage:$stage,
                releaseSha:$releaseSha,
                deployment:{
                  runId:$deploymentRunId,
                  evidenceDigest:$deploymentEvidenceDigest,
                  verification:"attested-exact-artifact"
                },
                runtimeBinding:{
                  profileId:$profileId,
                  generation:$generation,
                  capabilityDigest:$capabilityDigest,
                  availability:$binding[0].availability,
                  capabilities:$binding[0].capabilities,
                  bindingDigest:$bindingDigest,
                  sessionIdDigest:
                    (if $sessionIdDigest == "null" then null else $sessionIdDigest end),
                  sessionStatusDigest:
                    (if $sessionStatusDigest == "null" then null else $sessionStatusDigest end)
                },
                fourComponents:{
                  dataHubMcpServer:true,
                  agentContextKit:true,
                  dataHubSkills:true,
                  analyticsAgent:true
                },
                proof:{
                  level:
                    (if $profileId == "cloud"
                     then "credentialed-live-semantic"
                     else "active-session-capability"
                     end),
                  semanticProofDigest:
                    (if $semanticDigest == "null" then null else $semanticDigest end),
                  exactCanonicalQuery:true,
                  queryDigest:$queryDigest,
                  governedMutationAuthority:"separate-human-approved-canary"
                },
                secretsProjected:false,
                rawIdentifiersRetained:false,
                result:"passed",
                generatedAt:(now|todateiso8601)
              }
            ' >"${subjects}/payload.json"
          payload_digest="$(
            jq -cS . "${subjects}/payload.json" |
              sha256sum | awk '{print "sha256:" $1}'
          )"
          jq -S --arg digest "${payload_digest}" \
            '. + {digest:$digest}' "${subjects}/payload.json" \
            >"${subjects}/live-proof.json"
          rm -- "${subjects}/payload.json"
          stored_digest="$(jq -er .digest "${subjects}/live-proof.json")"
          calculated_digest="$(
            jq -cS 'del(.digest)' "${subjects}/live-proof.json" |
              sha256sum | awk '{print "sha256:" $1}'
          )"
          test "${stored_digest}" = "${calculated_digest}"
          jq -e --arg profile "${PROFILE}" '
            .schemaVersion == "archon.live-dual-runtime-proof/v2" and
            .runtimeBinding.profileId == $profile and
            (.runtimeBinding.capabilityDigest |
              test("^sha256:[0-9a-f]{64}$")) and
            all(.fourComponents[]; . == true) and
            .secretsProjected == false and
            .rawIdentifiersRetained == false and
            .result == "passed" and
            (.digest | test("^sha256:[0-9a-f]{64}$")) and
            (if $profile == "cloud"
             then .proof.level == "credentialed-live-semantic" and
                  (.proof.semanticProofDigest |
                    test("^sha256:[0-9a-f]{64}$")) and
                  .runtimeBinding.sessionIdDigest == null
             else .proof.level == "active-session-capability" and
                  .proof.semanticProofDigest == null and
                  (.runtimeBinding.sessionIdDigest |
                    test("^sha256:[0-9a-f]{64}$"))
             end)
          ' "${subjects}/live-proof.json" >/dev/null
          echo "path=${subjects}/live-proof.json" >>"${GITHUB_OUTPUT}"

      - name: Attest exact live proof
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.evidence.outputs.path }}
          predicate-type: https://github.com/upgradedev/archon-datahub/attestations/live-dual-runtime-proof/v2
          predicate-path: ${{ steps.evidence.outputs.path }}

      - name: Retain sanitized live proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-datahub-proof-${{ inputs.stage }}-${{ inputs.profile }}-${{ inputs.release_sha }}-${{ github.run_id }}
          path: ${{ steps.evidence.outputs.path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Seal submission-native live proof bundle
        if: inputs.profile == 'cloud' && inputs.stage == 'production'
        id: submission_evidence
        env:
          DEPLOYMENT_EVIDENCE: ${{ steps.deployment.outputs.evidence }}
          RUNTIME_BINDING: ${{ steps.runtime.outputs.binding }}
          LIVE_SUMMARY: ${{ steps.semantic.outputs.path }}
          SEMANTIC_PROOF: ${{ steps.semantic.outputs.semantic_path }}
          CANARY_RUN_ID: ${{ steps.canary.outputs.workflow_run_id }}
          ROLLBACK_SUBJECT_DIGEST: ${{ steps.canary.outputs.rollback_subject_digest }}
          ROLLBACK_EVIDENCE_DIGEST: ${{ steps.canary.outputs.rollback_evidence_digest }}
          CANARY_PREDICATE_DIGEST: ${{ steps.canary.outputs.attestation_predicate_digest }}
          CANARY_VERIFICATION_DIGEST: ${{ steps.canary.outputs.attestation_verification_digest }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/live-proof/submission-native"
          mkdir -p "${root}"
          cp -- "${DEPLOYMENT_EVIDENCE}" "${root}/deployment-evidence.json"
          cp -- "${SEMANTIC_PROOF}" "${root}/deployed-datahub-semantic-proof.json"
          binding_digest="sha256:$(sha256sum "${RUNTIME_BINDING}" | awk '{print $1}')"
          jq -nS \
            --slurpfile live "${LIVE_SUMMARY}" \
            --slurpfile binding "${RUNTIME_BINDING}" \
            --arg generation "${{ steps.runtime.outputs.generation }}" \
            --arg capabilityDigest "${{ steps.runtime.outputs.capability }}" \
            --arg bindingDigest "${binding_digest}" \
            --argjson canaryRunId "${CANARY_RUN_ID}" \
            --arg rollbackSubjectDigest "${ROLLBACK_SUBJECT_DIGEST}" \
            --arg rollbackEvidenceDigest "${ROLLBACK_EVIDENCE_DIGEST}" \
            --arg attestationPredicateDigest "${CANARY_PREDICATE_DIGEST}" \
            --arg attestationVerificationDigest "${CANARY_VERIFICATION_DIGEST}" '
              {
                schemaVersion:"archon.live-datahub-proof/v3",
                ok:$live[0].ok,
                result:$live[0].result,
                querySha256:$live[0].querySha256,
                datasetUrnSha256:$live[0].datasetUrnSha256,
                datasetsDiscovered:$live[0].datasetsDiscovered,
                aspectHistories:$live[0].aspectHistories,
                retainedHistories:$live[0].retainedHistories,
                stableSourceCount:$live[0].stableSourceCount,
                recoveredContradictions:$live[0].recoveredContradictions,
                contradictionAttributeCount:$live[0].contradictionAttributeCount,
                runtimeBinding:{
                  profileId:"cloud",
                  availability:$binding[0].availability,
                  generation:$generation,
                  capabilityDigest:$capabilityDigest,
                  bindingDigest:$bindingDigest
                },
                governedWrite:{
                  workflowRunId:$canaryRunId,
                  result:"write-verified-and-rollback-proven",
                  rollbackSubjectDigest:$rollbackSubjectDigest,
                  rollbackEvidenceDigest:$rollbackEvidenceDigest,
                  attestationPredicateDigest:$attestationPredicateDigest,
                  attestationVerificationDigest:$attestationVerificationDigest
                }
              }
            ' >"${root}/proof.json"
          jq -e '
            keys == [
              "aspectHistories","contradictionAttributeCount","datasetUrnSha256",
              "datasetsDiscovered","governedWrite","ok","querySha256",
              "recoveredContradictions","result","retainedHistories","runtimeBinding",
              "schemaVersion","stableSourceCount"
            ] and
            .schemaVersion == "archon.live-datahub-proof/v3" and
            .ok == true and .result == "retained-history-contradiction-proven" and
            .datasetsDiscovered == 1 and .retainedHistories == 1 and
            .stableSourceCount == 2 and .recoveredContradictions == 1 and
            .contradictionAttributeCount == 1 and
            (.runtimeBinding |
              keys == ["availability","bindingDigest","capabilityDigest","generation","profileId"] and
              .profileId == "cloud" and .availability == "READY") and
            (.governedWrite |
              keys == [
                "attestationPredicateDigest","attestationVerificationDigest","result",
                "rollbackEvidenceDigest","rollbackSubjectDigest","workflowRunId"
              ] and
              .result == "write-verified-and-rollback-proven")
          ' "${root}/proof.json" >/dev/null
          (
            cd "${root}"
            sha256sum \
              deployment-evidence.json \
              deployed-datahub-semantic-proof.json \
              proof.json >proof-subject.sha256
          )
          proven_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -cnS \
            --slurpfile proof "${root}/proof.json" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg releaseSha "${RELEASE_SHA}" \
            --arg deploymentRunId "${DEPLOYMENT_RUN_ID}" \
            --arg governedCanaryRunId "${CANARY_RUN_ID}" \
            --arg provenAt "${proven_at}" \
            --arg proofSha256 "$(sha256sum "${root}/proof.json" | awk '{print $1}')" \
            --arg deploymentEvidenceSha256 "$(sha256sum "${root}/deployment-evidence.json" | awk '{print $1}')" \
            --arg deployedDataHubSemanticProofSha256 "$(sha256sum "${root}/deployed-datahub-semantic-proof.json" | awk '{print $1}')" '
              {
                schemaVersion:"archon.live-datahub-proof-attestation/v4",
                repository:$repository,
                workflow:{runId:$runId,runAttempt:$runAttempt},
                releaseSha:$releaseSha,
                deploymentRunId:$deploymentRunId,
                governedCanaryRunId:$governedCanaryRunId,
                provenAt:$provenAt,
                querySha256:$proof[0].querySha256,
                runtimeBinding:$proof[0].runtimeBinding,
                evidence:{
                  proofSha256:$proofSha256,
                  deploymentEvidenceSha256:$deploymentEvidenceSha256,
                  deployedDataHubSemanticProofSha256:$deployedDataHubSemanticProofSha256
                },
                result:$proof[0].result,
                datasetUrnSha256:$proof[0].datasetUrnSha256
              }
            ' >"${root}/attestation-predicate.json"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release "${RELEASE_SHA}" '
              keys == [
                "datasetUrnSha256","deploymentRunId","evidence","governedCanaryRunId",
                "provenAt","querySha256","releaseSha","repository","result",
                "runtimeBinding","schemaVersion","workflow"
              ] and
              .schemaVersion == "archon.live-datahub-proof-attestation/v4" and
              .repository == $repository and .releaseSha == $release and
              .result == "retained-history-contradiction-proven"
            ' "${root}/attestation-predicate.json" >/dev/null
          (
            cd "${root}"
            sha256sum --check --strict proof-subject.sha256
          )
          {
            echo "directory=${root}"
            echo "inventory=${root}/proof-subject.sha256"
            echo "predicate=${root}/attestation-predicate.json"
          } >>"${GITHUB_OUTPUT}"

      - name: Attest submission-native live proof subjects
        if: inputs.profile == 'cloud' && inputs.stage == 'production'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ steps.submission_evidence.outputs.inventory }}
          predicate-type: https://github.com/upgradedev/archon-datahub/attestations/live-datahub-proof/v4
          predicate-path: ${{ steps.submission_evidence.outputs.predicate }}

      - name: Retain submission-native live proof bundle
        if: inputs.profile == 'cloud' && inputs.stage == 'production'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-datahub-proof-${{ inputs.release_sha }}-${{ github.run_attempt }}
          path: ${{ steps.submission_evidence.outputs.directory }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
      - name: Publish proof summary
        run: |
          {
            echo "### Live dual-runtime DataHub proof"
            echo
            echo "- Stage: ${STAGE}"
            echo "- Release: ${RELEASE_SHA}"
            echo "- Runtime: ${PROFILE}"
            echo "- Generation: ${{ steps.runtime.outputs.generation }}"
            echo "- Capability digest: ${{ steps.runtime.outputs.capability }}"
            echo "- Evidence contains no endpoint, token, account ID, or raw dataset URN."
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Remove runner-only proof material
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/live-proof"
