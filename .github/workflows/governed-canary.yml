name: Governed DataHub Cloud canary v2
run-name: Cloud canary ${{ inputs.release_sha }} from deployment ${{ inputs.deployment_run_id }}

on:
  workflow_dispatch:
    inputs:
      deployment_run_id:
        description: Exact successful staging deploy run ID
        required: true
        type: string
      deployment_artifact_id:
        description: Exact staging deployment-evidence artifact ID
        required: true
        type: string
      deployment_artifact_digest:
        description: Exact GitHub sha256 artifact digest
        required: true
        type: string
      release_sha:
        description: Exact deployed 40-character master SHA
        required: true
        type: string
      confirmation:
        description: Type RUN GOVERNED DATAHUB CLOUD CANARY
        required: true
        type: string

permissions: {}
concurrency:
  group: archon-governed-canary-mutation-recovery
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.1"
  AWS_PAGER: ""
  CANARY_STACK_NAME: Archon-staging-Judge
  CANARY_RUNTIME_PROFILE: cloud
  CANARY_SOURCE_WORKFLOW_RUN_ID: ${{ github.run_id }}
  CANARY_SOURCE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
  CANARY_CONTROL_PLANE_SHA: ${{ github.sha }}

jobs:
  prepare:
    name: Seal Cloud recovery ${{ inputs.deployment_artifact_digest }}
    if: github.repository == 'upgradedev/archon-datahub' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: write
      id-token: write
    environment:
      name: governed-canary-prepare
      url: ${{ vars.CANARY_APPLICATION_URL }}
    outputs:
      application_url: ${{ steps.stack.outputs.application_url }}
      cognito_client_id: ${{ steps.stack.outputs.cognito_client_id }}
      cognito_hosted_ui_origin: ${{ steps.stack.outputs.cognito_hosted_ui_origin }}
      cognito_issuer: ${{ steps.stack.outputs.cognito_issuer }}
      user_pool_id: ${{ steps.stack.outputs.user_pool_id }}
      recovery_digest: ${{ steps.seal.outputs.recovery_digest }}
      gates_digest: ${{ steps.gates.outputs.gates_digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANARY_RELEASE_SHA: ${{ inputs.release_sha }}
      CANARY_DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
      CANARY_DEPLOYMENT_ARTIFACT_ID: ${{ inputs.deployment_artifact_id }}
      CANARY_DEPLOYMENT_ARTIFACT_DIGEST: ${{ inputs.deployment_artifact_digest }}
      CANARY_APPLICATION_URL: ${{ vars.CANARY_APPLICATION_URL }}
      CANARY_ISOLATION_MARKER: ${{ vars.CANARY_ISOLATION_MARKER }}
      CANARY_DATAHUB_READ_GMS_URL: ${{ vars.CANARY_DATAHUB_READ_GMS_URL }}
      CANARY_DATAHUB_READ_MCP_URL: ${{ vars.CANARY_DATAHUB_READ_MCP_URL }}
      CANARY_DATAHUB_WRITE_GMS_URL: ${{ vars.CANARY_DATAHUB_WRITE_GMS_URL }}
      CANARY_DATAHUB_WRITE_MCP_URL: ${{ vars.CANARY_DATAHUB_WRITE_MCP_URL }}
    steps:
      - name: Bind current master and exact deployment artifact
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "RUN GOVERNED DATAHUB CLOUD CANARY"
          [[ "${CANARY_RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CANARY_DEPLOYMENT_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${CANARY_DEPLOYMENT_ARTIFACT_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${CANARY_DEPLOYMENT_ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${GITHUB_SHA}" = "${CANARY_RELEASE_SHA}"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)" = "${GITHUB_SHA}"
          run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANARY_DEPLOYMENT_RUN_ID}")"
          jq -e --arg sha "${CANARY_RELEASE_SHA}" --argjson id "${CANARY_DEPLOYMENT_RUN_ID}" '
            .id==$id and .name=="Deploy lean dual-runtime AWS release" and
            .path==".github/workflows/deploy.yml" and .event=="workflow_dispatch" and
            .head_branch=="master" and .head_sha==$sha and
            .status=="completed" and .conclusion=="success"
          ' <<<"${run}" >/dev/null
          artifact="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANARY_DEPLOYMENT_ARTIFACT_ID}")"
          expected="deployment-evidence-staging-${CANARY_RELEASE_SHA}-${CANARY_DEPLOYMENT_RUN_ID}"
          jq -e --arg name "${expected}" --arg digest "${CANARY_DEPLOYMENT_ARTIFACT_DIGEST}" \
            --argjson id "${CANARY_DEPLOYMENT_ARTIFACT_ID}" --argjson run "${CANARY_DEPLOYMENT_RUN_ID}" '
            .id==$id and .name==$name and .digest==$digest and .expired==false and
            .workflow_run.id==$run and .size_in_bytes>0
          ' <<<"${artifact}" >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.deployment_artifact_id }}
          run-id: ${{ inputs.deployment_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/governed-canary/deployment
      - name: Verify lean evidence v2 and attestation
        id: evidence
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/governed-canary/deployment"
          test -d "${root}" && test ! -L "${root}"
          test -z "$(find "${root}" -type l -print -quit)"
          mapfile -t paths < <(find "${root}" -type f -printf '%f\n' | sort)
          test "$(printf '%s\n' "${paths[@]}")" = $'deployment-evidence.json\nobservation.json'
          evidence="${root}/deployment-evidence.json"
          observation="${root}/observation.json"
          jq -e --arg sha "${CANARY_RELEASE_SHA}" --argjson run "${CANARY_DEPLOYMENT_RUN_ID}" --arg url "${CANARY_APPLICATION_URL}" '
            .schemaVersion=="archon.aws-deployment-evidence/v2" and .stage=="staging" and
            .releaseSha==$sha and .deploymentRunId==$run and .applicationUrl==$url and
            .promotion.policy=="build-once-promote-exact-artifacts" and
            .verification.result=="passed" and .verification.zeroIdleCore==true and
            .verification.httpBoundary==true and .verification.securityHeaders==true and
            .verification.directApiRejected==true and .verification.canonicalHostEnforced==true and
            (.verification.observationSha256|test("^[0-9a-f]{64}$")) and .secretsProjected==false
          ' "${evidence}" >/dev/null
          jq -e --arg sha "${CANARY_RELEASE_SHA}" '
            .schemaVersion=="archon.lean-runtime-observation/v1" and .stage=="staging" and
            .releaseSha==$sha and .topology.coreIdle==true and
            .topology.legacyAlwaysOnRuntimeAbsent==true and
            (.runtime.cloudImageDigest|test("^sha256:[0-9a-f]{64}$")) and
            .runtime.functions==6 and .runtime.imageFunctions==3 and
            (.security | all(.[]; . == true))
          ' "${observation}" >/dev/null
          observation_raw="$(sha256sum "${observation}"|awk '{print $1}')"
          test "$(jq -er .verification.observationSha256 "${evidence}")" = "${observation_raw}"
          gh attestation verify "${evidence}" --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml" \
            --predicate-type "https://github.com/upgradedev/archon-datahub/attestations/aws-deployment/v2" >/dev/null
          {
            echo "evidence_digest=sha256:$(sha256sum "${evidence}"|awk '{print $1}')"
            echo "observation_digest=sha256:${observation_raw}"
            echo "cloud_image_digest=$(jq -er .runtime.cloudImageDigest "${observation}")"
          } >>"${GITHUB_OUTPUT}"
      - name: Verify current GitHub control plane
        id: gates
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
          OUTPUT_PATH: ${{ runner.temp }}/governed-canary/recovery/control-plane-security-gates.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${OUTPUT_PATH}")"
          bash scripts/verify-github-control-plane.sh
          echo "gates_digest=sha256:$(sha256sum "${OUTPUT_PATH}"|awk '{print $1}')" >>"${GITHUB_OUTPUT}"
      - name: Validate exact canary prepare identity before OIDC
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_CANARY_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_CANARY_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_CANARY_PREPARE_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          test "${AWS_REGION}" = "eu-west-1"
          test "${AWS_ROLE_ARN}" = \
            "arn:aws:iam::${AWS_ACCOUNT_ID}:role/archon-datahub-github-governed-canary-prepare"
      - name: Configure step-scoped canary prepare AWS credentials
        id: canary-prepare-aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_CANARY_REGION }}
          role-to-assume: ${{ vars.AWS_CANARY_PREPARE_ROLE_ARN }}
          role-session-name: archon-canary-prepare-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_CANARY_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true
          output-env-credentials: false
          output-credentials: true
      - name: Verify exact Judge stack bindings
        id: stack
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.canary-prepare-aws.outputs.aws-access-key-id }}
          AWS_REGION: ${{ vars.AWS_CANARY_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.canary-prepare-aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.canary-prepare-aws.outputs.aws-session-token }}
          CLOUD_IMAGE_DIGEST: ${{ steps.evidence.outputs.cloud_image_digest }}
        run: |
          set -euo pipefail
          stack="${RUNNER_TEMP}/governed-canary/judge.json"
          aws cloudformation describe-stacks --stack-name "${CANARY_STACK_NAME}" >"${stack}"
          output() { jq -er --arg k "$1" '.Stacks[0].Outputs|map(select(.OutputKey==$k))|if length==1 then .[0].OutputValue else error("ambiguous output") end' "${stack}"; }
          test "$(jq -er .Stacks[0].StackName "${stack}")" = "${CANARY_STACK_NAME}"
          test "$(output ArchonReleaseSha)" = "${CANARY_RELEASE_SHA}"
          test "$(output ArchonDeploymentWorkflowRunId)" = "${CANARY_DEPLOYMENT_RUN_ID}"
          test "$(output ArchonApplicationUrl)" = "${CANARY_APPLICATION_URL}"
          test "${CANARY_APPLICATION_URL}" = "https://staging.archon-datahub.click"
          [[ "$(output ArchonCloudRuntimeImageUri)" == *@"${CLOUD_IMAGE_DIGEST}" ]]
          test "$(output ArchonCanonicalDatasetUrn)" = "urn:li:dataset:(urn:li:dataPlatform:sqlite,archon_demo.customers,PROD)"
          test "$(output ArchonGovernedColumnPath)" = "customer_email"
          pool="$(output ArchonUserPoolId)"
          {
            echo "application_url=$(output ArchonApplicationUrl)"
            echo "user_pool_id=${pool}"
            echo "cognito_client_id=$(output ArchonUserPoolClientId)"
            echo "cognito_hosted_ui_origin=$(output ArchonCognitoHostedUiOrigin)"
            echo "cognito_issuer=https://cognito-idp.${AWS_REGION}.amazonaws.com/${pool}"
          } >>"${GITHUB_OUTPUT}"
      - name: Seal pre-mutation recovery capability
        id: seal
        env:
          CANARY_DEPLOYMENT_EVIDENCE_SHA256: ${{ steps.evidence.outputs.evidence_digest }}
          CANARY_OBSERVATION_SHA256: ${{ steps.evidence.outputs.observation_digest }}
          CANARY_CLOUD_IMAGE_DIGEST: ${{ steps.evidence.outputs.cloud_image_digest }}
          CANARY_CONTROL_PLANE_GATES_SHA256: ${{ steps.gates.outputs.gates_digest }}
          CANARY_RECOVERY_PATH: ${{ runner.temp }}/governed-canary/recovery/recovery.json
        run: |
          set -euo pipefail
          node --import tsx scripts/governed-canary.ts seal
          jq -e '.schemaVersion=="archon.governed-canary-recovery/v4" and .runtime==(.runtime|select(.profileId=="cloud" and .resolution=="explicit" and .stackName=="Archon-staging-Judge"))' "${CANARY_RECOVERY_PATH}" >/dev/null
          echo "recovery_digest=$(jq -er .digest "${CANARY_RECOVERY_PATH}")" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-canary-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governed-canary/recovery
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  execute:
    name: Human-approved Cloud proof ${{ needs.prepare.outputs.recovery_digest }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
    environment:
      name: governed-canary
      url: ${{ needs.prepare.outputs.application_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANARY_RELEASE_SHA: ${{ inputs.release_sha }}
      CANARY_DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
      CANARY_APPLICATION_URL: ${{ needs.prepare.outputs.application_url }}
      CANARY_COGNITO_CLIENT_ID: ${{ needs.prepare.outputs.cognito_client_id }}
      CANARY_COGNITO_HOSTED_UI_ORIGIN: ${{ needs.prepare.outputs.cognito_hosted_ui_origin }}
      CANARY_COGNITO_ISSUER: ${{ needs.prepare.outputs.cognito_issuer }}
      CANARY_USER_POOL_ID: ${{ needs.prepare.outputs.user_pool_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: governed-canary-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governed-canary/recovery
      - name: Revalidate sealed control plane
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
          EXPECTED_GATE: ${{ needs.prepare.outputs.gates_digest }}
          VERIFICATION_MODE: sealed
          SEALED_GATE_PATH: ${{ runner.temp }}/governed-canary/recovery/control-plane-security-gates.json
          OUTPUT_PATH: ${{ runner.temp }}/governed-canary/execute-gates/control-plane-security-gates.json
        run: |
          export EXPECTED_GATE_SHA256="${EXPECTED_GATE#sha256:}"
          bash scripts/verify-github-control-plane.sh
      - name: Configure step-scoped canary approval AWS credentials
        id: canary-approval-aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_CANARY_APPROVAL_ROLE_ARN }}
          role-session-name: archon-canary-execute-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true
          output-env-credentials: false
          output-credentials: true
      - name: Revalidate dual-authority Judge and install Chromium
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.canary-approval-aws.outputs.aws-access-key-id }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.canary-approval-aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.canary-approval-aws.outputs.aws-session-token }}
          USERNAME: ${{ secrets.CANARY_COGNITO_USERNAME }}
        run: |
          set -euo pipefail
          : "${USERNAME:?CANARY_COGNITO_USERNAME is required}"
          echo "::add-mask::${USERNAME}"
          aws cognito-idp admin-get-user --user-pool-id "${CANARY_USER_POOL_ID}" --username "${USERNAME}" >"${RUNNER_TEMP}/user.json"
          aws cognito-idp admin-list-groups-for-user --user-pool-id "${CANARY_USER_POOL_ID}" --username "${USERNAME}" >"${RUNNER_TEMP}/groups.json"
          jq -e '.Enabled==true and .UserStatus=="CONFIRMED"' "${RUNNER_TEMP}/user.json" >/dev/null
          jq -e '([.Groups[].GroupName] | sort) == ["archon-approvers","archon-runtime-operators"]' "${RUNNER_TEMP}/groups.json" >/dev/null
          npm exec -- playwright install --with-deps chromium
      - name: Execute explicit Cloud Agent Stack and seal proof
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.canary-approval-aws.outputs.aws-access-key-id }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.canary-approval-aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.canary-approval-aws.outputs.aws-session-token }}
          JUDGE_USERNAME: ${{ secrets.CANARY_COGNITO_USERNAME }}
          JUDGE_PASSWORD: ${{ secrets.CANARY_COGNITO_PASSWORD }}
          ARCHON_EXPECTED_LIFECYCLE_DIGEST: ${{ needs.prepare.outputs.recovery_digest }}
        run: |
          set -euo pipefail
          : "${JUDGE_USERNAME:?username is required}"; : "${JUDGE_PASSWORD:?password is required}"
          echo "::add-mask::${JUDGE_USERNAME}"; echo "::add-mask::${JUDGE_PASSWORD}"
          runtime="${RUNNER_TEMP}/runtime-config.json"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 "${CANARY_APPLICATION_URL}/runtime-config.json" -o "${runtime}"
          sub="$(aws cognito-idp admin-get-user --user-pool-id "${CANARY_USER_POOL_ID}" --username "${JUDGE_USERNAME}" --query "UserAttributes[?Name=='sub'].Value | [0]" --output text)"
          account="$(printf 'archon-canary-account-v1\0%s' "${JUDGE_USERNAME}"|sha256sum|awk '{print $1}')"
          output="${RUNNER_TEMP}/governed-canary-live"; mkdir --mode=0700 "${output}"
          export ARCHON_LIVE_JUDGE_JOURNEY=1 ARCHON_LIVE_V2_ONLY=1 ARCHON_LIVE_RUNTIME_PROFILE=cloud
          export ARCHON_LIVE_BASE_URL="${CANARY_APPLICATION_URL}" ARCHON_LIVE_OUTPUT_DIR="${output}"
          application_origin_sha256="$(printf '%s' "${CANARY_APPLICATION_URL}"|sha256sum|awk '{print $1}')"
          runtime_config_sha256="$(sha256sum "${runtime}"|awk '{print $1}')"
          identity_digest="sha256:$(printf 'archon-judge-identity-v1\0%s' "${account}"|sha256sum|awk '{print $1}')"
          subject_digest="sha256:$(printf 'archon-cognito-subject-v1\0%s' "${sub}"|sha256sum|awk '{print $1}')"
          export ARCHON_EXPECTED_APPLICATION_ORIGIN_SHA256="${application_origin_sha256}"
          export ARCHON_EXPECTED_RUNTIME_CONFIG_SHA256="${runtime_config_sha256}"
          export ARCHON_EXPECTED_RELEASE_SHA="${CANARY_RELEASE_SHA}"
          export ARCHON_EXPECTED_IDENTITY_DIGEST="${identity_digest}"
          export ARCHON_EXPECTED_COGNITO_SUBJECT_DIGEST="${subject_digest}"
          export ARCHON_EXPECTED_COGNITO_HOSTED_UI_ORIGIN="${CANARY_COGNITO_HOSTED_UI_ORIGIN}"
          export ARCHON_EXPECTED_COGNITO_CLIENT_ID="${CANARY_COGNITO_CLIENT_ID}"
          export ARCHON_EXPECTED_COGNITO_ISSUER="${CANARY_COGNITO_ISSUER}" JUDGE_ACCOUNT_ID="${account}"
          npm exec -- playwright test --config=playwright.live.config.ts web/e2e/live-judge-journey.live.spec.ts
          receipt="${output}/browser-journey-receipt.json"
          jq -e '.schemaVersion=="archon.browser-governed-canary-v2/v1" and .journey.requestedProfile=="cloud" and .journey.resolvedProfile=="cloud" and .journey.result=="SUCCEEDED" and .journey.components==["DataHub MCP Server","Agent Context Kit","DataHub Skills","Analytics Agent"] and .checks.governedMutationAndContextDeltaVerified==true and .checks.secretMaterialRetained==false' "${receipt}" >/dev/null
          evidence="${RUNNER_TEMP}/governed-canary/evidence"; mkdir --mode=0700 "${evidence}"
          cp "${receipt}" "${evidence}/browser-journey-receipt.json"
          cp "${RUNNER_TEMP}/governed-canary/recovery/recovery.json" "${evidence}/recovery.json"
          (cd "${evidence}" && sha256sum browser-journey-receipt.json recovery.json >SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-canary-write-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governed-canary/evidence
          if-no-files-found: error
          retention-days: 90

  rollback:
    name: Fresh human-approved exact PII inverse
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, execute]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: read
      deployments: write
      id-token: write
    environment:
      name: governed-canary-recovery
      url: ${{ needs.prepare.outputs.application_url }}
    env:
      CANARY_SOURCE_WORKFLOW_RUN_ID: ${{ github.run_id }}
      CANARY_SOURCE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      CANARY_ISOLATION_MARKER: ${{ vars.CANARY_ISOLATION_MARKER }}
      CANARY_DATAHUB_READ_GMS_URL: ${{ vars.CANARY_DATAHUB_READ_GMS_URL }}
      CANARY_DATAHUB_READ_MCP_URL: ${{ vars.CANARY_DATAHUB_READ_MCP_URL }}
      CANARY_DATAHUB_WRITE_GMS_URL: ${{ vars.CANARY_DATAHUB_WRITE_GMS_URL }}
      CANARY_DATAHUB_WRITE_MCP_URL: ${{ vars.CANARY_DATAHUB_WRITE_MCP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: governed-canary-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governed-canary/recovery
      - name: Authenticate sealed original control plane
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          EXPECTED_GATE: ${{ needs.prepare.outputs.gates_digest }}
          VERIFICATION_MODE: sealed
          SEALED_GATE_PATH: ${{ runner.temp }}/governed-canary/recovery/control-plane-security-gates.json
          OUTPUT_PATH: ${{ runner.temp }}/governed-canary/rollback-gates/control-plane-security-gates.json
        run: |
          export EXPECTED_GATE_SHA256="${EXPECTED_GATE#sha256:}"
          bash scripts/verify-github-control-plane.sh
      - name: Validate exact canary recovery identity before OIDC
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_CANARY_RECOVERY_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          test "${AWS_REGION}" = "eu-west-1"
          test "${AWS_ROLE_ARN}" = \
            "arn:aws:iam::${AWS_ACCOUNT_ID}:role/archon-datahub-github-governed-canary-recovery"
      - name: Configure step-scoped canary recovery AWS credentials
        id: canary-recovery-aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_CANARY_RECOVERY_ROLE_ARN }}
          role-session-name: archon-canary-rollback-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true
          output-env-credentials: false
          output-credentials: true
      - name: Restore only canonical PII baseline and prove read-back
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.canary-recovery-aws.outputs.aws-access-key-id }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.canary-recovery-aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.canary-recovery-aws.outputs.aws-session-token }}
          CANARY_RECOVERY_PATH: ${{ runner.temp }}/governed-canary/recovery/recovery.json
          CANARY_RECOVERY_EVIDENCE_PATH: ${{ runner.temp }}/governed-canary/rollback/recovery-evidence.json
        run: |
          set -euo pipefail
          cleanup_canary_credentials() {
            unset CANARY_DATAHUB_READ_TOKEN CANARY_DATAHUB_WRITE_TOKEN \
              CANARY_DATAHUB_CREDENTIAL_BINDING_SHA256
          }
          trap cleanup_canary_credentials EXIT
          source scripts/load-datahub-cloud-canary-credentials.sh
          [[ "${CANARY_DATAHUB_CREDENTIAL_BINDING_SHA256}" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir --mode=0700 "$(dirname "${CANARY_RECOVERY_EVIDENCE_PATH}")"
          node --import tsx scripts/governed-canary.ts recover
          cleanup_canary_credentials
          trap - EXIT
          jq -e '.schemaVersion=="archon.governed-canary-recovery-evidence/v2" and .runtimeProfile=="cloud" and (.disposition=="restored" or .disposition=="already-baseline")' "${CANARY_RECOVERY_EVIDENCE_PATH}" >/dev/null
          cp "${RUNNER_TEMP}/governed-canary/recovery/recovery.json" "${RUNNER_TEMP}/governed-canary/rollback/recovery.json"
          cp "${CANARY_RECOVERY_EVIDENCE_PATH}" "${RUNNER_TEMP}/governed-canary/rollback/attestation-predicate.json"
          (cd "$(dirname "${CANARY_RECOVERY_EVIDENCE_PATH}")" && sha256sum recovery-evidence.json >recovery-evidence.sha256)
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: ${{ runner.temp }}/governed-canary/rollback/recovery-evidence.sha256
          predicate-type: https://github.com/upgradedev/archon-datahub/attestations/governed-canary-cloud-v2
          predicate-path: ${{ runner.temp }}/governed-canary/rollback/attestation-predicate.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-canary-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governed-canary/rollback
          if-no-files-found: error
          retention-days: 90