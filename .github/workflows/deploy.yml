name: Deploy lean dual-runtime AWS release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Protected environment to deploy
        required: true
        type: choice
        options: [staging, production]
      release_sha:
        description: Exact merged master commit represented by every artifact
        required: true
        type: string
      ci_run_id:
        description: Successful ci.yml push run for release_sha
        required: true
        type: string
      cloud_runtime_artifact_id:
        description: Exact datahub-cloud-runtime-release artifact ID
        required: true
        type: string
      cloud_runtime_artifact_digest:
        description: Exact GitHub sha256 digest of the Cloud runtime artifact
        required: true
        type: string
      core_ami_artifact_id:
        description: Exact datahub-core-ami artifact ID
        required: true
        type: string
      core_ami_artifact_digest:
        description: Exact GitHub sha256 digest of the Core AMI artifact
        required: true
        type: string
      staging_evidence_artifact_id:
        description: Required for production; exact staging deployment artifact
        required: false
        type: string
      staging_evidence_artifact_digest:
        description: Required for production; exact GitHub sha256 digest
        required: false
        type: string

permissions: {}

concurrency:
  group: archon-aws-control-plane
  cancel-in-progress: false

env:
  AWS_PAGER: ""
  AWS_REGION: eu-west-1
  AWS_EDGE_REGION: us-east-1
  NODE_VERSION: "22.23.1"

jobs:
  deploy:
    name: Verify once and deploy ${{ inputs.stage }}
    if: github.repository == 'upgradedev/archon-datahub'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.stage }}
      url: ${{ steps.release.outputs.application_url }}
    steps:
      - name: Validate immutable dispatch coordinates
        env:
          STAGE: ${{ inputs.stage }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CLOUD_ID: ${{ inputs.cloud_runtime_artifact_id }}
          CLOUD_DIGEST: ${{ inputs.cloud_runtime_artifact_digest }}
          CORE_ID: ${{ inputs.core_ami_artifact_id }}
          CORE_DIGEST: ${{ inputs.core_ami_artifact_digest }}
          STAGING_ID: ${{ inputs.staging_evidence_artifact_id }}
          STAGING_DIGEST: ${{ inputs.staging_evidence_artifact_digest }}
        run: |
          set -euo pipefail
          [[ "${STAGE}" =~ ^(staging|production)$ ]]
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CI_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${CLOUD_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${CORE_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${CLOUD_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${CORE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "${STAGE}" == production ]]; then
            [[ "${STAGING_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "${STAGING_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          else
            test -z "${STAGING_ID}${STAGING_DIGEST}"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require merged master and successful CI security workflows
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)" = "${RELEASE_SHA}"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          jq -e --arg sha "${RELEASE_SHA}" '
            .path == ".github/workflows/ci.yml" and
            .event == "push" and .head_branch == "master" and
            .head_sha == $sha and .conclusion == "success"
          ' <<<"${run}" >/dev/null
          for workflow in codeql.yml workflow-security.yml supply-chain.yml; do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=master&head_sha=${RELEASE_SHA}&status=completed&per_page=30")"
            jq -e --arg path ".github/workflows/${workflow}" --arg sha "${RELEASE_SHA}" '
              [.workflow_runs[] |
               select(.path == $path and .head_sha == $sha and
                      .conclusion == "success")] | length >= 1
            ' <<<"${runs}" >/dev/null
          done

      - name: Download and verify exact artifact archives
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CLOUD_ID: ${{ inputs.cloud_runtime_artifact_id }}
          CLOUD_DIGEST: ${{ inputs.cloud_runtime_artifact_digest }}
          CORE_ID: ${{ inputs.core_ami_artifact_id }}
          CORE_DIGEST: ${{ inputs.core_ami_artifact_digest }}
          STAGE: ${{ inputs.stage }}
          STAGING_ID: ${{ inputs.staging_evidence_artifact_id }}
          STAGING_DIGEST: ${{ inputs.staging_evidence_artifact_digest }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/promotion"
          mkdir -p "${root}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/artifacts?per_page=100")"
          meta() {
            jq -er --arg name "$1" '
              [.artifacts[] | select(.name == $name and .expired == false)] as $x |
              if ($x|length)==1 then $x[0] else error("artifact cardinality") end
            ' <<<"${artifacts}"
          }
          web="$(meta "web-${RELEASE_SHA}")"
          lambdas="$(meta "lambdas-${RELEASE_SHA}")"

          download() {
            local id="$1" digest="$2" name="$3" destination="$4" run_id="${5:-}"
            local metadata archive
            metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            jq -e --arg d "${digest}" --arg n "${name}" --arg r "${run_id}" '
              .expired == false and .digest == $d and .name == $n and
              (if $r == "" then true else (.workflow_run.id|tostring)==$r end)
            ' <<<"${metadata}" >/dev/null
            archive="${root}/${id}.zip"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" >"${archive}"
            test "sha256:$(sha256sum "${archive}"|awk '{print $1}')" = "${digest}"
            mkdir -p "${destination}"
            python3 - "${archive}" "${destination}" <<'PY'
          import stat, sys, zipfile
          from pathlib import Path
          archive, destination = Path(sys.argv[1]), Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(archive) as source:
              for item in source.infolist():
                  path = Path(item.filename)
                  target = (destination / path).resolve()
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("unsafe artifact path")
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit("artifact symlink rejected")
                  if destination != target and destination not in target.parents:
                      raise SystemExit("artifact extraction escaped destination")
              source.extractall(destination)
          PY
            rm -f -- "${archive}"
          }

          web_id="$(jq -er .id <<<"${web}")"
          web_digest="$(jq -er .digest <<<"${web}")"
          lambda_id="$(jq -er .id <<<"${lambdas}")"
          lambda_digest="$(jq -er .digest <<<"${lambdas}")"
          download "${web_id}" "${web_digest}" "web-${RELEASE_SHA}" "${root}/web" "${CI_RUN_ID}"
          download "${lambda_id}" "${lambda_digest}" "lambdas-${RELEASE_SHA}" "${root}/lambdas" "${CI_RUN_ID}"
          download "${CLOUD_ID}" "${CLOUD_DIGEST}" "datahub-cloud-runtime-release-${RELEASE_SHA}" "${root}/cloud"
          core_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CORE_ID}" --jq .name)"
          [[ "${core_name}" =~ ^datahub-core-ami-ami-[0-9a-f]{8,17}$ ]]
          download "${CORE_ID}" "${CORE_DIGEST}" "${core_name}" "${root}/core"
          if [[ "${STAGE}" == production ]]; then
            staging_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${STAGING_ID}" --jq .name)"
            [[ "${staging_name}" =~ ^deployment-evidence-staging-${RELEASE_SHA}-[1-9][0-9]*$ ]]
            download "${STAGING_ID}" "${STAGING_DIGEST}" "${staging_name}" "${root}/staging"
          fi
          {
            echo "root=${root}"
            echo "web_digest=${web_digest}"
            echo "lambda_digest=${lambda_digest}"
          } >>"${GITHUB_OUTPUT}"


      - name: Validate release receipts and producer workflows
        id: receipts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          STAGE: ${{ inputs.stage }}
          ROOT: ${{ steps.artifacts.outputs.root }}
          CLOUD_ID: ${{ inputs.cloud_runtime_artifact_id }}
          CORE_ID: ${{ inputs.core_ami_artifact_id }}
        run: |
          set -euo pipefail
          web_tar="${ROOT}/web/archon-web.tar.gz"
          lambda_tar="${ROOT}/lambdas/archon-lambdas.tar.gz"
          for pair in \
            "${web_tar}:${ROOT}/web/archon-web.tar.gz.sha256" \
            "${lambda_tar}:${ROOT}/lambdas/archon-lambdas.tar.gz.sha256"
          do
            file="${pair%%:*}"
            checksum="${pair#*:}"
            test -f "${file}"
            test -f "${checksum}"
            test "$(sha256sum "${file}"|awk '{print $1}')" = \
              "$(awk 'NR==1 {print $1}' "${checksum}")"
          done
          spa_tar_sha256="$(sha256sum "${web_tar}" | awk '{print $1}')"
          lambda_tar_sha256="$(sha256sum "${lambda_tar}" | awk '{print $1}')"
          [[ "${spa_tar_sha256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${lambda_tar_sha256}" =~ ^[0-9a-f]{64}$ ]]
          for subject in "${web_tar}" "${lambda_tar}"; do
            gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
              --predicate-type "https://github.com/upgradedev/archon-datahub/attestations/ci-release/v1" \
              >/dev/null
            gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/supply-chain.yml" \
              --predicate-type "https://github.com/upgradedev/archon-datahub/attestations/verified-ci-artifact/v4" \
              >/dev/null
          done

          cloud="${ROOT}/cloud/release.json"
          test -f "${cloud}"
          python3 - "${cloud}" "${RELEASE_SHA}" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path
          path, expected = Path(sys.argv[1]), sys.argv[2]
          receipt = json.loads(path.read_text(encoding="utf-8"))
          digest = receipt.pop("digest", None)
          encoded = json.dumps(
              receipt, sort_keys=True, separators=(",", ":"), ensure_ascii=False
          ).encode()
          if digest != "sha256:" + hashlib.sha256(encoded).hexdigest():
              raise SystemExit("Cloud receipt self-digest mismatch")
          if receipt.get("schemaVersion") != "archon.datahub-cloud-runtime-release/v1":
              raise SystemExit("Cloud receipt schema mismatch")
          if receipt.get("sourceSha") != expected:
              raise SystemExit("Cloud source mismatch")
          if (receipt.get("architecture"), receipt.get("platform")) != ("x86_64", "linux/amd64"):
              raise SystemExit("Cloud platform mismatch")
          if receipt.get("handlers") != {
              "read": "handlers.read_handler",
              "mutation": "handlers.mutation_handler",
              "fixtureReset": "handlers.fixture_reset_handler",
          }:
              raise SystemExit("Cloud handlers mismatch")
          gates = {"unitTests","trivy","sca","sbom","provenance","signature","attestations"}
          if set(receipt.get("gates", {})) != gates or not all(receipt["gates"].values()):
              raise SystemExit("Cloud gates mismatch")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", receipt.get("imageDigest", "")):
              raise SystemExit("Cloud image digest invalid")
          expected_uri = (
              r"[0-9]{12}\.dkr\.ecr\.eu-west-1\.amazonaws\.com/"
              r"archon-datahub-cloud-runtime-v2:cloud-v2-" + re.escape(expected)
          )
          if not re.fullmatch(expected_uri, receipt.get("imageUri", "")):
              raise SystemExit("Cloud tagged image URI invalid")
          PY
          cloud_digest="$(jq -er .digest "${cloud}")"
          tagged_image_uri="$(jq -er .imageUri "${cloud}")"
          tag_suffix=":cloud-v2-${RELEASE_SHA}"
          repository_uri="${tagged_image_uri%"${tag_suffix}"}"
          test "${repository_uri}${tag_suffix}" = "${tagged_image_uri}"
          image_uri="${repository_uri}@$(jq -er .imageDigest "${cloud}")"
          [[ "${image_uri}" =~ ^[0-9]{12}\.dkr\.ecr\.eu-west-1\.amazonaws\.com/archon-datahub-cloud-runtime-v2@sha256:[0-9a-f]{64}$ ]]

          core="${ROOT}/core/ami-build-evidence.json"
          test -f "${core}"
          jq -e --arg sha "${RELEASE_SHA}" '
            .schemaVersion == "archon.datahub-core-ami-build/v2" and
            .releaseSha == $sha and .companionSourceSha == $sha and
            .region == "eu-west-1" and
            (.amiId|test("^ami-[0-9a-f]{8,17}$")) and
            (.generation|test("^[A-Za-z0-9._-]{1,128}$")) and
            (.capabilityDigest|test("^sha256:[0-9a-f]{64}$")) and
            (.imageManifestDigest|test("^sha256:[0-9a-f]{64}$")) and
            .provenance.requestTagProofSchema == "archon.packer-request-tag-proof/v1" and
            .provenance.exactRequestTagsVerified == true and
            .provenance.accountIdentifierRetained == false and
            .supplyChain.scanner.name == "Trivy" and
            .supplyChain.scanner.version == "0.70.0" and
            .supplyChain.scanner.databaseMetadataRetained == true and
            .supplyChain.coreImages.resolutionCount == 1 and
            .supplyChain.coreImages.scanOrder == "sequential" and
            .supplyChain.coreImages.runtimePullsAllowed == false and
            .supplyChain.coreImages.actionableGate == "fixed HIGH,CRITICAL" and
            .supplyChain.coreImages.actionableFixedHighCritical == 0 and
            .supplyChain.coreImages.vexGenerated == false and
            .supplyChain.coreImages.perImageCycloneDx == true and
            .supplyChain.coreImages.perImageSpdx == true and
            .supplyChain.ami.baseImagePatched == true and
            .supplyChain.ami.applicableSecurityUpdates == 0 and
            .supplyChain.ami.composePullPolicy == "never" and
            .supplyChain.ami.osCycloneDx == true and
            .supplyChain.ami.osSpdx == true and
            .supplyChain.ami.scannerBinaryPresent == false and
            .supplyChain.ami.scannerDatabasePresent == false and
            .image.ImageId == .amiId and (.image|has("OwnerId")|not)
          ' "${core}" >/dev/null
          gh attestation verify "${core}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/datahub-core-ami.yml" \
            >/dev/null

          verify_run() {
            local id="$1" path="$2" events_json="$3" artifact run
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$(jq -er .workflow_run.id <<<"${artifact}")")"
            jq -e \
              --arg path "${path}" \
              --argjson events "${events_json}" \
              --arg sha "${RELEASE_SHA}" '
                .event as $actual_event |
                .path == $path and
                ($events | index($actual_event)) != null and
                .head_branch == "master" and .head_sha == $sha and
                .status == "completed" and .conclusion == "success"
              ' <<<"${run}" >/dev/null
          }
          verify_run "${CLOUD_ID}" \
            ".github/workflows/datahub-cloud-runtime-image.yml" \
            '["push","workflow_dispatch"]'
          verify_run "${CORE_ID}" \
            ".github/workflows/datahub-core-ami.yml" \
            '["workflow_dispatch"]'

          if [[ "${STAGE}" == production ]]; then
            staging="${ROOT}/staging/deployment-evidence.json"
            test -f "${staging}"
            jq -e \
              --arg sha "${RELEASE_SHA}" \
              --arg web "${{ steps.artifacts.outputs.web_digest }}" \
              --arg lambda "${{ steps.artifacts.outputs.lambda_digest }}" \
              --arg cloud "${cloud_digest}" \
              --arg capability "$(jq -er .capabilityDigest "${core}")" '
                .schemaVersion == "archon.aws-deployment-evidence/v2" and
                .stage == "staging" and .releaseSha == $sha and
                .promotion.webArtifactDigest == $web and
                .promotion.lambdaArtifactDigest == $lambda and
                .promotion.cloudRuntimeReleaseDigest == $cloud and
                .promotion.coreCapabilityDigest == $capability and
                .verification.result == "passed"
              ' "${staging}" >/dev/null
            gh attestation verify "${staging}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml" \
              --predicate-type "https://github.com/upgradedev/archon-datahub/attestations/aws-deployment/v2" \
              >/dev/null
          fi
          {
            echo "web_tar=${web_tar}"
            echo "lambda_tar=${lambda_tar}"
            echo "spa_tar_sha256=${spa_tar_sha256}"
            echo "lambda_tar_sha256=${lambda_tar_sha256}"
            echo "cloud_release_digest=${cloud_digest}"
            echo "image_uri=${image_uri}"
            echo "core_receipt=${core}"
            echo "core_ami_id=$(jq -er .amiId "${core}")"
            echo "core_generation=$(jq -er .generation "${core}")"
            echo "core_capability_digest=$(jq -er .capabilityDigest "${core}")"
            echo "core_image_manifest_digest=$(jq -er .imageManifestDigest "${core}")"
          } >>"${GITHUB_OUTPUT}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/aws/package-lock.json

      - name: Stage attested Lambda bytes and compile deployment IaC
        env:
          LAMBDA_TAR: ${{ steps.receipts.outputs.lambda_tar }}
        run: |
          set -euo pipefail
          members="${RUNNER_TEMP}/deploy-lambda-members.txt"
          tar --list --gzip --file "${LAMBDA_TAR}" >"${members}"
          test -s "${members}"
          while IFS= read -r member; do
            case "${member}" in
              control|control/*|runtime-control|runtime-control/*) ;;
              *)
                echo "::error::Unexpected promoted Lambda archive member: ${member}"
                exit 1
                ;;
            esac
            if [[ "${member}" == /* || "${member}" =~ (^|/)\.\.(/|$) ]]; then
              echo "::error::Unsafe promoted Lambda archive member: ${member}"
              exit 1
            fi
          done <"${members}"
          if LC_ALL=C sort "${members}" | uniq --repeated | grep -q .; then
            echo "::error::Duplicate promoted Lambda archive member"
            exit 1
          fi
          if tar --list --verbose --gzip --file "${LAMBDA_TAR}" |
            awk '
              substr($1, 1, 1) != "-" && substr($1, 1, 1) != "d" {
                unsafe = 1
              }
              END { exit(unsafe ? 0 : 1) }
            '
          then
            echo "::error::Promoted Lambda archive may contain only regular files and directories"
            exit 1
          fi
          rm -rf -- infra/aws/lambda/control infra/aws/lambda/runtime-control
          mkdir -p infra/aws/lambda
          tar --extract --gzip --file "${LAMBDA_TAR}" \
            --directory infra/aws/lambda --no-same-owner --no-same-permissions
          for entry in \
            control/index.js \
            control/remediation.js \
            control/package.json \
            control/package-lock.json \
            runtime-control/index.js \
            runtime-control/session.js \
            runtime-control/package.json \
            runtime-control/package-lock.json; do
            test -f "infra/aws/lambda/${entry}"
          done
          test -d infra/aws/lambda/control/node_modules
          test -d infra/aws/lambda/runtime-control/node_modules
          if find infra/aws/lambda/control infra/aws/lambda/runtime-control \
            \( ! -type f -a ! -type d \) -print -quit | grep -q .; then
            echo "::error::Extracted Lambda deployment tree contains a special file"
            exit 1
          fi
          npm ci --prefix infra/aws --ignore-scripts
          test "$(npm --version)" = "10.9.8"
          npm --prefix infra/aws run build

      - name: Fail closed on exact stage deployment role before AWS trust
        id: deploy_authority
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${STAGE}" =~ ^(staging|production)$ ]]
          expected_deploy_role_arn="arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/archon-datahub-github-${STAGE}-deploy"
          if [[ "${AWS_DEPLOY_ROLE_ARN}" != "${expected_deploy_role_arn}" ]]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not the exact foundation-owned ${STAGE} deploy role"
            exit 1
          fi
          printf 'role_arn=%s\n' "${AWS_DEPLOY_ROLE_ARN}" >>"${GITHUB_OUTPUT}"

      - name: Acquire short-lived deployment authority
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ steps.deploy_authority.outputs.role_arn }}
          role-session-name: archon-${{ inputs.stage }}-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Preflight exact lean stack execution-role bindings
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EXPECTED_STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          ALLOW_ABSENT=true \
            ALLOW_ROLE_MIGRATION=false \
            bash scripts/validate-cloudformation-role-bindings.sh >/dev/null

      - name: Revalidate live immutable image and AMI
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          IMAGE_URI: ${{ steps.receipts.outputs.image_uri }}
          CORE_RECEIPT: ${{ steps.receipts.outputs.core_receipt }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          test "${account}" = "${EXPECTED_ACCOUNT_ID}"
          repository_uri="${IMAGE_URI%@*}"
          image_digest="${IMAGE_URI##*@}"
          test "${repository_uri%%.*}" = "${account}"
          test "$(basename "${repository_uri}")" = "archon-datahub-cloud-runtime-v2"
          aws ecr describe-repositories \
            --repository-names archon-datahub-cloud-runtime-v2 \
            --region "${AWS_REGION}" --output json |
            jq -e '
              .repositories|length==1 and
              .[0].imageTagMutability=="IMMUTABLE" and
              .[0].imageScanningConfiguration.scanOnPush==true and
              .[0].encryptionConfiguration.encryptionType=="KMS"
            ' >/dev/null
          aws ecr describe-images \
            --repository-name archon-datahub-cloud-runtime-v2 \
            --image-ids "imageDigest=${image_digest}" \
            --region "${AWS_REGION}" --output json |
            jq -e --arg digest "${image_digest}" '
              .imageDetails|length==1 and .[0].imageDigest==$digest
            ' >/dev/null

          ami_id="$(jq -er .amiId "${CORE_RECEIPT}")"
          ami="$(aws ec2 describe-images --image-ids "${ami_id}" \
            --owners self --region "${AWS_REGION}" --output json)"
          jq -e \
            --arg id "${ami_id}" \
            --arg sha "${RELEASE_SHA}" \
            --arg generation "$(jq -er .generation "${CORE_RECEIPT}")" \
            --arg capability "$(jq -er .capabilityDigest "${CORE_RECEIPT}")" \
            --arg manifest "$(jq -er .imageManifestDigest "${CORE_RECEIPT}")" \
            --arg run "$(jq -er '.workflowRunId|tostring' "${CORE_RECEIPT}")" '
              .Images as $images |
              ($images|length)==1 and $images[0].ImageId==$id and
              $images[0].State=="available" and
              $images[0].Architecture=="x86_64" and
              ([$images[0].Tags[]|{key:.Key,value:.Value}]|from_entries) as $tags |
              $tags.ArchonDataHubCore=="verified" and
              $tags.ArchonFourComponents=="mcp,ack,skills,analytics" and
              $tags.ArchonGeneration==$generation and
              $tags.ArchonCapabilityDigest==$capability and
              $tags.ArchonImageManifestDigest==$manifest and
              $tags.ArchonReleaseSha==$sha and
              $tags.ManagedBy=="github-actions" and
              $tags."archon:Purpose"=="datahub-core-ami" and
              $tags."archon:BuildRun"==$run
            ' <<<"${ami}" >/dev/null


      - name: Deploy Edge, zero-idle Core, then serverless Judge
        id: cdk
        env:
          STAGE: ${{ inputs.stage }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          DOMAIN: ${{ vars.ARCHON_CLOUDFRONT_DOMAIN_NAME }}
          HOSTED_ZONE_ID: ${{ vars.ARCHON_CLOUDFRONT_HOSTED_ZONE_ID }}
          IMAGE_URI: ${{ steps.receipts.outputs.image_uri }}
          CLOUD_RELEASE_DIGEST: ${{ steps.receipts.outputs.cloud_release_digest }}
          CORE_AMI_ID: ${{ steps.receipts.outputs.core_ami_id }}
          CORE_GENERATION: ${{ steps.receipts.outputs.core_generation }}
          CORE_CAPABILITY_DIGEST: ${{ steps.receipts.outputs.core_capability_digest }}
          CORE_IMAGE_MANIFEST_DIGEST: ${{ steps.receipts.outputs.core_image_manifest_digest }}
          SPA_TAR_SHA256: ${{ steps.receipts.outputs.spa_tar_sha256 }}
          LAMBDA_TAR_SHA256: ${{ steps.receipts.outputs.lambda_tar_sha256 }}
        run: |
          set -euo pipefail
          : "${DOMAIN:?ARCHON_CLOUDFRONT_DOMAIN_NAME is required}"
          : "${HOSTED_ZONE_ID:?ARCHON_CLOUDFRONT_HOSTED_ZONE_ID is required}"
          [[ "${DOMAIN}" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$ ]]
          [[ "${HOSTED_ZONE_ID}" =~ ^Z[A-Z0-9]{1,31}$ ]]
          edge_stack="Archon-${STAGE}-Edge"
          core_stack="Archon-${STAGE}-Core"
          judge_stack="Archon-${STAGE}-Judge"
          edge_outputs="${RUNNER_TEMP}/edge-outputs.json"
          core_outputs="${RUNNER_TEMP}/core-outputs.json"
          judge_outputs="${RUNNER_TEMP}/judge-outputs.json"
          ddb_prefix="$(
            aws ec2 describe-managed-prefix-lists \
              --filters "Name=prefix-list-name,Values=com.amazonaws.${AWS_REGION}.dynamodb" \
              --region "${AWS_REGION}" \
              --query 'PrefixLists[0].PrefixListId' --output text
          )"
          [[ "${ddb_prefix}" =~ ^pl-([0-9a-f]{8}|[0-9a-f]{17})$ ]]

          (
            cd infra/aws
            ./node_modules/.bin/cdk deploy "${edge_stack}" \
              --exclusively --context "stage=${STAGE}" \
              --require-approval never \
              --parameters "${edge_stack}:CloudFrontDomainName=${DOMAIN}" \
              --parameters "${edge_stack}:CloudFrontHostedZoneId=${HOSTED_ZONE_ID}" \
              --outputs-file "${edge_outputs}"
          )
          certificate="$(jq -er --arg s "${edge_stack}" '.[$s].ArchonCloudFrontCertificateArn' "${edge_outputs}")"
          edge_waf="$(jq -er --arg s "${edge_stack}" '.[$s].ArchonCloudFrontWebAclArn' "${edge_outputs}")"

          (
            cd infra/aws
            ./node_modules/.bin/cdk deploy "${core_stack}" \
              --exclusively --context "stage=${STAGE}" \
              --require-approval never \
              --parameters "${core_stack}:DataHubCoreAmiId=${CORE_AMI_ID}" \
              --parameters "${core_stack}:DataHubCoreGeneration=${CORE_GENERATION}" \
              --parameters "${core_stack}:DataHubCoreCapabilityDigest=${CORE_CAPABILITY_DIGEST}" \
              --parameters "${core_stack}:DataHubCoreImageManifestDigest=${CORE_IMAGE_MANIFEST_DIGEST}" \
              --parameters "${core_stack}:DynamoDbPrefixListId=${ddb_prefix}" \
              --outputs-file "${core_outputs}"
          )

          (
            cd infra/aws
            ./node_modules/.bin/cdk deploy "${judge_stack}" \
              --exclusively --context "stage=${STAGE}" \
              --require-approval never \
              --parameters "${judge_stack}:CloudFrontDomainName=${DOMAIN}" \
              --parameters "${judge_stack}:CloudFrontHostedZoneId=${HOSTED_ZONE_ID}" \
              --parameters "${judge_stack}:CloudFrontCertificateArn=${certificate}" \
              --parameters "${judge_stack}:CloudFrontWebAclArn=${edge_waf}" \
              --parameters "${judge_stack}:CloudRuntimeImageUri=${IMAGE_URI}" \
              --parameters "${judge_stack}:SpaArtifactSha256=${SPA_TAR_SHA256}" \
              --parameters "${judge_stack}:LambdaArtifactSha256=${LAMBDA_TAR_SHA256}" \
              --parameters "${judge_stack}:CloudRuntimeReleaseDigest=${CLOUD_RELEASE_DIGEST}" \
              --parameters "${judge_stack}:CiRunId=${CI_RUN_ID}" \
              --parameters "${judge_stack}:DeploymentWorkflowRunId=${GITHUB_RUN_ID}" \
              --parameters "${judge_stack}:ReleaseSha=${RELEASE_SHA}" \
              --outputs-file "${judge_outputs}"
          )
          {
            echo "edge_outputs=${edge_outputs}"
            echo "core_outputs=${core_outputs}"
            echo "judge_outputs=${judge_outputs}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify exact post-deploy CloudFormation role bindings
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EXPECTED_STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          ALLOW_ABSENT=false \
            ALLOW_ROLE_MIGRATION=false \
            bash scripts/validate-cloudformation-role-bindings.sh >/dev/null

      - name: Publish exact SPA bytes and runtime authentication config
        id: release
        env:
          STAGE: ${{ inputs.stage }}
          WEB_TAR: ${{ steps.receipts.outputs.web_tar }}
          JUDGE_OUTPUTS: ${{ steps.cdk.outputs.judge_outputs }}
          DOMAIN: ${{ vars.ARCHON_CLOUDFRONT_DOMAIN_NAME }}
          DEMO_QUERY: ${{ vars.DATAHUB_DEMO_QUERY }}
        run: |
          set -euo pipefail
          : "${DEMO_QUERY:?DATAHUB_DEMO_QUERY is required}"
          [[ "${DEMO_QUERY}" != *'*'* && "${DEMO_QUERY}" != *'?'* ]]
          root="${RUNNER_TEMP}/spa"
          mkdir -p "${root}"
          tar --extract --gzip --file "${WEB_TAR}" \
            --directory "${root}" --no-same-owner --no-same-permissions
          test -f "${root}/index.html"
          if find "${root}" -type f -name '*.map' -print -quit | grep -q .; then
            echo "::error::source maps are forbidden in the public SPA"
            exit 1
          fi
          stack="Archon-${STAGE}-Judge"
          output() {
            jq -er --arg stack "${stack}" --arg key "$1" \
              '.[$stack][$key]' "${JUDGE_OUTPUTS}"
          }
          bucket="$(output ArchonSpaBucketName)"
          distribution="$(output ArchonCloudFrontDistributionId)"
          application_url="$(output ArchonApplicationUrl)"
          test "${application_url}" = "https://${DOMAIN}"
          jq -nS \
            --arg demoQuery "${DEMO_QUERY}" \
            --arg clientId "$(output ArchonUserPoolClientId)" \
            --arg authorizationEndpoint "$(output ArchonCognitoAuthorizationEndpoint)" \
            --arg tokenEndpoint "$(output ArchonCognitoTokenEndpoint)" \
            --arg logoutEndpoint "$(output ArchonCognitoLogoutEndpoint)" \
            --arg redirectUri "$(output ArchonAuthRedirectUri)" \
            --arg logoutUri "$(output ArchonAuthLogoutUri)" \
            --arg approvalScope "$(output ArchonApprovalOAuthScope)" '
              {
                schemaVersion:1,
                demoQuery:$demoQuery,
                auth:{
                  clientId:$clientId,
                  authorizationEndpoint:$authorizationEndpoint,
                  tokenEndpoint:$tokenEndpoint,
                  logoutEndpoint:$logoutEndpoint,
                  redirectUri:$redirectUri,
                  logoutUri:$logoutUri,
                  scopes:["openid","email","profile",$approvalScope]
                }
              }
            ' >"${root}/runtime-config.json"
          aws s3 sync "${root}/" "s3://${bucket}/" \
            --delete \
            --exclude "index.html" \
            --exclude "runtime-config.json" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "${root}/index.html" "s3://${bucket}/index.html" \
            --content-type "text/html; charset=utf-8" --cache-control "no-store"
          aws s3 cp "${root}/runtime-config.json" "s3://${bucket}/runtime-config.json" \
            --content-type "application/json" --cache-control "no-store"
          invalidation="$(
            aws cloudfront create-invalidation \
              --distribution-id "${distribution}" \
              --paths '/index.html' '/runtime-config.json' \
              --query Invalidation.Id --output text
          )"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${distribution}" --id "${invalidation}"
          echo "application_url=${application_url}" >>"${GITHUB_OUTPUT}"
          echo "distribution_id=${distribution}" >>"${GITHUB_OUTPUT}"


      - name: Verify deployed bytes, zero-idle posture and HTTP boundary
        env:
          ARCHON_STAGE: ${{ inputs.stage }}
          ARCHON_OBSERVATION_OUTPUT: ${{ runner.temp }}/deployment/observation.json
          EXPECT_CORE_IDLE: "true"
          APPLICATION_URL: ${{ steps.release.outputs.application_url }}
          JUDGE_OUTPUTS: ${{ steps.cdk.outputs.judge_outputs }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/deployment"
          bash scripts/observe-aws-live-runtime.sh
          stack="Archon-${ARCHON_STAGE}-Judge"
          direct_api="$(jq -er --arg s "${stack}" '.[$s].ArchonApiInvokeUrl' "${JUDGE_OUTPUTS}")"
          distribution_domain="$(jq -er --arg s "${stack}" '.[$s].ArchonCloudFrontDomainName' "${JUDGE_OUTPUTS}")"
          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 4 --retry-all-errors --max-time 30 \
            --dump-header "${RUNNER_TEMP}/deployment/index.headers" \
            --output "${RUNNER_TEMP}/deployment/index.html" "${APPLICATION_URL}/"
          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 4 --retry-all-errors --max-time 30 \
            --dump-header "${RUNNER_TEMP}/deployment/profiles.headers" \
            --output "${RUNNER_TEMP}/deployment/profiles.json" \
            "${APPLICATION_URL}/api/runtime-profiles"
          jq -e '.profiles|type=="array" and length==2' \
            "${RUNNER_TEMP}/deployment/profiles.json" >/dev/null
          grep -Eiq '^strict-transport-security: .*max-age=' \
            "${RUNNER_TEMP}/deployment/index.headers"
          grep -Eiq '^content-security-policy:' \
            "${RUNNER_TEMP}/deployment/index.headers"
          grep -Eiq '^x-content-type-options: nosniff' \
            "${RUNNER_TEMP}/deployment/index.headers"
          grep -Eiq '^x-frame-options: DENY' \
            "${RUNNER_TEMP}/deployment/index.headers"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --proto '=https' --tlsv1.2 --max-time 20 \
            "${direct_api}/api/runtime-profiles")" = "403"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --proto '=https' --tlsv1.2 --max-time 20 \
            "https://${distribution_domain}/")" = "421"

      - name: Seal deployment evidence
        id: evidence
        env:
          STAGE: ${{ inputs.stage }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          APPLICATION_URL: ${{ steps.release.outputs.application_url }}
          WEB_DIGEST: ${{ steps.artifacts.outputs.web_digest }}
          LAMBDA_DIGEST: ${{ steps.artifacts.outputs.lambda_digest }}
          CLOUD_DIGEST: ${{ steps.receipts.outputs.cloud_release_digest }}
          CORE_CAPABILITY: ${{ steps.receipts.outputs.core_capability_digest }}
          CORE_MANIFEST: ${{ steps.receipts.outputs.core_image_manifest_digest }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/deployment/deployment-evidence.json"
          observation="$(
            sha256sum "${RUNNER_TEMP}/deployment/observation.json"|awk '{print $1}'
          )"
          jq -nS \
            --arg stage "${STAGE}" \
            --arg sha "${RELEASE_SHA}" \
            --arg ci "${CI_RUN_ID}" \
            --arg run "${GITHUB_RUN_ID}" \
            --arg url "${APPLICATION_URL}" \
            --arg web "${WEB_DIGEST}" \
            --arg lambda "${LAMBDA_DIGEST}" \
            --arg cloud "${CLOUD_DIGEST}" \
            --arg capability "${CORE_CAPABILITY}" \
            --arg manifest "${CORE_MANIFEST}" \
            --arg observation "${observation}" '
              {
                schemaVersion:"archon.aws-deployment-evidence/v2",
                stage:$stage,
                releaseSha:$sha,
                ciRunId:($ci|tonumber),
                deploymentRunId:($run|tonumber),
                applicationUrl:$url,
                promotion:{
                  policy:"build-once-promote-exact-artifacts",
                  webArtifactDigest:$web,
                  lambdaArtifactDigest:$lambda,
                  cloudRuntimeReleaseDigest:$cloud,
                  coreCapabilityDigest:$capability,
                  coreImageManifestDigest:$manifest
                },
                verification:{
                  result:"passed",
                  zeroIdleCore:true,
                  httpBoundary:true,
                  securityHeaders:true,
                  directApiRejected:true,
                  canonicalHostEnforced:true,
                  observationSha256:$observation
                },
                secretsProjected:false,
                generatedAt:(now|todateiso8601)
              }
            ' >"${evidence}"
          jq -e '.verification.result=="passed"' "${evidence}" >/dev/null
          echo "path=${evidence}" >>"${GITHUB_OUTPUT}"

      - name: Attest exact deployment evidence
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.evidence.outputs.path }}
          predicate-type: https://github.com/upgradedev/archon-datahub/attestations/aws-deployment/v2
          predicate-path: ${{ steps.evidence.outputs.path }}

      - name: Retain exact deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-evidence-${{ inputs.stage }}-${{ inputs.release_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/deployment/deployment-evidence.json
            ${{ runner.temp }}/deployment/observation.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Publish deployment summary
        env:
          APPLICATION_URL: ${{ steps.release.outputs.application_url }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGE: ${{ inputs.stage }}
        run: |
          {
            echo "### Lean dual-runtime deployment"
            echo
            echo "- Stage: ${STAGE}"
            echo "- Release: ${RELEASE_SHA}"
            echo "- Application: ${APPLICATION_URL}"
            echo "- Core idle capacity: 0"
            echo "- Security evidence: CI/CD and GitHub attestations only"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Remove runner-only promotion material
        if: always()
        run: |
          rm -rf -- \
            "${RUNNER_TEMP}/promotion" \
            "${RUNNER_TEMP}/spa" \
            "${RUNNER_TEMP}/deployment"
