name: Recover interrupted governed DataHub Cloud canary v2

on:
  workflow_run:
    workflows:
      - Governed DataHub Cloud canary v2
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_canary_run_id:
        description: Failed or cancelled governed Cloud canary run ID
        required: true
        type: string
      source_canary_run_attempt:
        description: Exact source run attempt
        required: true
        type: string
      confirmation:
        description: Type RECOVER SEALED GOVERNED DATAHUB CLOUD CANARY
        required: true
        type: string

permissions: {}

concurrency:
  group: archon-governed-canary-mutation-recovery
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.1"
  CANARY_SOURCE_WORKFLOW_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_canary_run_id }}
  CANARY_SOURCE_WORKFLOW_RUN_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.source_canary_run_attempt }}

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Authenticate sealed Cloud recovery
    if: >-
      github.repository == 'upgradedev/archon-datahub' &&
      github.ref == 'refs/heads/master' &&
      (
        (
          github.event_name == 'workflow_run' &&
          (
            github.event.workflow_run.conclusion == 'failure' ||
            github.event.workflow_run.conclusion == 'cancelled'
          )
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.confirmation == 'RECOVER SEALED GOVERNED DATAHUB CLOUD CANARY'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    environment:
      name: governed-canary-prepare
    outputs:
      artifact_digest: ${{ steps.source.outputs.artifact_digest }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
      gates_digest: ${{ steps.manifest.outputs.gates_digest }}
      recovery_digest: ${{ steps.manifest.outputs.recovery_digest }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANARY_ISOLATION_MARKER: ${{ vars.CANARY_ISOLATION_MARKER }}
      CANARY_DATAHUB_READ_GMS_URL: ${{ vars.CANARY_DATAHUB_READ_GMS_URL }}
      CANARY_DATAHUB_READ_MCP_URL: ${{ vars.CANARY_DATAHUB_READ_MCP_URL }}
      CANARY_DATAHUB_WRITE_GMS_URL: ${{ vars.CANARY_DATAHUB_WRITE_GMS_URL }}
      CANARY_DATAHUB_WRITE_MCP_URL: ${{ vars.CANARY_DATAHUB_WRITE_MCP_URL }}
    steps:
      - name: Resolve exact failed source run and immutable artifact
        id: source
        env:
          TRIGGER_EVENT_NAME: ${{ github.event_name }}
          EVENT_SOURCE_ID: ${{ github.event.workflow_run.id }}
          EVENT_SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "${CANARY_SOURCE_WORKFLOW_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${CANARY_SOURCE_WORKFLOW_RUN_ATTEMPT}" =~ ^[1-9][0-9]{0,9}$ ]]
          test "$(gh api "/repos/${GITHUB_REPOSITORY}" --jq .default_branch)" = "master"
          source_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANARY_SOURCE_WORKFLOW_RUN_ID}/attempts/${CANARY_SOURCE_WORKFLOW_RUN_ATTEMPT}")"
          jq -e --arg repo "${GITHUB_REPOSITORY}" --argjson run "${CANARY_SOURCE_WORKFLOW_RUN_ID}" \
            --argjson attempt "${CANARY_SOURCE_WORKFLOW_RUN_ATTEMPT}" '
            .id==$run and .run_attempt==$attempt and
            .name=="Governed DataHub Cloud canary v2" and
            .path==".github/workflows/governed-canary.yml" and
            .head_repository.full_name==$repo and .head_branch=="master" and
            (.head_sha|test("^[0-9a-f]{40}$")) and .event=="workflow_dispatch" and
            .status=="completed" and (.conclusion=="failure" or .conclusion=="cancelled")
          ' <<<"${source_json}" >/dev/null
          if [[ "${TRIGGER_EVENT_NAME}" == "workflow_run" ]]; then
            test "${EVENT_SOURCE_ID}" = "${CANARY_SOURCE_WORKFLOW_RUN_ID}"
            test "${EVENT_SOURCE_ATTEMPT}" = "${CANARY_SOURCE_WORKFLOW_RUN_ATTEMPT}"
            test "${EVENT_SOURCE_CONCLUSION}" = "$(jq -er .conclusion <<<"${source_json}")"
            test "${EVENT_SOURCE_SHA}" = "$(jq -er .head_sha <<<"${source_json}")"
          fi
          artifacts="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANARY_SOURCE_WORKFLOW_RUN_ID}/artifacts?per_page=100" --slurp | jq '{artifacts: map(.artifacts[]) }')"
          expected="governed-canary-recovery-${CANARY_SOURCE_WORKFLOW_RUN_ID}-${CANARY_SOURCE_WORKFLOW_RUN_ATTEMPT}"
          candidate="$(jq -ce --arg name "${expected}" --argjson run "${CANARY_SOURCE_WORKFLOW_RUN_ID}" '
            [.artifacts[] | select(
              .name==$name and .expired==false and .workflow_run.id==$run and
              (.digest|test("^sha256:[0-9a-f]{64}$")) and .size_in_bytes>0
            )] | if length==1 then .[0] else error("expected exactly one sealed recovery artifact") end
          ' <<<"${artifacts}")"
          {
            echo "source_sha=$(jq -er .head_sha <<<"${source_json}")"
            echo "artifact_id=$(jq -er .id <<<"${candidate}")"
            echo "artifact_digest=$(jq -er .digest <<<"${candidate}")"
          } >>"${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ env.CANARY_SOURCE_WORKFLOW_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/governed-canary-recovery/source
      - name: Verify canonical manifest, endpoint binding, and sealed gates
        id: manifest
        env:
          CANARY_CONTROL_PLANE_SHA: ${{ steps.source.outputs.source_sha }}
          CANARY_RECOVERY_PATH: ${{ runner.temp }}/governed-canary-recovery/source/recovery.json
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/governed-canary-recovery/source"
          test -d "${root}" && test ! -L "${root}"
          test -z "$(find "${root}" -type l -print -quit)"
          mapfile -t paths < <(find "${root}" -type f -printf '%f\n' | sort)
          test "$(printf '%s\n' "${paths[@]}")" = $'control-plane-security-gates.json\nrecovery.json'
          node --import tsx scripts/governed-canary.ts verify
          jq -e --arg run "${CANARY_SOURCE_WORKFLOW_RUN_ID}" \
            --arg attempt "${CANARY_SOURCE_WORKFLOW_RUN_ATTEMPT}" \
            --arg sha "${CANARY_CONTROL_PLANE_SHA}" '
            .schemaVersion=="archon.governed-canary-recovery/v4" and
            .sourceWorkflow.runId==$run and .sourceWorkflow.runAttempt==$attempt and
            .sourceWorkflow.controlPlaneSha==$sha and
            .runtime.profileId=="cloud" and .runtime.resolution=="explicit" and
            .runtime.stackName=="Archon-staging-Judge" and
            .target.entityUrn=="urn:li:dataset:(urn:li:dataPlatform:sqlite,archon_demo.customers,PROD)" and
            .target.columnPath=="customer_email" and .target.tagUrn=="urn:li:tag:PII"
          ' "${CANARY_RECOVERY_PATH}" >/dev/null
          gate_digest="sha256:$(sha256sum "${root}/control-plane-security-gates.json"|awk '{print $1}')"
          test "${gate_digest}" = "$(jq -er .sourceWorkflow.controlPlaneGatesSha256 "${CANARY_RECOVERY_PATH}")"
          {
            echo "gates_digest=${gate_digest}"
            echo "recovery_digest=$(jq -er .digest "${CANARY_RECOVERY_PATH}")"
          } >>"${GITHUB_OUTPUT}"

  recover:
    name: Human-approved exact Cloud baseline recovery
    needs: resolve
    if: needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: read
      deployments: write
      id-token: write
    environment:
      name: governed-canary-recovery
    env:
      GH_TOKEN: ${{ github.token }}
      CANARY_CONTROL_PLANE_SHA: ${{ needs.resolve.outputs.source_sha }}
      CANARY_ISOLATION_MARKER: ${{ vars.CANARY_ISOLATION_MARKER }}
      CANARY_DATAHUB_READ_GMS_URL: ${{ vars.CANARY_DATAHUB_READ_GMS_URL }}
      CANARY_DATAHUB_READ_MCP_URL: ${{ vars.CANARY_DATAHUB_READ_MCP_URL }}
      CANARY_DATAHUB_WRITE_GMS_URL: ${{ vars.CANARY_DATAHUB_WRITE_GMS_URL }}
      CANARY_DATAHUB_WRITE_MCP_URL: ${{ vars.CANARY_DATAHUB_WRITE_MCP_URL }}
      CANARY_RECOVERY_PATH: ${{ runner.temp }}/governed-canary-recovery/source/recovery.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact_id }}
          run-id: ${{ env.CANARY_SOURCE_WORKFLOW_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/governed-canary-recovery/source
      - name: Re-authenticate source control plane and sealed manifest
        env:
          CONTROL_PLANE_SHA: ${{ needs.resolve.outputs.source_sha }}
          EXPECTED_GATE: ${{ needs.resolve.outputs.gates_digest }}
          VERIFICATION_MODE: sealed
          SEALED_GATE_PATH: ${{ runner.temp }}/governed-canary-recovery/source/control-plane-security-gates.json
          OUTPUT_PATH: ${{ runner.temp }}/governed-canary-recovery/current/control-plane-security-gates.json
        run: |
          set -euo pipefail
          export EXPECTED_GATE_SHA256="${EXPECTED_GATE#sha256:}"
          bash scripts/verify-github-control-plane.sh
          node --import tsx scripts/governed-canary.ts verify
          test "$(jq -er .digest "${CANARY_RECOVERY_PATH}")" = "${{ needs.resolve.outputs.recovery_digest }}"
      - name: Restore only canonical PII baseline and prove read-back
        env:
          CANARY_RECOVERY_EVIDENCE_PATH: ${{ runner.temp }}/governed-canary-recovery/evidence/recovery-evidence.json
          CANARY_DATAHUB_READ_TOKEN: ${{ secrets.CANARY_DATAHUB_READ_TOKEN }}
          CANARY_DATAHUB_WRITE_TOKEN: ${{ secrets.CANARY_DATAHUB_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          : "${CANARY_DATAHUB_READ_TOKEN:?CANARY_DATAHUB_READ_TOKEN is required}"
          : "${CANARY_DATAHUB_WRITE_TOKEN:?CANARY_DATAHUB_WRITE_TOKEN is required}"
          echo "::add-mask::${CANARY_DATAHUB_READ_TOKEN}"
          echo "::add-mask::${CANARY_DATAHUB_WRITE_TOKEN}"
          mkdir --mode=0700 "$(dirname "${CANARY_RECOVERY_EVIDENCE_PATH}")"
          node --import tsx scripts/governed-canary.ts recover
          jq -e '
            .schemaVersion=="archon.governed-canary-recovery-evidence/v2" and
            .runtimeProfile=="cloud" and
            (.disposition=="restored" or .disposition=="already-baseline") and
            .target.entityUrn=="urn:li:dataset:(urn:li:dataPlatform:sqlite,archon_demo.customers,PROD)" and
            .target.columnPath=="customer_email" and .target.tagUrn=="urn:li:tag:PII"
          ' "${CANARY_RECOVERY_EVIDENCE_PATH}" >/dev/null
          (
            cd "$(dirname "${CANARY_RECOVERY_EVIDENCE_PATH}")"
            sha256sum recovery-evidence.json >recovery-evidence.sha256
          )
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ runner.temp }}/governed-canary-recovery/evidence/recovery-evidence.sha256
          predicate-type: https://github.com/upgradedev/archon-datahub/attestations/governed-canary-cloud-v2
          predicate-path: ${{ runner.temp }}/governed-canary-recovery/evidence/recovery-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-canary-emergency-recovery-${{ env.CANARY_SOURCE_WORKFLOW_RUN_ID }}-${{ env.CANARY_SOURCE_WORKFLOW_RUN_ATTEMPT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governed-canary-recovery/evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
