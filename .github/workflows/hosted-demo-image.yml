name: Hosted demo image

# Builds the image the public demo runs on, without any cloud credentials and
# without pushing. The image is not covered by "Production container", which
# builds the distroless root Dockerfile; this one has to carry a Python
# interpreter because the DataHub MCP server is spawned over stdio.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/locks/datahub-mcp-v0.6.0.json
      - .github/security/openvex/datahub-mcp-setuptools-81.0.0.openvex.json
      - .github/workflows/hosted-demo-image.yml
      - package-lock.json
      - package.json
      - scripts/materialize-datahub-mcp-lock.sh
      - services/datahub-hosted-api/**
      - src/**
      - tsconfig.build.json
      - tsconfig.json

permissions: {}

concurrency:
  group: hosted-demo-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the MCP-capable audit image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # The build asserts `mcp-server-datahub --version` twice: once where the
      # sealed venv is materialized and once after it is relocated into the
      # runtime stage. A relocation that breaks the interpreter fails here
      # rather than at deploy time.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/datahub-hosted-api/Dockerfile
          push: false
          load: false
          provenance: false
          build-args: ARCHON_RELEASE_SHA=${{ github.sha }}
