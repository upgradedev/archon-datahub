                "${url}"
            )"
            test "${status}" = "200"
          done
          python3 - \
            "${final_rules}" \
            "${final_challenge}" \
            "${RULES_PROJECTION_DIGEST}" <<'PY'
          import hashlib
          import html
          import json
          import pathlib
          import re
          import sys
          from html.parser import HTMLParser

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = []
              def handle_data(self, data):
                  self.values.append(data)

          def text(path):
              parser = TextExtractor()
              parser.feed(pathlib.Path(path).read_text(encoding="utf-8"))
              return re.sub(
                  r"\s+", " ",
                  html.unescape(" ".join(parser.values)).replace("\xa0", " "),
              ).strip()

          rules = text(sys.argv[1])
          challenge = text(sys.argv[2])
          required = (
              "Feedback Period: July 6, 2026 (09:00 am Eastern Time)",
              "August 10, 2026 (05:00 pm Eastern Time)",
              "registered for the hackathon on Devpost",
              "complete an online form",
              "complete with actionable comments",
              "One Feedback Submission per Entrant.",
              "completeness, viability, and potential impact of the feedback",
              "Feedback Prizes are awarded to individuals, not to Projects",
          )
          if any(value not in rules for value in required):
              raise SystemExit("official feedback rule changed before signing")
          if "complete the feedback section during submission" not in challenge:
              raise SystemExit("official feedback-section wording changed before signing")
          projection = {
              "authenticatedUiObserved": False,
              "challengeUrl": "https://datahub.devpost.com/",
              "completeActionableFeedbackRequired": True,
              "distinctFeedbackSubmissionUnderRules": True,
              "evaluationCriteria": [
                  "completeness", "viability", "potential-impact"
              ],
              "feedbackDeadline": "2026-08-10T21:00:00Z",
              "feedbackStart": "2026-07-06T13:00:00Z",
              "individualNotProjectPrize": True,
              "oneEntryPerEntrant": True,
              "onlineFormRequired": True,
              "officialRulesUrl": "https://datahub.devpost.com/rules",
              "publicOverviewInstruction":
                  "complete-feedback-section-during-submission",
              "registeredEntrantRequired": True,
              "schemaVersion": "archon.datahub-feedback-rules/v1",
          }
          encoded = (
              json.dumps(projection, sort_keys=True, separators=(",", ":")) + "\n"
          ).encode()
          actual = "sha256:" + hashlib.sha256(encoded).hexdigest()
          if actual != sys.argv[3]:
              raise SystemExit("official rules projection changed before signing")
          PY
          (
            cd "${RUNNER_TEMP}/submission-bonus-feedback-attestation"
            sha256sum --check --strict SHA256SUMS
          )

      - name: Attest all three exact feedback subjects
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ runner.temp }}/submission-bonus-feedback-attestation/SHA256SUMS
          predicate-type: ${{ env.PREDICATE_TYPE }}
          predicate-path: ${{ runner.temp }}/submission-bonus-feedback-attestation/attestation-predicate.json

      - name: Verify persisted signed full-subject attestation
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "${ATTESTATION_ID}" =~ ^[1-9][0-9]*$ ]]
          test "${ATTESTATION_URL}" = \
            "https://github.com/${GITHUB_REPOSITORY}/attestations/${ATTESTATION_ID}"
          test -f "${ATTESTATION_BUNDLE_PATH}"
          test ! -L "${ATTESTATION_BUNDLE_PATH}"
          bundle_size="$(stat --format='%s' "${ATTESTATION_BUNDLE_PATH}")"
          (( bundle_size >= 1 && bundle_size <= 16777216 ))
          root="${RUNNER_TEMP}/submission-bonus-feedback-attestation"
          expected_subjects="$(
            jq -Rn '
              [
                inputs |
                capture(
                  "^(?<sha>[0-9a-f]{64})  " +
                  "(?<name>[A-Za-z0-9][A-Za-z0-9._/-]*)$"
                ) |
                {
                  name: .name,
                  digest: {sha256: .sha}
                }
              ] |
              sort_by(.name)
            ' <"${root}/SHA256SUMS"
          )"
          test "$(jq 'length' <<<"${expected_subjects}")" = "3"
          verification_dir="$(
            mktemp -d "${RUNNER_TEMP}/submission-bonus-feedback-verification.XXXXXX"
          )"
          validate_verification_result() {
            local output_path="$1"
            jq -e \
              --slurpfile predicate "${root}/attestation-predicate.json" \
              --arg predicateType "${PREDICATE_TYPE}" \
              --argjson expectedSubjects "${expected_subjects}" '
                [
                  .[] |
                  select(
                    .verificationResult.statement.predicateType ==
                      $predicateType and
                    .verificationResult.statement.predicate ==
                      $predicate[0] and
                    (
                      .verificationResult.statement.subject |
                      sort_by(.name)
                    ) == $expectedSubjects
                  ) |
                  .verificationResult.statement
                ] |
                unique |
                length == 1
              ' "${output_path}" >/dev/null
          }
          verify_subject() {
            local subject_path="$1"
            local output_path="$2"
            local attempt
            for attempt in {1..12}; do
              if gh attestation verify \
                "${subject_path}" \
                --repo "${GITHUB_REPOSITORY}" \
                --predicate-type "${PREDICATE_TYPE}" \
                --signer-workflow \
                  "${GITHUB_REPOSITORY}/.github/workflows/submission-bonus-feedback.yml" \
                --signer-digest "${RELEASE_SHA}" \
                --source-digest "${RELEASE_SHA}" \
                --source-ref refs/heads/master \
                --deny-self-hosted-runners \
                --format json >"${output_path}" &&
                validate_verification_result "${output_path}"; then
                return 0
              fi
              if (( attempt < 12 )); then
                sleep 5
              fi
            done
            echo "::error::Persisted full-subject feedback attestation could not be verified"
            return 1
          }
          verify_subject \
            "${root}/proofs/BONUS-FEEDBACK.json" \
            "${verification_dir}/BONUS-FEEDBACK.json"
          verify_subject \
            "${root}/attestation-predicate.json" \
            "${verification_dir}/predicate.json"
          {
            echo "### Feedback evidence sealed"
            echo
            echo "- Artifact: \`${{ needs.review.outputs.artifact_name }}\`"
            echo "- Subjects: 3 plus \`SHA256SUMS\`"
            echo "- Attestation: ${ATTESTATION_URL}"
            echo "- Privacy: no feedback answers, raw entrant identifiers, Devpost credentials, cookies, or private confirmation bytes retained; the salted entrant commitment and public reviewer numeric ID are disclosed"
          } >>"${GITHUB_STEP_SUMMARY}"
