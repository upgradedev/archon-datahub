          final_rules="${RUNNER_TEMP}/submission-bonus-feedback-final-rules.html"
          final_challenge="${RUNNER_TEMP}/submission-bonus-feedback-final-challenge.html"
          for pair in \
            "https://datahub.devpost.com/rules|${final_rules}" \
            "https://datahub.devpost.com/|${final_challenge}"; do
            url="${pair%%|*}"
            output="${pair#*|}"
            status="$(
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                --proto '=https' \
                --tlsv1.2 \
                --max-redirs 0 \
