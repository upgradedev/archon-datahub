            jq -er '.facts.reviewApproval.environmentId' "${facts}"
          )"
          expected_approval="APPROVE ARCHON DATAHUB FEEDBACK run_id=${GITHUB_RUN_ID} run_attempt=${PRODUCER_ATTEMPT} candidate_run_attempt=${CANDIDATE_RUN_ATTEMPT} release_sha=${RELEASE_SHA} candidate_artifact_id=${CANDIDATE_ARTIFACT_ID} candidate_artifact_digest=${CANDIDATE_ARTIFACT_DIGEST} candidate_digest=${CANDIDATE_DIGEST} canonical_evidence_digest=${CANONICAL_EVIDENCE_DIGEST} confirmation_digest=${CONFIRMATION_DIGEST} entrant_binding_digest=${ENTRANT_BINDING_DIGEST} submitted_at=${SUBMITTED_AT}"
          for identifier in \
            "${actor_id}" \
            "${triggering_actor_id}" \
            "${reviewer_id}" \
            "${environment_id}"; do
            [[ "${identifier}" =~ ^[1-9][0-9]*$ ]]
          done
          test "${reviewer_id}" != "${actor_id}"
          test "${reviewer_id}" != "${triggering_actor_id}"
          test "sha256:$(
            printf '%s' "${expected_approval}" | sha256sum | awk '{print $1}'
          )" = "$(
            jq -er '.facts.reviewApproval.approvalCommentDigest' "${facts}"
          )"
          for binding in \
            "${PRODUCER_ARTIFACT_ID}|${PRODUCER_ARTIFACT_DIGEST}" \
