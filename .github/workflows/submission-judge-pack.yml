                  ):
                      raise SystemExit(f"unsafe ZIP path: {raw!r}")
                  directory = entry.is_dir()
                  canonical = posixpath.normpath(raw.rstrip("/"))
                  required_raw = canonical + "/" if directory else canonical
                  if (
                      canonical in ("", ".", "..")
                      or raw != required_raw
                      or canonical.startswith("../")
                  ):
                      raise SystemExit(f"non-canonical ZIP path: {raw!r}")
                  mode_type = stat.S_IFMT(entry.external_attr >> 16)
                  if directory:
                      if (
                          canonical not in {str(path).replace(os.sep, "/") for path in allowed_dirs}
                          or canonical in seen_dirs
                          or mode_type not in (0, stat.S_IFDIR)
                      ):
                          raise SystemExit(f"unsafe ZIP directory: {raw!r}")
                      seen_dirs.add(canonical)
                      continue
                  if (
                      canonical not in expected
                      or canonical in seen_files
                      or mode_type not in (0, stat.S_IFREG)
                      or entry.flag_bits & 0x1
                      or entry.file_size <= 0
                      or entry.file_size > limits[kind]
                  ):
                      raise SystemExit(f"unsafe ZIP entry: {raw!r}")
                  total += entry.file_size
                  if total > limits[kind]:
                      raise SystemExit("upstream ZIP exceeds its size limit")
                  destination = output / canonical
                  destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  with bundle.open(entry) as source, destination.open("xb") as target:
                      shutil.copyfileobj(source, target, length=1024 * 1024)
                  if destination.stat().st_size != entry.file_size:
                      raise SystemExit(f"truncated ZIP entry: {raw!r}")
                  seen_files.add(canonical)
          if seen_files != expected:
              raise SystemExit("upstream ZIP file inventory is not exact")
