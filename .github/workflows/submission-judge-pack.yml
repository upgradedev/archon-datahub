name: Submission judge pack

run-name: Seal recommended judge pack for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current master release commit
        required: true
        type: string
      ci_run_id:
        description: Exact successful current-release CI push run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: submission-judge-pack-${{ inputs.release_sha }}
  cancel-in-progress: false

env:
  PREDICATE_TYPE: https://archon.datahub.dev/attestations/submission-judge-pack/v1
  CI_PREDICATE_TYPE: https://github.com/upgradedev/archon-datahub/attestations/ci-release/v1

defaults:
  run:
    shell: bash

jobs:
  produce:
    name: Produce exact recommended judge-pack evidence
    if: >-
      github.repository == 'upgradedev/archon-datahub' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Bind dispatch to the exact current release and CI run
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          expected_ref="${GITHUB_REPOSITORY}/.github/workflows/submission-judge-pack.yml@refs/heads/master"
          test "${GITHUB_WORKFLOW_REF}" = "${expected_ref}"
          test "${GITHUB_REF}" = "refs/heads/master"
          test "${GITHUB_SHA}" = "${RELEASE_SHA}"
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CI_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          current_release="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
              --jq '.object.sha'
          )"
          test "${current_release}" = "${RELEASE_SHA}" || {
            echo "::error::Judge-pack evidence requires the exact current master release"
            exit 1
          }

      - name: Check out the exact unprivileged producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve the exact successful CI attempt and immutable artifacts
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          work="${RUNNER_TEMP}/submission-judge-pack-source"
          test ! -e "${work}"
          mkdir --mode=0700 "${work}"
          CONTROL_PLANE_SHA="${RELEASE_SHA}" \
          OUTPUT_PATH="${work}/control-plane-security-gates.json" \
            bash scripts/verify-github-control-plane.sh

          api() {
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$@"
          }
          run="$(api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release "${RELEASE_SHA}" \
            --argjson runId "${CI_RUN_ID}" '
              .id == $runId and
              .path == ".github/workflows/ci.yml" and
              .event == "push" and
              .head_sha == $release and
              .head_branch == "master" and
              .head_repository.full_name == $repository and
              .repository.full_name == $repository and
              .status == "completed" and
              .conclusion == "success" and
              (.run_attempt | type) == "number" and
              .run_attempt > 0
            ' <<<"${run}" >/dev/null || {
            echo "::error::CI source is not the exact successful current-release push"
            exit 1
          }
          current_attempt="$(jq -er '.run_attempt' <<<"${run}")"
          (( current_attempt <= 20 )) || {
            echo "::error::CI run attempt exceeds the bounded history"
            exit 1
          }
          jobs_file="${work}/ci-jobs.ndjson"
          test ! -e "${jobs_file}"
          for attempt in $(seq 1 "${current_attempt}"); do
            api \
              --paginate \
              --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/attempts/${attempt}/jobs?per_page=100" |
              jq -ce \
                --argjson observedRunAttempt "${attempt}" '
                  .[] |
                  .jobs[] |
                  . + {observedRunAttempt: $observedRunAttempt}
                ' >>"${jobs_file}"
          done
          jobs="$(jq -cs '.' "${jobs_file}")"
          latest_successful_job() {
            local name="$1"
            jq -cer \
              --arg name "${name}" \
              --argjson currentAttempt "${current_attempt}" '
                [
                  .[] |
                  select(
                    .name == $name and
                    .status == "completed" and
                    .conclusion == "success" and
                    .observedRunAttempt <= $currentAttempt and
                    (.started_at | type) == "string" and
                    (.completed_at | type) == "string"
                  )
                ] as $eligible |
                if ($eligible | length) == 0 then
                  error("missing successful bounded-attempt producer job")
                else
                  ($eligible | map(.observedRunAttempt) | max)
                    as $latestAttempt |
                  [
                    $eligible[] |
                    select(.observedRunAttempt == $latestAttempt)
                  ] |
                  if length == 1 then
                    {
                      id: .[0].id,
                      runAttempt: .[0].observedRunAttempt,
                      startedAt: .[0].started_at,
                      completedAt: .[0].completed_at
                    }
                  else
                    error("latest successful producer job is ambiguous")
                  end
                end
              ' <<<"${jobs}"
          }
          current_successful_job() {
            local name="$1"
            jq -cer \
              --arg name "${name}" \
              --argjson currentAttempt "${current_attempt}" '
                [
                  .[] |
                  select(
                    .name == $name and
                    .observedRunAttempt == $currentAttempt and
                    .status == "completed" and
                    .conclusion == "success" and
                    (.started_at | type) == "string" and
                    (.completed_at | type) == "string"
                  )
                ] |
                if length == 1 then
                  {
                    id: .[0].id,
                    runAttempt: .[0].observedRunAttempt,
                    startedAt: .[0].started_at,
                    completedAt: .[0].completed_at
                  }
                else
                  error("missing or ambiguous current-attempt attestation job")
                end
              ' <<<"${jobs}"
          }
          judge_job="$(
            latest_successful_job "Reproducible judge evidence"
          )"
          container_job="$(latest_successful_job "Production container")"
          attest_job="$(
            current_successful_job "Sign exact CI release candidates"
          )"
          test "$(
            jq -r '.completedAt' <<<"${judge_job}"
          )" \< "$(
            jq -r '.completedAt' <<<"${attest_job}"
          )"
          test "$(
            jq -r '.completedAt' <<<"${container_job}"
          )" \< "$(
            jq -r '.completedAt' <<<"${attest_job}"
          )"

          artifacts="$(
            api \
              --paginate \
              --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/artifacts?per_page=100"
          )"
          select_artifact() {
            local name="$1"
            local window="$2"
            local maximum_size="$3"
            jq -cer \
              --arg name "${name}" \
              --arg release "${RELEASE_SHA}" \
              --arg startedAt "$(jq -r '.startedAt' <<<"${window}")" \
              --arg completedAt "$(jq -r '.completedAt' <<<"${window}")" \
              --argjson maximumSize "${maximum_size}" \
              --argjson runId "${CI_RUN_ID}" '
                [
                  .[] |
                  .artifacts[] |
                  select(
                    .name == $name and
                    .expired == false and
                    (.id | type) == "number" and
                    .id > 0 and
                    (.digest | type) == "string" and
                    (.digest | test("^sha256:[0-9a-f]{64}$")) and
                    (.size_in_bytes | type) == "number" and
                    .size_in_bytes > 0 and
                    .size_in_bytes <= $maximumSize and
                    .workflow_run.id == $runId and
                    .workflow_run.head_sha == $release and
                    .created_at >= $startedAt and
                    .created_at <= $completedAt
                  )
                ] |
                if length == 1 then .[0]
                else error("missing or ambiguous current-attempt artifact")
                end
              ' <<<"${artifacts}"
          }
          judge_producer_attempt="$(jq -er '.runAttempt' <<<"${judge_job}")"
          judge="$(
            select_artifact \
              "judge-evidence-${RELEASE_SHA}-${judge_producer_attempt}" \
              "${judge_job}" \
              52428800
          )"
          container="$(
            select_artifact \
              "container-${RELEASE_SHA}" \
              "${container_job}" \
              1073741824
          )"

          workflow_runs="$(
            api \
              --paginate \
              --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=master&event=push&per_page=100"
          )"
          test "$(
            jq -er \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg release "${RELEASE_SHA}" '
                [
                  .[] |
                  .workflow_runs[] |
                  select(
                    .path == ".github/workflows/ci.yml" and
                    .event == "push" and
                    .head_sha == $release and
                    .head_branch == "master" and
                    .head_repository.full_name == $repository and
                    .status == "completed" and
                    .conclusion == "success"
                  )
                ] |
                sort_by(.id, .run_attempt) |
                last |
                .id
              ' <<<"${workflow_runs}"
          )" = "${CI_RUN_ID}"
          jq -cnS \
            --argjson runId "${CI_RUN_ID}" \
            --argjson runAttempt "${current_attempt}" \
            --argjson judgeJob "${judge_job}" \
            --argjson containerJob "${container_job}" \
            --argjson judge "${judge}" \
            --argjson container "${container}" '
              {
                ci: {
                  runId: $runId,
                  runAttempt: $runAttempt
                },
                judgeArtifact: {
                  id: $judge.id,
                  name: $judge.name,
                  digest: $judge.digest,
                  sizeBytes: $judge.size_in_bytes,
                  producerAttempt: $judgeJob.runAttempt
                },
                containerArtifact: {
                  id: $container.id,
                  name: $container.name,
                  digest: $container.digest,
                  sizeBytes: $container.size_in_bytes,
                  producerAttempt: $containerJob.runAttempt
                }
              }
            ' >"${work}/source.json"

      - name: Download and safely extract the exact upstream archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/submission-judge-pack-source"
          source="${work}/source.json"
          test -f "${source}"
          download_artifact() {
            local id="$1"
            local digest="$2"
            local archive="$3"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              >"${archive}"
            test -s "${archive}"
            test "sha256:$(
              sha256sum "${archive}" | awk '{print $1}'
            )" = "${digest}"
          }
          judge_id="$(jq -er '.judgeArtifact.id' "${source}")"
          judge_digest="$(jq -er '.judgeArtifact.digest' "${source}")"
          container_id="$(jq -er '.containerArtifact.id' "${source}")"
          container_digest="$(jq -er '.containerArtifact.digest' "${source}")"
          download_artifact \
            "${judge_id}" \
            "${judge_digest}" \
            "${work}/judge.zip"
          download_artifact \
            "${container_id}" \
            "${container_digest}" \
            "${work}/container.zip"

          python3 - \
            "${work}/judge.zip" \
            "${work}/judge" \
            judge <<'PY'
          import os
          import posixpath
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          output = Path(sys.argv[2])
          kind = sys.argv[3]
          expected_by_kind = {
              "judge": {
                  "README.md",
                  "SHA256SUMS",
                  "audit/report.json",
                  "audit/report.md",
                  "audit/report.sarif",
                  "control/approval-decision.json",
                  "control/approval-request.json",
                  "control/evidence-dossier.json",
                  "control/execution-receipt.json",
                  "control/remediation-plan.json",
                  "control/rollback-proposal.json",
                  "manifest.json",
              },
              "container": {
                  "archon-image.tar.gz",
                  "archon-image.tar.gz.sha256",
                  "health.json",
                  "image-inspect.json",
              },
          }
          limits = {"judge": 50 * 1024 * 1024, "container": 1024 * 1024 * 1024}
          expected = expected_by_kind[kind]
          allowed_dirs = {
              parent
              for name in expected
              for parent in Path(name).parents
              if str(parent) != "."
          }
          if output.exists() or output.is_symlink():
              raise SystemExit("archive output already exists")
          output.mkdir(mode=0o700)
          seen_files: set[str] = set()
          seen_dirs: set[str] = set()
          total = 0
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              if not entries or len(entries) > 64:
                  raise SystemExit("unsafe ZIP entry count")
              for entry in entries:
                  raw = entry.filename
                  if (
                      not raw
                      or raw.startswith("/")
                      or "\\" in raw
                      or "\x00" in raw
                  ):
                      raise SystemExit(f"unsafe ZIP path: {raw!r}")
                  directory = entry.is_dir()
                  canonical = posixpath.normpath(raw.rstrip("/"))
                  required_raw = canonical + "/" if directory else canonical
                  if (
                      canonical in ("", ".", "..")
                      or raw != required_raw
                      or canonical.startswith("../")
                  ):
                      raise SystemExit(f"non-canonical ZIP path: {raw!r}")
                  mode_type = stat.S_IFMT(entry.external_attr >> 16)
                  if directory:
                      if (
                          canonical not in {str(path).replace(os.sep, "/") for path in allowed_dirs}
                          or canonical in seen_dirs
                          or mode_type not in (0, stat.S_IFDIR)
                      ):
                          raise SystemExit(f"unsafe ZIP directory: {raw!r}")
                      seen_dirs.add(canonical)
                      continue
                  if (
                      canonical not in expected
                      or canonical in seen_files
                      or mode_type not in (0, stat.S_IFREG)
                      or entry.flag_bits & 0x1
                      or entry.file_size <= 0
                      or entry.file_size > limits[kind]
                  ):
                      raise SystemExit(f"unsafe ZIP entry: {raw!r}")
                  total += entry.file_size
                  if total > limits[kind]:
                      raise SystemExit("upstream ZIP exceeds its size limit")
                  destination = output / canonical
                  destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  with bundle.open(entry) as source, destination.open("xb") as target:
                      shutil.copyfileobj(source, target, length=1024 * 1024)
                  if destination.stat().st_size != entry.file_size:
                      raise SystemExit(f"truncated ZIP entry: {raw!r}")
                  seen_files.add(canonical)
          if seen_files != expected:
              raise SystemExit("upstream ZIP file inventory is not exact")
          PY
          python3 - \
            "${work}/container.zip" \
            "${work}/container" \
            container <<'PY'
          import os
          import posixpath
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          output = Path(sys.argv[2])
          kind = sys.argv[3]
          expected_by_kind = {
              "judge": {
                  "README.md",
                  "SHA256SUMS",
                  "audit/report.json",
                  "audit/report.md",
                  "audit/report.sarif",
                  "control/approval-decision.json",
                  "control/approval-request.json",
                  "control/evidence-dossier.json",
                  "control/execution-receipt.json",
                  "control/remediation-plan.json",
                  "control/rollback-proposal.json",
                  "manifest.json",
              },
              "container": {
                  "archon-image.tar.gz",
                  "archon-image.tar.gz.sha256",
                  "health.json",
                  "image-inspect.json",
              },
          }
          limits = {"judge": 50 * 1024 * 1024, "container": 1024 * 1024 * 1024}
          expected = expected_by_kind[kind]
          allowed_dirs = {
              parent
              for name in expected
              for parent in Path(name).parents
              if str(parent) != "."
          }
          if output.exists() or output.is_symlink():
              raise SystemExit("archive output already exists")
          output.mkdir(mode=0o700)
          seen_files: set[str] = set()
          seen_dirs: set[str] = set()
          total = 0
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              if not entries or len(entries) > 64:
                  raise SystemExit("unsafe ZIP entry count")
              for entry in entries:
                  raw = entry.filename
                  if (
                      not raw
                      or raw.startswith("/")
                      or "\\" in raw
                      or "\x00" in raw
                  ):
                      raise SystemExit(f"unsafe ZIP path: {raw!r}")
                  directory = entry.is_dir()
                  canonical = posixpath.normpath(raw.rstrip("/"))
                  required_raw = canonical + "/" if directory else canonical
                  if (
                      canonical in ("", ".", "..")
                      or raw != required_raw
                      or canonical.startswith("../")
                  ):
                      raise SystemExit(f"non-canonical ZIP path: {raw!r}")
                  mode_type = stat.S_IFMT(entry.external_attr >> 16)
                  if directory:
                      if (
                          canonical not in {str(path).replace(os.sep, "/") for path in allowed_dirs}
                          or canonical in seen_dirs
                          or mode_type not in (0, stat.S_IFDIR)
                      ):
                          raise SystemExit(f"unsafe ZIP directory: {raw!r}")
                      seen_dirs.add(canonical)
                      continue
                  if (
                      canonical not in expected
                      or canonical in seen_files
                      or mode_type not in (0, stat.S_IFREG)
                      or entry.flag_bits & 0x1
                      or entry.file_size <= 0
                      or entry.file_size > limits[kind]
                  ):
                      raise SystemExit(f"unsafe ZIP entry: {raw!r}")
                  total += entry.file_size
                  if total > limits[kind]:
                      raise SystemExit("upstream ZIP exceeds its size limit")
                  destination = output / canonical
                  destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  with bundle.open(entry) as source, destination.open("xb") as target:
                      shutil.copyfileobj(source, target, length=1024 * 1024)
                  if destination.stat().st_size != entry.file_size:
                      raise SystemExit(f"truncated ZIP entry: {raw!r}")
                  seen_files.add(canonical)
          if seen_files != expected:
              raise SystemExit("upstream ZIP file inventory is not exact")
          PY
          rm -- "${work}/judge.zip" "${work}/container.zip"

      - name: Verify the judge pack and signed CI release predicate
        env:
          CI_PREDICATE_TYPE: ${{ env.CI_PREDICATE_TYPE }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/submission-judge-pack-source"
          judge="${work}/judge"
          container="${work}/container"
          source="${work}/source.json"
          test -z "$(find "${judge}" "${container}" -type l -print -quit)"
          (
            cd "${judge}"
            sha256sum --check --strict SHA256SUMS
          )
          test "$(
            awk '{print $2}' "${judge}/SHA256SUMS"
          )" = "$(
            printf '%s\n' \
              README.md \
              audit/report.json \
              audit/report.md \
              audit/report.sarif \
              control/approval-decision.json \
              control/approval-request.json \
              control/evidence-dossier.json \
              control/execution-receipt.json \
              control/remediation-plan.json \
              control/rollback-proposal.json \
              manifest.json |
              LC_ALL=C sort
          )"
          (
            cd "${container}"
            sha256sum --check --strict archon-image.tar.gz.sha256
          )
          test "$(
            awk '{print $2}' "${container}/archon-image.tar.gz.sha256"
          )" = "archon-image.tar.gz"

          python3 - "${judge}" "${RELEASE_SHA}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          release = sys.argv[2]
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected_keys = {
              "bindings",
              "claims",
              "digest",
              "evidenceClass",
              "files",
              "fixtureClock",
              "schemaVersion",
              "source",
              "summary",
          }
          if set(manifest) != expected_keys:
              raise SystemExit("judge manifest fields are not exact")
          digest_pattern = lambda value: (
              isinstance(value, str)
              and len(value) == 71
              and value.startswith("sha256:")
              and all(char in "0123456789abcdef" for char in value[7:])
          )
          if (
              manifest["schemaVersion"] != "archon.judge-evidence-pack/v1"
              or manifest["evidenceClass"] != "SYNTHETIC_OFFLINE_FIXTURE"
              or set(manifest["source"]) != {
                  "repository",
                  "releaseSha",
                  "fixtureDigest",
                  "toolVersion",
              }
              or manifest["source"]["repository"] != "upgradedev/archon-datahub"
              or manifest["source"]["releaseSha"] != release
              or not digest_pattern(manifest["source"]["fixtureDigest"])
              or manifest["source"]["toolVersion"] != "0.1.0"
              or manifest["claims"] != {
                  "liveDataHub": False,
                  "liveMutation": False,
                  "mutationPort": "in-memory synthetic fixture",
              }
              or manifest["summary"] != {
                  "entities": 3,
                  "findings": 7,
                  "contradictions": 2,
                  "lineageGaps": 1,
                  "governanceViolations": 4,
                  "receiptOutcome": "VERIFIED",
                  "verificationChecksPassed": 5,
                  "rollbackAvailability": "ELIGIBLE",
              }
          ):
              raise SystemExit("judge manifest semantic boundary is invalid")
          if manifest["fixtureClock"] != {
              "observedAt": "2026-07-23T10:00:00.000Z",
              "approvalRequestedAt": "2026-07-23T10:01:00.000Z",
              "approvalDecidedAt": "2026-07-23T10:02:00.000Z",
              "executionStartedAt": "2026-07-23T10:03:00.000Z",
              "executionCompletedAt": "2026-07-23T10:03:01.000Z",
          }:
              raise SystemExit("judge fixture clock drifted")
          binding_keys = {
              "approvalDecisionDigest",
              "approvalRequestDigest",
              "dossierDigest",
              "planDigest",
              "receiptDigest",
              "reportDigest",
              "rollbackProposalDigest",
          }
          if (
              set(manifest["bindings"]) != binding_keys
              or not all(digest_pattern(value) for value in manifest["bindings"].values())
          ):
              raise SystemExit("judge manifest bindings are invalid")
          unsigned = dict(manifest)
          manifest_digest = unsigned.pop("digest")
          canonical = json.dumps(
              unsigned,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode()
          if (
              not digest_pattern(manifest_digest)
              or "sha256:" + hashlib.sha256(canonical).hexdigest()
              != manifest_digest
          ):
              raise SystemExit("judge manifest canonical digest is invalid")
          payloads = {
              "README.md",
              "audit/report.json",
              "audit/report.md",
              "audit/report.sarif",
              "control/approval-decision.json",
              "control/approval-request.json",
              "control/evidence-dossier.json",
              "control/execution-receipt.json",
              "control/remediation-plan.json",
              "control/rollback-proposal.json",
          }
          descriptors = manifest["files"]
          if (
              not isinstance(descriptors, list)
              or len(descriptors) != len(payloads)
              or {item.get("path") for item in descriptors} != payloads
          ):
              raise SystemExit("judge manifest payload inventory is invalid")
          for descriptor in descriptors:
              if set(descriptor) != {"bytes", "mediaType", "path", "sha256"}:
                  raise SystemExit("judge manifest descriptor fields are not exact")
              content = (root / descriptor["path"]).read_bytes()
              actual = "sha256:" + hashlib.sha256(content).hexdigest()
              if (
                  descriptor["bytes"] != len(content)
                  or descriptor["sha256"] != actual
                  or not isinstance(descriptor["mediaType"], str)
                  or not descriptor["mediaType"]
              ):
                  raise SystemExit("judge manifest descriptor digest is invalid")
          PY

          container_sha="$(
            sha256sum "${container}/archon-image.tar.gz" |
              awk '{print $1}'
          )"
          ci_attempt="$(jq -er '.ci.runAttempt' "${source}")"
          judge_artifact_id="$(jq -er '.judgeArtifact.id' "${source}")"
          judge_artifact_name="$(jq -er '.judgeArtifact.name' "${source}")"
          judge_artifact_digest="$(
            jq -er '.judgeArtifact.digest' "${source}"
          )"
          judge_producer_attempt="$(
            jq -er '.judgeArtifact.producerAttempt' "${source}"
          )"
          container_artifact_id="$(
            jq -er '.containerArtifact.id' "${source}"
          )"
          container_artifact_name="$(
            jq -er '.containerArtifact.name' "${source}"
          )"
          container_artifact_digest="$(
            jq -er '.containerArtifact.digest' "${source}"
          )"
          container_producer_attempt="$(
            jq -er '.containerArtifact.producerAttempt' "${source}"
          )"
          raw="${work}/ci-attestation-raw.json"
          gh attestation verify "${container}/archon-image.tar.gz" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow \
              "github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
            --signer-digest "${RELEASE_SHA}" \
            --source-digest "${RELEASE_SHA}" \
            --source-ref refs/heads/master \
            --predicate-type "${CI_PREDICATE_TYPE}" \
            --deny-self-hosted-runners \
            --format json >"${raw}"
          jq -ceS \
            --arg containerSha "${container_sha}" \
            --arg judgeDigest "${judge_artifact_digest}" \
            --arg predicateType "${CI_PREDICATE_TYPE}" \
            --arg release "${RELEASE_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --argjson runAttempt "${ci_attempt}" \
            --argjson judgeArtifactId "${judge_artifact_id}" \
            --arg judgeArtifactName "${judge_artifact_name}" \
            --argjson judgeProducerAttempt "${judge_producer_attempt}" \
            --argjson containerArtifactId "${container_artifact_id}" \
            --arg containerArtifactName "${container_artifact_name}" \
            --arg containerArtifactDigest "${container_artifact_digest}" \
            --argjson containerProducerAttempt \
              "${container_producer_attempt}" \
            --arg runUrl \
              "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" '
              [
                .[] |
                select(
                  .verificationResult.statement.predicateType ==
                    $predicateType and
                  (
                    .verificationResult.statement.predicate |
                    keys | sort
                  ) == [
                    "capabilityEvidence",
                    "dependencyEvidence",
                    "gates",
                    "releaseArtifacts",
                    "schemaVersion",
                    "source"
                  ] and
                  .verificationResult.statement.predicate == {
                    schemaVersion: "archon.ci-release/v1",
                    source: {
                      repository: $repository,
                      commit: $release,
                      ref: "refs/heads/master",
                      event: "push",
                      workflowRun: $runUrl,
                      runAttempt: $runAttempt
                    },
                    gates: .verificationResult.statement.predicate.gates,
                    dependencyEvidence:
                      .verificationResult.statement.predicate.dependencyEvidence,
                    capabilityEvidence:
                      .verificationResult.statement.predicate.capabilityEvidence,
                    releaseArtifacts: {
                      judgeEvidence: {
                        id: $judgeArtifactId,
                        name: $judgeArtifactName,
                        digest: $judgeDigest,
                        producerAttempt: $judgeProducerAttempt
                      },
                      container: {
                        id: $containerArtifactId,
                        name: $containerArtifactName,
                        digest: $containerArtifactDigest,
                        producerAttempt: $containerProducerAttempt
                      }
                    }
                  } and
                  (
                    .verificationResult.statement.predicate.gates |
                    keys | sort
                  ) == [
                    "buildTest",
                    "container",
                    "contribution",
                    "dataHubBenchmark",
                    "dataHubMcpDependency",
                    "infrastructure",
                    "judgeEvidence",
                    "load",
                    "readiness",
                    "secretScan",
                    "security",
                    "web"
                  ] and
                  (
                    .verificationResult.statement.predicate.gates |
                    all(. == "success")
                  ) and
                  (
                    .verificationResult.statement.predicate.dependencyEvidence |
                    keys
                  ) == ["dataHubMcpSecurityArtifactDigest"] and
                  (
                    .verificationResult.statement.predicate.dependencyEvidence
                      .dataHubMcpSecurityArtifactDigest |
                    test("^sha256:[0-9a-f]{64}$")
                  ) and
                  (
                    .verificationResult.statement.predicate.capabilityEvidence |
                    keys | sort
                  ) == [
                    "dataHubBenchmarkArtifactDigest",
                    "judgeEvidenceArtifactDigest",
                    "ossContributionValidationArtifactDigest"
                  ] and
                  (
                    .verificationResult.statement.predicate.capabilityEvidence
                      .dataHubBenchmarkArtifactDigest |
                    test("^sha256:[0-9a-f]{64}$")
                  ) and
                  (
                    .verificationResult.statement.predicate.capabilityEvidence
                      .ossContributionValidationArtifactDigest |
                    test("^sha256:[0-9a-f]{64}$")
                  ) and
                  .verificationResult.statement.predicate.capabilityEvidence
                    .judgeEvidenceArtifactDigest == $judgeDigest and
                  (
                    .verificationResult.statement.subject |
                    map(.name) |
                    sort
                  ) == [
                    "archon-image.tar.gz",
                    "archon-lambdas.tar.gz",
                    "archon-web.tar.gz"
                  ] and
                  all(
                    .verificationResult.statement.subject[];
                    (.digest | keys) == ["sha256"] and
                    (.digest.sha256 | test("^[0-9a-f]{64}$"))
                  ) and
                  any(
                    .verificationResult.statement.subject[];
                    .name == "archon-image.tar.gz" and
                    .digest.sha256 == $containerSha
                  )
                ) |
                .verificationResult.statement
              ] |
              unique |
              if length == 1 then .[0]
              else error(
                "exactly one signed CI statement must bind the judge artifact"
              )
              end
            ' "${raw}" >"${work}/ci-statement.json"
          rm -- "${raw}"
          jq -cS '.predicate' "${work}/ci-statement.json" \
            >"${work}/ci-predicate.json"
          printf 'sha256:%s\n' "$(
            sha256sum "${work}/ci-predicate.json" |
              awk '{print $1}'
          )" >"${work}/ci-predicate.digest"

      - name: Assemble the exact registered SQ9 subjects
        env:
          CI_PREDICATE_TYPE: ${{ env.CI_PREDICATE_TYPE }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/submission-judge-pack-source"
          facts="${RUNNER_TEMP}/submission-judge-pack-facts"
          output="${RUNNER_TEMP}/submission-judge-pack"
          test ! -e "${facts}"
          test ! -e "${output}"
          mkdir --mode=0700 "${facts}"
          source="${work}/source.json"
          ci_attempt="$(jq -er '.ci.runAttempt' "${source}")"
          artifact_id="$(jq -er '.judgeArtifact.id' "${source}")"
          artifact_name="$(jq -er '.judgeArtifact.name' "${source}")"
          artifact_digest="$(jq -er '.judgeArtifact.digest' "${source}")"
          artifact_producer_attempt="$(
            jq -er '.judgeArtifact.producerAttempt' "${source}"
          )"
          predicate_digest="$(tr -d '\n' <"${work}/ci-predicate.digest")"
          manifest_digest="$(
            jq -er '.digest' "${work}/judge/manifest.json"
          )"
          jq -cnS \
            --arg workflowPath ".github/workflows/ci.yml" \
            --argjson runId "${CI_RUN_ID}" \
            --argjson runAttempt "${ci_attempt}" \
            --arg predicateType "${CI_PREDICATE_TYPE}" \
            --arg predicateDigest "${predicate_digest}" \
            --argjson artifactId "${artifact_id}" \
            --arg artifactName "${artifact_name}" \
            --arg artifactDigest "${artifact_digest}" \
            --argjson artifactProducerAttempt \
              "${artifact_producer_attempt}" \
            --arg manifestDigest "${manifest_digest}" '
              {
                evidenceClass: "SYNTHETIC_OFFLINE_FIXTURE",
                ci: {
                  workflowPath: $workflowPath,
                  runId: $runId,
                  runAttempt: $runAttempt,
                  predicateType: $predicateType,
                  predicateDigest: $predicateDigest
                },
                artifact: {
                  id: $artifactId,
                  name: $artifactName,
                  digest: $artifactDigest,
                  producerAttempt: $artifactProducerAttempt
                },
                manifestDigest: $manifestDigest,
                formats: [
                  "approval",
                  "dossier",
                  "json",
                  "markdown",
                  "plan",
                  "receipt",
                  "rollback",
                  "sarif"
                ],
                sanitized: true,
                notLiveProof: true
              }
            ' >"${facts}/SQ9.json"
          python3 scripts/validate-submission-proof-receipts.py \
            assemble-standard \
            --registry scripts/submission-evidence-registry.json \
            --source-key judge-pack \
            --facts-dir "${facts}" \
            --output-dir "${output}" \
            --repository "${GITHUB_REPOSITORY}" \
            --release-sha "${RELEASE_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --notice NOTICE.md \
            >"${work}/assembled-validation.json"
          python3 scripts/validate-submission-proof-receipts.py \
            validate-standard-source \
            --registry scripts/submission-evidence-registry.json \
            --source-key judge-pack \
            --source-dir "${output}" \
            --repository "${GITHUB_REPOSITORY}" \
            --release-sha "${RELEASE_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --notice NOTICE.md \
            >"${work}/retained-validation.json"
          cmp --silent \
            "${work}/assembled-validation.json" \
            "${work}/retained-validation.json"
          jq -e '
            .sourceKey == "judge-pack" and
            .workflowPath == ".github/workflows/submission-judge-pack.yml" and
            .subjectCount == 4 and
            .proofIds == ["SQ9"] and
            .result == "verified"
          ' "${work}/retained-validation.json" >/dev/null
          test "$(
            find "${output}" -type f -printf '%P\n' |
              LC_ALL=C sort
          )" = "$(
            printf '%s\n' \
              SHA256SUMS \
              attestation-predicate.json \
              proofs/SQ9.json \
              support/SQ9/ci-attestation.json \
              support/SQ9/judge-pack-manifest.json |
              LC_ALL=C sort
          )"
          (
            cd "${output}"
            sha256sum --check --strict SHA256SUMS
          )
          test "$(
            awk '{print $2}' "${output}/SHA256SUMS"
          )" = "$(
            printf '%s\n' \
              attestation-predicate.json \
              proofs/SQ9.json \
              support/SQ9/ci-attestation.json \
              support/SQ9/judge-pack-manifest.json |
              LC_ALL=C sort
          )"

      - name: Recheck upstream identity and canonical release before retention
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/submission-judge-pack-source"
          source="${work}/source.json"
          current_release="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
              --jq '.object.sha'
          )"
          test "${current_release}" = "${RELEASE_SHA}"
          current_run="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}"
          )"
          jq -e \
            --argjson attempt "$(jq -er '.ci.runAttempt' "${source}")" \
            --argjson runId "${CI_RUN_ID}" '
              .id == $runId and
              .run_attempt == $attempt and
              .status == "completed" and
              .conclusion == "success"
            ' <<<"${current_run}" >/dev/null
          for key in judgeArtifact containerArtifact; do
            artifact_id="$(jq -er --arg key "${key}" '.[$key].id' "${source}")"
            current="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            )"
            jq -e \
              --arg digest "$(jq -er --arg key "${key}" '.[$key].digest' "${source}")" \
              --arg name "$(jq -er --arg key "${key}" '.[$key].name' "${source}")" \
              --arg release "${RELEASE_SHA}" \
              --argjson artifactId "${artifact_id}" \
              --argjson runId "${CI_RUN_ID}" '
                .id == $artifactId and
                .name == $name and
                .digest == $digest and
                .expired == false and
                .workflow_run.id == $runId and
                .workflow_run.head_sha == $release
              ' <<<"${current}" >/dev/null
          done
          gate="${RUNNER_TEMP}/submission-judge-pack-final-gate"
          test ! -e "${gate}"
          mkdir --mode=0700 "${gate}"
          CONTROL_PLANE_SHA="${RELEASE_SHA}" \
          OUTPUT_PATH="${gate}/control-plane-security-gates.json" \
            bash scripts/verify-github-control-plane.sh
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Retain the exact standard judge-pack subjects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: submission-judge-pack-${{ inputs.release_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/submission-judge-pack
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Independently revalidate and attest judge-pack evidence
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Bind attester to the exact current release and workflow run
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          expected_ref="${GITHUB_REPOSITORY}/.github/workflows/submission-judge-pack.yml@refs/heads/master"
          test "${GITHUB_WORKFLOW_REF}" = "${expected_ref}"
          test "${GITHUB_REF}" = "refs/heads/master"
          test "${GITHUB_SHA}" = "${RELEASE_SHA}"
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CI_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          current_release="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
              --jq '.object.sha'
          )"
          test "${current_release}" = "${RELEASE_SHA}"

      - name: Check out the exact unprivileged attester
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Independently resolve producer and upstream artifact identities
        id: artifacts
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          work="${RUNNER_TEMP}/submission-judge-pack-attester-source"
          test ! -e "${work}"
          mkdir --mode=0700 "${work}"
          CONTROL_PLANE_SHA="${RELEASE_SHA}" \
          OUTPUT_PATH="${work}/control-plane-security-gates.json" \
            bash scripts/verify-github-control-plane.sh
          api() {
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$@"
          }

          producer_artifacts="$(
            api \
              --paginate \
              --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"
          )"
          producer="$(
            jq -cer \
              --arg release "${RELEASE_SHA}" \
              --argjson currentAttempt "${GITHUB_RUN_ATTEMPT}" \
              --argjson runId "${GITHUB_RUN_ID}" '
                (
                  "^submission-judge-pack-" + $release +
                    "-(?<attempt>[1-9][0-9]*)$"
                ) as $pattern |
                [
                  .[] |
                  .artifacts[] |
                  select(
                    .expired == false and
                    (.id | type) == "number" and
                    .id > 0 and
                    (.digest | type) == "string" and
                    (.digest | test("^sha256:[0-9a-f]{64}$")) and
                    (.size_in_bytes | type) == "number" and
                    .size_in_bytes > 0 and
                    .size_in_bytes <= 52428800 and
                    .workflow_run.id == $runId and
                    .workflow_run.head_sha == $release and
                    (.name | test($pattern))
                  ) |
                  . + {
                    producerAttempt:
                      (.name | capture($pattern).attempt | tonumber)
                  } |
                  select(.producerAttempt <= $currentAttempt)
                ] as $eligible |
                if ($eligible | length) == 0 then
                  error("no eligible immutable judge-pack artifact exists")
                else
                  ($eligible | map(.producerAttempt) | max) as $latestAttempt |
                  [
                    $eligible[] |
                    select(.producerAttempt == $latestAttempt)
                  ] |
                  if length == 1 then .[0]
                  else error(
                    "latest producer attempt has ambiguous judge-pack artifacts"
                  )
                  end
                end
              ' <<<"${producer_artifacts}"
          )"
          producer_attempt="$(jq -er '.producerAttempt' <<<"${producer}")"
          producer_jobs="$(
            api \
              --paginate \
              --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${producer_attempt}/jobs?per_page=100"
          )"
          producer_job="$(
            jq -cer '
              [
                .[] |
                .jobs[] |
                select(
                  .name == "Produce exact recommended judge-pack evidence" and
                  .status == "completed" and
                  .conclusion == "success"
                )
              ] |
              if length == 1 then .[0]
              else error("producer artifact has no exact successful owner job")
              end
            ' <<<"${producer_jobs}"
          )"
          jq -e \
            --arg startedAt "$(jq -er '.started_at' <<<"${producer_job}")" \
            --arg completedAt "$(jq -er '.completed_at' <<<"${producer_job}")" '
              .created_at >= $startedAt and
              .created_at <= $completedAt
            ' <<<"${producer}" >/dev/null

          run="$(api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release "${RELEASE_SHA}" \
            --argjson runId "${CI_RUN_ID}" '
              .id == $runId and
              .path == ".github/workflows/ci.yml" and
              .event == "push" and
              .head_sha == $release and
              .head_branch == "master" and
              .head_repository.full_name == $repository and
              .repository.full_name == $repository and
              .status == "completed" and
              .conclusion == "success" and
              (.run_attempt | type) == "number" and
              .run_attempt > 0
            ' <<<"${run}" >/dev/null
          current_attempt="$(jq -er '.run_attempt' <<<"${run}")"
          (( current_attempt <= 20 )) || {
            echo "::error::CI run attempt exceeds the bounded history"
            exit 1
          }
          jobs_file="${work}/ci-jobs.ndjson"
          test ! -e "${jobs_file}"
          for attempt in $(seq 1 "${current_attempt}"); do
            api \
              --paginate \
              --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/attempts/${attempt}/jobs?per_page=100" |
              jq -ce \
                --argjson observedRunAttempt "${attempt}" '
                  .[] |
                  .jobs[] |
                  . + {observedRunAttempt: $observedRunAttempt}
                ' >>"${jobs_file}"
          done
          jobs="$(jq -cs '.' "${jobs_file}")"
          latest_successful_job() {
            local name="$1"
            jq -cer \
              --arg name "${name}" \
              --argjson currentAttempt "${current_attempt}" '
                [
                  .[] |
                  select(
                    .name == $name and
                    .status == "completed" and
                    .conclusion == "success" and
                    .observedRunAttempt <= $currentAttempt and
                    (.started_at | type) == "string" and
                    (.completed_at | type) == "string"
                  )
                ] as $eligible |
                if ($eligible | length) == 0 then
                  error("missing successful bounded-attempt producer job")
                else
                  ($eligible | map(.observedRunAttempt) | max)
                    as $latestAttempt |
                  [
                    $eligible[] |
                    select(.observedRunAttempt == $latestAttempt)
                  ] |
                  if length == 1 then
                    {
                      id: .[0].id,
                      runAttempt: .[0].observedRunAttempt,
                      startedAt: .[0].started_at,
                      completedAt: .[0].completed_at
                    }
                  else
                    error("latest successful producer job is ambiguous")
                  end
                end
              ' <<<"${jobs}"
          }
          current_successful_job() {
            local name="$1"
            jq -cer \
              --arg name "${name}" \
              --argjson currentAttempt "${current_attempt}" '
                [
                  .[] |
                  select(
                    .name == $name and
                    .observedRunAttempt == $currentAttempt and
                    .status == "completed" and
                    .conclusion == "success" and
                    (.started_at | type) == "string" and
                    (.completed_at | type) == "string"
                  )
                ] |
                if length == 1 then
                  {
                    id: .[0].id,
                    runAttempt: .[0].observedRunAttempt,
                    startedAt: .[0].started_at,
                    completedAt: .[0].completed_at
                  }
                else
                  error("missing or ambiguous current-attempt attestation job")
                end
              ' <<<"${jobs}"
          }
          judge_job="$(
            latest_successful_job "Reproducible judge evidence"
          )"
          container_job="$(latest_successful_job "Production container")"
          attest_job="$(
            current_successful_job "Sign exact CI release candidates"
          )"
          test "$(
            jq -r '.completedAt' <<<"${judge_job}"
          )" \< "$(
            jq -r '.completedAt' <<<"${attest_job}"
          )"
          test "$(
            jq -r '.completedAt' <<<"${container_job}"
          )" \< "$(
            jq -r '.completedAt' <<<"${attest_job}"
          )"
          artifacts="$(
            api \
              --paginate \
              --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/artifacts?per_page=100"
          )"
          select_artifact() {
            local name="$1"
            local window="$2"
            local maximum_size="$3"
            jq -cer \
              --arg name "${name}" \
              --arg release "${RELEASE_SHA}" \
              --arg startedAt "$(jq -r '.startedAt' <<<"${window}")" \
              --arg completedAt "$(jq -r '.completedAt' <<<"${window}")" \
              --argjson maximumSize "${maximum_size}" \
              --argjson runId "${CI_RUN_ID}" '
                [
                  .[] |
                  .artifacts[] |
                  select(
                    .name == $name and
                    .expired == false and
                    (.id | type) == "number" and
                    .id > 0 and
                    (.digest | type) == "string" and
                    (.digest | test("^sha256:[0-9a-f]{64}$")) and
                    (.size_in_bytes | type) == "number" and
                    .size_in_bytes > 0 and
                    .size_in_bytes <= $maximumSize and
                    .workflow_run.id == $runId and
                    .workflow_run.head_sha == $release and
                    .created_at >= $startedAt and
                    .created_at <= $completedAt
                  )
                ] |
                if length == 1 then .[0]
                else error("missing or ambiguous current-attempt artifact")
                end
              ' <<<"${artifacts}"
          }
          judge_producer_attempt="$(jq -er '.runAttempt' <<<"${judge_job}")"
          judge="$(
            select_artifact \
              "judge-evidence-${RELEASE_SHA}-${judge_producer_attempt}" \
              "${judge_job}" \
              52428800
          )"
          container="$(
            select_artifact \
              "container-${RELEASE_SHA}" \
              "${container_job}" \
              1073741824
          )"
          workflow_runs="$(
            api \
              --paginate \
              --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=master&event=push&per_page=100"
          )"
          test "$(
            jq -er \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg release "${RELEASE_SHA}" '
                [
                  .[] |
                  .workflow_runs[] |
                  select(
                    .path == ".github/workflows/ci.yml" and
                    .event == "push" and
                    .head_sha == $release and
                    .head_branch == "master" and
                    .head_repository.full_name == $repository and
                    .status == "completed" and
                    .conclusion == "success"
