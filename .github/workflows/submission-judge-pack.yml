          rm -- "${work}/judge.zip" "${work}/container.zip"

      - name: Independently validate standard bytes and upstream semantics
        env:
          CI_PREDICATE_TYPE: ${{ env.CI_PREDICATE_TYPE }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          PRODUCER_ATTEMPT: ${{ steps.artifacts.outputs.producer_attempt }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/submission-judge-pack-attestation"
          work="${RUNNER_TEMP}/submission-judge-pack-attester-source"
          source="${work}/source.json"
          test -d "${output}"
          test ! -L "${output}"
          test -z "$(find "${output}" -type l -print -quit)"
          test "$(
            find "${output}" -type f -printf '%P\n' |
              LC_ALL=C sort
          )" = "$(
            printf '%s\n' \
              SHA256SUMS \
              attestation-predicate.json \
              proofs/SQ9.json \
              support/SQ9/ci-attestation.json \
              support/SQ9/judge-pack-manifest.json |
              LC_ALL=C sort
          )"
          (
            cd "${output}"
            sha256sum --check --strict SHA256SUMS
          )
          python3 scripts/validate-submission-proof-receipts.py \
            validate-standard-source \
            --registry scripts/submission-evidence-registry.json \
            --source-key judge-pack \
            --source-dir "${output}" \
            --repository "${GITHUB_REPOSITORY}" \
            --release-sha "${RELEASE_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${PRODUCER_ATTEMPT}" \
            --notice NOTICE.md \
            >"${work}/retained-validation.json"
          jq -e \
            --arg artifactName \
              "submission-judge-pack-${RELEASE_SHA}-${PRODUCER_ATTEMPT}" '
              .sourceKey == "judge-pack" and
              .artifactName == $artifactName and
              .subjectCount == 4 and
              .proofIds == ["SQ9"] and
              .result == "verified"
            ' "${work}/retained-validation.json" >/dev/null
          (
            cd "${work}/judge"
            sha256sum --check --strict SHA256SUMS
          )
          (
            cd "${work}/container"
            sha256sum --check --strict archon-image.tar.gz.sha256
          )

          python3 - "${work}/judge" "${RELEASE_SHA}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          release = sys.argv[2]
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if set(manifest) != {
              "bindings",
              "claims",
              "digest",
              "evidenceClass",
              "files",
              "fixtureClock",
              "schemaVersion",
              "source",
              "summary",
          }:
              raise SystemExit("judge manifest fields are not exact")
          digest_pattern = lambda value: (
              isinstance(value, str)
              and len(value) == 71
              and value.startswith("sha256:")
              and all(char in "0123456789abcdef" for char in value[7:])
          )
          if (
              manifest["schemaVersion"] != "archon.judge-evidence-pack/v1"
              or manifest["evidenceClass"] != "SYNTHETIC_OFFLINE_FIXTURE"
              or set(manifest["source"]) != {
                  "repository",
                  "releaseSha",
                  "fixtureDigest",
                  "toolVersion",
              }
              or manifest["source"]["repository"] != "upgradedev/archon-datahub"
              or manifest["source"]["releaseSha"] != release
              or not digest_pattern(manifest["source"]["fixtureDigest"])
              or manifest["source"]["toolVersion"] != "0.1.0"
              or manifest["claims"] != {
                  "liveDataHub": False,
                  "liveMutation": False,
                  "mutationPort": "in-memory synthetic fixture",
              }
              or manifest["summary"] != {
                  "entities": 3,
                  "findings": 7,
                  "contradictions": 2,
                  "lineageGaps": 1,
                  "governanceViolations": 4,
                  "receiptOutcome": "VERIFIED",
                  "verificationChecksPassed": 5,
                  "rollbackAvailability": "ELIGIBLE",
              }
          ):
              raise SystemExit("judge manifest semantic boundary is invalid")
          if manifest["fixtureClock"] != {
              "observedAt": "2026-07-23T10:00:00.000Z",
              "approvalRequestedAt": "2026-07-23T10:01:00.000Z",
              "approvalDecidedAt": "2026-07-23T10:02:00.000Z",
              "executionStartedAt": "2026-07-23T10:03:00.000Z",
              "executionCompletedAt": "2026-07-23T10:03:01.000Z",
          }:
              raise SystemExit("judge fixture clock drifted")
          binding_keys = {
              "approvalDecisionDigest",
              "approvalRequestDigest",
              "dossierDigest",
              "planDigest",
              "receiptDigest",
              "reportDigest",
              "rollbackProposalDigest",
          }
          if (
              set(manifest["bindings"]) != binding_keys
              or not all(digest_pattern(value) for value in manifest["bindings"].values())
          ):
              raise SystemExit("judge manifest bindings are invalid")
          unsigned = dict(manifest)
          manifest_digest = unsigned.pop("digest")
          canonical = json.dumps(
              unsigned,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode()
          if (
              not digest_pattern(manifest_digest)
              or "sha256:" + hashlib.sha256(canonical).hexdigest()
              != manifest_digest
          ):
              raise SystemExit("judge manifest canonical digest is invalid")
          payloads = {
              "README.md",
              "audit/report.json",
              "audit/report.md",
              "audit/report.sarif",
              "control/approval-decision.json",
              "control/approval-request.json",
              "control/evidence-dossier.json",
              "control/execution-receipt.json",
              "control/remediation-plan.json",
              "control/rollback-proposal.json",
          }
          descriptors = manifest["files"]
          if (
              not isinstance(descriptors, list)
              or len(descriptors) != len(payloads)
              or {item.get("path") for item in descriptors} != payloads
          ):
              raise SystemExit("judge manifest payload inventory is invalid")
          for descriptor in descriptors:
              if set(descriptor) != {"bytes", "mediaType", "path", "sha256"}:
                  raise SystemExit("judge manifest descriptor fields are not exact")
              content = (root / descriptor["path"]).read_bytes()
              if (
                  descriptor["bytes"] != len(content)
                  or descriptor["sha256"]
                  != "sha256:" + hashlib.sha256(content).hexdigest()
                  or not isinstance(descriptor["mediaType"], str)
                  or not descriptor["mediaType"]
              ):
                  raise SystemExit("judge manifest descriptor digest is invalid")
          PY

          container_sha="$(
            sha256sum "${work}/container/archon-image.tar.gz" |
              awk '{print $1}'
          )"
          ci_attempt="$(jq -er '.ci.runAttempt' "${source}")"
          judge_artifact_id="$(jq -er '.judgeArtifact.id' "${source}")"
          judge_artifact_name="$(jq -er '.judgeArtifact.name' "${source}")"
          judge_artifact_digest="$(
            jq -er '.judgeArtifact.digest' "${source}"
          )"
          judge_producer_attempt="$(
            jq -er '.judgeArtifact.producerAttempt' "${source}"
          )"
          container_artifact_id="$(
            jq -er '.containerArtifact.id' "${source}"
          )"
          container_artifact_name="$(
            jq -er '.containerArtifact.name' "${source}"
          )"
          container_artifact_digest="$(
            jq -er '.containerArtifact.digest' "${source}"
          )"
          container_producer_attempt="$(
            jq -er '.containerArtifact.producerAttempt' "${source}"
          )"
          raw="${work}/ci-attestation-raw.json"
          gh attestation verify "${work}/container/archon-image.tar.gz" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow \
              "github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
            --signer-digest "${RELEASE_SHA}" \
            --source-digest "${RELEASE_SHA}" \
            --source-ref refs/heads/master \
            --predicate-type "${CI_PREDICATE_TYPE}" \
            --deny-self-hosted-runners \
            --format json >"${raw}"
          jq -ceS \
            --arg containerSha "${container_sha}" \
            --arg judgeDigest "${judge_artifact_digest}" \
            --arg predicateType "${CI_PREDICATE_TYPE}" \
            --arg release "${RELEASE_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --argjson runAttempt "${ci_attempt}" \
            --argjson judgeArtifactId "${judge_artifact_id}" \
            --arg judgeArtifactName "${judge_artifact_name}" \
            --argjson judgeProducerAttempt "${judge_producer_attempt}" \
            --argjson containerArtifactId "${container_artifact_id}" \
            --arg containerArtifactName "${container_artifact_name}" \
            --arg containerArtifactDigest "${container_artifact_digest}" \
            --argjson containerProducerAttempt \
              "${container_producer_attempt}" \
            --arg runUrl \
              "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" '
              [
                .[] |
                select(
                  .verificationResult.statement.predicateType ==
                    $predicateType and
                  (
                    .verificationResult.statement.predicate |
                    keys | sort
                  ) == [
                    "capabilityEvidence",
                    "dependencyEvidence",
                    "gates",
                    "releaseArtifacts",
                    "schemaVersion",
                    "source"
                  ] and
                  .verificationResult.statement.predicate.source == {
                    repository: $repository,
                    commit: $release,
                    ref: "refs/heads/master",
                    event: "push",
                    workflowRun: $runUrl,
                    runAttempt: $runAttempt
                  } and
                  .verificationResult.statement.predicate.schemaVersion ==
                    "archon.ci-release/v1" and
                  (
                    .verificationResult.statement.predicate.gates |
                    keys | sort
                  ) == [
                    "buildTest",
                    "container",
                    "contribution",
                    "dataHubBenchmark",
                    "dataHubMcpDependency",
                    "infrastructure",
                    "judgeEvidence",
                    "load",
                    "readiness",
                    "secretScan",
                    "security",
                    "web"
                  ] and
                  (
                    .verificationResult.statement.predicate.gates |
                    all(. == "success")
                  ) and
                  (
                    .verificationResult.statement.predicate.dependencyEvidence |
                    keys
                  ) == ["dataHubMcpSecurityArtifactDigest"] and
                  (
                    .verificationResult.statement.predicate.dependencyEvidence
                      .dataHubMcpSecurityArtifactDigest |
                    test("^sha256:[0-9a-f]{64}$")
                  ) and
                  (
                    .verificationResult.statement.predicate.capabilityEvidence |
                    keys | sort
                  ) == [
                    "dataHubBenchmarkArtifactDigest",
                    "judgeEvidenceArtifactDigest",
                    "ossContributionValidationArtifactDigest"
                  ] and
                  (
                    .verificationResult.statement.predicate.capabilityEvidence
                      .dataHubBenchmarkArtifactDigest |
                    test("^sha256:[0-9a-f]{64}$")
                  ) and
                  (
                    .verificationResult.statement.predicate.capabilityEvidence
                      .ossContributionValidationArtifactDigest |
                    test("^sha256:[0-9a-f]{64}$")
                  ) and
                  .verificationResult.statement.predicate.capabilityEvidence
                    .judgeEvidenceArtifactDigest == $judgeDigest and
                  .verificationResult.statement.predicate.releaseArtifacts == {
                    judgeEvidence: {
                      id: $judgeArtifactId,
                      name: $judgeArtifactName,
                      digest: $judgeDigest,
                      producerAttempt: $judgeProducerAttempt
                    },
                    container: {
                      id: $containerArtifactId,
                      name: $containerArtifactName,
                      digest: $containerArtifactDigest,
                      producerAttempt: $containerProducerAttempt
                    }
                  } and
                  (
                    .verificationResult.statement.subject |
                    map(.name) |
                    sort
                  ) == [
                    "archon-image.tar.gz",
                    "archon-lambdas.tar.gz",
                    "archon-web.tar.gz"
                  ] and
                  all(
                    .verificationResult.statement.subject[];
                    (.digest | keys) == ["sha256"] and
                    (.digest.sha256 | test("^[0-9a-f]{64}$"))
                  ) and
                  any(
                    .verificationResult.statement.subject[];
                    .name == "archon-image.tar.gz" and
                    .digest.sha256 == $containerSha
                  )
                ) |
                .verificationResult.statement
              ] |
              unique |
              if length == 1 then .[0]
              else error(
                "exactly one signed CI statement must bind the judge artifact"
              )
              end
            ' "${raw}" >"${work}/ci-statement.json"
          rm -- "${raw}"
          jq -cS '.predicate' "${work}/ci-statement.json" \
            >"${work}/ci-predicate.json"
          predicate_digest="sha256:$(
            sha256sum "${work}/ci-predicate.json" |
              awk '{print $1}'
          )"
          jq -e \
            --arg workflowPath ".github/workflows/ci.yml" \
            --argjson runId "${CI_RUN_ID}" \
            --argjson runAttempt "$(jq -er '.ci.runAttempt' "${source}")" \
            --arg predicateType "${CI_PREDICATE_TYPE}" \
            --arg predicateDigest "${predicate_digest}" \
            --argjson artifactId "$(jq -er '.judgeArtifact.id' "${source}")" \
            --arg artifactName "$(jq -er '.judgeArtifact.name' "${source}")" \
            --arg artifactDigest "$(jq -er '.judgeArtifact.digest' "${source}")" \
            --argjson artifactProducerAttempt \
              "$(jq -er '.judgeArtifact.producerAttempt' "${source}")" \
            --arg manifestDigest "$(jq -er '.digest' "${work}/judge/manifest.json")" '
              .facts == {
                evidenceClass: "SYNTHETIC_OFFLINE_FIXTURE",
                ci: {
                  workflowPath: $workflowPath,
                  runId: $runId,
                  runAttempt: $runAttempt,
                  predicateType: $predicateType,
                  predicateDigest: $predicateDigest
                },
                artifact: {
                  id: $artifactId,
                  name: $artifactName,
                  digest: $artifactDigest,
                  producerAttempt: $artifactProducerAttempt
                },
                manifestDigest: $manifestDigest,
                formats: [
                  "approval",
                  "dossier",
                  "json",
                  "markdown",
                  "plan",
                  "receipt",
                  "rollback",
                  "sarif"
                ],
                sanitized: true,
                notLiveProof: true
              }
            ' "${output}/proofs/SQ9.json" >/dev/null

      - name: Recheck all immutable identities before attestation
        env:
          ARTIFACT_DIGEST: ${{ steps.artifacts.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ steps.artifacts.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.artifacts.outputs.artifact_name }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/submission-judge-pack-attester-source"
          source="${work}/source.json"
          current_release="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
              --jq '.object.sha'
          )"
          test "${current_release}" = "${RELEASE_SHA}"
          current_run="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}"
          )"
          jq -e \
            --argjson attempt "$(jq -er '.ci.runAttempt' "${source}")" \
            --argjson runId "${CI_RUN_ID}" '
              .id == $runId and
              .run_attempt == $attempt and
              .status == "completed" and
              .conclusion == "success"
            ' <<<"${current_run}" >/dev/null
          for key in judgeArtifact containerArtifact; do
            artifact_id="$(jq -er --arg key "${key}" '.[$key].id' "${source}")"
            current="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            )"
            jq -e \
              --arg digest "$(jq -er --arg key "${key}" '.[$key].digest' "${source}")" \
              --arg name "$(jq -er --arg key "${key}" '.[$key].name' "${source}")" \
              --arg release "${RELEASE_SHA}" \
              --argjson artifactId "${artifact_id}" \
              --argjson runId "${CI_RUN_ID}" '
                .id == $artifactId and
                .name == $name and
                .digest == $digest and
                .expired == false and
                .workflow_run.id == $runId and
                .workflow_run.head_sha == $release
              ' <<<"${current}" >/dev/null
          done
          retained="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          )"
          jq -e \
            --arg digest "${ARTIFACT_DIGEST}" \
            --arg name "${ARTIFACT_NAME}" \
            --arg release "${RELEASE_SHA}" \
            --argjson artifactId "${ARTIFACT_ID}" \
            --argjson runId "${GITHUB_RUN_ID}" '
              .id == $artifactId and
              .name == $name and
              .digest == $digest and
              .expired == false and
              .workflow_run.id == $runId and
              .workflow_run.head_sha == $release
            ' <<<"${retained}" >/dev/null
          gate="${RUNNER_TEMP}/submission-judge-pack-attester-final-gate"
          test ! -e "${gate}"
          mkdir --mode=0700 "${gate}"
          CONTROL_PLANE_SHA="${RELEASE_SHA}" \
          OUTPUT_PATH="${gate}/control-plane-security-gates.json" \
            bash scripts/verify-github-control-plane.sh
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Attest all four exact judge-pack subjects
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ runner.temp }}/submission-judge-pack-attestation/SHA256SUMS
          predicate-type: ${{ env.PREDICATE_TYPE }}
          predicate-path: ${{ runner.temp }}/submission-judge-pack-attestation/attestation-predicate.json
