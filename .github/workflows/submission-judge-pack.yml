            --argjson runId "${CI_RUN_ID}" \
            --argjson runAttempt "${current_attempt}" \
            --argjson judgeJob "${judge_job}" \
            --argjson containerJob "${container_job}" \
            --argjson judge "${judge}" \
            --argjson container "${container}" '
              {
                ci: {
                  runId: $runId,
                  runAttempt: $runAttempt
                },
                judgeArtifact: {
                  id: $judge.id,
                  name: $judge.name,
                  digest: $judge.digest,
                  sizeBytes: $judge.size_in_bytes,
                  producerAttempt: $judgeJob.runAttempt
                },
                containerArtifact: {
                  id: $container.id,
                  name: $container.name,
                  digest: $container.digest,
                  sizeBytes: $container.size_in_bytes,
                  producerAttempt: $containerJob.runAttempt
