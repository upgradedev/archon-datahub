            "$(jq -er '.containerArtifact.id' "${source}")" \
            "$(jq -er '.containerArtifact.digest' "${source}")" \
            "${work}/container.zip"

          python3 - \
            "${work}/judge.zip" \
            "${work}/judge" \
            judge <<'PY'
          import os
          import posixpath
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          output = Path(sys.argv[2])
          kind = sys.argv[3]
          expected_by_kind = {
              "judge": {
                  "README.md",
                  "SHA256SUMS",
                  "audit/report.json",
                  "audit/report.md",
                  "audit/report.sarif",
                  "control/approval-decision.json",
                  "control/approval-request.json",
                  "control/evidence-dossier.json",
                  "control/execution-receipt.json",
                  "control/remediation-plan.json",
                  "control/rollback-proposal.json",
                  "manifest.json",
              },
              "container": {
                  "archon-image.tar.gz",
                  "archon-image.tar.gz.sha256",
                  "health.json",
                  "image-inspect.json",
              },
          }
          limits = {"judge": 50 * 1024 * 1024, "container": 1024 * 1024 * 1024}
          expected = expected_by_kind[kind]
          allowed_dirs = {
              parent
              for name in expected
              for parent in Path(name).parents
              if str(parent) != "."
          }
          if output.exists() or output.is_symlink():
              raise SystemExit("archive output already exists")
          output.mkdir(mode=0o700)
          seen_files: set[str] = set()
          seen_dirs: set[str] = set()
          total = 0
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              if not entries or len(entries) > 64:
                  raise SystemExit("unsafe ZIP entry count")
              for entry in entries:
                  raw = entry.filename
                  if (
                      not raw
                      or raw.startswith("/")
                      or "\\" in raw
                      or "\x00" in raw
                  ):
                      raise SystemExit(f"unsafe ZIP path: {raw!r}")
                  directory = entry.is_dir()
                  canonical = posixpath.normpath(raw.rstrip("/"))
                  required_raw = canonical + "/" if directory else canonical
                  if (
                      canonical in ("", ".", "..")
                      or raw != required_raw
                      or canonical.startswith("../")
                  ):
                      raise SystemExit(f"non-canonical ZIP path: {raw!r}")
                  mode_type = stat.S_IFMT(entry.external_attr >> 16)
                  if directory:
                      if (
                          canonical not in {str(path).replace(os.sep, "/") for path in allowed_dirs}
                          or canonical in seen_dirs
                          or mode_type not in (0, stat.S_IFDIR)
                      ):
                          raise SystemExit(f"unsafe ZIP directory: {raw!r}")
                      seen_dirs.add(canonical)
                      continue
                  if (
                      canonical not in expected
                      or canonical in seen_files
                      or mode_type not in (0, stat.S_IFREG)
                      or entry.flag_bits & 0x1
                      or entry.file_size <= 0
                      or entry.file_size > limits[kind]
                  ):
                      raise SystemExit(f"unsafe ZIP entry: {raw!r}")
                  total += entry.file_size
                  if total > limits[kind]:
                      raise SystemExit("upstream ZIP exceeds its size limit")
                  destination = output / canonical
                  destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  with bundle.open(entry) as source, destination.open("xb") as target:
                      shutil.copyfileobj(source, target, length=1024 * 1024)
                  if destination.stat().st_size != entry.file_size:
                      raise SystemExit(f"truncated ZIP entry: {raw!r}")
                  seen_files.add(canonical)
          if seen_files != expected:
              raise SystemExit("upstream ZIP file inventory is not exact")
          PY
          python3 - \
            "${work}/container.zip" \
            "${work}/container" \
            container <<'PY'
