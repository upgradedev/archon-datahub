name: GitHub repository posture (admin/elevated-read controls unverified)

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: github-repository-posture
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  observe:
    name: Secretless posture (admin/elevated-read controls unverified)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      BASH_ENV: /dev/null
    steps:
      - name: Require the canonical repository and master ref
        env:
          EXPECTED_REF: refs/heads/master
          EXPECTED_REPOSITORY: upgradedev/archon-datahub
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${GITHUB_REF}" = "${EXPECTED_REF}"
          case "${GITHUB_EVENT_NAME}" in
            schedule | workflow_dispatch) ;;
            *)
              echo "::error::Unsupported repository-posture event"
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Observe the secretless repository posture
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_PATH: ${{ runner.temp }}/github-repository-posture/github-repository-posture.json
          POLICY_PATH: ${{ github.workspace }}/contracts/github-repository-posture-v1.json
        run: |
          set -euo pipefail
          bash scripts/verify-github-repository-posture.sh

      - name: Retain the canonical normalized posture receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-repository-posture-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-repository-posture/github-repository-posture.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
          overwrite: false
