name: Production alarm delivery proof

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: archon-production-alarm-delivery
  cancel-in-progress: false

env:
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_PAGER: ""
  AWS_REGION: eu-west-1

jobs:
  prove:
    name: Prove CloudWatch to encrypted SNS and SQS delivery
    if: >-
      github.repository == 'upgradedev/archon-datahub' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-paging-test
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Bind the current reviewed control plane
        env:
          ATTEMPTS: "40"
          BACKOFF_SECONDS: "15"
          GH_TOKEN: ${{ github.token }}
          OUTPUT_PATH: ${{ runner.temp }}/alarm-proof/control-plane-gates.json
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          mkdir -p "${RUNNER_TEMP}/alarm-proof"
          bash scripts/verify-github-control-plane.sh
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Validate protected paging identity
        env:
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          PAGING_ROLE: ${{ vars.AWS_PAGING_TEST_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "${ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          test "${PAGING_ROLE}" = \
            "arn:aws:iam::${ACCOUNT_ID}:role/archon-production-paging-test"

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PAGING_TEST_ROLE_ARN }}
          role-session-name: archon-alarm-proof-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Exercise and verify the exact production alarm route
        id: proof
        run: |
          set -euo pipefail
          stack=Archon-production-Judge
          stack_json="$(
            aws cloudformation describe-stacks \
              --stack-name "${stack}" --region "${AWS_REGION}" --output json
          )"
          output() {
            jq -er --arg key "$1" '
              [.Stacks[0].Outputs[] | select(.OutputKey == $key)] |
              if length == 1 then .[0].OutputValue else error($key) end
            ' <<<"${stack_json}"
          }
          queue_url="$(output ArchonAlarmProofQueueUrl)"
          topic_arn="$(output ArchonAlarmTopicArn)"
          alarm_name="$(output ArchonControlPlaneAlarmName)"
          release_sha="$(output ArchonReleaseSha)"
          test "${release_sha}" = "${GITHUB_SHA}"
          test "${alarm_name}" = archon-production-control-plane-errors
          [[ "${topic_arn}" =~ ^arn:aws:sns:eu-west-1:[0-9]{12}:archon-production-alarms$ ]]
          [[ "${queue_url}" =~ ^https://sqs\.eu-west-1\.amazonaws\.com/[0-9]{12}/archon-production-alarm-proof$ ]]

          queue_attributes="$(
            aws sqs get-queue-attributes --queue-url "${queue_url}" \
              --attribute-names QueueArn KmsMasterKeyId SqsManagedSseEnabled \
                MessageRetentionPeriod Policy \
              --region "${AWS_REGION}" --output json
          )"
          jq -e --arg topic "${topic_arn}" '
            (.Attributes.QueueArn |
              test("^arn:aws:sqs:eu-west-1:[0-9]{12}:archon-production-alarm-proof$")) and
            (.Attributes.KmsMasterKeyId | length) > 0 and
            .Attributes.MessageRetentionPeriod == "1209600" and
            (.Attributes.Policy | fromjson |
              [.Statement[] |
                select(
                  .Principal.Service == "sns.amazonaws.com" and
                  .Condition.ArnEquals["aws:SourceArn"] == $topic and
                  (.Action | tostring | contains("sqs:SendMessage"))
                )] | length) == 1
          ' <<<"${queue_attributes}" >/dev/null

          cleanup() {
            aws cloudwatch set-alarm-state \
              --alarm-name "${alarm_name}" --state-value OK \
              --state-reason "archon-ci-alarm-proof-cleanup" \
              --region "${AWS_REGION}" >/dev/null 2>&1 || true
            for _ in $(seq 1 4); do
              batch="$(
                aws sqs receive-message --queue-url "${queue_url}" \
                  --max-number-of-messages 10 --wait-time-seconds 1 \
                  --region "${AWS_REGION}" --output json 2>/dev/null || echo '{}'
              )"
              jq -r '.Messages[]?.ReceiptHandle' <<<"${batch}" |
                while IFS= read -r receipt; do
                  aws sqs delete-message --queue-url "${queue_url}" \
                    --receipt-handle "${receipt}" --region "${AWS_REGION}" \
                    >/dev/null 2>&1 || true
                done
            done
          }
          trap cleanup EXIT

          aws cloudwatch set-alarm-state \
            --alarm-name "${alarm_name}" --state-value OK \
            --state-reason "archon-ci-alarm-proof-prime" \
            --region "${AWS_REGION}"
          cleanup
          token="archon-ci-alarm-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws cloudwatch set-alarm-state \
            --alarm-name "${alarm_name}" --state-value ALARM \
            --state-reason "${token}" --region "${AWS_REGION}"

          matched=false
          matched_digest=
          for ((attempt = 1; attempt <= 18; attempt++)); do
            batch="$(
              aws sqs receive-message --queue-url "${queue_url}" \
                --max-number-of-messages 10 --wait-time-seconds 10 \
                --attribute-names SentTimestamp \
                --region "${AWS_REGION}" --output json
            )"
            while IFS= read -r row; do
              receipt="$(jq -er .ReceiptHandle <<<"${row}")"
              body="$(jq -er .Body <<<"${row}")"
              if jq -e \
                --arg alarm "${alarm_name}" \
                --arg token "${token}" '
                  .AlarmName == $alarm and
                  .NewStateValue == "ALARM" and
                  .NewStateReason == $token
                ' <<<"${body}" >/dev/null; then
                matched=true
                matched_digest="sha256:$(printf '%s' "${body}" | sha256sum | awk '{print $1}')"
              fi
              aws sqs delete-message --queue-url "${queue_url}" \
                --receipt-handle "${receipt}" --region "${AWS_REGION}"
            done < <(jq -c '.Messages[]?' <<<"${batch}")
            test "${matched}" = false || break
          done
          test "${matched}" = true
          [[ "${matched_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          jq -cnS \
            --arg releaseSha "${release_sha}" \
            --arg provedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deliveryDigest "${matched_digest}" '
              {
                schemaVersion:"archon.production-alarm-delivery/v2",
                releaseSha:$releaseSha,
                provedAt:$provedAt,
                route:"CloudWatch->SNS(KMS)->SQS(KMS)",
                checks:{
                  exactAlarm:true,
                  alarmTransition:true,
                  topicBinding:true,
                  encryptedProofQueue:true,
                  endToEndDelivery:true,
                  cleanupRegistered:true
                },
                deliveryDigest:$deliveryDigest,
                rawIdentifiersRetained:false,
                result:"passed"
              }
            ' >"${RUNNER_TEMP}/alarm-proof/evidence.json"
          echo "evidence=${RUNNER_TEMP}/alarm-proof/evidence.json" >>"${GITHUB_OUTPUT}"

      - name: Attest sanitized delivery evidence
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.proof.outputs.evidence }}
          predicate-type: https://github.com/upgradedev/archon-datahub/attestations/production-alarm-delivery/v2
          predicate-path: ${{ steps.proof.outputs.evidence }}

      - name: Retain alarm delivery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: production-alarm-delivery-${{ github.sha }}-${{ github.run_id }}
          path: ${{ steps.proof.outputs.evidence }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Remove runner-only evidence
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/alarm-proof"
