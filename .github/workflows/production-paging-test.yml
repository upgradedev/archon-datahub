name: Production paging delivery

on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: archon-production-paging-delivery
  cancel-in-progress: false

env:
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_PAGER: ""
  BASH_ENV: /dev/null
  PREDICATE_TYPE: https://archon.datahub.dev/attestations/production-paging-delivery/v1

defaults:
  run:
    shell: bash

jobs:
  control-plane:
    name: Bind exact green default-branch control plane
    if: >-
      github.repository == 'upgradedev/archon-datahub' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      gate_receipt: ${{ steps.gates.outputs.gate_receipt }}
      gate_receipt_sha256: ${{ steps.gates.outputs.gate_receipt_sha256 }}
    steps:
      - name: Check out the exact paging control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Seal the exact current workflow gates
        id: gates
        env:
          ATTEMPTS: "40"
          BACKOFF_SECONDS: "15"
          CONTROL_PLANE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          OUTPUT_PATH: ${{ runner.temp }}/production-paging-control-plane/control-plane-security-gates.json
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "${CONTROL_PLANE_SHA}"
          mkdir -p "$(dirname "${OUTPUT_PATH}")"
          bash scripts/verify-github-control-plane.sh
          gate_receipt_sha256="$(
            sha256sum "${OUTPUT_PATH}" |
              awk '{print $1}'
          )"
          gate_receipt="$(base64 --wrap=0 "${OUTPUT_PATH}")"
          {
            echo "gate_receipt=${gate_receipt}"
            echo "gate_receipt_sha256=${gate_receipt_sha256}"
          } >>"${GITHUB_OUTPUT}"

  exercise:
    name: Prove exact external HTTPS paging delivery
    needs: control-plane
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-paging-test
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      ALARM_SUBSCRIPTION_ARN: ${{ vars.ALARM_SUBSCRIPTION_ARN }}
      CONTROL_PLANE_GATE_RECEIPT: ${{ needs.control-plane.outputs.gate_receipt }}
      CONTROL_PLANE_GATE_RECEIPT_SHA256: ${{ needs.control-plane.outputs.gate_receipt_sha256 }}
      DEPLOY_REGION: ${{ vars.AWS_REGION }}
      EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      PAGING_ROLE_ARN: ${{ vars.AWS_PAGING_TEST_ROLE_ARN }}
    steps:
      - name: Validate protected paging configuration
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CONTROL_PLANE_GATE_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${EXPECTED_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]] || {
            echo "::error::production-paging-test AWS_ACCOUNT_ID must be a 12-digit account ID"
            exit 1
          }
          [[ "${DEPLOY_REGION}" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]] || {
            echo "::error::production-paging-test AWS_REGION is invalid"
            exit 1
          }
          [[ "${PAGING_ROLE_ARN}" =~ ^arn:aws[a-z-]*:iam::${EXPECTED_ACCOUNT_ID}:role/[^[:space:]]+$ ]] || {
            echo "::error::AWS_PAGING_TEST_ROLE_ARN must be a dedicated role in AWS_ACCOUNT_ID"
            exit 1
          }
          partition="$(cut -d: -f2 <<<"${PAGING_ROLE_ARN}")"
          expected_paging_role_arn="arn:${partition}:iam::${EXPECTED_ACCOUNT_ID}:role/archon-production-paging-test"
          test "${PAGING_ROLE_ARN}" = \
            "${expected_paging_role_arn}" || {
            echo "::error::AWS_PAGING_TEST_ROLE_ARN must name archon-production-paging-test"
            exit 1
          }
          [[ "${ALARM_SUBSCRIPTION_ARN}" =~ ^arn:${partition}:sns:${DEPLOY_REGION}:${EXPECTED_ACCOUNT_ID}:archon-production-alarms:[0-9a-fA-F-]{36}$ ]] || {
            echo "::error::ALARM_SUBSCRIPTION_ARN must be the exact production alarm subscription"
            exit 1
          }
          case "${PAGING_ROLE_ARN}" in
            *deploy*|*posture*|*observer*|*runtime*)
              echo "::error::Paging delivery must not reuse a deployment or observer role"
              exit 1
              ;;
          esac

          evidence_dir="${RUNNER_TEMP}/production-paging-evidence"
          sealed_dir="${RUNNER_TEMP}/production-paging-sealed-control-plane"
          mkdir -p "${evidence_dir}" "${sealed_dir}"
          printf '%s' "${CONTROL_PLANE_GATE_RECEIPT}" |
            base64 --decode \
              >"${sealed_dir}/control-plane-security-gates.json"
          actual_gate_sha256="$(
            sha256sum \
              "${sealed_dir}/control-plane-security-gates.json" |
              awk '{print $1}'
          )"
          test "${actual_gate_sha256}" = \
            "${CONTROL_PLANE_GATE_RECEIPT_SHA256}"
          jq -e \
            --arg sha "${GITHUB_SHA}" '
              (keys | sort) == [
                "branch",
                "schemaVersion",
                "sourceSha",
                "workflows"
              ] and
              .schemaVersion ==
                "archon.deployment-control-plane-gates/v1" and
              .branch == "master" and
              .sourceSha == $sha and
              (.workflows | length) == 3 and
              ([.workflows[].path] | sort) == [
                ".github/workflows/ci.yml",
                ".github/workflows/codeql.yml",
                ".github/workflows/workflow-security.yml"
              ]
            ' \
            "${sealed_dir}/control-plane-security-gates.json" >/dev/null
          {
            echo "EVIDENCE_DIR=${evidence_dir}"
            echo "SEALED_CONTROL_PLANE_DIR=${sealed_dir}"
          } >>"${GITHUB_ENV}"

      - name: Check out the exact protected paging control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate exact control plane before AWS trust
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
          EXPECTED_GATE_SHA256: ${{ needs.control-plane.outputs.gate_receipt_sha256 }}
          GH_TOKEN: ${{ github.token }}
          OUTPUT_PATH: ${{ runner.temp }}/production-paging-current-control-plane/control-plane-security-gates.json
          SEALED_GATE_PATH: ${{ runner.temp }}/production-paging-sealed-control-plane/control-plane-security-gates.json
          VERIFICATION_MODE: sealed
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_PLANE_SHA}"
          current_default_sha="$(
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
              jq -er '
                select(
                  .ref == "refs/heads/master" and
                  .object.type == "commit"
                ) |
                .object.sha
              '
          )"
          test "${current_default_sha}" = "${CONTROL_PLANE_SHA}"
          mkdir -p "$(dirname "${OUTPUT_PATH}")"
          bash scripts/verify-github-control-plane.sh
          cmp --silent "${OUTPUT_PATH}" "${SEALED_GATE_PATH}"

      - name: Acquire short-lived dedicated paging credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PAGING_TEST_ROLE_ARN }}
          role-session-name: archon-production-paging-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Publish one nonce-bound test and prove exact delivery
        id: delivery
        run: |
          set -euo pipefail
          umask 077
          work_dir="$(mktemp -d "${RUNNER_TEMP}/production-paging-live.XXXXXX")"
          cleanup() {
            rm -rf -- "${work_dir}"
          }
          trap cleanup EXIT

          caller="$(
            aws sts get-caller-identity --output json
          )"
          partition="$(cut -d: -f2 <<<"${PAGING_ROLE_ARN}")"
          expected_caller_arn="arn:${partition}:sts::${EXPECTED_ACCOUNT_ID}:assumed-role/archon-production-paging-test/archon-production-paging-${GITHUB_RUN_ID}"
          jq -e \
            --arg account "${EXPECTED_ACCOUNT_ID}" \
            --arg callerArn "${expected_caller_arn}" \
            --arg sessionName \
              "archon-production-paging-${GITHUB_RUN_ID}" '
              .Account == $account and
              .Arn == $callerArn and
              (.UserId | type == "string") and
              (
                .UserId |
                endswith(":" + $sessionName)
              )
            ' <<<"${caller}" >/dev/null || {
            echo "::error::The paging OIDC session is outside the expected AWS account"
            exit 1
          }

          stack_snapshot() {
            local raw="$1"
            jq -cS '
              .Stacks |
              if length == 1 then .[0] else
                error("expected exactly one production stack")
              end |
              {
                stackStatus: .StackStatus,
                terminationProtection: .EnableTerminationProtection,
                outputs: (
                  .Outputs |
                  map({key: .OutputKey, value: .OutputValue}) |
                  sort_by(.key)
                )
              }
            ' <<<"${raw}"
          }

          stack_output() {
            local key="$1"
            local snapshot="$2"
            jq -er \
              --arg key "${key}" '
                [
                  .outputs[] |
                  select(.key == $key) |
                  .value
                ] |
                if length == 1 then .[0] else
                  error("missing or duplicate stack output: " + $key)
                end
              ' <<<"${snapshot}"
          }

          raw_stack="$(
            aws cloudformation describe-stacks \
              --region "${DEPLOY_REGION}" \
              --stack-name Archon-production \
              --output json
          )"
          initial_stack="$(stack_snapshot "${raw_stack}")"
          jq -e '
            (
              .stackStatus == "CREATE_COMPLETE" or
              .stackStatus == "UPDATE_COMPLETE"
            ) and
            .terminationProtection == true
          ' <<<"${initial_stack}" >/dev/null || {
            echo "::error::Archon-production is not a stable protected stack"
            exit 1
          }

          release_sha="$(
            stack_output ArchonReleaseSha "${initial_stack}"
          )"
          deployment_run_id="$(
            stack_output \
              ArchonDeploymentWorkflowRunId \
              "${initial_stack}"
          )"
          deployment_run_attempt="$(
            stack_output \
              ArchonDeploymentWorkflowRunAttempt \
              "${initial_stack}"
          )"
          topic_arn="$(
            stack_output ArchonAlarmTopicArn "${initial_stack}"
          )"
          feedback_role_arn="$(
            stack_output \
              ArchonAlarmDeliveryFeedbackRoleArn \
              "${initial_stack}"
          )"
          topic_kms_key_arn="$(
            stack_output \
              ArchonAlarmTopicKmsKeyArn \
              "${initial_stack}"
          )"
          delivery_log_group="$(
            stack_output \
              ArchonAlarmDeliveryLogGroupName \
              "${initial_stack}"
          )"
          test "${release_sha}" = "${GITHUB_SHA}" || {
            echo "::error::Production must run the exact current default-branch release"
            exit 1
          }
          [[ "${deployment_run_id}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${deployment_run_attempt}" =~ ^[1-9][0-9]{0,19}$ ]]
          expected_topic_arn="arn:${partition}:sns:${DEPLOY_REGION}:${EXPECTED_ACCOUNT_ID}:archon-production-alarms"
          expected_feedback_role_arn="arn:${partition}:iam::${EXPECTED_ACCOUNT_ID}:role/archon-production-sns-delivery-status"
          expected_topic_kms_key_arn_prefix="arn:${partition}:kms:${DEPLOY_REGION}:${EXPECTED_ACCOUNT_ID}:key/"
          expected_log_group="sns/${DEPLOY_REGION}/${EXPECTED_ACCOUNT_ID}/archon-production-alarms"
          test "${topic_arn}" = "${expected_topic_arn}"
          test "${feedback_role_arn}" = \
            "${expected_feedback_role_arn}"
          [[ "${topic_kms_key_arn}" == \
            "${expected_topic_kms_key_arn_prefix}"* ]]
          test "${delivery_log_group}" = "${expected_log_group}"
          [[ "${ALARM_SUBSCRIPTION_ARN}" == "${topic_arn}:"* ]]

          topic_attributes="$(
            aws sns get-topic-attributes \
              --region "${DEPLOY_REGION}" \
              --topic-arn "${topic_arn}" \
              --output json
          )"
          jq -e \
            --arg feedbackRole "${feedback_role_arn}" \
            --arg topicKmsKeyArn "${topic_kms_key_arn}" \
            --arg topic "${topic_arn}" '
              .Attributes.TopicArn == $topic and
              .Attributes.HTTPSuccessFeedbackRoleArn ==
                $feedbackRole and
              .Attributes.HTTPFailureFeedbackRoleArn ==
                $feedbackRole and
              .Attributes.HTTPSuccessFeedbackSampleRate == "100" and
              .Attributes.KmsMasterKeyId == $topicKmsKeyArn
            ' <<<"${topic_attributes}" >/dev/null || {
            echo "::error::The production topic lacks exact 100% HTTPS delivery feedback"
            exit 1
          }
          topic_projection="$(
            jq -cS '
              .Attributes |
              {
                topicArn: .TopicArn,
                feedbackRoleArn: .HTTPSuccessFeedbackRoleArn,
                failureFeedbackRoleArn:
                  .HTTPFailureFeedbackRoleArn,
                successFeedbackSampleRate:
                  .HTTPSuccessFeedbackSampleRate,
                kmsMasterKeyId: .KmsMasterKeyId
              }
            ' <<<"${topic_attributes}"
          )"

          subscription_attributes="$(
            aws sns get-subscription-attributes \
              --region "${DEPLOY_REGION}" \
              --subscription-arn "${ALARM_SUBSCRIPTION_ARN}" \
              --output json
          )"
          jq -e \
            --arg account "${EXPECTED_ACCOUNT_ID}" \
            --arg subscription "${ALARM_SUBSCRIPTION_ARN}" \
            --arg topic "${topic_arn}" '
              .Attributes.SubscriptionArn == $subscription and
              .Attributes.TopicArn == $topic and
              .Attributes.Owner == $account and
              .Attributes.PendingConfirmation == "false" and
              .Attributes.Protocol == "https" and
              (.Attributes.Endpoint | type == "string") and
              (.Attributes.Endpoint | test("^https://[^[:space:]]+$")) and
              (
                ((.Attributes.FilterPolicy // "{}") | fromjson) ==
                {}
              )
            ' <<<"${subscription_attributes}" >/dev/null || {
            echo "::error::Paging requires one confirmed unfiltered HTTPS subscription"
            exit 1
          }
          endpoint="$(
            jq -er '.Attributes.Endpoint' \
              <<<"${subscription_attributes}"
          )"
          escaped_endpoint="${endpoint//%/%25}"
          escaped_endpoint="${escaped_endpoint//$'\r'/%0D}"
          escaped_endpoint="${escaped_endpoint//$'\n'/%0A}"
          printf '::add-mask::%s\n' "${escaped_endpoint}"
          subscription_projection="$(
            jq -cS '
              .Attributes |
              {
                owner: .Owner,
                pendingConfirmation: .PendingConfirmation,
                protocol: .Protocol,
                subscriptionArn: .SubscriptionArn,
                topicArn: .TopicArn,
                endpoint: .Endpoint,
                filterPolicy: (
                  (.FilterPolicy // "{}") | fromjson
                )
              }
            ' <<<"${subscription_attributes}"
          )"

          published_at="$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
          published_epoch="$(
            date --utc --date="${published_at}" +%s
          )"
          start_time_ms="$((published_epoch * 1000 - 300000))"
          nonce="$(openssl rand -hex 32)"
          payload_path="${work_dir}/synthetic-paging-message.json"
          jq -cnS \
            --arg emittedAt "${published_at}" \
            --arg nonce "${nonce}" \
            --arg releaseSha "${release_sha}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg runId "${GITHUB_RUN_ID}" '
              {
                schemaVersion:
                  "archon.synthetic-paging-delivery-test/v1",
                repository: $repository,
                releaseSha: $releaseSha,
                workflowRunId: ($runId | tonumber),
                workflowRunAttempt: ($runAttempt | tonumber),
                emittedAt: $emittedAt,
                nonce: $nonce,
                severity: "test",
                summary:
                  "Archon synthetic paging delivery test; no action required"
              }
            ' >"${payload_path}"
          payload_sha256="$(
            sha256sum "${payload_path}" |
              awk '{print $1}'
          )"
          payload_md5="$(
            # SNS exposes messageMD5Sum for transport correlation only. SHA-256
            # remains the retained integrity digest.
            md5sum "${payload_path}" |
              awk '{print $1}'
          )"
          [[ "${payload_md5}" =~ ^[0-9a-f]{32}$ ]]
          nonce_sha256="$(
            printf '%s' "${nonce}" |
              sha256sum |
              awk '{print $1}'
          )"
          publish_result="$(
            AWS_MAX_ATTEMPTS=1 \
            AWS_RETRY_MODE=standard \
              aws sns publish \
              --region "${DEPLOY_REGION}" \
              --topic-arn "${topic_arn}" \
              --subject "Archon synthetic paging delivery test" \
              --message "file://${payload_path}" \
              --output json
          )"
          message_id="$(
            jq -er '
              select(
                (keys | sort) == ["MessageId"] and
                (.MessageId |
                  test("^[0-9a-fA-F-]{36}$"))
              ) |
              .MessageId
            ' <<<"${publish_result}"
          )" || {
            echo "::error::SNS publish did not return one standard-topic MessageId"
            exit 1
          }
          message_id_sha256="$(
            printf '%s' "${message_id}" |
              sha256sum |
              awk '{print $1}'
          )"

          collect_matching_delivery_events() {
            local log_group="$1"
            local destination="$2"
            local output_path="$3"
            local page_file="${work_dir}/delivery-page.json"
            local request_file="${work_dir}/delivery-request.json"
            local events_file="${work_dir}/delivery-events.ndjson"
            local next_token=""
            local previous_token=""
            local page
            : >"${events_file}"
            for page in {1..100}; do
              jq -cnS \
                --arg filterPattern "\"${message_id}\"" \
                --arg logGroupName "${log_group}" \
                --arg nextToken "${next_token}" \
                --arg startTime "${start_time_ms}" '
                  {
                    filterPattern: $filterPattern,
                    limit: 100,
                    logGroupName: $logGroupName,
                    startTime: ($startTime | tonumber)
                  } +
                  if $nextToken == "" then {}
                  else {nextToken: $nextToken}
                  end
                ' >"${request_file}"
              aws logs filter-log-events \
                --region "${DEPLOY_REGION}" \
                --cli-input-json "file://${request_file}" \
                --no-paginate \
                --output json \
                >"${page_file}"
              jq -cr \
                --arg destination "${destination}" \
                --arg messageId "${message_id}" '
                  .events[]? |
                  (.message | fromjson?) as $message |
                  select(
                    $message != null and
                    (.eventId | type) == "string" and
                    (.eventId | length) >= 1 and
                    $message.notification.messageId ==
                      $messageId and
                    $message.delivery.destination ==
                      $destination
                  ) |
                  {
                    eventId,
                    eventTimestamp: .timestamp,
                    notificationTimestamp:
                      $message.notification.timestamp,
                    messageMD5Sum:
                      $message.notification.messageMD5Sum,
                    status: $message.status,
                    statusCode: $message.delivery.statusCode,
                    dwellTimeMs: $message.delivery.dwellTimeMs
                  }
                ' "${page_file}" >>"${events_file}"
              next_token="$(
                jq -r '.nextToken // empty' "${page_file}"
              )"
              if [[ -z "${next_token}" ]]; then
                break
              fi
              test "${next_token}" != "${previous_token}" || {
                echo "::error::CloudWatch pagination token repeated"
                return 1
              }
              previous_token="${next_token}"
              if (( page == 100 )); then
                echo "::error::CloudWatch pagination exceeded 100 pages"
                return 1
              fi
            done
            jq -csS 'unique_by(.eventId)' \
              "${events_file}" >"${output_path}"
          }

          match_path="${work_dir}/matching-delivery-events.json"
          delivery_found=false
          for poll_attempt in {1..36}; do
            collect_matching_delivery_events \
              "${delivery_log_group}" \
              "${endpoint}" \
              "${match_path}"
            match_count="$(jq -r 'length' "${match_path}")"
            if (( match_count > 1 )); then
              echo "::error::Multiple delivery events matched the exact endpoint and MessageId"
              exit 1
            fi
            if (( match_count == 1 )); then
              delivery_found=true
              break
            fi
            if (( poll_attempt < 36 )); then
              sleep 10
            fi
          done
          test "${delivery_found}" = "true" || {
            echo "::error::No exact external delivery receipt appeared within six minutes"
            exit 1
          }
          jq -e \
            --arg payloadMd5 "${payload_md5}" '
            length == 1 and
            .[0].messageMD5Sum == $payloadMd5 and
            .[0].status == "SUCCESS" and
            (.[0].statusCode | type) == "number" and
            .[0].statusCode >= 200 and
            .[0].statusCode <= 299 and
            (.[0].dwellTimeMs | type) == "number" and
            .[0].dwellTimeMs >= 0 and
            (.[0].eventTimestamp | type) == "number"
          ' "${match_path}" >/dev/null || {
            echo "::error::The exact delivery receipt is not a successful 2xx acceptance"
            exit 1
          }
          sleep 30
          collect_matching_delivery_events \
            "${delivery_log_group}" \
            "${endpoint}" \
            "${match_path}"
          jq -e \
            --arg payloadMd5 "${payload_md5}" '
              length == 1 and
              .[0].messageMD5Sum == $payloadMd5 and
              .[0].status == "SUCCESS" and
              (.[0].statusCode | type) == "number" and
              .[0].statusCode >= 200 and
              .[0].statusCode <= 299 and
              (.[0].dwellTimeMs | type) == "number" and
              .[0].dwellTimeMs >= 0 and
              (.[0].eventTimestamp | type) == "number"
            ' "${match_path}" >/dev/null || {
            echo "::error::The delivery receipt did not remain unique and successful"
            exit 1
          }
          status_code="$(
            jq -er '.[0].statusCode' "${match_path}"
          )"
          dwell_time_ms="$(
            jq -er '.[0].dwellTimeMs' "${match_path}"
          )"
          notification_timestamp="$(
            jq -er '.[0].notificationTimestamp' "${match_path}"
          )"
          delivery_event_timestamp="$(
            jq -er '.[0].eventTimestamp' "${match_path}"
          )"
          notification_epoch="$(
            date --utc --date="${notification_timestamp}" +%s
          )"
          published_epoch="$(
            date --utc --date="${published_at}" +%s
          )"
          (( notification_epoch >= published_epoch - 300 ))
          (( notification_epoch <= published_epoch + 300 ))
          delivery_event_epoch="$((delivery_event_timestamp / 1000))"
          delivered_at="$(
            date --utc \
              --date="@${delivery_event_epoch}" \
              +'%Y-%m-%dT%H:%M:%SZ'
          )"
          observed_at="$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
          observed_epoch="$(
            date --utc --date="${observed_at}" +%s
          )"
          delivered_epoch="$(
            date --utc --date="${delivered_at}" +%s
          )"
          canonical_utc_timestamp() {
            local value="$1"
            [[ "${value}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            test "$(
              date --utc \
                --date="${value}" \
                +'%Y-%m-%dT%H:%M:%SZ'
            )" = "${value}"
          }
          canonical_utc_timestamp "${published_at}"
          canonical_utc_timestamp "${delivered_at}"
          canonical_utc_timestamp "${observed_at}"
          (( delivered_epoch >= published_epoch - 300 ))
          (( delivered_epoch <= published_epoch + 420 ))
          (( delivered_epoch <= observed_epoch + 300 ))
          (( observed_epoch <= delivered_epoch + 900 ))

          final_stack="$(
            stack_snapshot "$(
              aws cloudformation describe-stacks \
                --region "${DEPLOY_REGION}" \
                --stack-name Archon-production \
                --output json
            )"
          )"
          test "${final_stack}" = "${initial_stack}" || {
            echo "::error::Archon-production changed during paging verification"
            exit 1
          }
          final_topic_attributes="$(
            aws sns get-topic-attributes \
              --region "${DEPLOY_REGION}" \
              --topic-arn "${topic_arn}" \
              --output json
          )"
          final_topic_projection="$(
            jq -cS '
              .Attributes |
              {
                topicArn: .TopicArn,
                feedbackRoleArn: .HTTPSuccessFeedbackRoleArn,
                failureFeedbackRoleArn:
                  .HTTPFailureFeedbackRoleArn,
                successFeedbackSampleRate:
                  .HTTPSuccessFeedbackSampleRate,
                kmsMasterKeyId: .KmsMasterKeyId
              }
            ' <<<"${final_topic_attributes}"
          )"
          test "${final_topic_projection}" = \
            "${topic_projection}" || {
            echo "::error::SNS delivery feedback configuration changed during the test"
            exit 1
          }
          final_subscription_attributes="$(
            aws sns get-subscription-attributes \
              --region "${DEPLOY_REGION}" \
              --subscription-arn "${ALARM_SUBSCRIPTION_ARN}" \
              --output json
          )"
          final_subscription_projection="$(
            jq -cS '
              .Attributes |
              {
                owner: .Owner,
                pendingConfirmation: .PendingConfirmation,
                protocol: .Protocol,
                subscriptionArn: .SubscriptionArn,
                topicArn: .TopicArn,
                endpoint: .Endpoint,
                filterPolicy: (
                  (.FilterPolicy // "{}") | fromjson
                )
              }
            ' <<<"${final_subscription_attributes}"
          )"
          test "${final_subscription_projection}" = \
            "${subscription_projection}" || {
            echo "::error::The exact paging subscription changed during the test"
            exit 1
          }

          topic_arn_sha256="$(
            printf '%s' "${topic_arn}" |
              sha256sum |
              awk '{print $1}'
          )"
          subscription_arn_sha256="$(
            printf '%s' "${ALARM_SUBSCRIPTION_ARN}" |
              sha256sum |
              awk '{print $1}'
          )"
          endpoint_sha256="$(
            printf '%s' "${endpoint}" |
              sha256sum |
              awk '{print $1}'
          )"
          feedback_role_arn_sha256="$(
            printf '%s' "${feedback_role_arn}" |
              sha256sum |
              awk '{print $1}'
          )"
          log_group_name_sha256="$(
            printf '%s' "${delivery_log_group}" |
              sha256sum |
              awk '{print $1}'
          )"
          topic_kms_key_arn_sha256="$(
            printf '%s' "${topic_kms_key_arn}" |
              sha256sum |
              awk '{print $1}'
          )"
          stack_output_set_sha256="$(
            printf '%s' "${initial_stack}" |
              sha256sum |
              awk '{print $1}'
          )"
          aws_account_id_sha256="$(
            printf '%s' "${EXPECTED_ACCOUNT_ID}" |
              sha256sum |
              awk '{print $1}'
          )"
          jq -cnS \
            --slurpfile gates \
              "${SEALED_CONTROL_PLANE_DIR}/control-plane-security-gates.json" \
            --arg awsAccountIdSha256 \
              "sha256:${aws_account_id_sha256}" \
            --arg controlPlaneGateReceiptSha256 \
              "sha256:${CONTROL_PLANE_GATE_RECEIPT_SHA256}" \
            --arg deliveredAt "${delivered_at}" \
            --arg deliveryEventTimestamp "${delivery_event_timestamp}" \
            --arg deploymentRunAttempt "${deployment_run_attempt}" \
            --arg deploymentRunId "${deployment_run_id}" \
            --arg dwellTimeMs "${dwell_time_ms}" \
            --arg endpointSha256 "sha256:${endpoint_sha256}" \
            --arg feedbackRoleArnSha256 \
              "sha256:${feedback_role_arn_sha256}" \
            --arg logGroupNameSha256 \
              "sha256:${log_group_name_sha256}" \
            --arg messageIdSha256 "sha256:${message_id_sha256}" \
            --arg nonceSha256 "sha256:${nonce_sha256}" \
            --arg observedAt "${observed_at}" \
            --arg payloadSha256 "sha256:${payload_sha256}" \
            --arg producerAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg publishedAt "${published_at}" \
            --arg region "${DEPLOY_REGION}" \
            --arg releaseSha "${release_sha}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg stackOutputSetSha256 \
              "sha256:${stack_output_set_sha256}" \
            --arg statusCode "${status_code}" \
            --arg subscriptionArnSha256 \
              "sha256:${subscription_arn_sha256}" \
            --arg topicArnSha256 "sha256:${topic_arn_sha256}" \
            --arg topicKmsKeyArnSha256 \
              "sha256:${topic_kms_key_arn_sha256}" '
              {
                schemaVersion:
                  "archon.production-paging-delivery/v1",
                repository: $repository,
                releaseSha: $releaseSha,
                deployment: {
                  workflowRunId: ($deploymentRunId | tonumber),
                  workflowRunAttempt:
                    ($deploymentRunAttempt | tonumber),
                  stackOutputSetSha256: $stackOutputSetSha256
                },
                controlPlane: {
                  sourceSha: $releaseSha,
                  gateReceiptSha256:
                    $controlPlaneGateReceiptSha256,
                  gates: $gates[0]
                },
                target: {
                  awsAccountIdSha256:
                    $awsAccountIdSha256,
                  region: $region,
                  protocol: "https",
                  topicArnSha256: $topicArnSha256,
                  subscriptionArnSha256:
                    $subscriptionArnSha256,
                  endpointSha256: $endpointSha256,
                  feedbackRoleArnSha256:
                    $feedbackRoleArnSha256,
                  logGroupNameSha256:
                    $logGroupNameSha256,
                  successFeedbackSampleRate: 100,
                  topicKmsEncrypted: true,
                  topicKmsKeyArnSha256:
                    $topicKmsKeyArnSha256
                },
                delivery: {
                  syntheticTest: true,
                  externalHttpsAccepted: true,
                  destinationMatched: true,
                  exactMessageIdMatched: true,
                  uniqueDestinationMatch: true,
                  payloadSha256: $payloadSha256,
                  nonceSha256: $nonceSha256,
                  messageIdSha256: $messageIdSha256,
                  status: "SUCCESS",
                  statusCode: ($statusCode | tonumber),
                  dwellTimeMs: ($dwellTimeMs | tonumber),
                  publishedAt: $publishedAt,
                  deliveredAt: $deliveredAt,
                  deliveryEventTimestamp:
                    ($deliveryEventTimestamp | tonumber),
                  observedAt: $observedAt
                },
                verification: {
                  completePagination: true,
                  boundedPoll: true,
                  stackUnchanged: true,
                  topicUnchanged: true,
                  subscriptionUnchanged: true
                },
                workflow: {
                  path:
                    ".github/workflows/production-paging-test.yml",
                  runId: ($runId | tonumber),
                  producerAttempt:
                    ($producerAttempt | tonumber)
                }
              }
            ' >"${EVIDENCE_DIR}/paging-delivery.json"
          paging_delivery_sha256="$(
            sha256sum "${EVIDENCE_DIR}/paging-delivery.json" |
              awk '{print $1}'
          )"
          jq -cnS \
            --arg controlPlaneGateReceiptSha256 \
              "sha256:${CONTROL_PLANE_GATE_RECEIPT_SHA256}" \
            --arg pagingDeliverySha256 \
              "sha256:${paging_delivery_sha256}" \
            --arg producerAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg releaseSha "${release_sha}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg runId "${GITHUB_RUN_ID}" '
              {
                schemaVersion:
                  "archon.production-paging-delivery-manifest/v1",
                repository: $repository,
                releaseSha: $releaseSha,
                workflow: {
                  path:
                    ".github/workflows/production-paging-test.yml",
                  runId: ($runId | tonumber),
                  producerAttempt:
                    ($producerAttempt | tonumber)
                },
                controlPlaneGateReceiptSha256:
                  $controlPlaneGateReceiptSha256,
                files: {
                  "paging-delivery.json":
                    $pagingDeliverySha256
                },
                subjects: [
                  "manifest.json",
                  "paging-delivery.json"
                ],
                subjectCount: 2
              }
            ' >"${EVIDENCE_DIR}/manifest.json"
          manifest_sha256="$(
            sha256sum "${EVIDENCE_DIR}/manifest.json" |
              awk '{print $1}'
          )"
          jq -cnS \
            --arg controlPlaneGateReceiptSha256 \
              "sha256:${CONTROL_PLANE_GATE_RECEIPT_SHA256}" \
            --arg manifestSha256 "sha256:${manifest_sha256}" \
            --arg pagingDeliverySha256 \
              "sha256:${paging_delivery_sha256}" \
            --arg producerAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg releaseSha "${release_sha}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg runId "${GITHUB_RUN_ID}" '
              {
                schemaVersion:
                  "archon.production-paging-delivery-attestation/v1",
                repository: $repository,
                releaseSha: $releaseSha,
                workflow: {
                  path:
                    ".github/workflows/production-paging-test.yml",
                  runId: ($runId | tonumber),
                  producerAttempt:
                    ($producerAttempt | tonumber)
                },
                controlPlaneGateReceiptSha256:
                  $controlPlaneGateReceiptSha256,
                subjects: {
                  "manifest.json": $manifestSha256,
                  "paging-delivery.json":
                    $pagingDeliverySha256
                },
                verificationResult: "passed"
              }
            ' >"${EVIDENCE_DIR}/attestation-predicate.json"
          (
            cd "${EVIDENCE_DIR}"
            printf '%s  %s\n' \
              "${paging_delivery_sha256}" \
              "paging-delivery.json" \
              >paging-subject.sha256
            printf '%s  %s\n' \
              "${manifest_sha256}" \
              "manifest.json" \
              >>paging-subject.sha256
            sha256sum \
              attestation-predicate.json \
              manifest.json \
              paging-delivery.json \
              paging-subject.sha256 \
              >SHA256SUMS
            chmod 0644 \
              SHA256SUMS \
              attestation-predicate.json \
              manifest.json \
              paging-delivery.json \
              paging-subject.sha256
            sha256sum --check --strict SHA256SUMS
          )
          rm -f -- "${payload_path}" "${match_path}"
          endpoint=""
          message_id=""
          nonce=""
          {
            echo "producer_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "release_sha=${release_sha}"
          } >>"${GITHUB_OUTPUT}"

      - name: Remove AWS credentials before evidence publication
        if: always()
        run: |
          {
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
            echo "AWS_SECURITY_TOKEN="
          } >>"${GITHUB_ENV}"

      - name: Revalidate canonical package without AWS credentials
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
          EXPECTED_GATE_SHA256: ${{ needs.control-plane.outputs.gate_receipt_sha256 }}
          GH_TOKEN: ${{ github.token }}
          OUTPUT_PATH: ${{ runner.temp }}/production-paging-final-control-plane/control-plane-security-gates.json
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          mkdir -p "$(dirname "${OUTPUT_PATH}")"
          bash scripts/verify-github-control-plane.sh
          cmp --silent \
            "${OUTPUT_PATH}" \
            "${SEALED_CONTROL_PLANE_DIR}/control-plane-security-gates.json"
          mapfile -t inventory < <(
            cd "${EVIDENCE_DIR}"
            find . -mindepth 1 -maxdepth 1 -type f -printf '%P\n' |
              LC_ALL=C sort
          )
          expected=(
            SHA256SUMS
            attestation-predicate.json
            manifest.json
            paging-delivery.json
            paging-subject.sha256
          )
          test "${inventory[*]}" = "${expected[*]}"
          test -z "$(
            find "${EVIDENCE_DIR}" \
              -mindepth 1 \
              ! -type f \
              -print \
              -quit
          )"
          (
            cd "${EVIDENCE_DIR}"
            sha256sum --check --strict SHA256SUMS
            test "$(wc -l <SHA256SUMS)" = "4"
            test "$(
              awk '{print $2}' SHA256SUMS |
                paste -sd' ' -
            )" = "attestation-predicate.json manifest.json paging-delivery.json paging-subject.sha256"
            test "$(wc -l <paging-subject.sha256)" = "2"
            test "$(
              awk '{print $2}' paging-subject.sha256 |
                paste -sd' ' -
            )" = "paging-delivery.json manifest.json"
            sha256sum --check --strict paging-subject.sha256
          )
          paging_sha="$(
            sha256sum "${EVIDENCE_DIR}/paging-delivery.json" |
              awk '{print $1}'
          )"
          manifest_sha="$(
            sha256sum "${EVIDENCE_DIR}/manifest.json" |
              awk '{print $1}'
          )"
          jq -e \
            --arg gateReceiptSha \
              "sha256:${EXPECTED_GATE_SHA256}" \
            --arg manifestSha "sha256:${manifest_sha}" \
            --arg pagingSha "sha256:${paging_sha}" \
            --arg release "${GITHUB_SHA}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg runId "${GITHUB_RUN_ID}" '
              (keys | sort) == [
                "controlPlaneGateReceiptSha256",
                "releaseSha",
                "repository",
                "schemaVersion",
                "subjects",
                "verificationResult",
                "workflow"
              ] and
              .schemaVersion ==
                "archon.production-paging-delivery-attestation/v1" and
              .repository == "upgradedev/archon-datahub" and
              .releaseSha == $release and
              .controlPlaneGateReceiptSha256 ==
                $gateReceiptSha and
              (
                .workflow |
                keys |
                sort
              ) == [
                "path",
                "producerAttempt",
                "runId"
              ] and
              .workflow.path ==
                ".github/workflows/production-paging-test.yml" and
              .workflow.runId == ($runId | tonumber) and
              .workflow.producerAttempt ==
                ($runAttempt | tonumber) and
              .subjects == {
                "manifest.json": $manifestSha,
                "paging-delivery.json": $pagingSha
              } and
              .verificationResult == "passed"
            ' "${EVIDENCE_DIR}/attestation-predicate.json" >/dev/null
          jq -e \
            --arg gateReceiptSha \
              "sha256:${EXPECTED_GATE_SHA256}" \
            --arg pagingSha "sha256:${paging_sha}" \
            --arg release "${GITHUB_SHA}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg runId "${GITHUB_RUN_ID}" '
              (keys | sort) == [
                "controlPlaneGateReceiptSha256",
                "files",
                "releaseSha",
                "repository",
                "schemaVersion",
                "subjectCount",
                "subjects",
                "workflow"
              ] and
              .schemaVersion ==
                "archon.production-paging-delivery-manifest/v1" and
              .repository == "upgradedev/archon-datahub" and
              .releaseSha == $release and
              .controlPlaneGateReceiptSha256 ==
                $gateReceiptSha and
              (
                .workflow |
                keys |
                sort
              ) == [
                "path",
                "producerAttempt",
                "runId"
              ] and
              .workflow.path ==
                ".github/workflows/production-paging-test.yml" and
              .workflow.runId == ($runId | tonumber) and
              .workflow.producerAttempt ==
                ($runAttempt | tonumber) and
              .files == {
                "paging-delivery.json": $pagingSha
              } and
              .subjects == [
                "manifest.json",
                "paging-delivery.json"
              ] and
              .subjectCount == 2
            ' "${EVIDENCE_DIR}/manifest.json" >/dev/null
          jq -e \
            --arg gateReceiptSha \
              "sha256:${EXPECTED_GATE_SHA256}" \
            --arg release "${GITHUB_SHA}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" '
              def digest:
                type == "string" and
                test("^sha256:[0-9a-f]{64}$");
              def positive_integer:
                type == "number" and
                . >= 1 and
                floor == .;
              def nonnegative_integer:
                type == "number" and
                . >= 0 and
                floor == .;

              (keys | sort) == [
                "controlPlane",
                "delivery",
                "deployment",
                "releaseSha",
                "repository",
                "schemaVersion",
                "target",
                "verification",
                "workflow"
              ] and
              .schemaVersion ==
                "archon.production-paging-delivery/v1" and
              .repository == "upgradedev/archon-datahub" and
              .releaseSha == $release and
              (
                .deployment |
                keys |
                sort
              ) == [
                "stackOutputSetSha256",
                "workflowRunAttempt",
                "workflowRunId"
              ] and
              (.deployment.workflowRunId | positive_integer) and
              (
                .deployment.workflowRunAttempt |
                positive_integer
              ) and
              (.deployment.stackOutputSetSha256 | digest) and
              (
                .controlPlane |
                keys |
                sort
              ) == [
                "gateReceiptSha256",
                "gates",
                "sourceSha"
              ] and
              .controlPlane.sourceSha == $release and
              .controlPlane.gateReceiptSha256 ==
                $gateReceiptSha and
              .controlPlane.gates.sourceSha == $release and
              (
                .workflow |
                keys |
                sort
              ) == [
                "path",
                "producerAttempt",
                "runId"
              ] and
              .workflow.path ==
                ".github/workflows/production-paging-test.yml" and
              .workflow.runId == ($runId | tonumber) and
              .workflow.producerAttempt ==
                ($runAttempt | tonumber) and
              (
                .target |
                keys |
                sort
              ) == [
                "awsAccountIdSha256",
                "endpointSha256",
                "feedbackRoleArnSha256",
                "logGroupNameSha256",
                "protocol",
                "region",
                "subscriptionArnSha256",
                "successFeedbackSampleRate",
                "topicArnSha256",
                "topicKmsEncrypted",
                "topicKmsKeyArnSha256"
              ] and
              .target.protocol == "https" and
              (
                .target.region |
                type == "string" and
                test("^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$")
              ) and
              .target.successFeedbackSampleRate == 100 and
              .target.topicKmsEncrypted == true and
              (.target.awsAccountIdSha256 | digest) and
              (.target.endpointSha256 | digest) and
              (.target.feedbackRoleArnSha256 | digest) and
              (.target.logGroupNameSha256 | digest) and
              (.target.subscriptionArnSha256 | digest) and
              (.target.topicArnSha256 | digest) and
              (.target.topicKmsKeyArnSha256 | digest) and
              (
                .delivery |
                keys |
                sort
              ) == [
                "deliveredAt",
                "deliveryEventTimestamp",
                "destinationMatched",
                "dwellTimeMs",
                "exactMessageIdMatched",
                "externalHttpsAccepted",
                "messageIdSha256",
                "nonceSha256",
                "observedAt",
                "payloadSha256",
                "publishedAt",
                "status",
                "statusCode",
                "syntheticTest",
                "uniqueDestinationMatch"
              ] and
              .delivery.syntheticTest == true and
              .delivery.externalHttpsAccepted == true and
              .delivery.destinationMatched == true and
              .delivery.exactMessageIdMatched == true and
              .delivery.uniqueDestinationMatch == true and
              .delivery.status == "SUCCESS" and
              (
                .delivery.statusCode |
                positive_integer
              ) and
              .delivery.statusCode >= 200 and
              .delivery.statusCode <= 299 and
              (
                .delivery.dwellTimeMs |
                nonnegative_integer
              ) and
              (
                .delivery.deliveryEventTimestamp |
                positive_integer
              ) and
              (.delivery.messageIdSha256 | digest) and
              (.delivery.nonceSha256 | digest) and
              (.delivery.payloadSha256 | digest) and
              (
                .verification |
                keys |
                sort
              ) == [
                "boundedPoll",
                "completePagination",
                "stackUnchanged",
                "subscriptionUnchanged",
                "topicUnchanged"
              ] and
              .verification.completePagination == true and
              .verification.boundedPoll == true and
              .verification.stackUnchanged == true and
              .verification.topicUnchanged == true and
              .verification.subscriptionUnchanged == true
            ' "${EVIDENCE_DIR}/paging-delivery.json" >/dev/null
          published_at="$(
            jq -er '.delivery.publishedAt' \
              "${EVIDENCE_DIR}/paging-delivery.json"
          )"
          delivered_at="$(
            jq -er '.delivery.deliveredAt' \
              "${EVIDENCE_DIR}/paging-delivery.json"
          )"
          observed_at="$(
            jq -er '.delivery.observedAt' \
              "${EVIDENCE_DIR}/paging-delivery.json"
          )"
          delivery_event_timestamp="$(
            jq -er '.delivery.deliveryEventTimestamp' \
              "${EVIDENCE_DIR}/paging-delivery.json"
          )"
          published_epoch="$(
            date --utc --date="${published_at}" +%s
          )"
          delivered_epoch="$(
            date --utc --date="${delivered_at}" +%s
          )"
          observed_epoch="$(
            date --utc --date="${observed_at}" +%s
          )"
          now_epoch="$(date --utc +%s)"
          canonical_utc_timestamp() {
            local value="$1"
            [[ "${value}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            test "$(
              date --utc \
                --date="${value}" \
                +'%Y-%m-%dT%H:%M:%SZ'
            )" = "${value}"
          }
          canonical_utc_timestamp "${published_at}"
          canonical_utc_timestamp "${delivered_at}"
          canonical_utc_timestamp "${observed_at}"
          (( delivered_epoch == delivery_event_timestamp / 1000 ))
          (( delivered_epoch >= published_epoch - 300 ))
          (( delivered_epoch <= published_epoch + 420 ))
          (( delivered_epoch <= observed_epoch + 300 ))
          (( observed_epoch <= delivered_epoch + 900 ))
          (( observed_epoch <= now_epoch + 300 ))
          (( now_epoch - observed_epoch <= 7200 ))
          jq -se '
            [
              .[] |
              .. |
              objects |
              keys[]
            ] |
            all(
              . != "awsAccountId" and
              . != "endpoint" and
              . != "failureFeedbackRoleArn" and
              . != "feedbackRoleArn" and
              . != "logGroupName" and
              . != "messageId" and
              . != "nonce" and
              . != "payload" and
              . != "providerResponse" and
              . != "rawLog" and
              . != "subscriptionArn" and
              . != "topicArn" and
              . != "topicKmsKeyArn"
            )
          ' "${EVIDENCE_DIR}"/*.json >/dev/null

      - name: Retain unsigned exact paging candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-paging-delivery-candidate-${{ steps.delivery.outputs.release_sha }}-${{ steps.delivery.outputs.producer_attempt }}
          path: ${{ runner.temp }}/production-paging-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  attest:
    name: Independently attest exact paging evidence
    needs: exercise
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Bind attester to the exact current workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          test "${GITHUB_REPOSITORY}" = "upgradedev/archon-datahub"
          test "${GITHUB_REF}" = "refs/heads/master"
          current_default_sha="$(
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
              jq -er '
                select(
                  .ref == "refs/heads/master" and
                  .object.type == "commit"
                ) |
                .object.sha
              '
          )"
          test "${current_default_sha}" = "${GITHUB_SHA}"

      - name: Check out the exact unprivileged attester
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify attester control plane before repository validation
        env:
          ATTEMPTS: "1"
          CONTROL_PLANE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          OUTPUT_PATH: ${{ runner.temp }}/production-paging-attester-control-plane/control-plane-security-gates.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_PLANE_SHA}"
          mkdir -p "$(dirname "${OUTPUT_PATH}")"
          bash scripts/verify-github-control-plane.sh

      - name: Resolve one immutable paging producer artifact
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts="$(
            gh api \
              --method GET \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"
          )"
          selected="$(
            jq -ceS \
              --arg currentAttempt "${GITHUB_RUN_ATTEMPT}" \
              --arg sha "${GITHUB_SHA}" \
              --arg runId "${GITHUB_RUN_ID}" '
                [
                  .[] |
                  .artifacts[] |
                  select(
                    .expired == false and
                    .workflow_run.id == ($runId | tonumber) and
                    .workflow_run.head_sha == $sha
                  ) |
                  . as $artifact |
                  (
                    try (
                      $artifact.name |
                      capture(
                        "^production-paging-delivery-candidate-" +
                        "(?<release>[0-9a-f]{40})-" +
                        "(?<attempt>[1-9][0-9]*)$"
                      )
                    )
                    catch empty
                  ) as $parsed |
                  select($parsed.release == $sha) |
                  ($parsed.attempt | tonumber) as $attempt |
                  select($attempt <= ($currentAttempt | tonumber)) |
                  {
                    artifact: $artifact,
                    producerAttempt: $attempt
                  }
                ] |
                if length == 0 then
                  error("no retained paging candidate at or before this attempt")
                else
                  group_by(.producerAttempt) as $groups |
                  if (
                    [
                      $groups[] |
                      select(length != 1)
                    ] |
                    length
                  ) != 0 then
                    error("duplicate paging candidate producer attempt")
                  else
                    $groups |
                    map(.[0]) |
                    sort_by(.producerAttempt) |
                    last
                  end
                end
              ' <<<"${artifacts}"
          )"
          candidate_name="$(jq -er '.artifact.name' <<<"${selected}")"
          release_sha="${GITHUB_SHA}"
          producer_attempt="$(
            jq -er '.producerAttempt' <<<"${selected}"
          )"
          candidate_id="$(jq -er '.artifact.id' <<<"${selected}")"
          candidate_digest="$(
            jq -er '.artifact.digest' <<<"${selected}"
          )"
          candidate_size="$(
            jq -er '.artifact.size_in_bytes' <<<"${selected}"
          )"
          (( producer_attempt <= GITHUB_RUN_ATTEMPT ))
          test "${candidate_name}" = \
            "production-paging-delivery-candidate-${release_sha}-${producer_attempt}"
          [[ "${candidate_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${candidate_size}" =~ ^[1-9][0-9]*$ ]]
          (( candidate_size <= 1048576 ))

          direct="$(
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${candidate_id}"
          )"
          jq -e \
            --arg digest "${candidate_digest}" \
            --arg name "${candidate_name}" \
            --arg sha "${GITHUB_SHA}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --argjson id "${candidate_id}" \
            --argjson size "${candidate_size}" '
              .id == $id and
              .name == $name and
              .digest == $digest and
              .size_in_bytes == $size and
              .expired == false and
              .workflow_run.id == ($runId | tonumber) and
              .workflow_run.head_sha == $sha
            ' <<<"${direct}" >/dev/null
          {
            echo "artifact_digest=${candidate_digest}"
            echo "artifact_id=${candidate_id}"
            echo "artifact_name=${candidate_name}"
            echo "artifact_size=${candidate_size}"
            echo "producer_attempt=${producer_attempt}"
            echo "release_sha=${release_sha}"
          } >>"${GITHUB_OUTPUT}"

      - name: Download the exact immutable paging candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/production-paging-attestation
          run-id: ${{ github.run_id }}

      - name: Independently validate exact paging bytes and semantics
        env:
          PRODUCER_ATTEMPT: ${{ steps.candidate.outputs.producer_attempt }}
          RELEASE_SHA: ${{ steps.candidate.outputs.release_sha }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/production-paging-attestation"
          test "${RELEASE_SHA}" = "${GITHUB_SHA}"
          (( PRODUCER_ATTEMPT <= GITHUB_RUN_ATTEMPT ))
          mapfile -t inventory < <(
            cd "${evidence_dir}"
            find . -mindepth 1 -maxdepth 1 -type f -printf '%P\n' |
              LC_ALL=C sort
          )
          expected=(
            SHA256SUMS
            attestation-predicate.json
            manifest.json
            paging-delivery.json
            paging-subject.sha256
          )
          test "${inventory[*]}" = "${expected[*]}"
          test -z "$(
            find "${evidence_dir}" \
              -mindepth 1 \
              ! -type f \
              -print \
              -quit
          )"
          while IFS= read -r file; do
            test -f "${file}"
            test ! -L "${file}"
            size="$(stat --format='%s' "${file}")"
            (( size >= 1 && size <= 524288 ))
          done < <(find "${evidence_dir}" -maxdepth 1 -type f)
          (
            cd "${evidence_dir}"
            sha256sum --check --strict SHA256SUMS
            test "$(wc -l <SHA256SUMS)" = "4"
            test "$(
              awk '{print $2}' SHA256SUMS |
                paste -sd' ' -
            )" = "attestation-predicate.json manifest.json paging-delivery.json paging-subject.sha256"
            test "$(wc -l <paging-subject.sha256)" = "2"
            test "$(
              awk '{print $2}' paging-subject.sha256 |
                paste -sd' ' -
            )" = "paging-delivery.json manifest.json"
            sha256sum --check --strict paging-subject.sha256
          )
          paging_sha="$(
            sha256sum "${evidence_dir}/paging-delivery.json" |
              awk '{print $1}'
          )"
          manifest_sha="$(
            sha256sum "${evidence_dir}/manifest.json" |
              awk '{print $1}'
          )"
          gate_receipt_sha="$(
            sha256sum \
              "${RUNNER_TEMP}/production-paging-attester-control-plane/control-plane-security-gates.json" |
              awk '{print $1}'
          )"
          canonical_gates="$(
            jq -cS . \
              "${RUNNER_TEMP}/production-paging-attester-control-plane/control-plane-security-gates.json"
          )"
          jq -e \
            --arg gateReceiptSha \
              "sha256:${gate_receipt_sha}" \
            --arg manifestSha "sha256:${manifest_sha}" \
            --arg pagingSha "sha256:${paging_sha}" \
            --arg producerAttempt "${PRODUCER_ATTEMPT}" \
            --arg release "${RELEASE_SHA}" \
            --arg runId "${GITHUB_RUN_ID}" '
              (keys | sort) == [
                "controlPlaneGateReceiptSha256",
                "releaseSha",
                "repository",
                "schemaVersion",
                "subjects",
                "verificationResult",
                "workflow"
              ] and
              .schemaVersion ==
                "archon.production-paging-delivery-attestation/v1" and
              .repository == "upgradedev/archon-datahub" and
              .releaseSha == $release and
              .controlPlaneGateReceiptSha256 ==
                $gateReceiptSha and
              (
                .workflow |
                keys |
                sort
              ) == [
                "path",
                "producerAttempt",
                "runId"
              ] and
              .workflow.path ==
                ".github/workflows/production-paging-test.yml" and
              .workflow.runId == ($runId | tonumber) and
              .workflow.producerAttempt ==
                ($producerAttempt | tonumber) and
              .subjects == {
                "manifest.json": $manifestSha,
                "paging-delivery.json": $pagingSha
              } and
              .verificationResult == "passed"
            ' "${evidence_dir}/attestation-predicate.json" >/dev/null
          jq -e \
            --arg gateReceiptSha \
              "sha256:${gate_receipt_sha}" \
            --arg pagingSha "sha256:${paging_sha}" \
            --arg producerAttempt "${PRODUCER_ATTEMPT}" \
            --arg release "${RELEASE_SHA}" \
            --arg runId "${GITHUB_RUN_ID}" '
              (keys | sort) == [
                "controlPlaneGateReceiptSha256",
                "files",
                "releaseSha",
                "repository",
                "schemaVersion",
                "subjectCount",
                "subjects",
                "workflow"
              ] and
              .schemaVersion ==
                "archon.production-paging-delivery-manifest/v1" and
              .repository == "upgradedev/archon-datahub" and
              .releaseSha == $release and
              .controlPlaneGateReceiptSha256 ==
                $gateReceiptSha and
              (
                .workflow |
                keys |
                sort
              ) == [
                "path",
                "producerAttempt",
                "runId"
              ] and
              .workflow.path ==
                ".github/workflows/production-paging-test.yml" and
              .workflow.runId == ($runId | tonumber) and
              .workflow.producerAttempt ==
                ($producerAttempt | tonumber) and
              .files == {
                "paging-delivery.json": $pagingSha
              } and
              .subjects == [
                "manifest.json",
                "paging-delivery.json"
              ] and
              .subjectCount == 2
            ' "${evidence_dir}/manifest.json" >/dev/null
          jq -e \
            --arg gateReceiptSha \
              "sha256:${gate_receipt_sha}" \
            --arg producerAttempt "${PRODUCER_ATTEMPT}" \
            --arg release "${RELEASE_SHA}" \
            --arg runId "${GITHUB_RUN_ID}" '
              def digest:
                type == "string" and
                test("^sha256:[0-9a-f]{64}$");
              def positive_integer:
                type == "number" and
                . >= 1 and
                floor == .;
              def nonnegative_integer:
                type == "number" and
                . >= 0 and
                floor == .;

              (keys | sort) == [
                "controlPlane",
                "delivery",
                "deployment",
                "releaseSha",
                "repository",
                "schemaVersion",
                "target",
                "verification",
                "workflow"
              ] and
              .schemaVersion ==
                "archon.production-paging-delivery/v1" and
              .repository == "upgradedev/archon-datahub" and
              .releaseSha == $release and
              (
                .deployment |
                keys |
                sort
              ) == [
                "stackOutputSetSha256",
                "workflowRunAttempt",
                "workflowRunId"
              ] and
              (.deployment.workflowRunId | positive_integer) and
              (
                .deployment.workflowRunAttempt |
                positive_integer
              ) and
              (.deployment.stackOutputSetSha256 | digest) and
              (
                .controlPlane |
                keys |
                sort
              ) == [
                "gateReceiptSha256",
                "gates",
                "sourceSha"
              ] and
              .controlPlane.sourceSha == $release and
              .controlPlane.gateReceiptSha256 ==
                $gateReceiptSha and
              .controlPlane.gates.sourceSha == $release and
              (
                .workflow |
                keys |
                sort
              ) == [
                "path",
                "producerAttempt",
                "runId"
              ] and
              .workflow.path ==
                ".github/workflows/production-paging-test.yml" and
              .workflow.runId == ($runId | tonumber) and
              .workflow.producerAttempt ==
                ($producerAttempt | tonumber) and
              (
                .target |
                keys |
                sort
              ) == [
                "awsAccountIdSha256",
                "endpointSha256",
                "feedbackRoleArnSha256",
                "logGroupNameSha256",
                "protocol",
                "region",
                "subscriptionArnSha256",
                "successFeedbackSampleRate",
                "topicArnSha256",
                "topicKmsEncrypted",
                "topicKmsKeyArnSha256"
              ] and
              .target.protocol == "https" and
              (
                .target.region |
                type == "string" and
                test("^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$")
              ) and
              .target.successFeedbackSampleRate == 100 and
              .target.topicKmsEncrypted == true and
              (.target.awsAccountIdSha256 | digest) and
              (.target.endpointSha256 | digest) and
              (.target.feedbackRoleArnSha256 | digest) and
              (.target.logGroupNameSha256 | digest) and
              (.target.subscriptionArnSha256 | digest) and
              (.target.topicArnSha256 | digest) and
              (.target.topicKmsKeyArnSha256 | digest) and
              (
                .delivery |
                keys |
                sort
              ) == [
                "deliveredAt",
                "deliveryEventTimestamp",
                "destinationMatched",
                "dwellTimeMs",
                "exactMessageIdMatched",
                "externalHttpsAccepted",
                "messageIdSha256",
                "nonceSha256",
                "observedAt",
                "payloadSha256",
                "publishedAt",
                "status",
                "statusCode",
                "syntheticTest",
                "uniqueDestinationMatch"
              ] and
              .delivery.syntheticTest == true and
              .delivery.externalHttpsAccepted == true and
              .delivery.destinationMatched == true and
              .delivery.exactMessageIdMatched == true and
              .delivery.uniqueDestinationMatch == true and
              .delivery.status == "SUCCESS" and
              (
                .delivery.statusCode |
                positive_integer
              ) and
              .delivery.statusCode >= 200 and
              .delivery.statusCode <= 299 and
              (
                .delivery.dwellTimeMs |
                nonnegative_integer
              ) and
              (
                .delivery.deliveryEventTimestamp |
                positive_integer
              ) and
              (.delivery.messageIdSha256 | digest) and
              (.delivery.nonceSha256 | digest) and
              (.delivery.payloadSha256 | digest) and
              (
                .verification |
                keys |
                sort
              ) == [
                "boundedPoll",
                "completePagination",
                "stackUnchanged",
                "subscriptionUnchanged",
                "topicUnchanged"
              ] and
              .verification.completePagination == true and
              .verification.boundedPoll == true and
              .verification.stackUnchanged == true and
              .verification.topicUnchanged == true and
              .verification.subscriptionUnchanged == true
            ' "${evidence_dir}/paging-delivery.json" >/dev/null
          published_at="$(
            jq -er '.delivery.publishedAt' \
              "${evidence_dir}/paging-delivery.json"
          )"
          delivered_at="$(
            jq -er '.delivery.deliveredAt' \
              "${evidence_dir}/paging-delivery.json"
          )"
          observed_at="$(
            jq -er '.delivery.observedAt' \
              "${evidence_dir}/paging-delivery.json"
          )"
          delivery_event_timestamp="$(
            jq -er '.delivery.deliveryEventTimestamp' \
              "${evidence_dir}/paging-delivery.json"
          )"
          published_epoch="$(
            date --utc --date="${published_at}" +%s
          )"
          delivered_epoch="$(
            date --utc --date="${delivered_at}" +%s
          )"
          observed_epoch="$(
            date --utc --date="${observed_at}" +%s
          )"
          now_epoch="$(date --utc +%s)"
          canonical_utc_timestamp() {
            local value="$1"
            [[ "${value}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            test "$(
              date --utc \
                --date="${value}" \
                +'%Y-%m-%dT%H:%M:%SZ'
            )" = "${value}"
          }
          canonical_utc_timestamp "${published_at}"
          canonical_utc_timestamp "${delivered_at}"
          canonical_utc_timestamp "${observed_at}"
          (( delivered_epoch == delivery_event_timestamp / 1000 ))
          (( delivered_epoch >= published_epoch - 300 ))
          (( delivered_epoch <= published_epoch + 420 ))
          (( delivered_epoch <= observed_epoch + 300 ))
          (( observed_epoch <= delivered_epoch + 900 ))
          (( observed_epoch <= now_epoch + 300 ))
          (( now_epoch - observed_epoch <= 7200 ))
          jq -se '
            [
              .[] |
              .. |
              objects |
              keys[]
            ] |
            all(
              . != "awsAccountId" and
              . != "endpoint" and
              . != "failureFeedbackRoleArn" and
              . != "feedbackRoleArn" and
              . != "logGroupName" and
              . != "messageId" and
              . != "nonce" and
              . != "payload" and
              . != "providerResponse" and
              . != "rawLog" and
              . != "subscriptionArn" and
              . != "topicArn" and
              . != "topicKmsKeyArn"
            )
          ' "${evidence_dir}"/*.json >/dev/null
          canonical_gates="$(
            jq -cS . \
              "${RUNNER_TEMP}/production-paging-attester-control-plane/control-plane-security-gates.json"
          )"
          embedded_gates="$(
            jq -cS '.controlPlane.gates' \
              "${evidence_dir}/paging-delivery.json"
          )"
          test "${embedded_gates}" = "${canonical_gates}"
          package_receipt_sha256="$(
            cd "${evidence_dir}"
            sha256sum \
              SHA256SUMS \
              attestation-predicate.json \
              manifest.json \
              paging-delivery.json \
              paging-subject.sha256 |
              sha256sum |
              awk '{print $1}'
          )"
          [[ "${package_receipt_sha256}" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "EVIDENCE_DIR=${evidence_dir}"
            echo "PACKAGE_RECEIPT_SHA256=${package_receipt_sha256}"
          } >>"${GITHUB_ENV}"

      - name: Recheck artifact and control plane before attestation
        env:
          ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          ARTIFACT_SIZE: ${{ steps.candidate.outputs.artifact_size }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          OUTPUT_PATH: ${{ runner.temp }}/production-paging-final-attester-control-plane/control-plane-security-gates.json
          PRODUCER_ATTEMPT: ${{ steps.candidate.outputs.producer_attempt }}
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          [[ "${PACKAGE_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          expected_package_receipt_sha256="${PACKAGE_RECEIPT_SHA256}"
          artifacts="$(
            gh api \
              --method GET \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"
          )"
          reselected="$(
            jq -ceS \
              --arg currentAttempt "${GITHUB_RUN_ATTEMPT}" \
              --arg sha "${CONTROL_PLANE_SHA}" \
              --arg runId "${GITHUB_RUN_ID}" \
              '
                [
                  .[] |
                  .artifacts[] |
                  select(
                    .expired == false and
                    .workflow_run.id == ($runId | tonumber) and
                    .workflow_run.head_sha == $sha
                  ) |
                  . as $artifact |
                  (
                    try (
                      $artifact.name |
                      capture(
                        "^production-paging-delivery-candidate-" +
                        "(?<release>[0-9a-f]{40})-" +
                        "(?<attempt>[1-9][0-9]*)$"
                      )
                    )
                    catch empty
                  ) as $parsed |
                  select($parsed.release == $sha) |
                  ($parsed.attempt | tonumber) as $attempt |
                  select($attempt <= ($currentAttempt | tonumber)) |
                  {
                    artifact: $artifact,
                    producerAttempt: $attempt
                  }
                ] |
                if length == 0 then
                  error("paging candidate disappeared before attestation")
                else
                  group_by(.producerAttempt) as $groups |
                  if (
                    [
                      $groups[] |
                      select(length != 1)
                    ] |
                    length
                  ) != 0 then
                    error("duplicate paging candidate producer attempt")
                  else
                    $groups |
                    map(.[0]) |
                    sort_by(.producerAttempt) |
                    last
                  end
                end
              ' <<<"${artifacts}"
          )"
          jq -e \
            --arg digest "${ARTIFACT_DIGEST}" \
            --arg name "${ARTIFACT_NAME}" \
            --argjson id "${ARTIFACT_ID}" \
            --argjson producerAttempt "${PRODUCER_ATTEMPT}" \
            --argjson size "${ARTIFACT_SIZE}" '
              .producerAttempt == $producerAttempt and
              .artifact.id == $id and
              .artifact.name == $name and
              .artifact.digest == $digest and
              .artifact.size_in_bytes == $size
            ' <<<"${reselected}" >/dev/null
          direct="$(
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          )"
          jq -e \
            --arg digest "${ARTIFACT_DIGEST}" \
            --arg name "${ARTIFACT_NAME}" \
            --arg sha "${CONTROL_PLANE_SHA}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --argjson id "${ARTIFACT_ID}" \
            --argjson size "${ARTIFACT_SIZE}" '
              .id == $id and
              .name == $name and
              .digest == $digest and
              .size_in_bytes == $size and
              .expired == false and
              .workflow_run.id == ($runId | tonumber) and
              .workflow_run.head_sha == $sha
            ' <<<"${direct}" >/dev/null
          mkdir -p "$(dirname "${OUTPUT_PATH}")"
          bash scripts/verify-github-control-plane.sh
          final_gates="$(jq -cS . "${OUTPUT_PATH}")"
          final_gate_sha256="$(
            sha256sum "${OUTPUT_PATH}" |
              awk '{print $1}'
          )"
          embedded_gates="$(
            jq -cS '.controlPlane.gates' \
              "${EVIDENCE_DIR}/paging-delivery.json"
          )"
          test "${final_gates}" = "${embedded_gates}"
          test "sha256:${final_gate_sha256}" = "$(
            jq -er '.controlPlane.gateReceiptSha256' \
              "${EVIDENCE_DIR}/paging-delivery.json"
          )"
          mapfile -t final_inventory < <(
            cd "${EVIDENCE_DIR}"
            find . -mindepth 1 -maxdepth 1 -type f -printf '%P\n' |
              LC_ALL=C sort
          )
          expected_inventory=(
            SHA256SUMS
            attestation-predicate.json
            manifest.json
            paging-delivery.json
            paging-subject.sha256
          )
          test "${final_inventory[*]}" = \
            "${expected_inventory[*]}"
          test -z "$(
            find "${EVIDENCE_DIR}" \
              -mindepth 1 \
              ! -type f \
              -print \
              -quit
          )"
          (
            cd "${EVIDENCE_DIR}"
            sha256sum --check --strict --status SHA256SUMS
            test "$(wc -l <SHA256SUMS)" = "4"
            test "$(
              awk '{print $2}' SHA256SUMS |
                paste -sd' ' -
            )" = "attestation-predicate.json manifest.json paging-delivery.json paging-subject.sha256"
            test "$(wc -l <paging-subject.sha256)" = "2"
            test "$(
              awk '{print $2}' paging-subject.sha256 |
                paste -sd' ' -
            )" = "paging-delivery.json manifest.json"
            sha256sum \
              --check \
              --strict \
              --status \
              paging-subject.sha256
          )
          final_package_receipt_sha256="$(
            cd "${EVIDENCE_DIR}"
            sha256sum \
              SHA256SUMS \
              attestation-predicate.json \
              manifest.json \
              paging-delivery.json \
              paging-subject.sha256 |
              sha256sum |
              awk '{print $1}'
          )"
          test "${final_package_receipt_sha256}" = \
            "${expected_package_receipt_sha256}"
          current_default_sha="$(
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" |
              jq -er '
                select(
                  .ref == "refs/heads/master" and
                  .object.type == "commit"
                ) |
                .object.sha
              '
          )"
          test "${current_default_sha}" = "${CONTROL_PLANE_SHA}"

      - name: Attest the two exact paging subjects
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: ${{ runner.temp }}/production-paging-attestation/paging-subject.sha256
          predicate-type: https://archon.datahub.dev/attestations/production-paging-delivery/v1
          predicate-path: ${{ runner.temp }}/production-paging-attestation/attestation-predicate.json

      - name: Verify the persisted signed paging attestation
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${ATTESTATION_ID}" =~ ^[1-9][0-9]*$ ]]
          test "${ATTESTATION_URL}" = \
            "https://github.com/${GITHUB_REPOSITORY}/attestations/${ATTESTATION_ID}"
          test -f "${ATTESTATION_BUNDLE_PATH}"
          test ! -L "${ATTESTATION_BUNDLE_PATH}"
          bundle_size="$(
            stat --format='%s' "${ATTESTATION_BUNDLE_PATH}"
          )"
          (( bundle_size >= 1 && bundle_size <= 16777216 ))
          verification_dir="$(
            mktemp -d "${RUNNER_TEMP}/production-paging-verification.XXXXXX"
          )"
          cleanup() {
            rm -rf -- "${verification_dir}"
          }
          trap cleanup EXIT
          paging_sha="$(
            sha256sum "${EVIDENCE_DIR}/paging-delivery.json" |
              awk '{print $1}'
          )"
          manifest_sha="$(
            sha256sum "${EVIDENCE_DIR}/manifest.json" |
              awk '{print $1}'
          )"
          validate_verification_result() {
            local output_path="$1"
            jq -e \
              --slurpfile predicate \
                "${EVIDENCE_DIR}/attestation-predicate.json" \
              --arg manifestSha "${manifest_sha}" \
              --arg pagingSha "${paging_sha}" \
              --arg predicateType "${PREDICATE_TYPE}" '
                type == "array" and
                length >= 1 and
                any(
                  .[];
                  .verificationResult.statement.predicateType ==
                    $predicateType and
                  .verificationResult.statement.predicate ==
                    $predicate[0] and
                  (
                    [
                      .verificationResult.statement.subject[] |
                      {
                        name,
                        digest
                      }
                    ] |
                    sort_by(.name)
                  ) == [
                    {
                      name: "manifest.json",
                      digest: {
                        sha256: $manifestSha
                      }
                    },
                    {
                      name: "paging-delivery.json",
                      digest: {
                        sha256: $pagingSha
                      }
                    }
                  ]
                )
              ' "${output_path}" >/dev/null
          }
          verify_subject() {
            local subject_path="$1"
            local output_path="$2"
            local attempt
            for attempt in {1..12}; do
              if gh attestation verify \
                "${subject_path}" \
                --repo "${GITHUB_REPOSITORY}" \
                --predicate-type "${PREDICATE_TYPE}" \
                --signer-workflow \
                  "${GITHUB_REPOSITORY}/.github/workflows/production-paging-test.yml" \
                --source-digest "${GITHUB_SHA}" \
                --source-ref "${GITHUB_REF}" \
                --deny-self-hosted-runners \
                --format json \
                >"${output_path}" &&
                validate_verification_result "${output_path}"; then
                return 0
              fi
              if (( attempt < 12 )); then
                sleep 5
              fi
            done
            echo "::error::Persisted paging attestation could not be verified"
            return 1
          }
          verify_subject \
            "${EVIDENCE_DIR}/paging-delivery.json" \
            "${verification_dir}/paging.json"
          verify_subject \
            "${EVIDENCE_DIR}/manifest.json" \
            "${verification_dir}/manifest.json"

      - name: Confirm exact attested bytes before retention
        run: |
          set -euo pipefail
          [[ "${PACKAGE_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          mapfile -t inventory < <(
            cd "${EVIDENCE_DIR}"
            find . -mindepth 1 -maxdepth 1 -type f -printf '%P\n' |
              LC_ALL=C sort
          )
          expected=(
            SHA256SUMS
            attestation-predicate.json
            manifest.json
            paging-delivery.json
            paging-subject.sha256
          )
          test "${inventory[*]}" = "${expected[*]}"
          test -z "$(
            find "${EVIDENCE_DIR}" \
              -mindepth 1 \
              ! -type f \
              -print \
              -quit
          )"
          (
            cd "${EVIDENCE_DIR}"
            sha256sum --check --strict --status SHA256SUMS
            sha256sum \
              --check \
              --strict \
              --status \
              paging-subject.sha256
          )
          retained_receipt_sha256="$(
            cd "${EVIDENCE_DIR}"
            sha256sum \
              SHA256SUMS \
              attestation-predicate.json \
              manifest.json \
              paging-delivery.json \
              paging-subject.sha256 |
              sha256sum |
              awk '{print $1}'
          )"
          test "${retained_receipt_sha256}" = \
            "${PACKAGE_RECEIPT_SHA256}"

      - name: Retain exact attested paging evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-paging-delivery-${{ steps.candidate.outputs.release_sha }}-${{ steps.candidate.outputs.producer_attempt }}
          path: ${{ runner.temp }}/production-paging-attestation
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
