name: Retry AWS incident recovery authorization cleanup

on:
  workflow_run:
    workflows:
      - Recover sealed AWS staging IAM incident
    types:
      - completed
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact lowercase 40-character current master SHA
        required: true
        type: string
      confirmation:
        description: Type REVOKE SEALED INCIDENT POLICY
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: archon-aws-control-plane
  cancel-in-progress: false

jobs:
  validate:
    name: Bind safe cleanup retry to current master
    if: >-
      github.repository == 'upgradedev/archon-datahub' &&
      github.ref == 'refs/heads/master' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.path ==
            '.github/workflows/aws-incident-recovery.yml' &&
          github.event.workflow_run.head_repository.full_name ==
            'upgradedev/archon-datahub' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.status == 'completed'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.confirmation == 'REVOKE SEALED INCIDENT POLICY'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      control_plane_sha: ${{ steps.source.outputs.control_plane_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate immutable cleanup control plane
        id: source
        env:
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
          CONTROL_PLANE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "${CONTROL_PLANE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${TRIGGER_EVENT}" == "workflow_dispatch" ]]; then
            test "${CONFIRMATION_INPUT}" = "REVOKE SEALED INCIDENT POLICY"
          fi
          test "${GITHUB_SHA}" = "${CONTROL_PLANE_SHA}"
          test "$(git rev-parse HEAD)" = "${CONTROL_PLANE_SHA}"
          test "$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
            --jq '.object.sha')" = "${CONTROL_PLANE_SHA}"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          echo "control_plane_sha=${CONTROL_PLANE_SHA}" >>"${GITHUB_OUTPUT}"

  cleanup:
    name: Hold recovery-role lock through cleanup
    needs: validate
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/aws-incident-recovery-driver.yml
    with:
      operation: cleanup
      expected_head_sha: ${{ needs.validate.outputs.control_plane_sha }}
      confirmation: REVOKE SEALED INCIDENT POLICY
    secrets: inherit