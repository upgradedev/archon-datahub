                  ) |
                  {
                    name: .name,
                    digest: {sha256: .sha}
                  }
                ] |
                sort_by(.name)
              ' <"${directory}/${subject_inventory}"
            )"
            expected_predicate="$(
              jq -cS . "${directory}/${predicate_file}"
            )"
            index=0
            while read -r subject_sha subject_name; do
              index=$((index + 1))
              subject_path="${directory}/${subject_name}"
              raw="${work}/verification-${index}.json"
              gh attestation verify "${subject_path}" \
                --repo "${GITHUB_REPOSITORY}" \
                --signer-workflow \
                  "github.com/${GITHUB_REPOSITORY}/${signer_workflow}" \
                --signer-digest "${RELEASE_SHA}" \
                --source-digest "${RELEASE_SHA}" \
                --source-ref refs/heads/master \
                --predicate-type "${predicate_type}" \
                --deny-self-hosted-runners \
                --format json >"${raw}"
              jq -e \
                --arg predicateType "${predicate_type}" \
                --arg subjectName "${subject_name}" \
                --arg subjectSha "${subject_sha}" \
                --argjson expectedPredicate "${expected_predicate}" \
                --argjson expectedSubjects "${expected_subjects}" '
                  [
                    .[] |
                    select(
                      .verificationResult.statement.predicateType ==
                        $predicateType and
                      .verificationResult.statement.predicate ==
                        $expectedPredicate and
                      (
                        .verificationResult.statement.subject |
                        sort_by(.name)
                      ) == $expectedSubjects and
                      any(
                        .verificationResult.statement.subject[];
                        .name == $subjectName and
                        .digest.sha256 == $subjectSha
                      )
                    )
                  ] |
                  unique_by(.verificationResult.statement) |
                  length == 1
                ' "${raw}" >/dev/null || {
                echo "::error::Attester did not recover one exact full-subject attestation"
                exit 1
              }
              rm -- "${raw}"
            done <"${directory}/${subject_inventory}"
          done <"${SOURCE_ROWS}"
          jq -se '
            [.[].key] == [
              "deployment",
              "availability",
              "provision",
              "rotate",
              "deactivate",
              "reactivate",
              "journey"
            ] and
            (map(.runId) | length) == 7 and
            (map(.runId) | length) == (map(.runId) | unique | length) and
            all(.[];
              (.runId | type) == "number" and
              .runId > 0 and
              (.currentRunAttempt | type) == "number" and
              .currentRunAttempt > 0
            )
          ' "${current_attempt_rows}" >/dev/null

      - name: Independently repeat credentialless public access probes
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          umask 077
          test -z "${GH_TOKEN:-}"
          root="${RUNNER_TEMP}/submission-project-access-attestation"
          public="${RUNNER_TEMP}/submission-project-access-attester-public"
          test ! -e "${public}"
          mkdir --mode=0700 "${public}"
          application_url="$(
            jq -er '.facts.applicationUrl' "${root}/proofs/SQ3.json"
          )"
          repository_url="$(
            jq -er '.facts.repositoryUrl' "${root}/proofs/SQ5.json"
          )"
          release_url="$(
            jq -er '.facts.releaseUrl' "${root}/proofs/SQ5.json"
          )"
          license_url="$(
            jq -er '.facts.licenseUrl' "${root}/proofs/SQ5.json"
          )"

          public_get() {
            local key="$1"
            local url="$2"
            local maximum="$3"
            local body="${public}/${key}.body"
            local meta="${public}/${key}.meta"
            curl \
              --silent \
              --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --max-redirs 0 \
              --connect-timeout 15 \
              --max-time 120 \
              --header 'Accept: application/json, text/html;q=0.9, */*;q=0.1' \
              --output "${body}" \
              --write-out \
                '%{http_code}\n%{num_redirects}\n%{url_effective}\n%{ssl_verify_result}\n%{size_download}\n' \
              "${url}" >"${meta}"
            test "$(sed -n '1p' "${meta}")" = "200"
            test "$(sed -n '2p' "${meta}")" = "0"
            test "$(sed -n '3p' "${meta}")" = "${url}"
            test "$(sed -n '4p' "${meta}")" = "0"
            size="$(sed -n '5p' "${meta}")"
            [[ "${size}" =~ ^[0-9]+$ ]]
            test "${size}" -gt 0
            test "${size}" -le "${maximum}"
            test "$(stat -c '%s' "${body}")" = "${size}"
          }

          public_get app "${application_url}/" 10485760
          public_get \
            runtime \
            "${application_url}/runtime-config.json" \
            65536
          public_get \
            profiles \
            "${application_url}/api/runtime-profiles" \
            131072
          public_get repository "${repository_url}" 10485760
          public_get release "${release_url}" 10485760
          public_get license "${license_url}" 10485760
          public_get \
            license_api \
            "https://api.github.com/repos/upgradedev/archon-datahub/license?ref=${RELEASE_SHA}" \
            1048576
          public_get \
            source_archive \
            "https://codeload.github.com/upgradedev/archon-datahub/tar.gz/${RELEASE_SHA}" \
            134217728
          cmp --silent \
            "${public}/runtime.body" \
            "${RUNNER_TEMP}/submission-project-access-upstream-attester/journey/source/production-runtime-config.json"
          jq -e '
            (keys | sort) == [
              "autoSelection","profiles","schemaVersion","serverTime"
            ] and
            .schemaVersion == "archon.runtime-profiles/v1" and
            (.serverTime | fromdateiso8601) and
            .autoSelection == "cloud" and
            (.profiles | length) == 2 and
            ([.profiles[].profileId] | sort) == ["cloud","core"] and
            all(.profiles[];
              (.capabilities | keys) == [
                "agentContextKit","analyticsAgent","dataHubSkills",
                "mcpGovernedWrite","mcpRead"
              ] and
              all(.capabilities[]; . == true) and
              (.generation | type) == "string" and
              (.generation | length) >= 1 and
              (.checkedAt | fromdateiso8601) and
              (.capabilityDigest | test("^sha256:[0-9a-f]{64}$"))
            ) and
            ([.profiles[] | select(.profileId == "cloud") | .availability])
              == ["READY"] and
            ([.profiles[] | select(.profileId == "core") | .availability])
              == ["LAUNCHABLE"]
          ' "${public}/profiles.body" >/dev/null
          attester_deployment="${RUNNER_TEMP}/submission-project-access-upstream-attester/deployment/source/deployment-evidence.json"
          attester_observation="${RUNNER_TEMP}/submission-project-access-upstream-attester/deployment/source/observation.json"
          observation_sha256="$(
            sha256sum "${attester_observation}" | awk '{print $1}'
          )"
          jq -e \
            --arg release "${RELEASE_SHA}" \
            --arg applicationUrl "${application_url}" \
            --arg observationSha256 "${observation_sha256}" '
              .schemaVersion == "archon.aws-deployment-evidence/v2" and
              .stage == "production" and
              .releaseSha == $release and
              .applicationUrl == $applicationUrl and
              .promotion.policy == "build-once-promote-exact-artifacts" and
              all(
                .promotion[
                  "webArtifactDigest",
                  "lambdaArtifactDigest",
                  "cloudRuntimeReleaseDigest",
                  "coreCapabilityDigest",
                  "coreImageManifestDigest"
                ];
                test("^sha256:[0-9a-f]{64}$")
              ) and
              .verification == {
                result:"passed",
                zeroIdleCore:true,
                httpBoundary:true,
                securityHeaders:true,
                directApiRejected:true,
                canonicalHostEnforced:true,
                observationSha256:$observationSha256
              } and
              .secretsProjected == false
            ' "${attester_deployment}" >/dev/null
          jq -e --arg release "${RELEASE_SHA}" '
            .schemaVersion == "archon.lean-runtime-observation/v1" and
            .stage == "production" and
            .releaseSha == $release and
            .topology.coreIdle == true and
            .topology.legacyAlwaysOnRuntimeAbsent == true and
            (.topology.stackFingerprintSha256 |
              test("^[0-9a-f]{64}$")) and
            (.runtime.cloudImageDigest |
              test("^sha256:[0-9a-f]{64}$")) and
            .runtime.functions == 6 and
            .runtime.imageFunctions == 3 and
            .runtime.sessionTables == 2 and
            .runtime.privateVersionedBuckets == 2 and
            .security.rawIdentifiersProjected == false
          ' "${attester_observation}" >/dev/null
          export PUBLIC_ROOT="${public}"
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import tarfile

          root = pathlib.Path(os.environ["PUBLIC_ROOT"])
          repository_root = pathlib.Path.cwd()
          license_record = json.loads(
              (root / "license_api.body").read_bytes()
          )
          content = license_record.get("content")
          if (
              license_record.get("path") != "LICENSE"
              or license_record.get("license", {}).get("spdx_id")
              != "Apache-2.0"
              or not isinstance(content, str)
              or base64.b64decode(content)
              != (repository_root / "LICENSE").read_bytes()
          ):
              raise SystemExit("attester license probe is invalid")
          tracked = {
              item.decode("utf-8")
              for item in subprocess.run(
                  ["git", "ls-files", "-z"],
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout.split(b"\0")
              if item
          }
          archived: dict[str, bytes] = {}
          total = 0
          with tarfile.open(
              root / "source_archive.body", mode="r:gz"
          ) as bundle:
              members = bundle.getmembers()
              roots = {
                  member.name.split("/", 1)[0]
                  for member in members
                  if member.name
              }
              if not members or len(roots) != 1:
                  raise SystemExit("attester archive root is invalid")
              prefix = next(iter(roots)) + "/"
              for member in members:
                  if member.isdir():
                      continue
                  if (
                      not member.name.startswith(prefix)
                      or not member.isfile()
                      or member.issym()
                      or member.islnk()
                      or member.size > 20 * 1024 * 1024
                  ):
                      raise SystemExit(
                          f"unsafe attester archive member: {member.name}"
                      )
                  relative = member.name.removeprefix(prefix)
                  if (
                      not relative
                      or "\\" in relative
                      or any(
                          part in ("", ".", "..")
                          for part in pathlib.PurePosixPath(
                              relative
                          ).parts
                      )
                      or relative in archived
                  ):
                      raise SystemExit(
                          f"non-canonical attester source: {relative}"
                      )
                  stream = bundle.extractfile(member)
                  if stream is None:
                      raise SystemExit(
                          f"unreadable attester source: {relative}"
                      )
                  data = stream.read()
                  total += len(data)
                  if total > 128 * 1024 * 1024:
                      raise SystemExit(
                          "attester public source exceeds total bound"
                      )
                  archived[relative] = data
          if set(archived) != tracked:
              raise SystemExit(
                  "attester public source tree is incomplete"
              )
          for relative, data in archived.items():
              local = repository_root / relative
              metadata = local.lstat()
              if (
                  not stat.S_ISREG(metadata.st_mode)
                  or stat.S_ISLNK(metadata.st_mode)
                  or local.read_bytes() != data
              ):
                  raise SystemExit(
                      f"attester source mismatch: {relative}"
                  )
          PY

      - name: Recheck cross-source semantics and canonical state before attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          AVAILABILITY_RUN_ID: ${{ inputs.availability_run_id }}
          PROVISION_RUN_ID: ${{ inputs.provision_run_id }}
          ROTATE_RUN_ID: ${{ inputs.rotate_run_id }}
          DEACTIVATE_RUN_ID: ${{ inputs.deactivate_run_id }}
          REACTIVATE_RUN_ID: ${{ inputs.reactivate_run_id }}
          JUDGE_JOURNEY_RUN_ID: ${{ inputs.judge_journey_run_id }}
          PROJECT_ACCESS_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          PROJECT_ACCESS_ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
          PROJECT_ACCESS_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          current_release="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
              --jq '.object.sha'
          )"
          test "${current_release}" = "${RELEASE_SHA}"

          current_artifact="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROJECT_ACCESS_ARTIFACT_ID}"
          )"
          jq -e \
            --arg release "${RELEASE_SHA}" \
            --arg name "${PROJECT_ACCESS_ARTIFACT_NAME}" \
            --arg digest "${PROJECT_ACCESS_ARTIFACT_DIGEST}" \
            --argjson artifactId "${PROJECT_ACCESS_ARTIFACT_ID}" \
            --argjson runId "${GITHUB_RUN_ID}" '
              .id == $artifactId and
              .name == $name and
              .digest == $digest and
              .expired == false and
              (.size_in_bytes | type) == "number" and
              .size_in_bytes > 0 and
              .size_in_bytes <= 52428800 and
              .workflow_run.id == $runId and
              .workflow_run.head_sha == $release
            ' <<<"${current_artifact}" >/dev/null

          export PROJECT_ACCESS_ROOT="${RUNNER_TEMP}/submission-project-access-attestation"
          export UPSTREAM_ROOT="${RUNNER_TEMP}/submission-project-access-upstream-attester"
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import pathlib
          import re
          import urllib.parse

          project = pathlib.Path(os.environ["PROJECT_ACCESS_ROOT"])
          upstream = pathlib.Path(os.environ["UPSTREAM_ROOT"])
          release = os.environ["RELEASE_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]

          def load(path: pathlib.Path) -> object:
              return json.loads(path.read_bytes())

          def facts(proof: str) -> dict:
              return load(project / "proofs" / f"{proof}.json")[
                  "facts"
              ]

          def sha(path: pathlib.Path) -> str:
              return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()

          def instant(value: str) -> dt.datetime:
              return dt.datetime.fromisoformat(
                  value.removesuffix("Z") + "+00:00"
              )

          sq3 = facts("SQ3")
          sq4 = facts("SQ4")
          sq5 = facts("SQ5")
          deployment_dir = upstream / "deployment" / "source"
          availability_dir = upstream / "availability" / "source"
          journey_dir = upstream / "journey" / "source"
          deployment = load(
              deployment_dir / "deployment-evidence.json"
          )
          deployment_observation = load(
              deployment_dir / "observation.json"
          )
          deployment_binding = load(
              upstream / "deployment" / "lean-verification" /
              "binding.json"
          )
          runtime = load(
              journey_dir / "production-runtime-config.json"
          )
          availability = load(availability_dir / "evidence.json")
          availability_observation = load(
              availability_dir / "observation.json"
          )
          availability_binding = load(
              upstream / "availability" / "lean-verification" /
              "binding.json"
          )
          journey_manifest = load(journey_dir / "manifest.json")
          journey_predicate = load(
              journey_dir / "attestation-predicate.json"
          )
          journey_deployment = load(
              journey_dir / "deployment-binding.json"
          )
          journey_lifecycle = load(
              journey_dir / "judge-user-lifecycle.json"
          )
          now = dt.datetime.now(dt.timezone.utc)
          availability_observed = instant(availability.get("observedAt"))
          availability_observation_observed = instant(
              availability_observation.get("observedAt")
          )
          parsed = urllib.parse.urlsplit(sq3["applicationUrl"])
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.path not in ("", "/")
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("retained application URL is invalid")
          application_url = f"https://{parsed.hostname.lower()}"
          application_origin_sha = hashlib.sha256(
              application_url.encode("utf-8")
          ).hexdigest()
          auth = runtime.get("auth")
          if not isinstance(auth, dict) or set(auth) != {
              "authorizationEndpoint",
              "tokenEndpoint",
              "logoutEndpoint",
              "clientId",
              "redirectUri",
              "logoutUri",
              "scopes",
          }:
              raise SystemExit("retained runtime auth keys are invalid")

          def auth_endpoint(value: object, path: str, label: str) -> str:
              if not isinstance(value, str):
                  raise SystemExit(f"{label} is not a string")
              parsed = urllib.parse.urlsplit(value)
              if (
                  parsed.scheme != "https"
                  or not parsed.hostname
                  or parsed.username is not None
                  or parsed.password is not None
                  or parsed.port not in (None, 443)
                  or parsed.path != path
                  or parsed.query
                  or parsed.fragment
              ):
                  raise SystemExit(f"{label} is not an exact HTTPS endpoint")
              return f"https://{parsed.hostname.lower()}"

          authorization_origin = auth_endpoint(
              auth["authorizationEndpoint"],
              "/oauth2/authorize",
              "retained authorization endpoint",
          )
          token_origin = auth_endpoint(
              auth["tokenEndpoint"],
              "/oauth2/token",
              "retained token endpoint",
          )
          logout_origin = auth_endpoint(
              auth["logoutEndpoint"],
              "/logout",
              "retained logout endpoint",
          )
          expected_availability_binding = {
              "workflowPath": ".github/workflows/availability.yml",
              "runId": sq3["observation"]["availabilityRunId"],
              "runAttempt": sq3["observation"][
                  "availabilityRunAttempt"
              ],
              "artifactId": sq3["observation"]["availabilityArtifactId"],
              "artifactName": sq3["observation"][
                  "availabilityArtifactName"
              ],
              "artifactDigest": sq3["observation"][
                  "availabilityArtifactDigest"
              ],
              "predicateType": sq3["observation"][
                  "availabilityPredicateType"
              ],
              "predicateDigest": sq3["observation"][
                  "availabilityPredicateDigest"
              ],
          }
          deployment_verification = deployment.get("verification", {})
          deployment_promotion = deployment.get("promotion", {})
          if (
              sq3["applicationUrl"] != application_url
              or sq4["applicationUrl"] != application_url
              or deployment_binding != sq3["deployment"]
              or journey_deployment != sq3["deployment"]
              or journey_deployment != sq4["deployment"]
              or deployment.get("schemaVersion")
              != "archon.aws-deployment-evidence/v2"
              or deployment.get("stage") != "production"
              or deployment.get("releaseSha") != release
              or deployment.get("deploymentRunId")
              != sq3["deployment"]["runId"]
              or deployment.get("applicationUrl") != application_url
              or deployment.get("secretsProjected") is not False
              or deployment_promotion.get("policy")
              != "build-once-promote-exact-artifacts"
              or any(
                  re.fullmatch(
                      r"sha256:[0-9a-f]{64}",
                      str(deployment_promotion.get(name, "")),
                  )
                  is None
                  for name in (
                      "webArtifactDigest",
                      "lambdaArtifactDigest",
                      "cloudRuntimeReleaseDigest",
                      "coreCapabilityDigest",
                      "coreImageManifestDigest",
                  )
              )
              or deployment_verification
              != {
                  "result": "passed",
                  "zeroIdleCore": True,
                  "httpBoundary": True,
                  "securityHeaders": True,
                  "directApiRejected": True,
                  "canonicalHostEnforced": True,
                  "observationSha256": sha(
                      deployment_dir / "observation.json"
                  ).removeprefix("sha256:"),
              }
              or deployment_observation.get("schemaVersion")
              != "archon.lean-runtime-observation/v1"
              or deployment_observation.get("stage") != "production"
              or deployment_observation.get("releaseSha") != release
              or deployment_observation.get("topology", {}).get(
                  "coreIdle"
              )
              is not True
              or deployment_observation.get("topology", {}).get(
                  "legacyAlwaysOnRuntimeAbsent"
              )
              is not True
              or deployment_observation.get("security", {}).get(
                  "rawIdentifiersProjected"
              )
              is not False
              or re.fullmatch(
                  r"sha256:[0-9a-f]{64}",
                  str(
                      deployment_observation.get("runtime", {}).get(
                          "cloudImageDigest", ""
                      )
                  ),
              )
              is None
              or set(runtime) != {"schemaVersion", "auth", "demoQuery"}
              or runtime.get("schemaVersion") != 1
              or authorization_origin != token_origin
              or authorization_origin != logout_origin
              or not isinstance(auth["clientId"], str)
              or re.fullmatch(r"[A-Za-z0-9]{8,128}", auth["clientId"])
              is None
              or auth["redirectUri"] != f"{application_url}/"
              or auth["logoutUri"] != f"{application_url}/"
              or auth["scopes"]
              != ["openid", "email", "profile", "archon/approve"]
              or not isinstance(runtime["demoQuery"], str)
              or not runtime["demoQuery"].strip()
              or journey_lifecycle != sq4["judgeUserLifecycle"]
              or availability_binding != expected_availability_binding
              or availability.get("schemaVersion")
              != "archon.production-availability/v2"
              or availability.get("releaseSha") != release
              or availability.get("observedAt")
              != sq3["observation"]["availabilityObservedAt"]
              or availability.get("checks")
              != {
                  "publicSpa": True,
                  "runtimeProfiles": True,
                  "securityHeaders": True,
                  "leanAwsControls": True,
                  "coreIdle": True,
              }
              or re.fullmatch(
                  r"sha256:[0-9a-f]{64}",
                  str(availability.get("profileResponseDigest", "")),
              )
              is None
              or availability.get("rawIdentifiersRetained") is not False
              or availability.get("result") != "passed"
              or availability_observation.get("schemaVersion")
              != "archon.lean-runtime-observation/v1"
              or availability_observation.get("stage") != "production"
              or availability_observation.get("releaseSha") != release
              or availability_observation.get("topology", {}).get(
                  "coreIdle"
              )
              is not True
              or availability_observation.get("topology", {}).get(
                  "legacyAlwaysOnRuntimeAbsent"
              )
              is not True
              or availability_observation.get("security", {}).get(
                  "rawIdentifiersProjected"
              )
              is not False
              or availability_observation_observed > availability_observed
              or availability_observed - availability_observation_observed
              > dt.timedelta(minutes=5)
              or availability_observation_observed
              > now + dt.timedelta(minutes=5)
              or now - availability_observation_observed
              > dt.timedelta(hours=7)
              or availability_observed > now + dt.timedelta(minutes=5)
              or now - availability_observed > dt.timedelta(hours=7)
              or journey_manifest.get("releaseSha") != release
              or journey_manifest.get("source", {}).get("runId")
              != sq4["freshJudgeJourney"]["runId"]
              or journey_manifest.get("source", {}).get("runAttempt")
              != sq4["freshJudgeJourney"]["runAttempt"]
              or journey_manifest.get("journey", {}).get(
                  "identityDigest"
              )
              != sq4["judgeUserLifecycle"]["identityDigest"]
              or journey_manifest.get("journey", {}).get(
                  "cognitoSubjectDigest"
              )
              != sq4["judgeUserLifecycle"]["cognitoSubjectDigest"]
              or journey_manifest.get("journey", {}).get(
                  "terminalReceiptDigest"
              )
              != sq4["freshJudgeJourney"]["terminalReceiptDigest"]
              or journey_predicate.get("checks", {}).get(
                  "identityIsFresh"
              )
              is not True
              or journey_predicate.get("checks", {}).get(
                  "loginSucceeded"
              )
              is not True
              or journey_predicate.get("checks", {}).get(
                  "startSucceeded"
              )
              is not True
              or journey_predicate.get("checks", {}).get(
                  "statusPollingSucceeded"
              )
              is not True
              or journey_predicate.get("checks", {}).get(
                  "terminalReceiptVerified"
              )
              is not True
              or journey_predicate.get("checks", {}).get(
                  "logoutIsolationVerified"
              )
              is not True
              or sq4["testingInstructionsPath"]
              != "docs/JUDGE_TESTING.md"
              or sq4["testingInstructionsDigest"]
              != sha(pathlib.Path("docs/JUDGE_TESTING.md"))
              or sq4["freeAccess"] is not True
              or sq4["accessValidThrough"]
              != "2026-08-31T21:00:00Z"
              or sq5["repositoryUrl"]
              != "https://github.com/upgradedev/archon-datahub"
              or sq5["releaseUrl"]
              != (
                  "https://github.com/upgradedev/archon-datahub/tree/"
                  + release
              )
              or sq5["licenseSpdx"] != "Apache-2.0"
              or sq5["completeSource"] is not True
          ):
              raise SystemExit("retained cross-source facts are invalid")
          operations = sq4["judgeUserLifecycle"]["operations"]
          names = ["provision", "rotate", "deactivate", "reactivate"]
          results = [
              "provisioned-and-readback-verified",
              "rotated-and-readback-verified",
              "deactivated-and-readback-verified",
              "reactivated-and-readback-verified",
          ]
          times = []
          for index, name in enumerate(names):
              receipt = load(
                  upstream / name / "source" /
                  "operation-receipt.json"
              )
              operation = operations[index]
              if (
                  operation["operation"] != name
                  or operation["result"] != results[index]
                  or operation["runId"] != receipt["source"]["runId"]
                  or operation["runAttempt"]
                  != receipt["source"]["runAttempt"]
                  or operation["identityDigest"]
                  != "sha256:" + receipt["identityDigest"]
                  or operation["cognitoSubjectDigest"]
                  != "sha256:" + receipt["cognitoSubjectDigest"]
                  or operation["applicationOriginSha256"]
                  != application_origin_sha
                  or operation["operationReceiptDigest"]
                  != sha(
                      upstream / name / "source" /
                      "operation-receipt.json"
                  )
              ):
                  raise SystemExit(
                      f"{name} retained lifecycle fact is invalid"
                  )
              times.append(instant(operation["performedAt"]))
          if (
              times != sorted(times)
              or len(set(times)) != 4
              or times[-1] >= instant(
                  sq4["freshJudgeJourney"]["journeyStartedAt"]
              )
              or now - instant(
                  sq4["freshJudgeJourney"]["journeyCompletedAt"]
              )
              > dt.timedelta(hours=24)
          ):
              raise SystemExit("retained lifecycle chronology is invalid")
          PY

          deployment_runs="$(
            gh api \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=master&event=workflow_dispatch&per_page=100"
          )"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --argjson selected "${DEPLOYMENT_RUN_ID}" '
              [
                .[] |
                .workflow_runs[] |
                select(
                  .path == ".github/workflows/deploy.yml" and
                  .event == "workflow_dispatch" and
                  .head_branch == "master" and
                  .head_repository.full_name == $repository
                )
              ] as $deployments |
              (
                [
                  $deployments[] |
                  select(
                    .status == "completed" and
                    .conclusion == "success"
                  )
                ] |
                sort_by(.id, .run_attempt) |
                last |
                .id
              ) == $selected and
              all($deployments[]; .id <= $selected)
            ' <<<"${deployment_runs}" >/dev/null
          availability_runs="$(
            gh api \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/availability.yml/runs?branch=master&per_page=100"
          )"
          test "$(
            jq -er \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg release "${RELEASE_SHA}" '
                [
                  .[] |
                  .workflow_runs[] |
                  select(
                    .path == ".github/workflows/availability.yml" and
                    (
                      .event == "workflow_dispatch" or
                      .event == "schedule"
                    ) and
                    .status == "completed" and
                    .conclusion == "success" and
                    .head_sha == $release and
                    .head_branch == "master" and
                    .head_repository.full_name == $repository
                  )
                ] |
                sort_by(.id, .run_attempt) |
                last |
                .id
              ' <<<"${availability_runs}"
          )" = "${AVAILABILITY_RUN_ID}"

          lifecycle_runs="$(
            gh api \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/judge-user.yml/runs?branch=master&event=workflow_dispatch&per_page=100"
          )"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release "${RELEASE_SHA}" \
            --argjson provision "${PROVISION_RUN_ID}" \
            --argjson rotate "${ROTATE_RUN_ID}" \
            --argjson deactivate "${DEACTIVATE_RUN_ID}" \
            --argjson reactivate "${REACTIVATE_RUN_ID}" '
              [
                .[] |
                .workflow_runs[] |
                select(
                  .path == ".github/workflows/judge-user.yml" and
                  .event == "workflow_dispatch" and
                  .head_sha == $release and
                  .head_branch == "master" and
                  .head_repository.full_name == $repository and
                  (
                    .display_title |
                    test(
                      "^(provision|rotate|deactivate|reactivate) " +
                      "judge access in production$"
                    )
                  )
                )
              ] as $production |
              (
                [
                  $production[] |
                  {
                    id: .id,
                    operation: (
                      .display_title |
                      capture(
                        "^(?<operation>provision|rotate|" +
                        "deactivate|reactivate) "
                      ).operation
                    ),
                    status: .status,
                    conclusion: .conclusion
                  }
                ] |
                sort_by(.id) |
                .[-4:]
              ) == [
                {
                  id: $provision,
                  operation: "provision",
                  status: "completed",
                  conclusion: "success"
                },
                {
                  id: $rotate,
                  operation: "rotate",
                  status: "completed",
                  conclusion: "success"
                },
                {
                  id: $deactivate,
                  operation: "deactivate",
                  status: "completed",
                  conclusion: "success"
                },
                {
                  id: $reactivate,
                  operation: "reactivate",
                  status: "completed",
                  conclusion: "success"
                }
              ] and
              all($production[]; .id <= $reactivate)
            ' <<<"${lifecycle_runs}" >/dev/null

          journey_runs="$(
            gh api \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/submission-judge-journey.yml/runs?branch=master&event=workflow_dispatch&per_page=100"
          )"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release "${RELEASE_SHA}" \
            --argjson selected "${JUDGE_JOURNEY_RUN_ID}" '
              [
                .[] |
                .workflow_runs[] |
                select(
                  .path ==
                    ".github/workflows/submission-judge-journey.yml" and
                  .event == "workflow_dispatch" and
                  .head_sha == $release and
                  .head_branch == "master" and
                  .head_repository.full_name == $repository
                )
              ] as $journeys |
              (
                [
                  $journeys[] |
                  select(
                    .status == "completed" and
                    .conclusion == "success"
                  )
                ] |
                sort_by(.id, .run_attempt) |
                last |
                .id
              ) == $selected and
              all($journeys[]; .id <= $selected)
            ' <<<"${journey_runs}" >/dev/null

          source_rows="$(
            printf '%s/%s' \
              "${RUNNER_TEMP}/submission-project-access-upstream-attester" \
              sources.ndjson
          )"
          current_attempt_rows="$(
            printf '%s/%s' \
              "${RUNNER_TEMP}/submission-project-access-upstream-attester" \
              current-attempts.ndjson
          )"
          jq -se \
            --argjson deployment "${DEPLOYMENT_RUN_ID}" \
            --argjson availability "${AVAILABILITY_RUN_ID}" \
            --argjson provision "${PROVISION_RUN_ID}" \
            --argjson rotate "${ROTATE_RUN_ID}" \
            --argjson deactivate "${DEACTIVATE_RUN_ID}" \
            --argjson reactivate "${REACTIVATE_RUN_ID}" \
            --argjson journey "${JUDGE_JOURNEY_RUN_ID}" '
              [.[].key] == [
                "deployment",
                "availability",
                "provision",
                "rotate",
                "deactivate",
                "reactivate",
                "journey"
              ] and
              [.[].runId] == [
                $deployment,
                $availability,
                $provision,
                $rotate,
                $deactivate,
                $reactivate,
                $journey
              ] and
              all(.[]; .runAttempt == .producerAttempt)
            ' "${source_rows}" >/dev/null
          reselected_count=0
          while IFS= read -r source; do
            key="$(jq -er '.key' <<<"${source}")"
            retained_workflow="$(jq -er '.workflowPath' <<<"${source}")"
            retained_event_policy="$(
              jq -er '.eventPolicy' <<<"${source}"
            )"
            retained_operation="$(jq -er '.operation // ""' <<<"${source}")"
            run_id="$(jq -er '.runId' <<<"${source}")"
            producer_attempt="$(jq -er '.producerAttempt' <<<"${source}")"
            artifact_id="$(jq -er '.artifactId' <<<"${source}")"
            artifact_name="$(jq -er '.artifactName' <<<"${source}")"
            artifact_digest="$(jq -er '.artifactDigest' <<<"${source}")"
            observed_current_attempt="$(
              jq -ser \
                --arg key "${key}" \
                --argjson runId "${run_id}" '
                  [
                    .[] |
                    select(.key == $key and .runId == $runId)
                  ] |
                  if length == 1 then .[0].currentRunAttempt
                  else error(
                    "missing or ambiguous observed current run attempt"
                  )
                  end
                ' "${current_attempt_rows}"
            )"
            case "${key}" in
              deployment)
                workflow_path=".github/workflows/deploy.yml"
                event_policy="dispatch"
                operation=""
                selection_policy="exact-run-id"
                artifact_prefix="deployment-evidence-production-${RELEASE_SHA}-"
                ;;
              availability)
                workflow_path=".github/workflows/availability.yml"
                event_policy="availability"
                operation=""
                selection_policy="exact-run-id"
                artifact_prefix="production-availability-${RELEASE_SHA}-"
                ;;
              provision|rotate|deactivate|reactivate)
                workflow_path=".github/workflows/judge-user.yml"
                event_policy="dispatch"
                operation="${key}"
                selection_policy="single-retained"
                artifact_prefix="$(
                  printf 'judge-user-operation-%s-%s-' \
                    "${key}" \
                    "${RELEASE_SHA}"
                )"
                ;;
              journey)
                workflow_path="$(
                  printf '%s' \
                    .github/workflows/submission-judge-journey.yml
                )"
                event_policy="dispatch"
                operation=""
                selection_policy="latest-retained"
                artifact_prefix="$(
                  printf 'submission-judge-journey-%s-' "${RELEASE_SHA}"
                )"
                ;;
              *)
                echo "::error::Unknown retained upstream source: ${key}"
                exit 1
                ;;
            esac
            test "${retained_workflow}" = "${workflow_path}"
            test "${retained_event_policy}" = "${event_policy}"
            test "${retained_operation}" = "${operation}"
            [[ "${run_id}" =~ ^[1-9][0-9]*$ ]]
            [[ "${observed_current_attempt}" =~ ^[1-9][0-9]*$ ]]
            [[ "${producer_attempt}" =~ ^[1-9][0-9]*$ ]]
            [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]]
            [[ "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

            run_before="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            )"
            jq -e \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg release "${RELEASE_SHA}" \
              --arg path "${workflow_path}" \
              --arg eventPolicy "${event_policy}" \
              --arg operation "${operation}" \
              --argjson runId "${run_id}" \
              --argjson observedAttempt "${observed_current_attempt}" '
                .id == $runId and
                .path == $path and
                .head_sha == $release and
                .head_branch == "master" and
                .head_repository.full_name == $repository and
                .repository.full_name == $repository and
                .status == "completed" and
                .conclusion == "success" and
                .run_attempt == $observedAttempt and
                (
                  if $eventPolicy == "availability" then
                    .event == "workflow_dispatch" or
                    .event == "schedule"
                  else
                    $eventPolicy == "dispatch" and
                    .event == "workflow_dispatch"
                  end
                ) and
                (
                  if $operation == "" then true
                  else
                    .display_title ==
                      ($operation + " judge access in production")
                  end
                )
              ' <<<"${run_before}" >/dev/null
            current_attempt="$(jq -er '.run_attempt' <<<"${run_before}")"
            artifacts="$(
              gh api \
                --paginate \
                --slurp \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100"
            )"
            selected="$(
              python3 scripts/validate-submission-proof-receipts.py \
                select-run-artifact \
                --policy "${selection_policy}" \
                --artifact-prefix "${artifact_prefix}" \
                --run-id "${run_id}" \
                --release-sha "${RELEASE_SHA}" \
                --maximum-attempt "${current_attempt}" \
                <<<"${artifacts}"
            )"
            jq -e \
              --arg release "${RELEASE_SHA}" \
              --arg name "${artifact_name}" \
              --arg digest "${artifact_digest}" \
              --argjson artifactId "${artifact_id}" \
              --argjson runId "${run_id}" \
              --argjson producerAttempt "${producer_attempt}" '
                .producerAttempt == $producerAttempt and
                .metadata.id == $artifactId and
                .metadata.name == $name and
                .metadata.digest == $digest and
                .metadata.expired == false and
                (.metadata.size_in_bytes | type) == "number" and
                .metadata.size_in_bytes > 0 and
                .metadata.size_in_bytes <= 52428800 and
                .metadata.workflow_run.id == $runId and
                .metadata.workflow_run.head_sha == $release
              ' <<<"${selected}" >/dev/null
            artifact="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            )"
            jq -e \
              --arg release "${RELEASE_SHA}" \
              --arg name "${artifact_name}" \
              --arg digest "${artifact_digest}" \
              --argjson artifactId "${artifact_id}" \
              --argjson runId "${run_id}" '
                .id == $artifactId and
                .name == $name and
                .digest == $digest and
                .expired == false and
                (.size_in_bytes | type) == "number" and
                .size_in_bytes > 0 and
                .size_in_bytes <= 52428800 and
                .workflow_run.id == $runId and
                .workflow_run.head_sha == $release
              ' <<<"${artifact}" >/dev/null
            run_after="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            )"
            jq -e \
              --argjson runId "${run_id}" \
              --argjson currentAttempt "${current_attempt}" '
                .id == $runId and
                .run_attempt == $currentAttempt and
                .status == "completed" and
                .conclusion == "success"
              ' <<<"${run_after}" >/dev/null
            reselected_count=$((reselected_count + 1))
          done <"${source_rows}"
          test "${reselected_count}" = "7"

          current_artifact="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROJECT_ACCESS_ARTIFACT_ID}"
          )"
          jq -e \
            --arg release "${RELEASE_SHA}" \
            --arg name "${PROJECT_ACCESS_ARTIFACT_NAME}" \
            --arg digest "${PROJECT_ACCESS_ARTIFACT_DIGEST}" \
            --argjson artifactId "${PROJECT_ACCESS_ARTIFACT_ID}" \
            --argjson runId "${GITHUB_RUN_ID}" '
              .id == $artifactId and
              .name == $name and
              .digest == $digest and
              .expired == false and
              (.size_in_bytes | type) == "number" and
              .size_in_bytes > 0 and
              .size_in_bytes <= 52428800 and
              .workflow_run.id == $runId and
              .workflow_run.head_sha == $release
            ' <<<"${current_artifact}" >/dev/null
          gate_dir="${RUNNER_TEMP}/submission-project-access-attester-gate"
          test ! -e "${gate_dir}"
          mkdir --mode=0700 "${gate_dir}"
          CONTROL_PLANE_SHA="${RELEASE_SHA}" \
          OUTPUT_PATH="${gate_dir}/control-plane-security-gates.json" \
            bash scripts/verify-github-control-plane.sh
          current_release="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
              --jq '.object.sha'
          )"
          test "${current_release}" = "${RELEASE_SHA}"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Attest all fifteen exact project-access subjects
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ runner.temp }}/submission-project-access-attestation/SHA256SUMS
          predicate-type: ${{ env.PREDICATE_TYPE }}
          predicate-path: ${{ runner.temp }}/submission-project-access-attestation/attestation-predicate.json
