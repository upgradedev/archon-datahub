name: Submission operations

run-name: Prove judging-period operations for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current master release commit
        required: true
        type: string
      availability_run_id:
        description: Exact fresh production availability run ID retained by project access
        required: true
        type: string
      posture_run_id:
        description: Exact fresh production posture run ID
        required: true
        type: string
      paging_run_id:
        description: Exact successful production paging-delivery run ID
        required: true
        type: string
      governed_canary_run_id:
        description: Exact governed-canary run bound by live deployment evidence
        required: true
        type: string
      project_access_run_id:
        description: Exact successful standard-v1 project-access run ID
        required: true
        type: string
      live_datahub_run_id:
        description: Exact successful live-datahub v4 run ID carrying D4
        required: true
        type: string

permissions: {}

concurrency:
  group: submission-operations-${{ inputs.release_sha }}
  cancel-in-progress: false

env:
  PREDICATE_TYPE: https://archon.datahub.dev/attestations/submission-operations/v1

defaults:
  run:
    shell: bash

jobs:
  produce:
    name: Produce exact operational-readiness evidence
    if: >-
      github.repository == 'upgradedev/archon-datahub' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      artifact_digest: "sha256:${{ steps.upload.outputs['artifact-digest'] }}"
      artifact_id: ${{ steps.upload.outputs['artifact-id'] }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      predicate_digest: ${{ steps.package.outputs.predicate_digest }}
      producer_run_attempt: ${{ steps.package.outputs.producer_attempt }}
      producer_run_id: ${{ github.run_id }}
    steps:
      - name: Bind dispatch to exact scalar source identifiers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          AVAILABILITY_RUN_ID: ${{ inputs.availability_run_id }}
          POSTURE_RUN_ID: ${{ inputs.posture_run_id }}
          PAGING_RUN_ID: ${{ inputs.paging_run_id }}
          GOVERNED_CANARY_RUN_ID: ${{ inputs.governed_canary_run_id }}
          PROJECT_ACCESS_RUN_ID: ${{ inputs.project_access_run_id }}
          LIVE_DATAHUB_RUN_ID: ${{ inputs.live_datahub_run_id }}
        run: |
          set -euo pipefail
          expected_ref="${GITHUB_REPOSITORY}/.github/workflows/submission-operations.yml@refs/heads/master"
          test "${GITHUB_WORKFLOW_REF}" = "${expected_ref}"
          test "${GITHUB_REF}" = "refs/heads/master"
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${RELEASE_SHA}"
          source_ids=(
            "${AVAILABILITY_RUN_ID}"
            "${POSTURE_RUN_ID}"
            "${PAGING_RUN_ID}"
            "${GOVERNED_CANARY_RUN_ID}"
            "${PROJECT_ACCESS_RUN_ID}"
            "${LIVE_DATAHUB_RUN_ID}"
          )
          for run_id in "${source_ids[@]}"; do
            [[ "${run_id}" =~ ^[1-9][0-9]*$ ]]
          done
          test "$(
            printf '%s\n' "${source_ids[@]}" | LC_ALL=C sort -u | wc -l
          )" = "${#source_ids[@]}"
          current_run="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          )"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release "${RELEASE_SHA}" \
            --argjson runId "${GITHUB_RUN_ID}" \
            --argjson runAttempt "${GITHUB_RUN_ATTEMPT}" '
              .id == $runId and
              .run_attempt == $runAttempt and
              .path == ".github/workflows/submission-operations.yml" and
              .event == "workflow_dispatch" and
              .head_sha == $release and
              .head_branch == "master" and
              .head_repository.full_name == $repository and
              .repository.full_name == $repository
            ' <<<"${current_run}" >/dev/null
          test "$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
              --jq '.object.sha'
          )" = "${RELEASE_SHA}"

      - name: Check out the exact unprivileged producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact producer control plane
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          gate="${RUNNER_TEMP}/submission-operations-producer-gate"
          test ! -e "${gate}"
          mkdir --mode=0700 "${gate}"
          CONTROL_PLANE_SHA="${RELEASE_SHA}" \
          OUTPUT_PATH="${gate}/control-plane-security-gates.json" \
            bash scripts/verify-github-control-plane.sh

      - name: Materialize exact reviewed operations collector
        id: collector
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          workflow=".github/workflows/submission-operations.yml"
          collector="${RUNNER_TEMP}/collect-submission-operations.sh"
          test ! -e "${collector}"
          awk '
            /^# BEGIN ARCHON SUBMISSION OPERATIONS COLLECTOR$/ {
              if (active || seen) exit 21
              active = 1
              seen = 1
              next
            }
            /^# END ARCHON SUBMISSION OPERATIONS COLLECTOR$/ {
              if (!active) exit 22
              active = 0
              ended = 1
              next
            }
            active {
              if ($0 == "#|") {
                print ""
                next
              }
              if (substr($0, 1, 3) != "#| ") exit 23
              print substr($0, 4)
            }
            END {
              if (!seen || active || !ended) exit 24
            }
          ' "${workflow}" >"${collector}"
          test -s "${collector}"
          test "$(head -n 1 "${collector}")" = "#!/usr/bin/env bash"
          chmod 0500 "${collector}"
          bash -n "${collector}"
          echo "path=${collector}" >>"${GITHUB_OUTPUT}"

      - name: Independently collect and reconstruct exact SQ10 facts
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATIONS_COLLECTOR: ${{ steps.collector.outputs.path }}
          OPERATIONS_ROOT: ${{ runner.temp }}/submission-operations-producer
          RELEASE_SHA: ${{ inputs.release_sha }}
          AVAILABILITY_RUN_ID: ${{ inputs.availability_run_id }}
          POSTURE_RUN_ID: ${{ inputs.posture_run_id }}
          PAGING_RUN_ID: ${{ inputs.paging_run_id }}
          GOVERNED_CANARY_RUN_ID: ${{ inputs.governed_canary_run_id }}
          PROJECT_ACCESS_RUN_ID: ${{ inputs.project_access_run_id }}
          LIVE_DATAHUB_RUN_ID: ${{ inputs.live_datahub_run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          "${OPERATIONS_COLLECTOR}"

      - name: Assemble exact registered SQ10 subjects
        id: package
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          OPERATIONS_ROOT: ${{ runner.temp }}/submission-operations-producer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          facts="${OPERATIONS_ROOT}/facts"
          output="${RUNNER_TEMP}/submission-operations-evidence"
          validation="${RUNNER_TEMP}/submission-operations-assembly.json"
          test -f "${facts}/SQ10.json"
          test ! -L "${facts}/SQ10.json"
          test ! -e "${output}"
          python3 scripts/validate-submission-proof-receipts.py \
            assemble-standard \
            --registry scripts/submission-evidence-registry.json \
            --source-key operations \
            --facts-dir "${facts}" \
            --output-dir "${output}" \
            --repository "${GITHUB_REPOSITORY}" \
            --release-sha "${RELEASE_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --notice NOTICE.md >"${validation}"
          jq -e \
            --arg release "${RELEASE_SHA}" \
            --argjson attempt "${GITHUB_RUN_ATTEMPT}" '
              .schemaVersion ==
                "archon.submission-standard-source-validation/v1" and
              .repository == "upgradedev/archon-datahub" and
              .releaseSha == $release and
              .sourceKey == "operations" and
              .workflowPath ==
                ".github/workflows/submission-operations.yml" and
              .artifactName ==
                ("submission-operations-" + $release + "-" +
                  ($attempt | tostring)) and
              .predicateType ==
                "https://archon.datahub.dev/attestations/" +
                "submission-operations/v1" and
              .subjectCount == 9 and
              .proofIds == ["SQ10"]
            ' "${validation}" >/dev/null
          test "$(
            find "${output}" -type f -printf '%P\n' | LC_ALL=C sort
          )" = "$(
            printf '%s\n' \
              SHA256SUMS \
              attestation-predicate.json \
              proofs/SQ10.json \
              support/SQ10/availability-attestation.json \
              support/SQ10/credential-rotation.json \
              support/SQ10/judge-access-validity.json \
              support/SQ10/monitor-configuration.json \
              support/SQ10/paging-delivery.json \
              support/SQ10/posture-attestation.json \
              support/SQ10/rollback-recovery.json
          )"
          test "$(wc -l <"${output}/SHA256SUMS")" = "9"
          (
            cd "${output}"
            sha256sum --check --strict SHA256SUMS
          )
          predicate_digest="sha256:$(
            sha256sum "${output}/attestation-predicate.json" |
              awk '{print $1}'
          )"
          {
            echo "artifact_name=submission-operations-${RELEASE_SHA}-${GITHUB_RUN_ATTEMPT}"
            echo "predicate_digest=${predicate_digest}"
            echo "producer_attempt=${GITHUB_RUN_ATTEMPT}"
          } >>"${GITHUB_OUTPUT}"

      - name: Recheck canonical state before retention
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
              --jq '.object.sha'
          )" = "${RELEASE_SHA}"

      - name: Retain exact standard operations subjects
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/submission-operations-evidence
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 90

  attest:
    name: Independently revalidate and attest operations subjects
    needs: produce
    if: needs.produce.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Bind attester to exact current workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          expected_ref="${GITHUB_REPOSITORY}/.github/workflows/submission-operations.yml@refs/heads/master"
          test "${GITHUB_WORKFLOW_REF}" = "${expected_ref}"
          test "${GITHUB_REF}" = "refs/heads/master"
          test "${GITHUB_SHA}" = "${RELEASE_SHA}"
          current_run="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          )"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release "${RELEASE_SHA}" \
            --argjson runId "${GITHUB_RUN_ID}" \
            --argjson runAttempt "${GITHUB_RUN_ATTEMPT}" '
              .id == $runId and
              .run_attempt == $runAttempt and
              .path == ".github/workflows/submission-operations.yml" and
              .event == "workflow_dispatch" and
              .head_sha == $release and
              .head_branch == "master" and
              .head_repository.full_name == $repository and
              .repository.full_name == $repository
            ' <<<"${current_run}" >/dev/null

      - name: Check out the exact unprivileged attester
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact attester control plane
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          gate="${RUNNER_TEMP}/submission-operations-attester-gate"
          test ! -e "${gate}"
          mkdir --mode=0700 "${gate}"
          CONTROL_PLANE_SHA="${RELEASE_SHA}" \
          OUTPUT_PATH="${gate}/control-plane-security-gates.json" \
            bash scripts/verify-github-control-plane.sh

      - name: Resolve one immutable operations producer artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          artifact_prefix="submission-operations-${RELEASE_SHA}-"
          artifacts="$(
            gh api \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"
          )"
          selected="$(
            python3 scripts/validate-submission-proof-receipts.py \
              select-run-artifact \
              --policy latest-retained \
              --artifact-prefix "${artifact_prefix}" \
              --run-id "${GITHUB_RUN_ID}" \
              --release-sha "${RELEASE_SHA}" \
              --maximum-attempt "${GITHUB_RUN_ATTEMPT}" \
              <<<"${artifacts}"
          )"
          artifact_id="$(jq -er '.metadata.id' <<<"${selected}")"
          artifact_name="$(jq -er '.metadata.name' <<<"${selected}")"
          artifact_digest="$(jq -er '.metadata.digest' <<<"${selected}")"
          producer_attempt="$(jq -er '.producerAttempt' <<<"${selected}")"
          [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]]
          [[ "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${producer_attempt}" =~ ^[1-9][0-9]*$ ]]
          (( producer_attempt <= GITHUB_RUN_ATTEMPT ))
          {
            echo "artifact_id=${artifact_id}"
            echo "artifact_name=${artifact_name}"
            echo "artifact_digest=${artifact_digest}"
            echo "producer_attempt=${producer_attempt}"
          } >>"${GITHUB_OUTPUT}"

      - name: Download exact immutable operations archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/submission-operations-source.zip"
          root="${RUNNER_TEMP}/submission-operations-attestation"
          test ! -e "${archive}"
          test ! -e "${root}"
          mkdir --mode=0700 "${root}"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            >"${archive}"
          test "sha256:$(
            sha256sum "${archive}" | awk '{print $1}'
          )" = "${ARTIFACT_DIGEST}"
          python3 - "${archive}" "${root}" <<'PY'
          import pathlib
          import posixpath
          import stat
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          root = pathlib.Path(sys.argv[2])
          expected = {
              "SHA256SUMS",
              "attestation-predicate.json",
              "proofs/SQ10.json",
              "support/SQ10/availability-attestation.json",
              "support/SQ10/credential-rotation.json",
              "support/SQ10/judge-access-validity.json",
              "support/SQ10/monitor-configuration.json",
              "support/SQ10/paging-delivery.json",
              "support/SQ10/posture-attestation.json",
              "support/SQ10/rollback-recovery.json",
          }
          expected_directories = {"proofs", "support", "support/SQ10"}
          total = 0
          seen: set[str] = set()
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              for entry in entries:
                  raw = entry.filename
                  canonical = posixpath.normpath(raw.rstrip("/"))
                  expected_raw = canonical + "/" if entry.is_dir() else canonical
                  mode = stat.S_IFMT(entry.external_attr >> 16)
                  if (
                      not raw
                      or raw.startswith("/")
                      or "\\" in raw
                      or "\x00" in raw
                      or canonical in ("", ".", "..")
                      or canonical.startswith("../")
                      or raw != expected_raw
                      or canonical in seen
                  ):
                      raise SystemExit(f"unsafe operations archive path: {raw!r}")
                  seen.add(canonical)
                  if entry.is_dir():
                      if canonical not in expected_directories:
                          raise SystemExit("unexpected archive directory")
                      if mode not in (0, stat.S_IFDIR):
                          raise SystemExit("invalid directory entry")
                      continue
                  if mode not in (0, stat.S_IFREG):
                      raise SystemExit("non-regular archive entry")
                  if entry.flag_bits & 0x1:
                      raise SystemExit("encrypted archive entry")
                  if entry.file_size > 10 * 1024 * 1024:
                      raise SystemExit("oversized archive entry")
                  total += entry.file_size
                  if total > 64 * 1024 * 1024:
                      raise SystemExit("oversized extracted archive")
              files = {entry.filename for entry in entries if not entry.is_dir()}
              if files != expected:
                  raise SystemExit("operations archive file inventory differs")
              bundle.extractall(root)
          for path in root.rglob("*"):
              if path.is_symlink():
                  raise SystemExit("operations archive contains a symlink")
          PY

      - name: Validate exact retry-safe standard-v1 source
        env:
          ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
          PRODUCER_ATTEMPT: ${{ steps.artifact.outputs.producer_attempt }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/submission-operations-attestation"
          (
            cd "${root}"
            sha256sum --check --strict SHA256SUMS
          )
          validation="${RUNNER_TEMP}/submission-operations-attester-validation.json"
          python3 scripts/validate-submission-proof-receipts.py \
            validate-standard-source \
            --registry scripts/submission-evidence-registry.json \
            --source-key operations \
            --source-dir "${root}" \
            --repository "${GITHUB_REPOSITORY}" \
            --release-sha "${RELEASE_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${PRODUCER_ATTEMPT}" \
            --notice NOTICE.md >"${validation}"
          jq -e \
            --arg artifactName "${ARTIFACT_NAME}" \
            --arg release "${RELEASE_SHA}" '
              .schemaVersion ==
                "archon.submission-standard-source-validation/v1" and
              .sourceKey == "operations" and
              .releaseSha == $release and
              .artifactName == $artifactName and
              .subjectCount == 9 and
              .proofIds == ["SQ10"]
            ' "${validation}" >/dev/null

      - name: Materialize exact reviewed operations collector
        id: collector
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          workflow=".github/workflows/submission-operations.yml"
          collector="${RUNNER_TEMP}/collect-submission-operations.sh"
          test ! -e "${collector}"
          awk '
            /^# BEGIN ARCHON SUBMISSION OPERATIONS COLLECTOR$/ {
              if (active || seen) exit 21
              active = 1
              seen = 1
              next
            }
            /^# END ARCHON SUBMISSION OPERATIONS COLLECTOR$/ {
              if (!active) exit 22
              active = 0
              ended = 1
              next
            }
            active {
              if ($0 == "#|") {
                print ""
                next
              }
              if (substr($0, 1, 3) != "#| ") exit 23
              print substr($0, 4)
            }
            END {
              if (!seen || active || !ended) exit 24
            }
          ' "${workflow}" >"${collector}"
          test -s "${collector}"
          test "$(head -n 1 "${collector}")" = "#!/usr/bin/env bash"
          chmod 0500 "${collector}"
          bash -n "${collector}"
          echo "path=${collector}" >>"${GITHUB_OUTPUT}"

      - name: Independently recollect every upstream and compare SQ10 facts
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATIONS_COLLECTOR: ${{ steps.collector.outputs.path }}
          OPERATIONS_ROOT: ${{ runner.temp }}/submission-operations-attester-reconstruction
          RELEASE_SHA: ${{ inputs.release_sha }}
          AVAILABILITY_RUN_ID: ${{ inputs.availability_run_id }}
          POSTURE_RUN_ID: ${{ inputs.posture_run_id }}
          PAGING_RUN_ID: ${{ inputs.paging_run_id }}
          GOVERNED_CANARY_RUN_ID: ${{ inputs.governed_canary_run_id }}
          PROJECT_ACCESS_RUN_ID: ${{ inputs.project_access_run_id }}
          LIVE_DATAHUB_RUN_ID: ${{ inputs.live_datahub_run_id }}
        run: |
          set -euo pipefail
          "${OPERATIONS_COLLECTOR}"
          jq -cS . \
            "${OPERATIONS_ROOT}/facts/SQ10.json" \
            >"${RUNNER_TEMP}/submission-operations-expected-facts.json"
          jq -cS '.facts' \
            "${RUNNER_TEMP}/submission-operations-attestation/proofs/SQ10.json" \
            >"${RUNNER_TEMP}/submission-operations-retained-facts.json"
          cmp --silent \
            "${RUNNER_TEMP}/submission-operations-expected-facts.json" \
            "${RUNNER_TEMP}/submission-operations-retained-facts.json"

      - name: Recheck producer artifact and canonical state
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          PRODUCER_ATTEMPT: ${{ steps.artifact.outputs.producer_attempt }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          artifacts="$(
            gh api \
              --paginate \
              --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"
          )"
          selected="$(
            python3 scripts/validate-submission-proof-receipts.py \
              select-run-artifact \
              --policy latest-retained \
              --artifact-prefix "submission-operations-${RELEASE_SHA}-" \
              --run-id "${GITHUB_RUN_ID}" \
              --release-sha "${RELEASE_SHA}" \
              --maximum-attempt "${GITHUB_RUN_ATTEMPT}" \
              <<<"${artifacts}"
          )"
          jq -e \
            --arg name "${ARTIFACT_NAME}" \
            --arg digest "${ARTIFACT_DIGEST}" \
            --argjson artifactId "${ARTIFACT_ID}" \
            --argjson attempt "${PRODUCER_ATTEMPT}" '
              .producerAttempt == $attempt and
              .metadata.id == $artifactId and
              .metadata.name == $name and
              .metadata.digest == $digest
            ' <<<"${selected}" >/dev/null
          test "$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
              --jq '.object.sha'
          )" = "${RELEASE_SHA}"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Attest all nine exact operations subjects
